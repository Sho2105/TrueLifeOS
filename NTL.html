<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8>
<title>Rain World Eco-Sim</title>
<style>body{margin:0;background:#050505;color:#888;font-family:monospace;overflow:hidden}canvas{display:block;margin:0 auto;border:1px solid #333}#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);padding:10px;pointer-events:none}.legend-item{display:flex;align-items:center;margin-bottom:4px}.dot{width:10px;height:10px;margin-right:8px;display:inline-block}</style>
</head>
<body>
<div id=ui>
<h3>CYCLE: <span id=cycleTimer>0</span></h3>
<div class=legend-item><span class=dot style=background:white></span>Slugcat</div>
<div class=legend-item><span class=dot style=background:#0f0></span>Green Lizard</div>
<div class=legend-item><span class=dot style=background:#f0f></span>Pink Lizard</div>
<div class=legend-item><span class=dot style=background:#444></span>Batfly</div>
<div class=legend-item><span class=dot style=background:orange></span>Spear</div>
<div style=font-size:.8em;margin-top:5px>Viewing Room: <span id=roomIdx>0</span></div>
<div style=font-size:.8em;color:#666>(Click canvas to change rooms)</div>
</div>
<canvas id=gameCanvas></canvas>
<script>const TILE_SIZE=10;const ROOM_WIDTH=80;const ROOM_HEIGHT=50;const GRAVITY=0.4;const NUM_ROOMS=5;const ENTITY_TYPES={SLUGCAT:{color:'white',size:8,speed:2.5,type:'prey/predator'},LIZARD_GREEN:{color:'#00ff00',size:12,speed:1.5,type:'predator',hp:3},LIZARD_PINK:{color:'#ff00ff',size:10,speed:2.2,type:'predator',hp:2},BATFLY:{color:'#555',size:4,speed:1.0,type:'food'},SPEAR:{color:'orange',size:3,speed:8,type:'weapon'}};class Room{constructor(id){this.id=id;this.grid=[];this.entities=[];this.projectiles=[];this.generateCave();this.populate();}
generateCave(){for(let x=0;x<ROOM_WIDTH;x++){this.grid[x]=[];for(let y=0;y<ROOM_HEIGHT;y++){if(x===0||x===ROOM_WIDTH-1||y===0||y===ROOM_HEIGHT-1)this.grid[x][y]=1;else this.grid[x][y]=Math.random()<0.45?1:0;}}
for(let i=0;i<5;i++){let newGrid=JSON.parse(JSON.stringify(this.grid));for(let x=1;x<ROOM_WIDTH-1;x++){for(let y=1;y<ROOM_HEIGHT-1;y++){let neighbors=this.countNeighbors(x,y);if(neighbors>4)newGrid[x][y]=1;else if(neighbors<4)newGrid[x][y]=0;}}
this.grid=newGrid;}
this.drillTunnel(0,Math.floor(ROOM_HEIGHT/2),1,0);this.drillTunnel(ROOM_WIDTH-1,Math.floor(ROOM_HEIGHT/2),-1,0);}
drillTunnel(startX,startY,dirX,dirY){let x=startX;let y=startY;for(let i=0;i<10;i++){if(x>=0&&x<ROOM_WIDTH&&y>=0&&y<ROOM_HEIGHT)this.grid[x][y]=0;x+=dirX;y+=dirY;}}
countNeighbors(x,y){let count=0;for(let i=-1;i<=1;i++){for(let j=-1;j<=1;j++){if(i===0&&j===0)continue;if(this.grid[x+i][y+j]===1)count++;}}
return count;}
populate(){const spawn=(count,ClassRef)=>{for(let i=0;i<count;i++){let pos=this.findEmptySpot();if(pos)this.entities.push(new ClassRef(pos.x*TILE_SIZE,pos.y*TILE_SIZE,this));}};spawn(8,Batfly);spawn(2,Lizard);spawn(1,Slugcat);}
findEmptySpot(){for(let k=0;k<100;k++){let x=Math.floor(Math.random()*(ROOM_WIDTH-2))+1;let y=Math.floor(Math.random()*(ROOM_HEIGHT-2))+1;if(this.grid[x][y]===0)return{x,y};}
return null;}}
class Entity{constructor(x,y,room,config){this.x=x;this.y=y;this.vx=0;this.vy=0;this.room=room;this.config=config;this.alive=true;this.grounded=false;this.holding=null;this.stunned=0;}
update(){if(!this.alive)return;if(this.stunned>0){this.stunned--;this.vy+=GRAVITY;this.applyPhysics();return;}
this.behavior();this.vy+=GRAVITY;this.applyPhysics();this.checkRoomTransition();}
applyPhysics(){this.x+=this.vx;if(this.collides(this.x,this.y)){this.x-=this.vx;this.vx*=-0.5;}
this.y+=this.vy;this.grounded=false;if(this.collides(this.x,this.y)){this.y-=this.vy;if(this.vy>0)this.grounded=true;this.vy=0;}
this.vx*=0.9;}
collides(x,y){let gx=Math.floor(x/TILE_SIZE);let gy=Math.floor(y/TILE_SIZE);if(gx<0||gx>=ROOM_WIDTH||gy<0||gy>=ROOM_HEIGHT)return false;return this.room.grid[gx][gy]===1;}
checkRoomTransition(){if(this.x<0)world.switchRoom(this,-1);else if(this.x>ROOM_WIDTH*TILE_SIZE)world.switchRoom(this,1);}
behavior(){}
findClosest(typeStr){let closest=null;let minDist=9999;this.room.entities.forEach(e=>{if(e!==this&&e.alive&&e.config.type.includes(typeStr)){let d=Math.hypot(e.x-this.x,e.y-this.y);if(d<minDist){minDist=d;closest=e;}}});return{entity:closest,dist:minDist};}
moveTowards(targetX,targetY){if(targetX<this.x)this.vx-=0.5;else this.vx+=0.5;if(Math.abs(this.vx)>this.config.speed)this.vx=Math.sign(this.vx)*this.config.speed;if(this.grounded&&this.collides(this.x+(this.vx*5),this.y)){this.vy=-5;}}
draw(ctx){ctx.fillStyle=this.stunned>0?'gray':this.config.color;ctx.fillRect(this.x-this.config.size/2,this.y-this.config.size/2,this.config.size,this.config.size);if(this.holding){ctx.fillStyle=this.holding.type==='spear'?ENTITY_TYPES.SPEAR.color:'red';ctx.fillRect(this.x,this.y-10,4,4);}}}
class Batfly extends Entity{constructor(x,y,room){super(x,y,room,ENTITY_TYPES.BATFLY);this.noise={x:Math.random(),y:Math.random()};}
behavior(){this.vx+=(Math.random()-0.5)*0.5;this.vy+=(Math.random()-0.5)*0.5-0.1;let predator=this.findClosest('predator');if(predator.entity&&predator.dist<60){this.vx+=(this.x-predator.entity.x)*0.1;this.vy+=(this.y-predator.entity.y)*0.1;}}}
class Lizard extends Entity{constructor(x,y,room){let type=Math.random()>0.5?ENTITY_TYPES.LIZARD_GREEN:ENTITY_TYPES.LIZARD_PINK;super(x,y,room,type);this.hp=type.hp;}
behavior(){let prey=this.findClosest('prey');if(!prey.entity)prey=this.findClosest('food');if(prey.entity&&prey.dist<150){this.moveTowards(prey.entity.x,prey.entity.y);if(prey.dist<this.config.size+5){prey.entity.alive=false;}}else{if(Math.random()<0.05)this.vx=(Math.random()-0.5)*2;}}}
class Slugcat extends Entity{constructor(x,y,room){super(x,y,room,ENTITY_TYPES.SLUGCAT);this.cooldown=0;this.spears=0;}
behavior(){let enemy=this.findClosest('predator');let food=this.findClosest('food');if(enemy.entity&&enemy.dist<80){if(this.spears>0&&this.cooldown<=0){let dx=enemy.entity.x-this.x;let dy=enemy.entity.y-this.y;let mag=Math.hypot(dx,dy);this.room.projectiles.push(new Spear(this.x,this.y,(dx/mag)*8,(dy/mag)*8,this.room));this.spears--;this.cooldown=30;}else{this.moveTowards(this.x-(enemy.entity.x-this.x),this.y);}}
else if(food.entity&&food.dist<200){this.moveTowards(food.entity.x,food.entity.y);if(food.dist<10){food.entity.alive=false;}}
else{if(Math.random()<0.02)this.vx=(Math.random()-0.5)*4;if(this.spears===0&&Math.random()<0.005)this.spears=1;}
if(this.cooldown>0)this.cooldown--;}
draw(ctx){super.draw(ctx);if(this.spears>0){ctx.fillStyle='orange';ctx.fillRect(this.x,this.y-8,2,10);}}}
class Spear{constructor(x,y,vx,vy,room){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.room=room;this.active=true;}
update(){if(!this.active)return;this.x+=this.vx;this.y+=this.vy;this.vy+=0.1;let gx=Math.floor(this.x/TILE_SIZE);let gy=Math.floor(this.y/TILE_SIZE);if(gx>=0&&gx<ROOM_WIDTH&&gy>=0&&gy<ROOM_HEIGHT&&this.room.grid[gx][gy]===1){this.active=false;}
this.room.entities.forEach(e=>{if(e.alive&&e.config.type==='predator'){let d=Math.hypot(e.x-this.x,e.y-this.y);if(d<e.config.size){e.hp--;e.vx+=this.vx*0.5;e.stunned=60;this.active=false;if(e.hp<=0)e.alive=false;}}});}
draw(ctx){if(!this.active)return;ctx.fillStyle='orange';ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill();}}
class World{constructor(){this.rooms=[];for(let i=0;i<NUM_ROOMS;i++){this.rooms.push(new Room(i));}
this.activeRoomIdx=0;}
get activeRoom(){return this.rooms[this.activeRoomIdx];}
update(){this.rooms.forEach(room=>{room.entities.forEach(e=>e.update());room.entities=room.entities.filter(e=>e.alive);room.projectiles.forEach(p=>p.update());room.projectiles=room.projectiles.filter(p=>p.active);if(Math.random()<0.005&&room.entities.filter(e=>e.config.type.includes('prey')).length===0){let pos=room.findEmptySpot();if(pos)room.entities.push(new Slugcat(pos.x*TILE_SIZE,pos.y*TILE_SIZE,room));}});}
switchRoom(entity,direction){let oldRoom=entity.room;let newIdx=oldRoom.id+direction;if(newIdx<0||newIdx>=this.rooms.length){entity.vx*=-1;entity.x=direction>0?(ROOM_WIDTH*TILE_SIZE)-5:5;return;}
let newRoom=this.rooms[newIdx];oldRoom.entities=oldRoom.entities.filter(e=>e!==entity);entity.room=newRoom;entity.x=direction>0?10:(ROOM_WIDTH*TILE_SIZE)-10;newRoom.entities.push(entity);}}
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');canvas.width=ROOM_WIDTH*TILE_SIZE;canvas.height=ROOM_HEIGHT*TILE_SIZE;const world=new World();let cycle=0;canvas.addEventListener('mousedown',()=>{world.activeRoomIdx=(world.activeRoomIdx+1)%NUM_ROOMS;document.getElementById('roomIdx').innerText=world.activeRoomIdx;});function loop(){cycle++;document.getElementById('cycleTimer').innerText=cycle;world.update();ctx.fillStyle='#050505';ctx.fillRect(0,0,canvas.width,canvas.height);let r=world.activeRoom;ctx.fillStyle='#222';for(let x=0;x<ROOM_WIDTH;x++){for(let y=0;y<ROOM_HEIGHT;y++){if(r.grid[x][y]===1)ctx.fillRect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE);}}
ctx.fillStyle='#333';ctx.fillRect(0,(ROOM_HEIGHT/2)*TILE_SIZE-20,10,40);ctx.fillRect(canvas.width-10,(ROOM_HEIGHT/2)*TILE_SIZE-20,10,40);r.entities.forEach(e=>e.draw(ctx));r.projectiles.forEach(p=>p.draw(ctx));requestAnimationFrame(loop);}
loop();</script>
</body>
</html>
