<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIFT</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --panel: rgba(8,8,8,0.94);
  --solid: #0a0a0a;
  --border: #333;
  --hi: #555;
  --dim: #777;
  --text: #bbb;
  --bright: #eee;
  --white: #fff;
  --amber: #fc3;
  --red: #f33;
  --green: #3f7;
  --font: 'VT323', monospace;
  --header: 'Press Start 2P', cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 20px;
  line-height: 1.15;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#wrap {
  width: 400px;
  height: 400px;
  position: relative;
  transform-origin: center;
  box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 0 1px #111;
}

#view {
  width: 400px;
  height: 400px;
  position: relative;
  background: var(--bg);
  overflow: hidden;
  border: 1px solid #1a1a1a;
}

canvas { display: block; width: 400px; height: 400px; }

#crt {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  background: linear-gradient(transparent 50%, rgba(0,0,0,0.08) 50%);
  background-size: 100% 2px;
}
#crt::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%);
}
#crt::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01) 1px, transparent 1px, transparent 3px);
}

@keyframes flicker {
  0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.96} 94%{opacity:1} 96%{opacity:0.98} 97%{opacity:1}
}
#view { animation: flicker 7s infinite; }

.panel {
  position: absolute;
  left: 0; right: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  z-index: 15;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter: blur(6px);
}
.panel.collapsed { transform: translateY(var(--off)); pointer-events: none; }
.panel.collapsed .tab { pointer-events: auto; }

#top { top: 0; height: 50%; --off: calc(-100% + 28px); border-bottom: 1px solid var(--border); }
#bot { bottom: 0; height: 50%; --off: calc(100% - 28px); border-top: 1px solid var(--border); }

.tab {
  height: 28px;
  min-height: 28px;
  background: var(--solid);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  cursor: pointer;
  user-select: none;
  font-family: var(--header);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--dim);
  transition: all 0.2s ease;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.tab:hover { color: var(--bright); background: #111; border-color: var(--hi); }
.tab:active { background: #141414; }

.tab::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--dim);
  transition: background 0.2s;
}
.tab:hover::before { background: var(--bright); }

.pbody {
  flex: 1;
  overflow: hidden;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
}
.collapsed .pbody { opacity: 0; }
:not(.collapsed) .pbody { opacity: 1; transition: opacity 0.15s ease 0.05s; }

#grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto auto;
  gap: 6px 8px;
  height: 100%;
  font-size: 20px;
}

.cell { display: flex; flex-direction: column; justify-content: flex-start; min-height: 0; overflow: hidden; padding: 2px 0; }
.label { font-family: var(--header); font-size: 7px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; line-height: 1.4; white-space: nowrap; }
.val { font-size: 22px; color: var(--bright); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.val.alert { color: var(--red); text-shadow: 0 0 8px rgba(255,51,51,0.5); }
.val.hope { color: var(--green); text-shadow: 0 0 8px rgba(51,255,119,0.4); }
.val.poi { color: var(--amber); text-shadow: 0 0 8px rgba(255,204,51,0.4); }
.val.scan { color: var(--amber); }

input[type="range"] {
  -webkit-appearance: none;
  width: 100%; height: 3px;
  background: var(--border);
  outline: none;
  margin-top: 4px;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  background: var(--white);
  cursor: pointer;
  border: 1px solid var(--dim);
  box-shadow: 0 0 6px rgba(255,255,255,0.2);
}
input[type="range"]:disabled { opacity: 0.3; cursor: default; }
input[type="range"]:disabled::-webkit-slider-thumb { background: var(--border); border-color: #333; box-shadow: none; cursor: default; }

.btns { display: flex; gap: 4px; margin-top: 3px; }

button {
  background: var(--solid);
  border: 1px solid var(--hi);
  color: var(--text);
  font-family: var(--header);
  font-size: 8px;
  padding: 5px 8px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.15s ease;
  line-height: 1.4;
  flex: 1;
}
button:hover:not(:disabled) { background: var(--white); border-color: var(--white); color: var(--bg); box-shadow: 0 0 16px rgba(255,255,255,0.15); }
button:active:not(:disabled) { transform: translateY(1px); background: var(--bright); }
button:disabled { opacity: 0.2; cursor: default; border-color: var(--border); color: var(--dim); }
button.on { background: var(--amber); border-color: var(--amber); color: var(--bg); box-shadow: 0 0 12px rgba(255,204,51,0.3); }

#focus {
  font-family: var(--header);
  font-size: 7px;
  color: var(--dim);
  margin-top: 5px;
  cursor: pointer;
  letter-spacing: 1px;
  line-height: 1.4;
  padding: 3px 0;
  border-top: 1px solid var(--border);
  transition: color 0.2s;
}
#focus:hover { color: var(--text); }
#focus.on { color: var(--white); border-color: var(--hi); text-shadow: 0 0 6px rgba(255,255,255,0.3); }

#chat {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  font-size: 20px;
  line-height: 1.2;
  scrollbar-width: thin;
  scrollbar-color: var(--border) var(--bg);
  padding-right: 4px;
}
#chat::-webkit-scrollbar { width: 3px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: var(--border); }
#chat::-webkit-scrollbar-thumb:hover { background: var(--hi); }

.line {
  margin-bottom: 5px;
  padding: 3px 5px 3px 8px;
  border-left: 2px solid transparent;
  opacity: 0;
  animation: in 0.4s forwards;
  word-break: break-word;
}
.line.daily { border-left-color: var(--border); }
.line.poi { border-left-color: var(--amber); }
.line.crisis { border-left-color: var(--red); }
.line.hope { border-left-color: var(--green); }
.line.focus { border-left-color: var(--white); }

.t { color: var(--dim); font-size: 18px; margin-right: 5px; user-select: none; }
.n { font-family: var(--header); font-size: 7px; cursor: pointer; margin-right: 4px; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle; }
.n:hover { opacity: 0.7; text-decoration: underline; }
.x { color: var(--text); font-size: 20px; }
.line.crisis .x { color: var(--red); }
.line.hope .x { color: var(--green); }
.line.poi .x { color: var(--amber); }
.line.focus .x { color: var(--white); }

@keyframes in { to { opacity: 1; } }

#hud {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 12;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#hud.on { opacity: 1; }
#hud h1 { font-family: var(--header); font-size: 10px; color: var(--white); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; text-shadow: 0 0 10px rgba(255,255,255,0.4); }
#hud p { font-family: var(--font); font-size: 20px; color: var(--dim); letter-spacing: 1px; }

#scan-bar {
  position: absolute;
  bottom: 0; left: 0;
  height: 2px;
  background: var(--white);
  width: 0%;
  transition: width 0.1s linear;
  z-index: 11;
  box-shadow: 0 0 6px var(--white), 0 0 12px rgba(255,255,255,0.3);
}

.corner {
  position: absolute;
  width: 10px; height: 10px;
  border: 1px solid var(--border);
  z-index: 13;
  pointer-events: none;
}
.tl { top: 4px; left: 4px; border-right: none; border-bottom: none; }
.tr { top: 4px; right: 4px; border-left: none; border-bottom: none; }
.bl { bottom: 4px; left: 4px; border-right: none; border-top: none; }
.br { bottom: 4px; right: 4px; border-left: none; border-top: none; }

@keyframes pulse { 0%,100%{border-color:var(--border)} 50%{border-color:var(--white)} }
.scanning .corner { animation: pulse 1s infinite; }

#rim {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 16px;
  background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
  pointer-events: none;
  z-index: 10;
}
</style>
</head>
<body>

<div id="wrap">
  <div id="view">
    <canvas id="space" width="400" height="400"></canvas>
    <div id="crt"></div>
    <div id="rim"></div>
    <div id="scan-bar"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="hud">
      <h1 id="hud-title">UNKNOWN</h1>
      <p id="hud-sub">Contact approaching</p>
    </div>

    <div id="top" class="panel">
      <div class="pbody">
        <div id="grid">
          <div class="cell">
            <div class="label">Mission Day</div>
            <div class="val" id="day">1</div>
          </div>
          <div class="cell">
            <div class="label">Distance</div>
            <div class="val" id="dist">0.00 ly</div>
          </div>
          <div class="cell">
            <div class="label">Drift Speed</div>
            <input type="range" id="speed" min="0" max="100" value="25">
          </div>
          <div class="cell">
            <div class="label">Crew</div>
            <div class="val" id="crew">2,341</div>
          </div>
          <div class="cell">
            <div class="label">Approaching</div>
            <div class="val" id="poi-val">—</div>
          </div>
          <div class="cell">
            <div class="label">Action</div>
            <div class="btns">
              <button id="btn-scan" disabled>SCAN</button>
              <button id="btn-pass" disabled>PASS</button>
            </div>
            <div id="focus">FOCUS: NONE</div>
          </div>
        </div>
      </div>
      <div class="tab" onclick="toggle('top')"><span>SHIP.SYS</span></div>
    </div>

    <div id="bot" class="panel">
      <div class="tab" onclick="toggle('bot')"><span>COMMS.LOG</span></div>
      <div class="pbody">
        <div id="chat"></div>
      </div>
    </div>
  </div>
</div>

<script>
const App = (() => {
  const C = {
    W: 400, H: 400, FPS: 14,
    STARS: 140, DUST: 18,
    SCAN: 4500, POI_GAP: 550,
    AUTO_SCAN: 3500, RESUME: 2500,
    CHAT_INT: 14000, CRISIS: 0.0015,
    MAX_CHAT: 40, APPROACH: 340, PASS: 100, OFF: -120
  };

  const S = {
    day: 1, dist: 0, speed: 25, target: 25, crew: 2341,
    scanning: false, scanT: 0,
    poi: null, nextPoi: C.POI_GAP,
    stars: [], dust: [],
    lastChat: 0, lastCrisis: 0,
    focus: null, habitable: 0, scanned: 0, total: 0
  };

  const $ = id => document.getElementById(id);
  const rand = (a, b) => Math.random() * (b - a) + a;
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '???');

  const NPCS = [
    {n: 'Elena', r: 'CPT', c: '#ffaaaa'},
    {n: 'Kael', r: 'NAV', c: '#aaaaff'},
    {n: 'Mira', r: 'BIO', c: '#aaffaa'},
    {n: 'Voss', r: 'ENG', c: '#ffffaa'}
  ];

  const TPL = {
    approach: [
      "{n}: Contact ahead. {type} at {dist} AU.",
      "Sensors ping. {n} marks it without looking up."
    ],
    scan: [
      "{n}: Surface analysis running...",
      "{n}: Scanning. {t}s to completion."
    ],
    dead: [
      "{n}: Atmosphere {atm}. Temp {temp}K. Dead.",
      "{n}: Nothing but rock and regret."
    ],
    gas: ["{n}: Gas giant. Storms eternal. Useless."],
    ice: ["{n}: Frozen world. Subsurface ocean unreachable."],
    lava: ["{n}: Molten crust. Volcanic hell."],
    ruins: ["{n}: Structures detected. Ancient. Dead."],
    asteroid: ["{n}: Asteroid cluster. No value."],
    derelict: ["{n}: Dead vessel. Another ghost."],
    almost: [
      "{n}: Readings are contradictory. Something wrong.",
      "{n}: Breathable atmosphere, but the surface screams."
    ],
    hope: [
      "{n}: ...Green. It's actually green.",
      "{n}: Oxygen. Water. After all this time."
    ],
    pass: [
      "{n}: Passing it by. No point stopping.",
      "The world fades into the dark."
    ],
    auto: [
      "{n}: Auto-scan initiated.",
      "Routine scan. No manual input."
    ],
    daily: [
      "{n}: Day {day}. The gardens died again.",
      "{n}: I forgot what the sun feels like.",
      "{n}: The hum of the engine is the only music."
    ],
    crisis: [
      "Life support flickering in sector 7.",
      "We lost another today. Storage bay 12.",
      "The archive is degrading. Forgetting faster."
    ],
    hope_crisis: [
      "Elena: We passed the point of no return centuries ago.",
      "Elena: Full speed ahead. I'm sorry."
    ]
  };

  const POI_TYPES = [
    {id: 'dead', label: 'Barren', colors: ['#4a4a4a', '#2a2a2a'], r: [10, 30], craters: true},
    {id: 'gas', label: 'Gas Giant', colors: ['#6a5a4a', '#4a3a2a'], r: [30, 55], ring: true, bands: true},
    {id: 'ice', label: 'Frozen', colors: ['#8abbd4', '#5a8aaa'], r: [12, 26], ice: true},
    {id: 'lava', label: 'Molten', colors: ['#883300', '#551100'], r: [10, 22], lava: true},
    {id: 'asteroid', label: 'Asteroids', colors: ['#555', '#333'], r: [3, 10], cluster: true},
    {id: 'ruins', label: 'Ruins', colors: ['#556', '#334'], r: [8, 16], square: true},
    {id: 'derelict', label: 'Derelict', colors: ['#655', '#433'], r: [7, 14], ship: true}
  ];

  const npc = () => {
    if (S.focus && Math.random() < 0.55) return NPCS.find(x => x.n === S.focus) ?? pick(NPCS);
    return pick(NPCS);
  };

  const initStars = () => {
    for (let i = 0; i < C.STARS; i++) {
      S.stars.push({
        x: randInt(0, C.W), y: randInt(0, C.H),
        s: rand(0.5, 2.2), sp: rand(0.15, 1.2),
        a: rand(0.2, 0.95), t: rand(0, Math.PI * 2),
        l: randInt(0, 2)
      });
    }
    for (let i = 0; i < C.DUST; i++) {
      S.dust.push({
        x: randInt(0, C.W), y: randInt(0, C.H),
        vx: rand(-2, 2), vy: rand(-1, 1), life: rand(0, 1)
      });
    }
  };

  const updateStars = dt => {
    const m = (S.speed / 100) * dt * 45;
    S.stars.forEach(s => {
      s.x -= s.sp * (1 + s.l * 0.4) * m;
      s.t += dt * 2.5;
      if (s.x < -4) { s.x = C.W + 4; s.y = randInt(0, C.H); }
    });
    S.dust.forEach(d => {
      d.x += d.vx * dt * 3 - (S.speed / 100) * dt * 20;
      d.y += d.vy * dt * 3;
      d.life -= dt * 0.15;
      if (d.life <= 0 || d.x < -5) {
        Object.assign(d, { x: randInt(C.W, C.W + 50), y: randInt(0, C.H), vx: rand(-2, 2), vy: rand(-1, 1), life: rand(0.5, 1.5) });
      }
    });
  };

  const drawStars = ctx => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, C.W, C.H);
    S.stars.forEach(s => {
      ctx.globalAlpha = s.a * (0.5 + 0.5 * Math.sin(s.t));
      ctx.fillStyle = '#fff';
      const z = Math.max(1, Math.round(s.s));
      ctx.fillRect(Math.round(s.x), Math.round(s.y), z, z);
    });
    ctx.globalAlpha = 1;
    S.dust.forEach(d => {
      ctx.globalAlpha = d.life * 0.3;
      ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
    });
    ctx.globalAlpha = 1;
  };

  const genName = () => {
    const p = ['K', 'G', 'W', 'P', 'T'];
    const s = ['b', 'c', 'd', 'Prime', 'IV'];
    return pick(p) + '-' + randInt(1, 999) + pick(s);
  };

  const genPOI = () => {
    const b = pick(POI_TYPES);
    const r = rand(b.r[0], b.r[1]);
    const roll = Math.random();
    const hope = roll < 0.012;
    const almost = !hope && roll < 0.065;
    const atm = hope ? 'N2-O2' : almost ? pick(['N2-CO2', 'O2-low']) : pick(['CO2', 'CH4', 'None', 'SO2']);
    const temp = hope ? randInt(280, 310) : almost ? randInt(250, 330) : randInt(40, 650);
    return {
      ...b, r: Math.round(r), x: C.W + 50, y: 200 + randInt(-80, 80),
      atm, temp: Math.floor(temp), g: rand(0.1, 2.2).toFixed(2),
      surf: hope ? pick(['Forests', 'Oceans']) : pick(['Cratered', 'Rocky', 'Dust']),
      water: hope || almost, result: hope ? 'hope' : almost ? 'almost' : b.id,
      name: genName(), phase: 'approach', autoT: 0, scanned: false, passed: false
    };
  };

  const drawPOI = ctx => {
    if (!S.poi) return;
    const p = S.poi;
    if (p.x < C.OFF || p.x > C.W + 120) return;
    const cx = Math.round(p.x), cy = Math.round(p.y), r = p.r;

    const glow = ctx.createRadialGradient(cx, cy, r, cx, cy, r * 2.2);
    glow.addColorStop(0, p.colors[0] + '20');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2); ctx.fill();

    if (p.atm !== 'None') {
      ctx.strokeStyle = p.colors[0] + '35';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.stroke();
    }

    if (p.cluster) {
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = pick(p.colors);
        ctx.fillRect(cx + randInt(-r, r), cy + randInt(-r * 0.5, r * 0.5), randInt(2, 4), randInt(2, 3));
      }
    } else if (p.square) {
      ctx.fillStyle = p.colors[0];
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      ctx.fillStyle = p.colors[1];
      ctx.fillRect(cx - r * 0.4, cy - r * 0.3, r * 0.8, r * 0.2);
    } else if (p.ship) {
      ctx.fillStyle = p.colors[0];
      ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r * 0.7, cy + r); ctx.lineTo(cx - r * 0.7, cy + r); ctx.fill();
    } else {
      const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
      g.addColorStop(0, p.colors[1]); g.addColorStop(1, p.colors[0]);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      if (p.craters) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        for (let i = 0; i < 3; i++) {
          const a = rand(0, Math.PI * 2), d = rand(0, r * 0.5), cr = randInt(1, Math.max(2, r * 0.2));
          ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, cr, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (p.bands) {
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        for (let i = -1; i <= 1; i++) ctx.fillRect(cx - r, cy + i * r * 0.12, r * 2, r * 0.06);
      }
      if (p.lava) {
        ctx.fillStyle = '#ff4400';
        for (let i = 0; i < 3; i++) {
          const a = rand(0, Math.PI * 2), d = rand(0, r * 0.4);
          ctx.fillRect(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 2, 2);
        }
      }
      if (p.ice) {
        ctx.fillStyle = 'rgba(200,230,255,0.15)';
        ctx.beginPath(); ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
    }

    if (p.ring) {
      ctx.strokeStyle = p.colors[1] + '40';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.5, r * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
    }

    if (p.x < C.W - 10 && p.x > 10) {
      ctx.fillStyle = '#555'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
      ctx.fillText(p.name, cx, cy + r + 12);
      ctx.fillStyle = '#333'; ctx.font = '8px monospace';
      ctx.fillText(p.label, cx, cy + r + 22);
    }

    if (S.scanning) {
      const t = 1 - S.scanT / C.SCAN;
      ctx.strokeStyle = '#fc3'; ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);
      ctx.strokeRect(cx - r - 4, cy - r - 4, (r + 4) * 2, (r + 4) * 2);
      ctx.globalAlpha = 1;
    }
  };

  const updatePOI = dt => {
    const move = (S.speed / 100) * dt * 55;
    if (!S.poi) {
      if (S.dist >= S.nextPoi) {
        S.poi = genPOI();
        S.nextPoi = S.dist + C.POI_GAP + randInt(-80, 120);
        S.total++;
      }
      return;
    }
    const p = S.poi;
    if (!S.scanning && p.phase !== 'center') p.x -= move;

    if (p.phase === 'approach' && p.x < C.APPROACH) {
      p.phase = 'center';
      const n = npc();
      Chat.add('poi', pick(TPL.approach), { n: n.n, type: p.label, dist: randInt(40, 180) });
      UI.hud('APPROACHING', p.name);
      p.autoT = C.AUTO_SCAN;
      S.target = 0;
    }

    if (p.phase === 'center') {
      if (!p.scanned && !p.passed) {
        p.autoT -= dt * 1000;
        if (p.autoT <= 0 && !S.scanning) {
          Chat.add('daily', pick(TPL.auto), { n: npc().n });
          startScan();
        }
      }
      if (p.x < C.PASS && !p.scanned && !p.passed) {
        p.passed = true;
        Chat.add('daily', pick(TPL.pass), { n: npc().n });
        endPOI();
      }
    }

    if (p.x < C.OFF) {
      if (!p.scanned && !p.passed) {
        p.passed = true;
        Chat.add('daily', pick(TPL.pass), { n: npc().n });
      }
      endPOI();
    }
  };

  const startScan = () => {
    const p = S.poi;
    if (!p || p.scanned || S.scanning) return;
    S.scanning = true; S.scanT = C.SCAN; S.target = 0;
    UI.btn(true, true);
    $('view').classList.add('scanning');
    const n = npc();
    Chat.add('poi', pick(TPL.scan), { n: n.n, t: Math.floor(C.SCAN / 1000) });
    S.scanned++;
  };

  const passPOI = () => {
    const p = S.poi;
    if (!p || p.scanned || S.scanning) return;
    p.passed = true; S.target = parseInt($('speed').value);
    Chat.add('daily', pick(TPL.pass), { n: npc().n });
    UI.btn(true, true);
    setTimeout(() => { if (S.poi?.passed) endPOI(); }, 800);
  };

  const completeScan = () => {
    const p = S.poi;
    if (!p) return;
    p.scanned = true; S.scanning = false;
    $('view').classList.remove('scanning');
    const tpl = TPL[p.result] ?? TPL.dead;
    const n = npc();
    let delay = C.RESUME;

    if (p.result === 'hope') {
      S.habitable++;
      Chat.add('hope', pick(tpl), { n: n.n, type: p.name });
      setTimeout(() => Chat.add('crisis', pick(TPL.hope_crisis), { n: 'Elena' }), 3000);
      delay = C.RESUME + 3000;
    } else if (p.result === 'almost') {
      Chat.add('hope', pick(tpl), { n: n.n, type: p.name });
    } else {
      Chat.add('poi', pick(tpl), { n: n.n, atm: p.atm, temp: p.temp, g: p.g, surf: p.surf });
    }

    setTimeout(() => { S.target = parseInt($('speed').value); }, delay);
    $('scan-bar').style.width = '0%';
    UI.btn(true, true);
    setTimeout(() => { if (S.poi?.scanned) endPOI(); }, delay + 500);
  };

  const endPOI = () => {
    S.poi = null; S.scanning = false; S.scanT = 0;
    UI.hudOff(); $('scan-bar').style.width = '0%';
    $('view').classList.remove('scanning');
    S.target = parseInt($('speed').value);
  };

  const drawShip = ctx => {
    const cx = C.W / 2, by = C.H - 12;
    ctx.fillStyle = '#080808';
    ctx.fillRect(cx - 35, by - 8, 70, 8);
    ctx.fillRect(cx - 12, by - 16, 24, 8);
    ctx.fillRect(cx - 55, by - 5, 18, 4);
    ctx.fillRect(cx + 37, by - 5, 18, 4);
    const g = ctx.createRadialGradient(cx, by + 4, 2, cx, by + 4, 10);
    g.addColorStop(0, 'rgba(80,60,20,0.25)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(cx - 18, by, 36, 12);
  };

  const Chat = {
    add(cat, tpl, vars = {}) {
      const n = vars.n ? NPCS.find(x => x.n === vars.n) ?? npc() : npc();
      const ctx = { n: n.n, r: n.r, day: Math.floor(S.day), ...vars };
      const text = fmt(tpl, ctx);
      const box = $('chat');
      const div = document.createElement('div');
      div.className = `line ${cat}${S.focus && n.n === S.focus ? ' focus' : ''}`;
      div.innerHTML = `<span class="t">D${Math.floor(S.day)}</span><span class="n" style="color:${n.c}">${n.n}</span><span class="x">${text}</span>`;
      div.querySelector('.n').onclick = () => UI.focus(n.n);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      while (box.children.length > C.MAX_CHAT) box.removeChild(box.firstChild);
    },

    ambient(dt) {
      S.lastChat += dt * 1000;
      const iv = C.CHAT_INT / (1 + S.speed / 90);
      if (S.lastChat > iv) {
        S.lastChat = 0;
        if (Math.random() < 0.2 && S.lastCrisis > 60000) {
          S.lastCrisis = 0;
          this.add('crisis', pick(TPL.crisis), { n: npc().n });
          if (Math.random() < 0.35) S.crew = Math.max(100, S.crew - randInt(1, 3));
        } else {
          this.add('daily', pick(TPL.daily), { n: npc().n });
        }
      }
      S.lastCrisis += dt * 1000;
    }
  };

  const UI = {
    btn(scan, pass) {
      $('btn-scan').disabled = scan;
      $('btn-pass').disabled = pass;
    },
    hud(title, sub) {
      $('hud').classList.add('on');
      $('hud-title').textContent = title;
      $('hud-sub').textContent = sub;
    },
    hudOff() { $('hud').classList.remove('on'); },
    focus(name) {
      S.focus = name;
      $('focus').textContent = 'FOCUS: ' + name;
      $('focus').className = 'on';
      Chat.add('daily', '// FOCUS: ' + name, { n: 'SYS' });
    },
    clear() {
      S.focus = null;
      $('focus').textContent = 'FOCUS: NONE';
      $('focus').className = '';
    },
    update() {
      $('day').textContent = Math.floor(S.day);
      $('dist').textContent = (S.dist / 100).toFixed(2) + ' ly';
      const c = $('crew');
      c.textContent = S.crew.toLocaleString();
      c.className = S.crew < 1800 ? 'val alert' : 'val';
      $('speed').disabled = S.scanning || !!(S.poi && S.poi.phase === 'center');

      const p = $('poi-val');
      if (S.scanning) {
        const pct = Math.floor(100 - S.scanT / C.SCAN * 100);
        p.textContent = 'SCAN ' + pct + '%';
        p.className = 'val scan';
        $('scan-bar').style.width = pct + '%';
      } else if (S.poi && S.poi.phase === 'center') {
        p.textContent = S.poi.name;
        p.className = 'val poi';
      } else {
        p.textContent = '—';
        p.className = 'val';
      }
    }
  };

  const bind = () => {
    $('speed').addEventListener('input', e => {
      if (!S.scanning && (!S.poi || S.poi.phase !== 'center')) S.target = parseInt(e.target.value);
    });
    $('btn-scan').addEventListener('click', startScan);
    $('btn-pass').addEventListener('click', passPOI);
    $('focus').addEventListener('dblclick', UI.clear);
    window.addEventListener('resize', () => {
      const s = Math.min(window.innerWidth, window.innerHeight) * 0.95 / 400;
      $('wrap').style.transform = `scale(${s})`;
    });
  };

  window.toggle = id => $(id).classList.toggle('collapsed');

  const loop = () => {
    const dt = 1000 / C.FPS / 1000;
    S.speed += (S.target - S.speed) * 0.04;
    if (S.speed > 0.5) {
      S.day += (S.speed / 100) * dt * 1.2;
      S.dist += (S.speed / 100) * dt * 7;
    }
    if (S.scanning) {
      S.scanT -= dt * 1000;
      if (S.scanT <= 0) completeScan();
    }
    updateStars(dt);
    updatePOI(dt);
    Chat.ambient(dt);
    UI.update();

    const ctx = $('space').getContext('2d');
    drawStars(ctx);
    drawPOI(ctx);
    drawShip(ctx);
  };

  const boot = () => {
    $('chat').innerHTML = '';
    [
      { t: 500, cat: 'daily', text: 'The ship groans. Day {day}.', vars: { n: 'Voss', day: 1 } },
      { t: 3000, cat: 'daily', text: 'Sensors clear. As always.', vars: { n: 'Kael' } },
      { t: 6000, cat: 'daily', text: 'Day {day}. The drift continues.', vars: { n: 'Elena', day: 1 } },
      { t: 10000, cat: 'daily', text: 'Click crew names to focus. Double-click FOCUS to clear.', vars: { n: 'SYS' } }
    ].forEach(l => setTimeout(() => Chat.add(l.cat, l.text, l.vars), l.t));
  };

  const init = () => {
    initStars();
    bind();
    const s = Math.min(window.innerWidth, window.innerHeight) * 0.95 / 400;
    $('wrap').style.transform = `scale(${s})`;
    boot();
    setInterval(loop, 1000 / C.FPS);
  };

  return { init };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
