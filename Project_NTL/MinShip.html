<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Terrarium</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000102; overflow:hidden; }
canvas { display:block; image-rendering:pixelated; filter: contrast(1.5) brightness(1.25) saturate(1.3); }
#fx {
    position:fixed; inset:0; pointer-events:none; z-index:20;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,255,255,0.012), rgba(0,0,0,0.012));
    background-size: 100% 2px, 2px 100%;
    box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="fx"></div>
<script>
// --- CORE CONSTANTS & UTILS ---
const GAME = { P2: Math.PI * 2, MAX: 2000, TICK: 1000 / 60 };
const R = (a, b) => Math.random() * (b - a) + a;

const C = document.getElementById('g');
const ctx = C.getContext('2d', { alpha: false });
let W, H;
window.onresize = () => { W = C.width = window.innerWidth; H = C.height = window.innerHeight; };
window.onresize();

// --- ENTITY COMPONENT SYSTEM ---
// Retained the high-performance typed arrays for your future project
const MAX = GAME.MAX;
const mkU8 = () => new Uint8Array(MAX);
const mkF32 = () => new Float32Array(MAX);

const eType = mkU8(); // 1: Ship, 3: Particle
const px = mkF32(), py = mkF32(), vx = mkF32(), vy = mkF32(), ang = mkF32();
const ttl = mkF32(), bSpd = mkF32();
const clrH = mkF32(), clrS = mkF32(), clrL = mkF32();

let alive = 0, cameraX = 0, shipId = -1;
const pool = new Uint16Array(MAX);
for (let i = 0; i < MAX; i++) pool[i] = i;

const spawn = (t) => {
    if (alive >= MAX) return -1;
    const id = pool[alive++];
    eType[id] = t;
    return id;
};

const destroy = (id) => {
    if (!eType[id]) return;
    eType[id] = 0;
    pool[--alive] = id;
};

// --- GAME OBJECT GENERATORS ---
const addShip = (x, y) => {
    const id = spawn(1);
    px[id] = x; py[id] = y;
    vx[id] = 2; vy[id] = 0; ang[id] = 0;

    // Random Color Function
    clrH[id] = R(0, 360);
    clrS[id] = R(60, 100);
    clrL[id] = R(50, 75);
    return id;
};

const addPart = (x, y, speed, size, life, h, s, l) => {
    const id = spawn(3);
    if (id === -1) return;
    const a = R(0, GAME.P2);
    px[id] = x; py[id] = y;
    vx[id] = Math.cos(a) * speed;
    vy[id] = Math.sin(a) * speed;
    bSpd[id] = size; ttl[id] = life;

    clrH[id] = h || R(180, 220);
    clrS[id] = s || 80;
    clrL[id] = l || 70;
};

// --- SHAPE DATA ---
// Circular hull shape coordinates
const CIRCLE_PTS = Array.from({ length: 16 }, (_, j) => [Math.cos(j * Math.PI / 8), Math.sin(j * Math.PI / 8)]);
const SHIP_SCALE = 8;

// Init single ship
shipId = addShip(0, 0);

// --- MAIN LOGIC ---
const updateAll = () => {
    for (let i = 0; i < MAX; i++) {
        if (!eType[i]) continue;

        if (eType[i] === 1) { // SHIP LOGIC
            px[i] += vx[i];

            // Gentle wave bobbing on the Y axis
            py[i] = H / 2 + Math.sin(px[i] * 0.015) * 60;

            // Engine trail particles (matching ship color)
            if (Math.random() < 0.6) {
                addPart(
                    px[i] - SHIP_SCALE * 1.2, py[i] + R(-3, 3),
                    R(0.5, 1.5), R(1, 2.5), R(0.4, 1.2),
                    clrH[i], clrS[i], clrL[i]
                );
            }

            // Camera rigorously follows the ship, anchoring it at 30% of screen width
            cameraX = px[i] - W * 0.3;

        } else if (eType[i] === 3) { // PARTICLE LOGIC
            // Particles drift backward slightly relative to ship to simulate momentum
            px[i] += vx[i] - 1.5;
            py[i] += vy[i];
            vx[i] *= 0.92; vy[i] *= 0.92; bSpd[i] *= 0.96;

            if ((ttl[i] -= 0.02) <= 0) destroy(i);
        }
    }
};

// --- RENDERING ---
const render = () => {
    ctx.fillStyle = '#000102';
    ctx.fillRect(0, 0, W, H);

    // Render scrolling background grid
    ctx.strokeStyle = 'rgba(0,200,255,0.02)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const offX = -(cameraX % 120);
    for (let i = offX; i < W; i += 120) { ctx.moveTo(i, 0); ctx.lineTo(i, H); }
    for (let i = 0; i < H; i += 120) { ctx.moveTo(0, i); ctx.lineTo(W, i); }
    ctx.stroke();

    // Lock camera
    ctx.save();
    ctx.translate(-cameraX, 0);
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < MAX; i++) {
        if (!eType[i]) continue;

        if (eType[i] === 3) { // Draw Particles
            ctx.globalAlpha = Math.max(0, ttl[i]);
            ctx.fillStyle = `hsl(${clrH[i]}, ${clrS[i]}%, ${clrL[i]}%)`;
            ctx.fillRect(px[i] - bSpd[i], py[i] - bSpd[i], bSpd[i] * 2, bSpd[i] * 2);
            ctx.globalAlpha = 1;

        } else if (eType[i] === 1) { // Draw Ship
            ctx.save();
            ctx.translate(px[i], py[i]);
            ctx.rotate(ang[i]);

            // Outer Hull
            ctx.beginPath();
            ctx.moveTo(CIRCLE_PTS[0][0] * SHIP_SCALE, CIRCLE_PTS[0][1] * SHIP_SCALE);
            for (let j = 1; j < CIRCLE_PTS.length; j++) {
                ctx.lineTo(CIRCLE_PTS[j][0] * SHIP_SCALE, CIRCLE_PTS[j][1] * SHIP_SCALE);
            }
            ctx.closePath();
            ctx.fillStyle = `hsl(${clrH[i]}, ${clrS[i]}%, ${clrL[i]}%)`;
            ctx.fill();

            // Inner brutalist cut-out detail
            ctx.globalCompositeOperation = 'source-over';
            ctx.beginPath();
            ctx.moveTo(CIRCLE_PTS[0][0] * SHIP_SCALE * 0.55, CIRCLE_PTS[0][1] * SHIP_SCALE * 0.55);
            for (let j = 1; j < CIRCLE_PTS.length; j++) {
                ctx.lineTo(CIRCLE_PTS[j][0] * SHIP_SCALE * 0.55, CIRCLE_PTS[j][1] * SHIP_SCALE * 0.55);
            }
            ctx.closePath();
            ctx.fillStyle = '#000102';
            ctx.fill();

            ctx.lineWidth = 1.5;
            ctx.strokeStyle = `hsl(${clrH[i]}, ${clrS[i]}%, ${clrL[i]}%)`;
            ctx.stroke();

            ctx.restore();
        }
    }
    ctx.restore();
};

// --- GAME LOOP ---
const TICK = GAME.TICK;
let last = performance.now(), accum = 0;
const loop = (now) => {
    const dt = Math.min(now - last, 100);
    last = now;
    accum += dt;
    while (accum >= TICK) {
        updateAll();
        accum -= TICK;
    }
    render();
    requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
</script>
</body>
</html>
