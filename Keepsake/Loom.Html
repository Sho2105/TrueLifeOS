<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Loom</title>
<script id="loom-pocket" type="application/json">{
  "notes": {
  },

<style>

#bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd2);z-index:800;display:flex;flex-direction:column}
#pl{height:var(--pal-h);border-bottom:1px solid var(--bd);display:none;flex-direction:column;overflow:hidden}

.pnil{padding:var(--s2) var(--s5);color:var(--fg2);font-style:italic;font-size:.88em}
.pi.confirm-row{border-left-color:var(--acc2);background:rgba(181,55,46,.06)}
.pi.confirm-row .pt{color:var(--acc2)}
.pi.confirm-row.on{background:rgba(181,55,46,.12)}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="bar">
  <div id="pl"></div>
  <div id="pr">
    <input id="pi" placeholder="search, /command, #tag, key:value …" autocomplete="off" spellcheck="false" aria-label="Command palette">
  </div>
</div>
<div id="main">
  <div id="stage">
    <div id="empty"><p>no notes open<br><span style="opacity:.5;font-size:.85em">&gt; to search or /new</span></p></div>
  </div>
</div>
<script>

const Notes=(()=>{
  const stage=()=>U.$("stage"),empty=()=>U.$("empty");
  const{e,a}=U;
  let active=null,currentId=null;

  const autoH=ta=>{
    const main=U.$("main");
    const savedTop=main.scrollTop;
    ta.style.height="auto";
    ta.style.height=ta.scrollHeight+"px";
    main.scrollTop=savedTop;
  };

  const scrollCaretIntoView=ta=>{
    const main=U.$("main");
    const barH=U.$("bar").getBoundingClientRect().height;
    const viewH=window.innerHeight;
    const visibleH=viewH-barH;
    const taRect=ta.getBoundingClientRect();
    const cs=getComputedStyle(ta);
    const lh=parseFloat(cs.lineHeight)||20;
    const padTop=parseFloat(cs.paddingTop)||0;
    const linesBefore=ta.value.slice(0,ta.selectionStart).split("\n").length-1;
    const caretTop=taRect.top+padTop+linesBefore*lh;
    const caretBottom=caretTop+lh;
    const margin=lh*1.5;
    if(caretBottom+margin>visibleH){
      main.scrollTop+=caretBottom+margin-visibleH;
    }else if(caretTop-margin<0){
      main.scrollTop+=caretTop-margin;
    }
  };

  const renderedOffsetToRaw=(rnd,ta,clickX,clickY)=>{
    const raw=ta.value;
    const lines=raw.split("\n");
    const els=[...rnd.querySelectorAll("p,h1,h2,h3,h4,h5,h6,li,td,th,pre,blockquote,hr,div.emb,div.tw")];
    let bestEl=null,bestDist=Infinity;
    for(const el of els){
      const r=el.getBoundingClientRect();
      if(clickY>=r.top&&clickY<=r.bottom&&clickX>=r.left&&clickX<=r.right){bestEl=el;break}
      const cy=r.top+r.height/2,cx=r.left+r.width/2;
      const d=Math.hypot(cx-clickX,cy-clickY);
      if(d<bestDist){bestDist=d;bestEl=el}
    }
    if(!bestEl)return raw.length;
    const text=(bestEl.textContent||"").trim().replace(/\s+/g," ").slice(0,40);
    if(!text)return raw.length;
    for(let i=0;i<lines.length;i++){
      if(lines[i].includes(text.slice(0,20)))return lines.slice(0,i+1).join("\n").length;
    }
    return raw.length;
  };

  const draw=el=>{
    const id=el.dataset.id,note=Store.get(id);if(!note)return;
    const{meta,body}=Cache.get(id,note.raw);
    const pills=[...Object.entries(meta.extra).filter(([k])=>k!=="title"&&k!=="tags").map(([k,v])=>`<button class="pill" data-q="${a(k+":"+v)}">${e(k)}: ${e(v)}</button>`),...meta.tags.map(t=>`<button class="pill" data-q="${a("#"+t)}">#${e(t)}</button>`)];
    const out=MD.wikiLinks(body).map(t=>({t,miss:!Store.byTitle(t)}));
    const back=Idx.get(meta.title).filter(bid=>bid!==id).map(bid=>{const bn=Store.get(bid);return bn?{t:Cache.get(bid,bn.raw).meta.title}:null}).filter(Boolean);
    const ll=(arr,cr)=>arr.length?arr.map(x=>`<button class="lb" data-wl="${a(x.t)}"><span class="lt">${e(x.t)}</span>${cr&&x.miss?'<span class="ls">create</span>':""}</button>`).join(""):`<div class="lnil">none</div>`;
    const{html,slots}=MD.render(body);
    el.querySelector(".rnd").innerHTML=`<h1>${e(meta.title||"Untitled")}</h1>`+(pills.length?`<div class="pills">${pills.join("")}</div>`:"")+`<div>${html}</div>`+`<div class="lnks"><div class="lc"><div class="lhd">Outgoing</div>${ll(out,true)}</div><div class="lc"><div class="lhd">Backlinks</div>${ll(back,false)}</div></div>`;
    SB.mount(el,id,slots);
  };

  const enter=(el,caretPos)=>{
    if(active&&active!==el)exit(active);
    const id=el.dataset.id,ta=el.querySelector(".ta"),note=Store.get(id);if(!note)return;
    el.dataset.oldTitle=Cache.get(id,note.raw).meta.title;
    ta.value=note.raw;
    el.querySelector(".rnd").classList.add("hidden");
    el.querySelector(".cb").classList.add("ed");
    ta.classList.add("on");
    ta.style.height="auto";
    ta.style.height=ta.scrollHeight+"px";
    ta.focus();
    const pos=(caretPos!=null&&caretPos>=0&&caretPos<=ta.value.length)?caretPos:ta.value.length;
    ta.setSelectionRange(pos,pos);
    setTimeout(()=>scrollCaretIntoView(ta),30);
    active=el;
  };

  const exit=el=>{
    if(!el)return;
    const ta=el.querySelector(".ta");if(!ta||!ta.classList.contains("on"))return;
    const id=el.dataset.id,note=Store.get(id);
    if(note&&note.raw!==ta.value)Store.set({id,raw:ta.value});
    const ot=el.dataset.oldTitle,nm=Cache.get(id,ta.value).meta;
    if(ot&&nm.title&&ot!==nm.title){
      if(Store.hasTitle(nm.title,id)){
        let rev=ta.value.replace(/^(---\n[\s\S]*?title:\s*)(.+?)(\n)/m,(_,p1,_2,p3)=>`${p1}${ot}${p3}`);
        if(rev===ta.value)rev=ta.value.replace(/^(#{1,6}\s+)(.+?)$/m,(_,p1)=>`${p1}${ot}`);
        Store.set({id,raw:rev});ta.value=rev;Toast.show(`"${nm.title}" exists — reverted`,true);
      }else{
        let n=0;Store.all().forEach(x=>{if(x.id===id)return;const re=new RegExp(`\\[\\[${U.re(ot)}(#[^\\]]+)?\\]\\]`,"gi");if(re.test(x.raw)){n++;Store.set({...x,raw:x.raw.replace(re,(_,anc)=>`[[${nm.title}${anc||""}]]`)})}});
        if(n){const cur=document.querySelector(".note-view.active");if(cur&&cur.dataset.id!==id)draw(cur);Toast.show(`Relinked ${n} note(s)`)}
      }
    }
    delete el.dataset.oldTitle;
    ta.classList.remove("on");
    el.querySelector(".rnd").classList.remove("hidden");
    el.querySelector(".cb").classList.remove("ed");
    if(active===el)active=null;
    draw(el);
  };

  const closeAll=()=>{
    document.querySelectorAll(".note-view").forEach(el=>{
      const id=el.dataset.id;
      if(el.querySelector(".ta")?.classList.contains("on"))exit(el);
      SB.clear(id);State.rem(id);el.remove();
    });
    currentId=null;State.setCurrent(null);
    empty().style.display="";
  };

  const close=(elOrId)=>{
    const id=typeof elOrId==="string"?elOrId:elOrId?.dataset?.id;if(!id)return;
    const el=stage().querySelector(`.note-view[data-id="${id}"]`);if(!el)return;
    if(el.querySelector(".ta")?.classList.contains("on"))exit(el);
    SB.clear(id);State.rem(id);
    if(currentId===id){
      const remaining=[...stage().querySelectorAll(".note-view")].filter(x=>x.dataset.id!==id);
      el.remove();
      if(remaining.length){const prev=remaining[remaining.length-1];prev.classList.add("active");currentId=prev.dataset.id;State.setCurrent(currentId)}
      else{currentId=null;State.setCurrent(null);empty().style.display=""}
    }else el.remove();
  };

  const del=id=>{
    const n=Store.get(id);if(!n)return;
    const t=Cache.get(id,n.raw).meta.title;
    Store.del(id);State.rem(id);close(id);Toast.show(`Deleted "${t}"`);
  };

  const open=(id,edit=false)=>{
    if(!Store.get(id))return;
    let el=stage().querySelector(`.note-view[data-id="${id}"]`);
    if(!el){
      el=document.createElement("div");el.className="note-view";el.dataset.id=id;
      el.innerHTML=`<div class="cb"><div class="rnd"></div><textarea class="ta" spellcheck="false" placeholder="---\ntitle: Untitled\ntags: \n---\n\n"></textarea></div>`;
      stage().appendChild(el);draw(el);State.add(id);
      const ta=el.querySelector(".ta"),rnd=el.querySelector(".rnd");

      rnd.addEventListener("dblclick",ev=>{
        if(ev.target.closest(".wl,.pill,.lb,.grid-item"))return;
        const note=Store.get(id);if(!note)return;
        const caretPos=renderedOffsetToRaw(rnd,ta,ev.clientX,ev.clientY);
        enter(el,caretPos);
      });

      rnd.addEventListener("click",ev=>{
        const pill=ev.target.closest(".pill");if(pill){Pal.set(pill.dataset.q);return}
        const wl=ev.target.closest("[data-wl]");
        if(wl){const n=Store.byTitle(wl.dataset.wl);if(n){open(n.id);if(wl.dataset.anc)setTimeout(()=>document.getElementById(`lh-${wl.dataset.anc.toLowerCase().replace(/[^\w]+/g,"-").replace(/^-|-$/g,"")}`)?.scrollIntoView({behavior:"smooth",block:"start"}),80)}else create(wl.dataset.wl)}
        const gi=ev.target.closest("[data-grid-item]");
        if(gi&&!wl&&!pill){const e2=ev.target.closest(".note-view");if(e2&&ev.detail>=2)enter(e2)}
      });

      const saveDebounced=U.deb(()=>{const n=Store.get(id);if(n&&n.raw!==ta.value)Store.set({id,raw:ta.value})},K.SAVE_DEB_MS);
      ta.addEventListener("input",()=>{
        autoH(ta);
        saveDebounced();
        requestAnimationFrame(()=>scrollCaretIntoView(ta));
      });
      ta.addEventListener("keydown",ev=>{
        if((ev.metaKey||ev.ctrlKey)&&ev.key==="s"){ev.preventDefault();exit(el)}
        if(ev.key==="Escape")exit(el);
        if(ev.key==="Tab"){
          ev.preventDefault();
          const s=ta.selectionStart,end=ta.selectionEnd;
          ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(end);
          ta.selectionStart=ta.selectionEnd=s+2;
          autoH(ta);
          requestAnimationFrame(()=>scrollCaretIntoView(ta));
        }
      });
      ta.addEventListener("click",()=>requestAnimationFrame(()=>scrollCaretIntoView(ta)));
      ta.addEventListener("blur",()=>setTimeout(()=>{if(!document.activeElement?.closest("#bar")&&ta.classList.contains("on"))exit(el)},160));
    }
    document.querySelectorAll(".note-view.active").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    currentId=id;State.setCurrent(id);
    empty().style.display="none";
    U.$("main").scrollTo({top:0});
    if(edit)setTimeout(()=>enter(el),30);
  };

  const create=title=>{
    const base=(title||"Untitled").trim()||"Untitled";let fin=base,n=2;
    while(Store.hasTitle(fin))fin=`${base} ${n++}`;
    if(fin!==base)Toast.show(`"${base}" exists — created "${fin}"`,true);
    const id=U.uid();Store.set({id,raw:FM.build({title:fin})});open(id,true);
  };

  document.addEventListener("mousedown",ev=>{if(active&&active.querySelector(".ta")?.classList.contains("on"))if(!active.contains(ev.target)&&!U.$("bar").contains(ev.target))exit(active)},{capture:true});
  return{open,create,draw,close,closeAll,del,exitActive:()=>exit(active),currentId:()=>currentId};
})();

  const tick=(nodes,edges)=>{for(const n of nodes){n.vx*=K.SIM_DAMP;n.vy*=K.SIM_DAMP}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);const f=K.SIM_REP/d2;dx/=d;dy/=d;a.vx-=f*dx;a.vy-=f*dy;b.vx+=f*dx;b.vy+=f*dy}for(const e of edges){const dx=e.dst.x-e.src.x,dy=e.dst.y-e.src.y,d=Math.sqrt(dx*dx+dy*dy)+.01;const f=(d-K.SIM_REST)*K.SIM_SPRING;e.src.vx+=f*dx/d;e.src.vy+=f*dy/d;e.dst.vx-=f*dx/d;e.dst.vy-=f*dy/d}for(const n of nodes){n.vx-=n.x*K.SIM_GRAVITY;n.vy-=n.y*K.SIM_GRAVITY;n.x+=n.vx;n.y+=n.vy}};
  const drawFrame=(cv,ctx,nodes,edges,hoverId,tx,ty,scale)=>{ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle=U.cssVar("--g-bg");ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(tx,ty);ctx.scale(scale,scale);for(const e of edges){const hov=e.src.id===hoverId||e.dst.id===hoverId;ctx.beginPath();ctx.moveTo(e.src.x,e.src.y);ctx.lineTo(e.dst.x,e.dst.y);ctx.strokeStyle=hov?U.cssVar("--g-edge-hov"):U.cssVar("--g-edge");ctx.lineWidth=(hov?1.4:.7)/scale;ctx.stroke()}for(const n of nodes){const hov=n.id===hoverId,r=n.r+(hov?2:0);if(hov){ctx.beginPath();ctx.arc(n.x,n.y,r+6,0,Math.PI*2);ctx.fillStyle=n.col+"1a";ctx.fill()}ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fillStyle=hov?n.col:n.col+"aa";ctx.fill();ctx.beginPath();ctx.arc(n.x,n.y,r*.55,0,Math.PI*2);ctx.fillStyle=hov?"rgba(255,240,210,.18)":"rgba(255,240,210,.06)";ctx.fill();if(hov){const fs=Math.round(Math.max(10,Math.min(12,11/scale)));ctx.font=`${fs}px ui-monospace,monospace`;ctx.textAlign="center";const tw=ctx.measureText(n.title).width;const lx=n.x,ly=n.y-r-6/scale;ctx.fillStyle=U.cssVar("--g-bg")+"d0";ctx.fillRect(lx-tw/2-5/scale,ly-fs,tw+10/scale,fs+5/scale);ctx.fillStyle=U.cssVar("--g-ink");ctx.fillText(n.title,lx,ly)}}ctx.restore()};
  const mount=(wrap,openCb)=>{wrap.innerHTML="";const{nodes,edges}=build();const cv=document.createElement("canvas");const DPR=Math.min(window.devicePixelRatio||1,2);const W=wrap.clientWidth||800,H=wrap.clientHeight||320;cv.width=W*DPR;cv.height=H*DPR;cv.style.cssText=`display:block;width:${W}px;height:${H}px;cursor:grab;touch-action:none`;wrap.appendChild(cv);const ctx=cv.getContext("2d");ctx.scale(DPR,DPR);let tx=W/2,ty=H/2,scale=1,hoverId=null;let panning=false,panStart={x:0,y:0},panOrigin={x:0,y:0};let dragging=null,dragMoved=false;let raf=null,running=true,simSteps=0;const toWorld=(cx,cy)=>({x:(cx-tx)/scale,y:(cy-ty)/scale});const hitNode=(cx,cy)=>{const{x,y}=toWorld(cx,cy);for(const n of nodes){const dx=n.x-x,dy=n.y-y;if(dx*dx+dy*dy<=(n.r+4)*(n.r+4)/scale/scale)return n}return null};const redraw=()=>drawFrame(cv,ctx,nodes,edges,hoverId,tx,ty,scale);const loop=()=>{if(!running)return;if(simSteps<K.SIM_STEPS){tick(nodes,edges);simSteps++}redraw();raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);cv.addEventListener("pointerdown",ev=>{ev.preventDefault();ev.stopPropagation();const rect=cv.getBoundingClientRect();const cx=ev.clientX-rect.left,cy=ev.clientY-rect.top;const hit=hitNode(cx,cy);if(hit){dragging=hit;dragMoved=false;cv.style.cursor="grabbing"}else{panning=true;panStart={x:ev.clientX,y:ev.clientY};panOrigin={x:tx,y:ty};cv.style.cursor="grabbing"}cv.setPointerCapture(ev.pointerId)});cv.addEventListener("pointermove",ev=>{const rect=cv.getBoundingClientRect();const cx=ev.clientX-rect.left,cy=ev.clientY-rect.top;if(dragging){const w=toWorld(cx,cy);dragging.x=w.x;dragging.y=w.y;dragging.vx=0;dragging.vy=0;dragMoved=true}else if(panning){tx=panOrigin.x+(ev.clientX-panStart.x);ty=panOrigin.y+(ev.clientY-panStart.y)}else{hoverId=(hitNode(cx,cy)||{id:null}).id||null;cv.style.cursor=hoverId?"pointer":"grab"}if(!raf&&running){raf=requestAnimationFrame(()=>{redraw();raf=null})}});cv.addEventListener("pointerup",ev=>{cv.releasePointerCapture(ev.pointerId);if(dragging){if(!dragMoved)openCb&&openCb(dragging.id);dragging=null}panning=false;cv.style.cursor="grab"});cv.addEventListener("wheel",ev=>{ev.preventDefault();ev.stopPropagation();const rect=cv.getBoundingClientRect();const cx=ev.clientX-rect.left,cy=ev.clientY-rect.top;const f=ev.deltaY<0?K.ZOOM_IN:K.ZOOM_OUT;const ns=Math.max(K.ZOOM_MIN,Math.min(K.ZOOM_MAX,scale*f));tx=cx-(cx-tx)*(ns/scale);ty=cy-(cy-ty)*(ns/scale);scale=ns;if(!raf&&running){raf=requestAnimationFrame(()=>{redraw();raf=null})}},{passive:false});return()=>{running=false;if(raf)cancelAnimationFrame(raf);raf=null}};
  return{mount};
})();
Kernel.register("Graph",Graph);

const Pal=(()=>{
  let idx=-1,domItems=[],pendingDel=null,lastQ=null,graphDestroy=null,isGraphMode=false;
  const inp=()=>U.$("pi"),list=()=>U.$("pl");
  const{e,a}=U;
  const destroyGraph=()=>{if(graphDestroy){graphDestroy();graphDestroy=null}isGraphMode=false};
  const reset=()=>{inp().value="";hide();inp().blur()};
  const hide=()=>{destroyGraph();list().classList.remove("on");list().innerHTML="";idx=-1;domItems=[];pendingDel=null;lastQ=null;inp().classList.remove("del-pending")};
  document.addEventListener("mousedown",ev=>{if(list().classList.contains("on")&&!U.$("bar").contains(ev.target))hide()},{capture:true});
  const grp=t=>`<div class="pg">${e(t)}</div>`;
  const grpRule=()=>`<hr class="pg-rule">`;
  const noteRow=(n,action,extra={})=>{const{meta}=Cache.get(n.id,n.raw);const tagHtml=meta.tags.slice(0,4).map(t=>`<span class="pi-tag">${e(t)}</span>`).join("");const xtra=Object.entries(meta.extra).filter(([k])=>k!=="title"&&k!=="tags").slice(0,2).map(([k,v])=>`<span class="pi-xtra">${e(k)}:${e(v)}</span>`).join(" ");const metaRight=(tagHtml||xtra)?`<div class="pi-meta">${tagHtml}${xtra}</div>`:"";const dataAttrs=Object.entries({...extra,id:n.id,action}).map(([k,v])=>`data-${k}="${a(v)}"`).join(" ");return`<div class="pi" ${dataAttrs}><span class="pt">${e(meta.title||"Untitled")}</span>${metaRight}</div>`};
  const cmdRow=(c,act="fill")=>`<div class="pi" data-action="${a(act)}" data-key="${a(c.k)}"><span class="pt" style="font-family:var(--f)">${e(c.l)}</span><span class="ps" style="margin-left:auto">${e(c.d)}</span></div>`;
  const parse=raw=>{if(!raw.startsWith("/"))return{type:"plain",q:raw};const body=raw.slice(1),bodyL=body.toLowerCase();const cmd=Cmds.filter(c=>!bodyL||bodyL===c.k||bodyL.startsWith(c.k+" ")).sort((a,b)=>b.k.length-a.k.length)[0];if(cmd&&(bodyL===cmd.k||bodyL.startsWith(cmd.k+" ")))return{type:"cmd",cmd,filter:body.slice(cmd.k.length).trimStart()};return{type:"partial",prefix:bodyL}};
  const scoreNotes=(q,pool)=>{if(!q)return pool;return pool.map(n=>({n,sc:U.score(q,Cache.get(n.id,n.raw).meta.title,"")})).filter(x=>x.sc>=0).sort((a,b)=>b.sc-a.sc).map(x=>x.n)};
  const applyNav=()=>{domItems.forEach((x,i)=>x.classList.toggle("on",i===idx));if(idx>=0&&domItems[idx])domItems[idx].scrollIntoView({block:"nearest"})};
  const showGraph=()=>{destroyGraph();isGraphMode=true;list().innerHTML=`<div id="pl-graph"></div>`;list().classList.add("on");graphDestroy=Graph.mount(list().querySelector("#pl-graph"),id=>{reset();Notes.open(id)});domItems=[];idx=-1;inp().focus()};
  const render=raw=>{
    raw=(raw||"").trimLeft();
    if(raw.trimStart()==="/graph"){showGraph();return}
    destroyGraph();const qChanged=raw!==lastQ;lastQ=raw;let html="";
    if(pendingDel){const n=Store.get(pendingDel);const title=n?Cache.get(n.id,n.raw).meta.title:"(deleted)";html+=grp("Confirm deletion");html+=`<div class="pi confirm-row" data-action="confirm-del" data-id="${a(pendingDel)}"><span class="pt">Delete "${e(title)}"?</span><span class="ps" style="margin-left:auto">Enter to confirm</span></div>`;html+=`<div class="pi" data-action="cancel-del"><span class="pt">Cancel</span></div>`}
    else{
      const p=parse(raw);
      if(p.type==="partial"){const cmds=Cmds.filter(c=>!p.prefix||c.k.startsWith(p.prefix)||c.k.includes(p.prefix));html+=grp("Commands");html+=cmds.map(c=>cmdRow(c)).join("")||`<div class="pnil">No commands.</div>`}
      else if(p.type==="cmd"){const{cmd,filter}=p;html+=grp(cmd.l);html+=`<div class="pi" data-action="exec" data-key="${a(cmd.k)}" data-filter="${a(filter)}"><span class="pt">${e(cmd.l)}</span><span class="ps" style="margin-left:auto">${filter?`"${e(filter)}"`:cmd.d}</span></div>`;if(!cmd.noNote){const pool=cmd.openOnly?[...document.querySelectorAll(".note-view")].map(el=>Store.get(el.dataset.id)).filter(Boolean):Store.sorted();const notes=scoreNotes(filter,pool);if(notes.length){html+=grpRule();html+=notes.slice(0,K.PAL_LIMIT).map(n=>noteRow(n,"pick",{key:cmd.k})).join("")}else if(filter&&cmd.canCreate){html+=grpRule();html+=`<div class="pi" data-action="create-cmd" data-key="${a(cmd.k)}" data-title="${a(filter)}"><span class="pt">+ Create "${e(filter)}"</span></div>`}}}
      else{
        const q=p.q;
        if(q.startsWith("#")){const t=q.slice(1).toLowerCase();const ns=Store.sorted().filter(n=>Cache.get(n.id,n.raw).meta.tags.some(x=>t?x.toLowerCase().includes(t):true));html+=grp(`#${e(q.slice(1))}`);html+=ns.length?ns.map(n=>noteRow(n,"open")).join(""):`<div class="pnil">No results.</div>`}
        else if(/^[\w-]+:/.test(q)){const ci=q.indexOf(":"),field=q.slice(0,ci).toLowerCase(),val=q.slice(ci+1).trim().toLowerCase();if(!val){const fm=Store.fieldMap().get(field);html+=grp(`${e(field)}:`);if(!fm||!fm.size)html+=`<div class="pnil">No notes have "${e(field)}".</div>`;else html+=[...fm.entries()].sort((a,b)=>b[1]-a[1]).map(([v,cnt])=>`<div class="pi" data-action="setq" data-q="${a(field+":"+v)}"><span class="pt">${e(v)}</span><span class="ps" style="margin-left:auto">${cnt} note${cnt!==1?"s":""}</span></div>`).join("")}else{const ns=Store.sorted().filter(n=>(Cache.get(n.id,n.raw).meta.extra[field]||"").toLowerCase().includes(val));html+=grp(`${e(field)}: ${e(val)}`);html+=ns.length?ns.map(n=>noteRow(n,"open")).join(""):`<div class="pnil">No results.</div>`}}
        else if(q){const scored=Store.sorted().map(n=>{const{meta,body}=Cache.get(n.id,n.raw);return{n,meta,body,sc:U.score(q,meta.title,body)}}).filter(x=>x.sc>=0).sort((a,b)=>b.sc-a.sc);html+=grp("Notes");if(scored.length){const ql=q.toLowerCase();html+=scored.slice(0,K.PAL_LIMIT).map(({n,meta,body,sc})=>{const tagHtml=meta.tags.slice(0,4).map(t=>`<span class="pi-tag">${e(t)}</span>`).join("");const bi=body.toLowerCase().indexOf(ql);let snip="";if(bi>=0&&sc<60){const st=Math.max(0,bi-12);snip=(st>0?"…":"")+body.slice(st,bi+ql.length+40).replace(/[\r\n]+/g," ")+"…"}const metaRight=tagHtml||snip?`<div class="pi-meta">${tagHtml}${snip?`<span class="pi-snip">${e(snip)}</span>`:""}</div>`:"";return`<div class="pi" data-action="open" data-id="${a(n.id)}"><span class="pt">${e(meta.title||"Untitled")}</span>${metaRight}</div>`}).join("")}else{html+=`<div class="pi" data-action="create" data-title="${a(q)}"><span class="pt">+ Create "${e(q)}"</span></div>`}html+=grpRule();const matchCmds=Cmds.filter(c=>c.k.includes(q.toLowerCase()));if(matchCmds.length)html+=matchCmds.map(c=>cmdRow(c)).join("")}
        else{html+=grp("Notes");const ns=Store.sorted().slice(0,K.PAL_LIMIT);html+=ns.length?ns.map(n=>noteRow(n,"open")).join(""):`<div class="pnil">No notes yet.</div>`;html+=grpRule();html+=grp("Commands");html+=Cmds.map(c=>cmdRow(c)).join("")}
      }
    }
    list().innerHTML=`<div id="pl-body">${html}</div>`;list().classList.add("on");
    setTimeout(()=>{domItems=[...list().querySelectorAll(".pi")];if(pendingDel&&qChanged)idx=0;if(idx>=domItems.length)idx=Math.max(0,domItems.length-1);if(idx<0&&domItems.length)idx=0;applyNav()},0);
  };
  const cancelDel=()=>{pendingDel=null;inp().classList.remove("del-pending");inp().value="/del ";render("/del ");inp().focus()};
  const exec=el=>{
    const{action,id,key,title,q,filter}=el.dataset;
    if(action==="open"){Notes.open(id);inp().value="";render("");inp().focus()}
    else if(action==="setq"){inp().value=q;inp().focus();render(q)}
    else if(action==="create"){Notes.create(title);inp().value="";render("");inp().focus()}
    else if(action==="fill"){const c=Cmds.find(c=>c.k===key);if(!c)return;if(c.k==="graph"){inp().value="/graph";render("/graph");return}if(c.noNote){c.act(undefined,"");inp().value="";render("");inp().focus()}else{inp().value="/"+c.k+" ";inp().focus();render(inp().value)}}
    else if(action==="exec"){const c=Cmds.find(c=>c.k===key);if(!c)return;if(c.k==="graph"){inp().value="/graph";render("/graph");return}if(c.noNote){c.act(undefined,filter||"");inp().value="";render("");inp().focus()}else if(filter){c.act(undefined,filter||"");inp().value="";render("");inp().focus()}else{inp().value="/"+c.k+" ";inp().focus();render(inp().value)}}
    else if(action==="pick"){const c=Cmds.find(c=>c.k===key);if(!c)return;if(c.k==="del"){pendingDel=id;idx=0;inp().classList.add("del-pending");inp().value=`/del ${Cache.get(id,Store.get(id)?.raw??"").meta.title}`;render(inp().value);inp().focus()}else{c.act(id);inp().value="";render("");inp().focus()}}
    else if(action==="create-cmd"){const c=Cmds.find(c=>c.k===key);if(!c)return;if(c.onCreate)c.onCreate(title);else Notes.create(title);inp().value="";render("");inp().focus()}
    else if(action==="confirm-del"){const delId=id;pendingDel=null;inp().classList.remove("del-pending");Notes.del(delId);inp().value="";render("");inp().focus()}
    else if(action==="cancel-del"){cancelDel()}
  };
  const deb=U.deb(q=>render(q),K.PAL_DEB_MS);
  document.addEventListener("DOMContentLoaded",()=>{
    const i=inp();
    i.addEventListener("focus",()=>render(i.value));
    list().addEventListener("mousedown",ev=>{ev.preventDefault();ev.stopPropagation()});
    list().addEventListener("click",ev=>{const it=ev.target.closest(".pi");if(it){exec(it);setTimeout(()=>inp().focus(),0)}});
    list().addEventListener("pointermove",ev=>{if(isGraphMode)return;const it=ev.target.closest(".pi");if(it){const ni=domItems.indexOf(it);if(ni>=0&&ni!==idx){idx=ni;applyNav()}}});
    i.addEventListener("input",()=>{if(pendingDel){pendingDel=null;inp().classList.remove("del-pending")}const v=i.value;if(v.trimStart()==="/graph"){render(v);return}deb(v)});
    i.addEventListener("keydown",ev=>{
      if(ev.key==="ArrowDown"){ev.preventDefault();if(!isGraphMode){idx=Math.min((domItems.length||1)-1,idx+1);applyNav()}}
      else if(ev.key==="ArrowUp"){ev.preventDefault();if(!isGraphMode){idx=Math.max(0,idx-1);applyNav()}}
      else if(ev.key==="Enter"){ev.preventDefault();if(isGraphMode)return;if(idx>=0&&domItems[idx])exec(domItems[idx]);else{const q=inp().value.trim();if(q&&!q.startsWith("/")&&!q.startsWith("#")){Notes.create(q);inp().value="";render("")}}}
      else if(ev.key==="Escape"){ev.preventDefault();if(pendingDel)cancelDel();else reset()}
    });
  });
  const set=q=>{inp().value=q;inp().focus();render(q)};
  return{focus:()=>inp().focus(),set};
})();
Kernel.register("Pal",Pal);

const Cmds=[
  {k:"new",l:"/new",d:"Create a note",noNote:true,act:(_,f)=>Notes.create(f||"")},
  {k:"open",l:"/open",d:"Open or create note",canCreate:true,act:id=>Notes.open(id),onCreate:t=>Notes.create(t)},
  {k:"edit",l:"/edit",d:"Open in edit mode",act:id=>Notes.open(id,true)},
  {k:"close",l:"/close",d:"Close current note",noNote:true,act:()=>{const id=Notes.currentId();if(id)Notes.close(id)}},
  {k:"closeall",l:"/closeall",d:"Close all notes",noNote:true,act:()=>Notes.closeAll()},
  {k:"del",l:"/del",d:"Delete (confirms in palette)",act:id=>Notes.del(id)},
  {k:"graph",l:"/graph",d:"Visualize note connections",noNote:true,act:()=>{}},
  {k:"save",l:"/save",d:"Download snapshot",noNote:true,act:()=>Save.go()},
];
Kernel.register("Cmds",Cmds);

const Save={go:()=>{
  Notes.exitActive();
  const data={notes:Store.snap(),state:State.get()};
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector("#stage").innerHTML="";
  clone.querySelector("#toasts").innerHTML="";
  clone.querySelector("#pl").innerHTML="";
  clone.querySelector("#pl").classList.remove("on");
  clone.querySelector("#pi").value="";
  clone.querySelector("#pi").classList.remove("del-pending");
  const safeJSON=JSON.stringify(data,null,2).replace(/</g,"\\u003c");
  const html=clone.outerHTML.replace(/(<script\s+id="loom-pocket"[^>]*>)([\s\S]*?)(<\/script>)/,(_,p1,_2,p3)=>`${p1}\n${safeJSON}\n${p3}`);
  const anchor=document.createElement("a");
  anchor.href=URL.createObjectURL(new Blob(["<!doctype html>\n"+html],{type:"text/html"}));
  anchor.download=`loom-${new Date().toISOString().slice(0,10)}.html`;
  anchor.click();URL.revokeObjectURL(anchor.href);
  Toast.show("Saved");
}};
Kernel.register("Save",Save);

const style=document.createElement("style");
style.textContent=`#main.sb-locked{overflow:hidden;padding-right:calc(var(--s5) + var(--sb-scroll, 0px))}`;
document.head.appendChild(style);

Store.init();
(State.get().openNotes?.length?State.get().openNotes:[Store.sorted()[0]?.id]).filter(Boolean).forEach(id=>Notes.open(id));
document.addEventListener("keydown",ev=>{
  const mod=navigator.platform.includes("Mac")?ev.metaKey:ev.ctrlKey;
  if(mod&&ev.key==="k"){ev.preventDefault();Pal.focus()}
  if(mod&&ev.key==="s"){ev.preventDefault();Save.go()}
  if(ev.key===">"&&ev.target.tagName!=="TEXTAREA"&&ev.target.tagName!=="INPUT"){ev.preventDefault();Pal.focus()}
});
window.addEventListener("beforeunload",ev=>{Notes.exitActive();ev.preventDefault();ev.returnValue=""});
</script>
