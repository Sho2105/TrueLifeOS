<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfect Dark Shadow</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #111;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 32px 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fira Code', monospace;
      color: #ccc;
    }

    .card {
      background: #0f0f0f;
      padding: 40px;
      border-radius: 16px;
      font-size: 13px;
      max-width: 90vw;
      box-shadow:
        0px 0px 0px 3px rgba(165, 165, 165, 0.04),
        -9px 9px 0 -0.5px rgba(0, 0, 0, 0.04),
        -18px 18px 18px -1.5px rgba(0, 0, 0, 0.08),
        -37px 37px 37px -3px rgba(0, 0, 0, 0.16),
        -75px 75px 75px -6px rgba(0, 0, 0, 0.24),
        -150px 150px 150px -12px rgba(0, 0, 0, 0.48);
    }
  </style>
</head>
<body>
  <div class="card">
    <pre>
box-shadow:
  0px 0px 0px 3px rgba(165,165,165,0.04),
  -9px 9px 0 -0.5px rgba(0, 0, 0, 0.04),
  -18px 18px 18px -1.5px rgba(0, 0, 0, 0.08),
  -37px 37px 37px -3px rgba(0, 0, 0, 0.16),
  -75px 75px 75px -6px rgba(0, 0, 0, 0.24),
  -150px 150px 150px -12px rgba(0, 0, 0, 0.48);
    </pre>
  </div>
</body>
</html>
