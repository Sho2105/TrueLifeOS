<!DOCTYPE html>
<html lang="en">
<!-- Rules:
Naming: Use `root-` for core/shared elements, `branchX-` for page-specific
Rules: No external libs, no internet, minimal, responsive, self-contained, future proof, no abbreviations
Add Branch: Clone a template (e.g., `branch1-notes-template`), add to `rootState.pageTemplates` and `availablePages`, define `rootApplication.branchX.render`, setup buttons in `rootButtonLibrary.setupBranchX`.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LifeOS</title>
    <style>
        :root {
            --primary: hsl(0, 0%, 27%);
            --secondary: hsl(0, 0%, 53%);
            --background: hsl(0, 0%, 95%);
            --card: hsl(0, 0%, 100%);
            --accent: hsl(0, 0%, 80%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: clamp(12px, 3.5vw, 16px);
            line-height: 1.8;
            max-width: 73%;
            margin: 5% auto;
        }

        .root-main {
            width: 100%;
            margin: 0.2rem auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .root-page {
            display: none;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 0.2rem;
        }

        .root-page.active {
            display: flex;
        }

        .small-window {
            position: absolute;
            background: var(--card);
            border: 1px solid var(--secondary);
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 0.2rem;
            padding: 0.5rem;
            user-select: none;
        }

        .small-window.active {
            display: flex;
        }

        .small-window-notes {
            width: clamp(200px, 50vw, 400px);
            height: clamp(150px, 40vh, 300px);
        }

        .small-window-game {
            width: clamp(150px, 40vw, 320px);
            height: clamp(100px, 30vh, 220px);
        }

        .small-window-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.2rem;
            padding-bottom: 0.2rem;
            cursor: move;
        }

        .small-window-title {
            font-size: clamp(0.9rem, 2.2vw, 1.1rem);
            color: var(--primary);
            cursor: move;
        }

        .small-window-buttons {
            display: flex;
            gap: 0.2rem;
        }

        .small-window-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow-y: auto;
        }

        .root-clickable {
            color: var(--primary);
            cursor: pointer;
            border-bottom: 1px solid var(--primary);
            text-decoration: none;
        }

        .root-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(20px, 6vw, 24px);
            height: clamp(20px, 6vw, 24px);
        }

        .root-button svg {
            width: clamp(10px, 3vw, 12px);
            height: clamp(10px, 3vw, 12px);
            fill: var(--primary);
        }

        .root-tooltip-zone {
            position: fixed;
            bottom: 0.2rem;
            right: 0.2rem;
            color: var(--primary);
            padding: 0.2rem;
            font-size: clamp(8px, 2vw, 10px);
            max-width: 50vw;
            display: none;
        }

        .root-tooltip-zone.active {
            display: block;
        }

        .root-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(0.8rem, 2vw, 1rem);
            z-index: 1000;
            display: none;
        }

        .root-loading-overlay.active {
            display: flex;
        }

        .root-loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(0.8rem, 2vw, 1rem);
            z-index: 1000;
        }

        .root-loading-screen.hidden {
            display: none;
        }

        .root-input,
        textarea,
        select,
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"],
        input[type="url"],
        input[type="search"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="datetime-local"],
        input[type="month"],
        input[type="week"],
        input[type="color"],
        input[type="file"],
        input[type="range"] {
            appearance: none;
            padding: 0.2rem;
            background: var(--card);
            color: var(--primary);
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            width: 100%;
            font-family: monospace;
            border: 1px solid var(--secondary);
        }

        .root-input:focus,
        textarea:focus,
        select:focus,
        input:focus {
            border-color: var(--secondary);
            outline: none;
        }

        input[type="checkbox"],
        input[type="radio"] {
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--card);
            border: 1px solid var(--secondary);
            cursor: pointer;
        }

        input[type="checkbox"]:checked,
        input[type="radio"]:checked {
            background: var(--secondary);
        }

        input[type="checkbox"] {
            border-radius: 2px;
        }

        input[type="radio"] {
            border-radius: 50%;
        }

        select {
            background: var(--card);
            padding-right: 1rem;
            border: 1px solid var(--secondary);
        }

        input[type="range"] {
            height: 4px;
            background: var(--accent);
            cursor: pointer;
        }

        input[type="file"]::-webkit-file-upload-button {
            background: var(--card);
            border: 1px solid var(--secondary);
            color: var(--primary);
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            cursor: pointer;
            padding: 0.2rem;
        }

        progress,
        meter {
            appearance: none;
            width: 100%;
            height: 8px;
            background: var(--accent);
        }

        .root-scrollbar {
            scrollbar-width: none;
        }

        @media (max-width: 600px) {
            .root-main {
                max-width: 100vw;
                margin: 0.1rem auto;
            }

            .small-window {
                width: 90vw !important;
            }

            .root-button {
                width: clamp(18px, 5vw, 22px);
                height: clamp(18px, 5vw, 22px);
            }

            .root-button svg {
                width: clamp(8px, 2.5vw, 10px);
                height: clamp(8px, 2.5vw, 10px);
            }
        }

        @media (max-width: 400px) {
            body {
                font-size: clamp(10px, 3vw, 14px);
            }

            .small-window-content {
                min-width: 60%;
            }

            .small-window-title {
                font-size: clamp(0.8rem, 2vw, 1rem);
            }
        }

        .branch1-note-input {
            resize: vertical;
            min-height: clamp(60px, 15vh, 80px);
            flex-grow: 1;
        }

        .branch1-note-view {
            flex-grow: 1;
            padding: 0.2rem;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            font-family: monospace;
            white-space: pre-wrap;
            display: none;
            overflow-y: auto;
        }

        .branch1-note-view.active {
            display: block;
        }

        .branch1-note-view h1 {
            font-size: 1.6em;
            margin: 0.6em 0;
        }

        .branch1-note-view h2 {
            font-size: 1.4em;
            margin: 0.5em 0;
        }

        .branch1-note-view h3 {
            font-size: 1.2em;
            margin: 0.4em 0;
        }

        .branch1-note-view h4 {
            font-size: 1.1em;
            margin: 0.3em 0;
        }

        .branch1-note-view h5 {
            font-size: 1em;
            margin: 0.3em 0;
        }

        .branch1-note-view h6 {
            font-size: 0.9em;
            margin: 0.3em 0;
        }

        .branch1-note-view strong {
            font-weight: bold;
        }

        .branch1-note-view em {
            font-style: italic;
        }

        .branch1-note-view a {
            color: var(--primary);
            border-bottom: 1px solid var(--primary);
            text-decoration: none;
        }

        .branch1-note-view ul,
        .branch1-note-view ol {
            margin: 0.5em 0;
            padding-left: 1.5em;
        }

        .branch1-note-view li {
            margin: 0.2em 0;
        }

        .branch1-note-view img {
            max-width: 100%;
            height: auto;
            margin: 0.5em 0;
        }

        .branch1-note-view audio,
        .branch1-note-view video {
            max-width: 100%;
            margin: 0.5em 0;
        }

        .branch1-note-view blockquote {
            margin: 0.5em 0;
            padding-left: 1em;
            color: var(--secondary);
        }

        .branch1-note-view pre {
            background: var(--card);
            padding: 0.5em;
            overflow-x: auto;
        }

        .branch1-note-view code {
            background: var(--card);
            padding: 0.1em 0.2em;
        }

        .branch1-note-view table {
            border-collapse: collapse;
            margin: 0.5em 0;
        }

        .branch1-note-view th,
        .branch1-note-view td {
            border: 1px solid var(--secondary);
            padding: 0.3em;
        }

        .branch1-note-view hr {
            border: none;
            border-top: 1px solid var(--secondary);
            margin: 0.5em 0;
        }

        .branch1-note-view del {
            text-decoration: line-through;
        }

        .branch2-game-canvas {
            width: 100%;
            height: clamp(80px, 20vh, 120px);
            background: var(--card);
        }
    </style>
</head>

<body>
    <div class="root-loading-screen">Loading...</div>
    <div class="root-loading-overlay">Uploading...</div>
    <div class="root-tooltip-zone"></div>
    <main class="root-main">
        <section id="home" class="root-page active" role="region" aria-label="Home Page">
            <p>
                Explore <span class="root-clickable" data-window="notes">Notes</span> or
                <span class="root-clickable" data-window="game">Game</span>.
            </p>
        </section>
    </main>

    <template id="branch1-notes-template">
        <div id="notes" class="small-window small-window-notes" role="region" aria-label="Notes Window">
            <div class="small-window-toolbar">
                <span class="small-window-title">Notes</span>
                <div class="small-window-buttons"></div>
            </div>
            <div class="small-window-content">
                <textarea class="root-input branch1-note-input root-scrollbar" placeholder="Write note..."
                    data-input="note"></textarea>
                <div class="branch1-note-view root-scrollbar"></div>
            </div>
        </div>
    </template>
    <template id="branch2-game-template">
        <div id="game" class="small-window small-window-game" role="region" aria-label="Game Window">
            <div class="small-window-toolbar">
                <span class="small-window-title">Game</span>
                <div class="small-window-buttons"></div>
            </div>
            <div class="small-window-content">
                <canvas class="branch2-game-canvas" width="300" height="120"></canvas>
            </div>
        </div>
    </template>

    <script>
        (function () {
            const rootState = {
                currentWindow: null,
                availableWindows: ['notes', 'game'],
                windowTemplates: {
                    notes: 'branch1-notes-template',
                    game: 'branch2-game-template'
                },
                templateCache: new Map(),
                branch1: {
                    text: '',
                    isViewMode: false,
                    cachedHtml: '',
                    history: [''],
                    historyIndex: 0,
                    maxHistory: 50
                },
                branch2: {}
            };

            const rootDragHandler = {
                isDragging: false,
                startX: 0,
                startY: 0,
                initDrag(container, event, isTouch = false) {
                    const target = event.target.closest('.small-window-toolbar') || event.target.closest('.small-window-title');
                    if (!target || event.target.closest('.root-button')) return;
                    this.isDragging = true;
                    const rect = container.getBoundingClientRect();
                    const touch = isTouch ? event.touches[0] : event;
                    this.startX = touch.clientX - rect.left;
                    this.startY = touch.clientY - rect.top;
                    event.preventDefault();
                    document.addEventListener('mousemove', e => this.moveDrag(container, e));
                    document.addEventListener('touchmove', e => this.moveDrag(container, e, true));
                    document.addEventListener('mouseup', () => this.stopDrag());
                    document.addEventListener('touchend', () => this.stopDrag());
                },
                moveDrag(container, event, isTouch = false) {
                    if (!this.isDragging) return;
                    const touch = isTouch ? event.touches[0] : event;
                    const newX = touch.clientX - this.startX;
                    const newY = touch.clientY - this.startY;
                    const maxX = window.innerWidth - container.offsetWidth;
                    const maxY = window.innerHeight - container.offsetHeight;
                    container.style.left = `${Math.max(0, Math.min(newX, maxX))}px`;
                    container.style.top = `${Math.max(0, Math.min(newY, maxY))}px`;
                    event.preventDefault();
                },
                stopDrag() {
                    this.isDragging = false;
                    document.removeEventListener('mousemove', this.moveDrag);
                    document.removeEventListener('touchmove', this.moveDrag);
                    document.removeEventListener('mouseup', this.stopDrag);
                    document.removeEventListener('touchend', this.stopDrag);
                }
            };

            const rootToggleWindow = (windowId, clickableElement) => {
                console.log(`[Background] Toggling window: ${windowId}`);
                try {
                    if (!rootState.availableWindows.includes(windowId)) throw new Error(`Window not found: ${windowId}`);
                    let targetWindow = document.getElementById(windowId);
                    if (rootState.currentWindow === windowId) {
                        targetWindow?.remove();
                        rootState.currentWindow = null;
                        return;
                    }
                    if (rootState.currentWindow) {
                        document.getElementById(rootState.currentWindow)?.remove();
                        rootState.currentWindow = null;
                    }
                    if (!targetWindow) {
                        if (rootState.templateCache.has(windowId)) {
                            targetWindow = rootState.templateCache.get(windowId).cloneNode(true);
                        } else {
                            const template = document.getElementById(rootState.windowTemplates[windowId]);
                            if (!template?.content?.firstElementChild) throw new Error(`Template corrupt: ${windowId}`);
                            const rawTemplate = template.content.firstElementChild.cloneNode(true);
                            rootState.templateCache.set(windowId, rawTemplate);
                            targetWindow = rawTemplate.cloneNode(true);
                        }
                        const toolbar = targetWindow.querySelector('.small-window-buttons');
                        toolbar.innerHTML = '';
                        if (windowId === 'notes') {
                            rootButtonLibrary.setupBranch1(toolbar);
                            rootApplication.branch1.render(targetWindow);
                        } else if (windowId === 'game') {
                            rootButtonLibrary.setupBranch2(toolbar);
                            rootApplication.branch2.render(targetWindow);
                        }
                        targetWindow.querySelectorAll('.root-input').forEach(input => rootInputHandler.bindInput(input, targetWindow));
                        targetWindow.addEventListener('mousedown', e => rootDragHandler.initDrag(targetWindow, e));
                        targetWindow.addEventListener('touchstart', e => rootDragHandler.initDrag(targetWindow, e, true));
                        targetWindow.addEventListener('mousemove', e => rootDragHandler.moveDrag(targetWindow, e));
                        targetWindow.addEventListener('touchmove', e => rootDragHandler.moveDrag(targetWindow, e, true));
                        targetWindow.addEventListener('mouseup', () => rootDragHandler.stopDrag());
                        targetWindow.addEventListener('touchend', () => rootDragHandler.stopDrag());
                        document.querySelector('.root-main').appendChild(targetWindow);
                        const rect = clickableElement.getBoundingClientRect();
                        targetWindow.style.left = `${rect.right + 10}px`;
                        targetWindow.style.top = `${rect.top}px`;
                        targetWindow.classList.add('active');
                        rootState.currentWindow = windowId;
                        document.querySelector('.root-loading-screen').classList.add('hidden');
                        console.log('[Background] Loading screen hidden');
                    }
                } catch (error) {
                    console.error(`[Error] ${error}`);
                    document.querySelector('.root-loading-screen').classList.add('hidden');
                    alert('Failed to open window.');
                }
            };

            const rootButtonLibrary = {
                createButton(action, tooltip, svgPath) {
                    const btn = document.createElement('button');
                    btn.className = 'root-button';
                    btn.dataset.action = action;
                    btn.dataset.tooltip = tooltip;
                    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="${svgPath}"/></svg>`;
                    return btn;
                },
                getSaveButton() {
                    return this.createButton('save', 'Save', 'M17 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3zm3-10H5V5h10v4z');
                },
                getLoadButton() {
                    return this.createButton('load', 'Load', 'M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z');
                },
                getViewButton() {
                    return this.createButton('toggle-view', 'Toggle View', 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z');
                },
                getImportButton() {
                    return this.createButton('import', 'Import Media (Max 10MB)', 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m14-7l-5-5m0 0l-5 5m5-5v12');
                },
                getUndoButton() {
                    return this.createButton('undo', 'Undo', 'M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z');
                },
                getRedoButton() {
                    return this.createButton('redo', 'Redo', 'M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z');
                },
                setupBranch1(toolbar) {
                    [this.getSaveButton(), this.getLoadButton(), this.getImportButton(),
                    this.getViewButton(), this.getUndoButton(), this.getRedoButton()]
                        .forEach(btn => toolbar.appendChild(btn));
                },
                setupBranch2(toolbar) { }
            };

            const rootInputHandler = {
                bindInput(input, container) {
                    if (input.dataset.input !== 'note') return;
                    input.addEventListener('input', e => {
                        const newText = e.target.value.trim();
                        if (newText === rootState.branch1.text) return;
                        rootState.branch1.text = newText;
                        rootState.branch1.history = rootState.branch1.history.slice(0, rootState.branch1.historyIndex + 1);
                        rootState.branch1.history.push(newText);
                        if (rootState.branch1.history.length > rootState.branch1.maxHistory) {
                            rootState.branch1.history.shift();
                        }
                        rootState.branch1.historyIndex = rootState.branch1.history.length - 1;
                        rootState.branch1.cachedHtml = '';
                    });
                    input.addEventListener('touchstart', e => {
                        if (e.target.closest('.small-window-toolbar')) return;
                        e.stopPropagation();
                        input.focus();
                    });
                    input.addEventListener('click', e => {
                        e.stopPropagation();
                        input.focus();
                    });
                }
            };

            const rootMediaHandler = {
                fileToBase64(file) {
                    return new Promise((resolve, reject) => {
                        try {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = () => reject(new Error('Failed to read file'));
                            reader.readAsDataURL(file);
                        } catch (error) {
                            reject(error);
                        }
                    });
                },
                getFileType(file) {
                    const type = file.type.split('/')[0];
                    return ['image', 'audio', 'video'].includes(type) ? type : null;
                },
                insertMedia(container, base64, type, alt = 'media') {
                    try {
                        const input = container.querySelector('.branch1-note-input');
                        const cursorPos = input.selectionStart;
                        const textBefore = rootState.branch1.text.slice(0, cursorPos);
                        const textAfter = rootState.branch1.text.slice(cursorPos);
                        const markdown = type === 'image' ? `![${alt}](${base64})\n` :
                            type === 'audio' ? `[audio](${base64})\n` :
                                `[video](${base64})\n`;
                        rootState.branch1.text = textBefore + markdown + textAfter;
                        rootState.branch1.history = rootState.branch1.history.slice(0, rootState.branch1.historyIndex + 1);
                        rootState.branch1.history.push(rootState.branch1.text);
                        if (rootState.branch1.history.length > rootState.branch1.maxHistory) {
                            rootState.branch1.history.shift();
                        }
                        rootState.branch1.historyIndex = rootState.branch1.history.length - 1;
                        rootState.branch1.cachedHtml = '';
                        rootApplication.branch1.render(container);
                    } catch (error) {
                        console.error(`[Error] Media insertion failed: ${error}`);
                        alert('Failed to insert media.');
                    }
                }
            };

            const rootTooltipHandler = {
                showTooltip(text) {
                    const zone = document.querySelector('.root-tooltip-zone');
                    zone.textContent = text;
                    zone.classList.add('active');
                },
                hideTooltip() {
                    document.querySelector('.root-tooltip-zone').classList.remove('active');
                }
            };

            const rootInitialize = () => {
                console.log('[Background] Starting app');
                document.addEventListener('DOMContentLoaded', () => {
                    console.log('[Background] DOM ready');
                    try {
                        document.querySelector('#home').classList.add('active');
                        document.querySelector('.root-loading-screen').classList.add('hidden');
                    } catch (error) {
                        console.error(`[Error] App start failed: ${error}`);
                        alert('Failed to initialize app.');
                    }
                });

                const main = document.querySelector('.root-main');
                const handleInteraction = (event, isTouch = false) => {
                    const span = event.target.closest('.root-clickable');
                    const button = event.target.closest('.root-button');
                    const container = button?.closest('.small-window');
                    if (span) {
                        if (isTouch) event.preventDefault();
                        const windowId = span.dataset.window;
                        if (windowId) {
                            console.log(`[Background] Window ${isTouch ? 'touched' : 'clicked'}: ${windowId}`);
                            rootToggleWindow(windowId, span);
                        }
                        return;
                    }
                    if (!button || !container) return;
                    if (isTouch) event.preventDefault();
                    const action = button.dataset.action;
                    console.log(`[Background] Button ${isTouch ? 'touched' : 'clicked'}: ${action}`);
                    if (container.id === 'notes') {
                        const actions = {
                            save: () => rootApplication.branch1.save(container),
                            load: () => rootApplication.branch1.load(container),
                            import: () => rootApplication.branch1.importMedia(container),
                            'toggle-view': () => rootApplication.branch1.toggleView(container),
                            undo: () => rootApplication.branch1.undo(container),
                            redo: () => rootApplication.branch1.redo(container)
                        };
                        actions[action]?.();
                    }
                };

                main.addEventListener('click', handleInteraction);
                main.addEventListener('touchstart', e => handleInteraction(e, true));
                main.addEventListener('mouseover', e => {
                    const button = e.target.closest('.root-button');
                    if (button && button.dataset.tooltip) rootTooltipHandler.showTooltip(button.dataset.tooltip);
                });
                main.addEventListener('mouseout', e => {
                    if (e.target.closest('.root-button')) rootTooltipHandler.hideTooltip();
                });
            };

            window.rootApplication = {
                branch1: {
                    save(container) {
                        console.log('[Background] Saving note');
                        try {
                            const blob = new Blob([rootState.branch1.text || ''], { type: 'text/plain' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'note.md';
                            a.click();
                            URL.revokeObjectURL(url);
                            console.log('[Background] Note saved');
                        } catch (error) {
                            console.error(`[Error] Save failed: ${error}`);
                            alert('Failed to save note.');
                        }
                    },
                    load(container) {
                        console.log('[Background] Loading note');
                        try {
                            const input = document.createElement('input');
                            input.type = 'file';
                            input.accept = '.md';
                            input.addEventListener('change', event => {
                                const file = event.target.files[0];
                                if (!file || (!file.name.endsWith('.md') && file.type !== 'text/plain' && file.type !== 'application/octet-stream')) return;
                                const reader = new FileReader();
                                reader.onload = e => {
                                    rootState.branch1.text = e.target.result.trim();
                                    rootState.branch1.history = [rootState.branch1.text];
                                    rootState.branch1.historyIndex = 0;
                                    rootState.branch1.cachedHtml = '';
                                    this.render(container);
                                    console.log('[Background] Note loaded');
                                };
                                reader.onerror = () => {
                                    console.error('[Error] Failed to read .md file');
                                    alert('Failed to load note.');
                                };
                                reader.readAsText(file);
                            });
                            input.click();
                        } catch (error) {
                            console.error(`[Error] Load failed: ${error}`);
                            alert('Failed to load note.');
                        }
                    },
                    importMedia(container) {
                        console.log('[Background] Importing media');
                        try {
                            const overlay = document.querySelector('.root-loading-overlay');
                            overlay.classList.add('active');
                            const input = document.createElement('input');
                            input.type = 'file';
                            input.accept = 'image/*,audio/mpeg,video/mp4';
                            input.addEventListener('change', async event => {
                                const file = event.target.files[0];
                                if (!file) {
                                    overlay.classList.remove('active');
                                    return;
                                }
                                if (file.size > 10 * 1024 * 1024) {
                                    overlay.classList.remove('active');
                                    alert('File too large. Maximum size is 10MB.');
                                    return;
                                }
                                if (file.type.startsWith('image/') || file.type === 'audio/mpeg' || file.type === 'video/mp4') {
                                    try {
                                        const base64 = await rootMediaHandler.fileToBase64(file);
                                        const type = rootMediaHandler.getFileType(file);
                                        if (type) {
                                            rootMediaHandler.insertMedia(container, base64, type, file.name);
                                            console.log('[Background] Media imported');
                                        }
                                    } catch (error) {
                                        console.error(`[Error] Media import failed: ${error}`);
                                        alert('Failed to import media.');
                                    }
                                } else {
                                    alert('Unsupported file type.');
                                }
                                overlay.classList.remove('active');
                            });
                            input.addEventListener('cancel', () => overlay.classList.remove('active'));
                            input.click();
                        } catch (error) {
                            console.error(`[Error] Import failed: ${error}`);
                            alert('Failed to import media.');
                            document.querySelector('.root-loading-overlay').classList.remove('active');
                        }
                    },
                    toggleView(container) {
                        console.log('[Background] Toggling view mode');
                        try {
                            rootState.branch1.isViewMode = !rootState.branch1.isViewMode;
                            this.render(container);
                        } catch (error) {
                            console.error(`[Error] Toggle view failed: ${error}`);
                            alert('Failed to toggle view mode.');
                        }
                    },
                    undo(container) {
                        console.log('[Background] Undo action');
                        try {
                            if (rootState.branch1.historyIndex > 0) {
                                rootState.branch1.historyIndex--;
                                rootState.branch1.text = rootState.branch1.history[rootState.branch1.historyIndex];
                                rootState.branch1.cachedHtml = '';
                                this.render(container);
                            }
                        } catch (error) {
                            console.error(`[Error] Undo failed: ${error}`);
                            alert('Failed to undo.');
                        }
                    },
                    redo(container) {
                        console.log('[Background] Redo action');
                        try {
                            if (rootState.branch1.historyIndex < rootState.branch1.history.length - 1) {
                                rootState.branch1.historyIndex++;
                                rootState.branch1.text = rootState.branch1.history[rootState.branch1.historyIndex];
                                rootState.branch1.cachedHtml = '';
                                this.render(container);
                            }
                        } catch (error) {
                            console.error(`[Error] Redo failed: ${error}`);
                            alert('Failed to redo.');
                        }
                    },
                    render(container) {
                        console.log('[Background] Rendering notes');
                        try {
                            const input = container.querySelector('.branch1-note-input');
                            const view = container.querySelector('.branch1-note-view');
                            input.style.display = rootState.branch1.isViewMode ? 'none' : 'block';
                            view.classList.toggle('active', rootState.branch1.isViewMode);
                            input.value = rootState.branch1.text || '';
                            if (rootState.branch1.isViewMode) {
                                if (!rootState.branch1.cachedHtml) {
                                    rootState.branch1.cachedHtml = this.parseMarkdown(rootState.branch1.text || '');
                                }
                                view.innerHTML = rootState.branch1.cachedHtml;
                            } else {
                                view.innerHTML = '';
                                rootState.branch1.cachedHtml = '';
                            }
                            document.querySelector('.root-loading-screen').classList.add('hidden');
                            console.log('[Background] Loaded');
                        } catch (error) {
                            console.error(`[Error] Render failed: ${error}`);
                            alert('Failed to render note.');
                            document.querySelector('.root-loading-screen').classList.add('hidden');
                        }
                    },
                    parseMarkdown(text) {
                        const lines = text.split('\n');
                        let html = '';
                        let inList = false;
                        let listStack = [];
                        let inCodeBlock = false;
                        let codeBlockContent = '';
                        let inTable = false;
                        let tableRows = [];
                        let tableHeaders = [];

                        for (let i = 0; i < lines.length; i++) {
                            let line = lines[i].trim();
                            if (!line) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                if (inCodeBlock) {
                                    codeBlockContent += '\n';
                                } else if (inTable) {
                                    html += this.renderTable(tableHeaders, tableRows);
                                    inTable = false;
                                    tableHeaders = [];
                                    tableRows = [];
                                } else {
                                    html += '<br>';
                                }
                                continue;
                            }

                            if (inCodeBlock) {
                                if (line.match(/^```/)) {
                                    html += `<pre><code>${codeBlockContent}</code></pre>`;
                                    inCodeBlock = false;
                                    codeBlockContent = '';
                                } else {
                                    codeBlockContent += line + '\n';
                                }
                                continue;
                            }

                            if (line.match(/^```/)) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                if (inTable) {
                                    html += this.renderTable(tableHeaders, tableRows);
                                    inTable = false;
                                    tableHeaders = [];
                                    tableRows = [];
                                }
                                inCodeBlock = true;
                                continue;
                            }

                            if (line.match(/^(---|\*\*\*|___)$/)) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                if (inTable) {
                                    html += this.renderTable(tableHeaders, tableRows);
                                    inTable = false;
                                    tableHeaders = [];
                                    tableRows = [];
                                }
                                html += '<hr>';
                                continue;
                            }

                            if (line.startsWith('>')) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                if (inTable) {
                                    html += this.renderTable(tableHeaders, tableRows);
                                    inTable = false;
                                    tableHeaders = [];
                                    tableRows = [];
                                }
                                html += `<blockquote>${this.parseInline(line.slice(1).trim())}</blockquote>`;
                                continue;
                            }

                            if (line.match(/^\|.*\|$/)) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                try {
                                    const cells = line.split('|').map(cell => cell.trim()).filter(cell => cell);
                                    if (!inTable) {
                                        if (cells.length === 0) continue;
                                        inTable = true;
                                        tableHeaders = cells;
                                        if (lines[i + 1] && lines[i + 1].match(/^\|[-:\s]+\|$/)) {
                                            i++;
                                        }
                                    } else {
                                        tableRows.push(cells);
                                    }
                                } catch (error) {
                                    console.warn(`[Warn] Malformed table row skipped: ${line}`);
                                    inTable = false;
                                    tableHeaders = [];
                                    tableRows = [];
                                }
                                continue;
                            } else if (inTable) {
                                html += this.renderTable(tableHeaders, tableRows);
                                inTable = false;
                                tableHeaders = [];
                                tableRows = [];
                            }

                            if (line.match(/^!\[([^\]]*)\]\((data:image\/[^)]+)\)/)) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                const match = line.match(/^!\[([^\]]*)\]\((data:image\/[^)]+)\)/);
                                html += `<img src="${match[2]}" alt="${match[1]}">`;
                                continue;
                            }

                            if (line.match(/^\[audio\]\((data:audio\/[^)]+)\)/)) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                const match = line.match(/^\[audio\]\((data:audio\/[^)]+)\)/);
                                html += `<audio controls src="${match[1]}"></audio>`;
                                continue;
                            }

                            if (line.match(/^\[video\]\((data:video\/[^)]+)\)/)) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                const match = line.match(/^\[video\]\((data:video\/[^)]+)\)/);
                                html += `<video controls src="${match[1]}"></video>`;
                                continue;
                            }

                            const headingMatch = line.match(/^(#{1,6})\s/);
                            if (headingMatch) {
                                if (inList) {
                                    while (listStack.length) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    inList = false;
                                }
                                const level = headingMatch[1].length;
                                const content = line.slice(level + 1).trim();
                                html += `<h${level}>${this.parseInline(content)}</h${level}>`;
                                continue;
                            }

                            const indentLevel = line.match(/^\s*/)[0].length / 2;
                            if (line.match(/^\s*[-*]\s/) || line.match(/^\s*\d+\.\s/)) {
                                const isOrdered = line.match(/^\s*\d+\.\s/);
                                const currentType = isOrdered ? 'ol' : 'ul';
                                const trimmedLine = line.replace(/^\s*/, '');
                                const content = isOrdered ? trimmedLine.replace(/^\d+\.\s/, '').trim() : trimmedLine.slice(2).trim();

                                if (!inList) {
                                    inList = true;
                                    listStack = [{ type: currentType, indent: indentLevel }];
                                    html += `<${currentType}>`;
                                } else {
                                    while (listStack.length && indentLevel < listStack[listStack.length - 1].indent) {
                                        const { type } = listStack.pop();
                                        html += `</${type}>`;
                                    }
                                    if (!listStack.length) {
                                        listStack.push({ type: currentType, indent: indentLevel });
                                        html += `<${currentType}>`;
                                    } else if (indentLevel > listStack[listStack.length - 1].indent) {
                                        listStack.push({ type: currentType, indent: indentLevel });
                                        html += `<${currentType}>`;
                                    } else if (listStack[listStack.length - 1].type !== currentType) {
                                        html += `</${listStack.pop().type}><${currentType}>`;
                                        listStack.push({ type: currentType, indent: indentLevel });
                                    }
                                }

                                html += `<li>${this.parseInline(content)}</li>`;
                                continue;
                            } else if (inList) {
                                while (listStack.length) {
                                    const { type } = listStack.pop();
                                    html += `</${type}>`;
                                }
                                inList = false;
                            }

                            html += `<p>${this.parseInline(line)}</p>`;
                        }

                        if (inList) {
                            while (listStack.length) {
                                const { type } = listStack.pop();
                                html += `</${type}>`;
                            }
                        }
                        if (inCodeBlock) html += `<pre><code>${codeBlockContent}</code></pre>`;
                        if (inTable) html += this.renderTable(tableHeaders, tableRows);
                        return html;
                    },
                    renderTable(headers, rows) {
                        try {
                            if (headers.length === 0) return '';
                            let html = '<table>';
                            html += '<tr>' + headers.map(header => `<th>${this.parseInline(header)}</th>`).join('') + '</tr>';
                            html += rows.map(row => `<tr>${row.map(cell => `<td>${this.parseInline(cell)}</td>`).join('')}</tr>`).join('');
                            html += '</table>';
                            return html;
                        } catch (error) {
                            console.warn(`[Error] Failed to render table: ${error}`);
                            return '';
                        }
                    },
                    parseInline(text) {
                        text = text.replace(/\\([*_\-\[\]\(\)#>|`])/g, '$1');
                        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
                        text = text.replace(/~~(.*?)~~/g, '<del>$1</del>');
                        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
                        text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                        return text;
                    }
                },
                branch2: {
                    render(container) {
                        console.log('[Background] Rendering game');
                        try {
                            const canvas = container.querySelector('.branch2-game-canvas');
                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.fillStyle = 'hsl(0, 0%, 50%)';
                            ctx.fillRect(10, 10, 50, 50);
                            document.querySelector('.root-loading-screen').classList.add('hidden');
                            console.log('[Background] Loaded');
                        } catch (error) {
                            console.error(`[Error] Game render failed: ${error}`);
                            alert('Failed to render game.');
                        }
                    }
                }
            };

            rootInitialize();
        })();
    </script>
</body>

</html>
