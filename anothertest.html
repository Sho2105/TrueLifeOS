<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interface</title>
  <!-- 
  Features: Command-driven UI, root page, pluggable branch apps, loading states, lifecycle hooks.
  Rules: No external libraries, no internet dependencies, minimal codebase, expandable, modular, responsive, self-contained, 5 HSL color variables, no abbreviations, "root" prefix for core, "branch" prefix for pages, grouped code zones.
  Dev Guide:
    - Add branch: Register in `root.branches` with { html, init?, destroy?, meta? }.
    - Add command: Use `root.commands.register(name, fn)`.
    - Debug: Check console for '[root]' or '[Error]' logs.
    - Mobile: Touch-friendly, capped branch height, no scrollbars.
  -->
  <style>
    :root {
      --color-primary: hsl(0, 0%, 95%);
      --color-background: hsl(0, 0%, 0%);
      --color-accent-dark: hsl(0, 0%, 25%);
      --color-accent-light: hsl(0, 0%, 50%);
      --color-glow: hsl(0, 0%, 75%);
      --inset-size: 25px;
      --grid-size: 30px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--color-background);
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-overflow-scrolling: touch;
    }

    .root-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--color-background);
      z-index: 1;
    }

    .root-background-media {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }

    .root-foreground {
      position: fixed;
      top: var(--inset-size);
      left: var(--inset-size);
      width: calc(100% - 50px);
      height: calc(100% - 50px);
      display: grid;
      z-index: 5;
    }

    .root-middleground {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
    }

    .branch-middleground-zone-top,
    .branch-middleground-zone-right,
    .branch-middleground-zone-bottom,
    .branch-middleground-zone-left {
      position: fixed;
    }

    .branch-middleground-zone-top {
      top: 0;
      left: 0;
      right: 0;
      height: var(--inset-size);
    }

    .branch-middleground-zone-right {
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--inset-size);
    }

    .branch-middleground-zone-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--inset-size);
    }

    .branch-middleground-zone-left {
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--inset-size);
    }

    .branch-middleground-interface {
      position: fixed;
      top: var(--inset-size);
      left: var(--inset-size);
      right: var(--inset-size);
      height: var(--inset-size);
      display: flex;
      align-items: center;
      color: var(--color-primary);
      font-family: monospace;
      font-size: 12px;
      transform: translateY(-100%);
      transition: opacity 0.3s ease;
    }

    .branch-middleground-interface-input {
      background: none;
      border: none;
      color: var(--color-primary);
      font-family: monospace;
      font-size: 12px;
      width: 50%;
      padding: 0 5px;
      outline: none;
      transition: text-shadow 0.3s ease;
    }

    .branch-middleground-interface-input:focus {
      text-shadow: 0 0 5px var(--color-glow);
    }

    .branch-middleground-interface-output {
      flex-grow: 1;
      padding: 0 5px;
      color: var(--color-glow);
      font-family: monospace;
      font-size: 12px;
      text-align: right;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .branch-middleground-interface-output.hidden {
      display: none;
    }

    .branch-middleground-axis-x,
    .branch-middleground-axis-y {
      position: fixed;
      background: repeating-linear-gradient(
        var(--gradient-direction, to right),
        var(--color-primary) 0,
        var(--color-primary) 1px,
        transparent 1px,
        transparent var(--gradient-interval, var(--grid-size))
      );
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .branch-middleground-axis-x:hover,
    .branch-middleground-axis-y:hover {
      opacity: 1;
    }

    .branch-middleground-axis-x {
      bottom: var(--inset-size);
      left: var(--inset-size);
      right: var(--inset-size);
      height: 10px;
      transform: translateY(100%);
      --gradient-interval: 30px;
    }

    .branch-middleground-axis-x::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to right,
        var(--color-primary) 0,
        var(--color-primary) 1px,
        transparent 1px,
        transparent 300px
      );
    }

    .branch-middleground-axis-y {
      top: var(--inset-size);
      left: var(--inset-size);
      bottom: var(--inset-size);
      width: 10px;
      transform: translateX(-100%);
      --gradient-direction: to bottom;
      --gradient-interval: 30px;
    }

    .branch-middleground-axis-y::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        var(--color-primary) 0,
        var(--color-primary) 1px,
        transparent 1px,
        transparent 300px
      );
    }

    .branch-content-loading {
      position: fixed;
      top: var(--inset-size);
      left: var(--inset-size);
      width: calc(100% - 50px);
      height: calc(100% - 50px);
      background: var(--color-background);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--color-primary);
      font-family: monospace;
      font-size: 16px;
      z-index: 6;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .branch-content-loading.active {
      display: flex;
      opacity: 1;
    }

    .branch-content-container {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      color: var(--color-primary);
      font-family: monospace;
      font-size: 12px;
      padding: 1rem;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .branch-content-container.active {
      display: block;
      opacity: 1;
    }

    @media (max-width: 768px) {
      .branch-content-container {
        touch-action: none;
      }
    }

    .branch-content-showcase {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .branch-content-showcase h2 {
      font-size: 14px;
      color: var(--color-primary);
      letter-spacing: 1px;
      text-shadow: 0 0 3px var(--color-glow);
      transition: text-shadow 0.3s ease;
    }

    .branch-content-showcase label {
      font-size: 12px;
      color: var(--color-primary);
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .branch-content-showcase label:hover {
      opacity: 1;
    }

    .branch-content-showcase input,
    .branch-content-showcase select,
    .branch-content-showcase textarea,
    .branch-content-showcase button {
      background: none;
      color: var(--color-primary);
      font-family: monospace;
      font-size: 12px;
      padding: 0.6rem;
      border: none;
      width: 100%;
      outline: none;
      transition: text-shadow 0.3s ease;
    }

    .branch-content-showcase input:focus,
    .branch-content-showcase select:focus,
    .branch-content-showcase textarea:focus,
    .branch-content-showcase button:focus {
      text-shadow: 0 0 5px var(--color-glow);
    }

    .branch-content-showcase button {
      cursor: pointer;
      padding: 0.6rem 1.2rem;
      width: auto;
      display: inline-block;
      letter-spacing: 0.5px;
      opacity: 0.8;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .branch-content-showcase button:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .branch-content-showcase input[type="checkbox"],
    .branch-content-showcase input[type="radio"] {
      width: auto;
      margin-right: 0.5rem;
      accent-color: var(--color-primary);
      transition: transform 0.2s ease;
    }

    .branch-content-showcase input[type="checkbox"]:hover,
    .branch-content-showcase input[type="radio"]:hover {
      transform: scale(1.1);
    }

    .branch-content-showcase textarea {
      resize: vertical;
      min-height: 60px;
      max-height: 120px;
    }

    .branch-content-showcase select {
      appearance: none;
      background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2210%22%20height%3D%226%22%20viewBox%3D%220%200%2010%206%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M1%201L5%205L9%201%22%20stroke%3D%22%23F5F5F5%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E');
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 10px;
      padding-right: 1.6rem;
    }

    .branch-content-showcase datalist {
      display: none;
    }

    .branch-content-showcase progress {
      width: 100%;
      height: 6px;
      background: var(--color-accent-dark);
      border-radius: 2px;
      transition: opacity 0.3s ease;
    }

    .branch-content-showcase progress::-webkit-progress-bar {
      background: var(--color-accent-dark);
    }

    .branch-content-showcase progress::-webkit-progress-value {
      background: var(--color-primary);
      opacity: 0.9;
    }

    .branch-content-showcase progress::-moz-progress-bar {
      background: var(--color-primary);
      opacity: 0.9;
    }

    .branch-content-showcase details {
      padding: 0.6rem;
      transition: opacity 0.3s ease;
    }

    .branch-content-showcase details[open] {
      opacity: 0.9;
    }

    .branch-content-showcase summary {
      cursor: pointer;
      transition: text-shadow 0.3s ease;
    }

    .branch-content-showcase summary:hover {
      text-shadow: 0 0 5px var(--color-glow);
    }

    .branch-content-showcase fieldset {
      margin: 0.5rem 0;
      padding: 0.6rem;
    }

    .branch-content-showcase legend {
      font-size: 12px;
      color: var(--color-primary);
      transition: text-shadow 0.3s ease;
    }

    .branch-content-showcase legend:hover {
      text-shadow: 0 0 3px var(--color-glow);
    }
  </style>
</head>
<body>
  <div class="root-background">
    <!-- <video class="root-background-media" autoplay loop muted src="data:video/mp4;base64,AAAA..."></video> -->
  </div>
  <div class="root-foreground" id="foreground">
    <div class="branch-content-loading" id="loadingScreen">Loading...</div>
  </div>
  <div class="root-middleground">
    <div class="branch-middleground-zone-top"></div>
    <div class="branch-middleground-zone-right"></div>
    <div class="branch-middleground-zone-bottom"></div>
    <div class="branch-middleground-zone-left"></div>
    <div class="branch-middleground-interface">
      <input type="text" id="interfaceInput" class="branch-middleground-interface-input" placeholder="Type command..." aria-label="Command input">
      <span id="interfaceOutput" class="branch-middleground-interface-output hidden"></span>
    </div>
    <div class="branch-middleground-axis-x"></div>
    <div class="branch-middleground-axis-y"></div>
  </div>
  <script>
    (function () {
      const root = {
        config: {
          gridSize: 30,
          maxInputLength: 100,
          logPrefix: '[root]',
          errorPrefix: '[Error]'
        },

        branches: {
          'branch-1': {
            meta: { name: 'Interactive Elements', description: 'Form controls demo' },
            html: `
              <div class="branch-content-showcase">
                <h2>Branch 1: Interactive Elements</h2>
                <label for="textInput" aria-label="Text input">Text Input</label>
                <input type="text" id="textInput" placeholder="Enter text..." aria-label="Enter text">
                <label for="numberInput" aria-label="Number input">Number Input</label>
                <input type="number" id="numberInput" min="0" max="100" value="50" aria-label="Enter number between 0 and 100">
                <label for="rangeInput" aria-label="Range slider">Range Slider</label>
                <input type="range" id="rangeInput" min="0" max="100" value="50" aria-label="Adjust range from 0 to 100">
                <label for="colorInput" aria-label="Color picker">Color Picker</label>
                <input type="color" id="colorInput" value="#ffffff" aria-label="Select color">
                <label for="dateInput" aria-label="Date picker">Date Picker</label>
                <input type="date" id="dateInput" aria-label="Select date">
                <label for="selectInput" aria-label="Select dropdown">Select Dropdown</label>
                <select id="selectInput" aria-label="Choose an option">
                  <option value="option1">Option 1</option>
                  <option value="option2">Option 2</option>
                  <option value="option3">Option 3</option>
                </select>
                <label for="datalistInput" aria-label="Datalist input">Datalist Input</label>
                <input list="datalistOptions" id="datalistInput" placeholder="Type or select..." aria-label="Type or select from list">
                <datalist id="datalistOptions">
                  <option value="Choice 1">
                  <option value="Choice 2">
                  <option value="Choice 3">
                </datalist>
                <label for="textareaInput" aria-label="Textarea">Textarea</label>
                <textarea id="textareaInput" placeholder="Enter multiple lines..." aria-label="Enter multiple lines"></textarea>
                <fieldset>
                  <legend>Checkboxes</legend>
                  <label><input type="checkbox" checked aria-label="Checkbox 1"> Checkbox 1</label>
                  <label><input type="checkbox" aria-label="Checkbox 2"> Checkbox 2</label>
                </fieldset>
                <fieldset>
                  <legend>Radio Buttons</legend>
                  <label><input type="radio" name="radio" checked aria-label="Radio 1"> Radio 1</label>
                  <label><input type="radio" name="radio" aria-label="Radio 2"> Radio 2</label>
                </fieldset>
                <label for="progressBar" aria-label="Progress bar">Progress Bar</label>
                <progress id="progressBar" value="70" max="100" aria-label="Progress at 70%"></progress>
                <details>
                  <summary aria-label="Toggle details">Toggle Details</summary>
                  <p>Hidden content for the sci-fi vibe.</p>
                </details>
                <button aria-label="Activate button">Activate</button>
              </div>
            `,
            init() {
              const button = document.querySelector('#branch-1 button');
              const handler = () => console.log(`${root.config.logPrefix} Button clicked`);
              button.addEventListener('click', handler);
              return { button, handler };
            },
            destroy({ button, handler }) {
              button?.removeEventListener('click', handler);
            }
          }
        },

        elements: {
          background: document.querySelector('.root-background'),
          foreground: document.querySelector('.root-foreground'),
          loadingScreen: document.querySelector('#loadingScreen'),
          input: document.querySelector('#interfaceInput'),
          output: document.querySelector('#interfaceOutput')
        },

        state: {
          currentBranch: null,
          isLoading: false
        },

        utils: {
          log(...args) {
            console.log(root.config.logPrefix, ...args);
          },
          error(...args) {
            console.error(root.config.errorPrefix, ...args);
          },
          debounce(fn, delay) {
            let timeout;
            return (...args) => {
              clearTimeout(timeout);
              timeout = setTimeout(() => fn(...args), delay);
            };
          },
          waitForFrame() {
            return new Promise(resolve => requestAnimationFrame(resolve));
          }
        },

        background: {
          resize() {
            const { gridSize } = root.config;
            const width = window.visualViewport?.width || window.innerWidth;
            const height = window.visualViewport?.height || window.innerHeight;
            root.elements.background.style.width = `${Math.ceil(width / gridSize) * gridSize}px`;
            root.elements.background.style.height = `${Math.ceil(height / gridSize) * gridSize}px`;
          }
        },

        foreground: {
          async loadBranch(id) {
            if (!root.branches[id]) return `Error: Branch ${id} not found`;
            if (root.state.isLoading) return 'Error: Branch loading in progress';

            root.state.isLoading = true;
            root.elements.loadingScreen.classList.add('active');

            try {
              root.foreground.unloadBranch();
              const container = document.createElement('div');
              container.id = id;
              container.className = 'branch-content-container active';
              container.innerHTML = root.branches[id].html;
              root.elements.foreground.appendChild(container);

              await root.utils.waitForFrame();
              const branchState = root.branches[id].init ? await Promise.resolve(root.branches[id].init()) : null;

              root.state.currentBranch = { id, container, state: branchState };
              root.state.isLoading = false;
              root.elements.loadingScreen.classList.remove('active');
              root.utils.log(`Loaded ${id}`);
              return `Opened Branch ${id.replace('branch-', '')}`;
            } catch (error) {
              root.utils.error(`Load failed for ${id}:`, error);
              root.state.isLoading = false;
              root.elements.loadingScreen.classList.remove('active');
              root.foreground.unloadBranch();
              return `Error: ${error.message}`;
            }
          },

          unloadBranch() {
            const { currentBranch } = root.state;
            if (!currentBranch) return;
            const { id, container, state } = currentBranch;
            if (root.branches[id]?.destroy) root.branches[id].destroy(state);
            container.remove();
            root.state.currentBranch = null;
            root.utils.log(`Unloaded ${id}`);
          }
        },

        commands: {
          registry: new Map([
            ['help', () => `Commands: ${[...root.commands.registry.keys()].join(', ')}`],
            ['open', async (args) => {
              if (args[0] === 'branch' && args[1]) {
                return await root.foreground.loadBranch(`branch-${args[1]}`);
              }
              return 'Invalid. Try: open branch 1';
            }],
            ['root', () => {
              root.foreground.unloadBranch();
              return 'Returned to root';
            }],
            ['clear', () => {
              root.elements.output.classList.add('hidden');
              return 'Cleared output';
            }],
            ['list', () => {
              return Object.keys(root.branches)
                .map(id => {
                  const { meta = {} } = root.branches[id];
                  return `${id.replace('branch-', '')}: ${meta.name || id} - ${meta.description || 'No description'}`;
                })
                .join('\n');
            }]
          ]),

          register(name, fn) {
            root.commands.registry.set(name.toLowerCase(), fn);
            root.utils.log(`Registered command: ${name}`);
          },

          async handle(input) {
            root.elements.output.classList.add('hidden');
            const trimmed = input.trim().slice(0, root.config.maxInputLength);
            if (!trimmed) return;

            const [cmd, ...args] = trimmed.split(/\s+/);
            const handler = root.commands.registry.get(cmd.toLowerCase());
            const response = handler ? await Promise.resolve(handler(args)) : `Unknown command: ${cmd}`;

            root.elements.output.textContent = response;
            root.elements.output.classList.remove('hidden');
          }
        },

        init() {
          root.utils.log('Starting');
          const mediaLoad = root.elements.background.querySelector('.root-background-media')
            ? new Promise(resolve => {
                const media = root.elements.background.querySelector('.root-background-media');
                if (media.complete) resolve();
                else media.addEventListener('loadeddata', resolve, { once: true });
              })
            : Promise.resolve();

          Promise.all([
            new Promise(resolve => {
              if (document.readyState === 'complete') resolve();
              else window.addEventListener('load', resolve, { once: true });
            }),
            mediaLoad
          ])
            .then(() => {
              root.elements.input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.target.value.trim()) {
                  root.commands.handle(e.target.value);
                  e.target.value = '';
                }
              });

              root.elements.input.addEventListener('focusin', () => root.elements.input.focus());
              window.addEventListener('resize', root.utils.debounce(root.background.resize, 100));

              root.background.resize();
              root.utils.log('Initialized');
            })
            .catch(error => {
              root.utils.error('Init failed:', error);
              root.elements.input.placeholder = 'Error loading interface';
            });
        }
      };

      root.init();
    })();
  </script>
</body>
</html>
