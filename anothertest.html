<!-- Rules:
Naming: Use `root-` for core/shared elements, `branchX-` for page-specific
Rules: No external libs, no internet, minimal, responsive, self-contained, future proof, no abbreviations
Add Branch: Clone a template (e.g., `branch1-notes-template`), add to `rootState.pageTemplates` and `availablePages`, define `rootApplication.branchX.render`, setup buttons in `rootButtonLibrary.setupBranchX`.
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LifeOS</title>
  <!-- CSS Zone: Root Styles -->
  <style>
    :root {
      --primary: hsl(0, 0%, 0%);
      --secondary: hsl(0, 0%, 20%);
      --background: hsl(0, 0%, 100%);
      --card: hsl(0, 0%, 80%);
      --accent: hsl(0, 0%, 60%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
    }

    body {
      background: var(--background);
      color: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: clamp(10px, 3vw, 12px);
      line-height: 1.3;
    }

    .root-main {
      max-width: 98vw;
      width: 100%;
      margin: 0.2rem auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .root-page {
      display: none;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.2rem;
    }

    .root-page.active {
      display: flex;
    }

    .root-sidebar {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      width: clamp(30px, 8vw, 40px);
      min-width: 30px;
    }

    .root-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .root-clickable {
      color: var(--secondary);
      cursor: pointer;
      text-decoration: underline;
      padding: 0.1rem;
    }

    .root-clickable:hover {
      color: var(--accent);
    }

    .root-button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(20px, 6vw, 24px);
      height: clamp(20px, 6vw, 24px);
      position: relative;
    }

    .root-button svg {
      width: clamp(10px, 3vw, 12px);
      height: clamp(10px, 3vw, 12px);
      fill: var(--secondary);
    }

    .root-button:hover svg {
      fill: var(--accent);
    }

    .root-tooltip-zone {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--secondary);
      color: var(--background);
      padding: 0.4rem 0.8rem;
      font-size: clamp(8px, 2vw, 10px);
      border-radius: 4px;
      z-index: 100;
      max-width: 50vw;
      display: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .root-tooltip-zone.active {
      display: block;
      opacity: 1;
    }

    .root-loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(0.8rem, 2vw, 1rem);
      z-index: 1000;
      display: none;
    }

    .root-loading-overlay.active {
      display: flex;
    }

    .root-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--background);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(0.8rem, 2vw, 1rem);
      z-index: 1000;
    }

    .root-loading-screen.hidden {
      display: none;
    }

    .root-input,
    textarea,
    select,
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    input[type="search"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="datetime-local"],
    input[type="month"],
    input[type="week"],
    input[type="color"],
    input[type="file"],
    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      padding: 0.2rem;
      background: var(--background);
      color: var(--primary);
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      width: 100%;
      font-family: monospace;
      outline: none;
    }

    .root-input:focus,
    textarea:focus,
    select:focus,
    input:focus {
      outline: 1px solid var(--secondary);
    }

    input[type="checkbox"],
    input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--background);
      cursor: pointer;
    }

    input[type="checkbox"]:checked,
    input[type="radio"]:checked {
      background: var(--secondary);
    }

    input[type="checkbox"] {
      border-radius: 2px;
    }

    input[type="radio"] {
      border-radius: 50%;
    }

    select {
      background: var(--background) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23000000"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat right 0.2rem center;
      background-size: 10px;
      padding-right: 1rem;
    }

    input[type="range"] {
      height: 4px;
      background: var(--card);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      background: var(--secondary);
      border-radius: 50%;
    }

    input[type="file"]::-webkit-file-upload-button {
      background: none;
      border: none;
      color: var(--secondary);
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      cursor: pointer;
      padding: 0.2rem;
    }

    progress,
    meter {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: var(--card);
    }

    progress::-webkit-progress-bar,
    meter::-webkit-meter-bar {
      background: var(--card);
    }

    progress::-webkit-progress-value,
    meter::-webkit-meter-optimum-value {
      background: var(--secondary);
    }

    .root-scrollbar {
      scrollbar-width: none;
    }

    .root-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .root-scrollbar::-webkit-scrollbar-track {
      background: var(--background);
    }

    .root-scrollbar::-webkit-scrollbar-thumb {
      background: var(--secondary);
      border-radius: 3px;
    }

    @media (max-width: 600px) {
      .root-main {
        max-width: 100vw;
        margin: 0.1rem auto;
      }

      .root-sidebar {
        width: clamp(25px, 10vw, 35px);
      }

      .root-button {
        width: clamp(18px, 5vw, 22px);
        height: clamp(18px, 5vw, 22px);
      }

      .root-button svg {
        width: clamp(8px, 2.5vw, 10px);
        height: clamp(8px, 2.5vw, 10px);
      }
    }

    @media (max-width: 400px) {
      body {
        font-size: clamp(8px, 2.5vw, 10px);
      }

      .root-sidebar {
        width: clamp(20px, 8vw, 30px);
      }

      .root-content {
        min-width: 60%;
      }
    }
  </style>
  <!-- End CSS Zone: Root Styles -->

  <!-- CSS Zone: Branch1 Notes Styles -->
  <style>
    .branch1-note-input {
      resize: vertical;
      min-height: clamp(60px, 15vh, 80px);
      flex-grow: 1;
    }

    .branch1-note-view {
      flex-grow: 1;
      padding: 0.2rem;
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      font-family: monospace;
      white-space: pre-wrap;
      display: none;
      overflow-y: auto;
    }

    .branch1-note-view.active {
      display: block;
    }

    .branch1-note-view h1 {
      font-size: 1.2em;
      margin: 0.5em 0;
    }

    .branch1-note-view h2 {
      font-size: 1.1em;
      margin: 0.4em 0;
    }

    .branch1-note-view h3 {
      font-size: 1em;
      margin: 0.3em 0;
    }

    .branch1-note-view strong {
      font-weight: bold;
    }

    .branch1-note-view em {
      font-style: italic;
    }

    .branch1-note-view a {
      color: var(--secondary);
      text-decoration: underline;
    }

    .branch1-note-view a:hover {
      color: var(--accent);
    }

    .branch1-note-view ul,
    .branch1-note-view ol {
      margin: 0.5em 0;
      padding-left: 1.5em;
    }

    .branch1-note-view li {
      margin: 0.2em 0;
    }

    .branch1-note-view img {
      max-width: 100%;
      height: auto;
      margin: 0.5em 0;
    }

    .branch1-note-view audio,
    .branch1-note-view video {
      max-width: 100%;
      margin: 0.5em 0;
    }

    .branch1-note-view blockquote {
      margin: 0.5em 0;
      padding-left: 1em;
      color: var(--secondary);
    }

    .branch1-note-view pre {
      background: var(--card);
      padding: 0.5em;
      overflow-x: auto;
    }

    .branch1-note-view code {
      background: var(--card);
      padding: 0.1em 0.2em;
    }

    .branch1-note-view table {
      border-collapse: collapse;
      margin: 0.5em 0;
    }

    .branch1-note-view th,
    .branch1-note-view td {
      border: 1px solid var(--secondary);
      padding: 0.3em;
    }

    .branch1-note-view hr {
      border: none;
      border-top: 1px solid var(--secondary);
      margin: 0.5em 0;
    }

    .branch1-note-view del {
      text-decoration: line-through;
    }
  </style>
  <!-- End CSS Zone: Branch1 Notes Styles -->

  <!-- CSS Zone: Branch2 Game Styles -->
  <style>
    .branch2-game-canvas {
      width: clamp(150px, 70vw, 300px);
      height: clamp(100px, 50vw, 200px);
    }
  </style>
  <!-- End CSS Zone: Branch2 Game Styles -->
</head>

<body>
  <!-- HTML Zone: Root Page Code -->
  <div class="root-loading-screen">Loading...</div>
  <div class="root-loading-overlay">Uploading...</div>
  <div class="root-tooltip-zone"></div>
  <main class="root-main">
    <section id="home" class="root-page active" role="region" aria-label="Home Page">
      <p>
        Explore <span class="root-clickable" data-page="notes">Notes</span> or
        <span class="root-clickable" data-page="game">Game</span>.
      </p>
    </section>
  </main>
  <!-- End HTML Zone: Root Page Code -->

  <!-- HTML Zone: Child Page Code -->
  <template id="branch1-notes-template">
    <section id="notes" class="root-page" role="region" aria-label="Notes Page">
      <div class="root-sidebar"></div>
      <div class="root-content">
        <h1>Notes</h1>
        <textarea class="root-input branch1-note-input root-scrollbar" placeholder="Write note..."
          data-input="note"></textarea>
        <div class="branch1-note-view root-scrollbar"></div>
      </div>
    </section>
  </template>
  <template id="branch2-game-template">
    <section id="game" class="root-page" role="region" aria-label="Game Page">
      <div class="root-sidebar"></div>
      <div class="root-content">
        <h1>Game</h1>
        <canvas class="branch2-game-canvas" width="300" height="200"></canvas>
      </div>
    </section>
  </template>
  <!-- End HTML Zone: Child Page Code -->

  <!-- JS Zone: Root Logic -->
  <script>
    (function () {
      const rootState = {
        currentPage: 'home',
        availablePages: ['home', 'notes', 'game'],
        pageTemplates: {
          notes: 'branch1-notes-template',
          game: 'branch2-game-template'
        },
        templateCache: new Map(),
        branch1: {
          text: '',
          isViewMode: false,
          cachedHtml: '',
          history: [''],
          historyIndex: 0,
          maxHistory: 50
        },
        branch2: {}
      };

      const rootSwitchPage = (pageId) => {
        console.log(`[Background] Switching to: ${pageId}`);
        try {
          if (!rootState.availablePages.includes(pageId)) throw new Error(`Page not found: ${pageId}`);
          document.querySelectorAll('.root-page').forEach(page => page.classList.remove('active'));
          let targetPage = document.getElementById(pageId);
          if (!targetPage && rootState.pageTemplates[pageId]) {
            console.log(`[Background] Loading template: ${pageId}`);
            if (rootState.templateCache.has(pageId)) {
              targetPage = rootState.templateCache.get(pageId).cloneNode(true);
            } else {
              const template = document.getElementById(rootState.pageTemplates[pageId]);
              if (template?.content?.firstElementChild) {
                const rawTemplate = template.content.firstElementChild.cloneNode(true);
                rootState.templateCache.set(pageId, rawTemplate);
                targetPage = rawTemplate.cloneNode(true);
              } else {
                throw new Error(`Template corrupt: ${pageId}`);
              }
              document.querySelector('.root-main').appendChild(targetPage);
              if (pageId === 'notes') {
                rootButtonLibrary.setupBranch1(targetPage);
                rootApplication.branch1.render(targetPage);
              } else if (pageId === 'game') {
                rootButtonLibrary.setupBranch2(targetPage);
                rootApplication.branch2.render(targetPage);
              }
              targetPage.querySelectorAll('.root-input').forEach(input => rootInputHandler.bindInput(input, targetPage));
            }
          }
          if (targetPage) {
            targetPage.classList.add('active');
            rootState.currentPage = pageId;
            document.querySelector('.root-loading-screen').classList.add('hidden');
            console.log('[Background] Loading screen hidden');
          } else {
            throw new Error(`Page load failed: ${pageId}`);
          }
        } catch (error) {
          console.error(`[Error] ${error}`);
          document.getElementById('home').classList.add('active');
          rootState.currentPage = 'home';
          document.querySelector('.root-loading-screen').classList.add('hidden');
          alert('Failed to load page.');
        }
      };

      const rootButtonLibrary = {
        getBackButton() {
          const btn = document.createElement('button');
          btn.className = 'root-button';
          btn.dataset.action = 'back';
          btn.dataset.tooltip = 'Back';
          btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>';
          return btn;
        },
        getSaveButton() {
          const btn = document.createElement('button');
          btn.className = 'root-button';
          btn.dataset.action = 'save';
          btn.dataset.tooltip = 'Save';
          btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3zm3-10H5V5h10v4z"/></svg>';
          return btn;
        },
        getLoadButton() {
          const btn = document.createElement('button');
          btn.className = 'root-button';
          btn.dataset.action = 'load';
          btn.dataset.tooltip = 'Load';
          btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';
          return btn;
        },
        getViewButton() {
          const btn = document.createElement('button');
          btn.className = 'root-button';
          btn.dataset.action = 'toggle-view';
          btn.dataset.tooltip = 'Toggle View';
          btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
          return btn;
        },
        getImportButton() {
          const btn = document.createElement('button');
          btn.className = 'root-button';
          btn.dataset.action = 'import';
          btn.dataset.tooltip = 'Import Media (Max 10MB)';
          btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m14-7l-5-5m0 0l-5 5m5-5v12"/></svg>';
          return btn;
        },
        getUndoButton() {
          const btn = document.createElement('button');
          btn.className = 'root-button';
          btn.dataset.action = 'undo';
          btn.dataset.tooltip = 'Undo';
          btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>';
          return btn;
        },
        getRedoButton() {
          const btn = document.createElement('button');
          btn.className = 'root-button';
          btn.dataset.action = 'redo';
          btn.dataset.tooltip = 'Redo';
          btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>';
          return btn;
        },
        setupBranch1(container) {
          const sidebar = container.querySelector('.root-sidebar');
          sidebar.appendChild(this.getSaveButton());
          sidebar.appendChild(this.getLoadButton());
          sidebar.appendChild(this.getImportButton());
          sidebar.appendChild(this.getViewButton());
          sidebar.appendChild(this.getUndoButton());
          sidebar.appendChild(this.getRedoButton());
          sidebar.appendChild(this.getBackButton());
        },
        setupBranch2(container) {
          const sidebar = container.querySelector('.root-sidebar');
          sidebar.appendChild(this.getBackButton());
        }
      };

      const rootInputHandler = {
        bindInput(input, container) {
          if (input.dataset.input === 'note') {
            input.addEventListener('input', (e) => {
              const newText = e.target.value.trim();
              if (newText !== rootState.branch1.text) {
                rootState.branch1.text = newText;
                rootState.branch1.history = rootState.branch1.history.slice(0, rootState.branch1.historyIndex + 1);
                rootState.branch1.history.push(newText);
                if (rootState.branch1.history.length > rootState.branch1.maxHistory) {
                  rootState.branch1.history.shift();
                }
                rootState.branch1.historyIndex = rootState.branch1.history.length - 1;
                rootState.branch1.cachedHtml = '';
              }
            });
            input.addEventListener('touchstart', (e) => {
              e.preventDefault();
              input.focus();
            });
            input.addEventListener('click', () => input.focus());
          }
        }
      };

      const rootMediaHandler = {
        fileToBase64(file) {
          return new Promise((resolve, reject) => {
            try {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(new Error('Failed to read file'));
              reader.readAsDataURL(file);
            } catch (error) {
              reject(error);
            }
          });
        },
        getFileType(file) {
          const type = file.type.split('/')[0];
          if (type === 'image') return 'image';
          if (type === 'audio') return 'audio';
          if (type === 'video') return 'video';
          return null;
        },
        insertMedia(container, base64, type, alt = 'media') {
          try {
            const input = container.querySelector('.branch1-note-input');
            const cursorPos = input.selectionStart;
            const textBefore = rootState.branch1.text.slice(0, cursorPos);
            const textAfter = rootState.branch1.text.slice(cursorPos);
            let markdown = '';
            if (type === 'image') {
              markdown = `![${alt}](${base64})\n`;
            } else if (type === 'audio') {
              markdown = `[audio](${base64})\n`;
            } else if (type === 'video') {
              markdown = `[video](${base64})\n`;
            }
            rootState.branch1.text = textBefore + markdown + textAfter;
            rootState.branch1.history = rootState.branch1.history.slice(0, rootState.branch1.historyIndex + 1);
            rootState.branch1.history.push(rootState.branch1.text);
            if (rootState.branch1.history.length > rootState.branch1.maxHistory) {
              rootState.branch1.history.shift();
            }
            rootState.branch1.historyIndex = rootState.branch1.history.length - 1;
            rootState.branch1.cachedHtml = '';
            rootApplication.branch1.render(container);
          } catch (error) {
            console.error(`[Error] Media insertion failed: ${error}`);
            alert('Failed to insert media.');
          }
        }
      };

      const rootTooltipHandler = {
        showTooltip(text) {
          const zone = document.querySelector('.root-tooltip-zone');
          zone.textContent = text;
          zone.classList.add('active');
        },
        hideTooltip() {
          const zone = document.querySelector('.root-tooltip-zone');
          zone.classList.remove('active');
        }
      };

      const rootInitialize = () => {
        console.log('[Background] Starting app');
        document.addEventListener('DOMContentLoaded', () => {
          console.log('[Background] DOM ready');
          try {
            rootSwitchPage(rootState.currentPage);
            document.querySelector('.root-loading-screen').classList.add('hidden');
          } catch (error) {
            console.error(`[Error] App start failed: ${error}`);
            rootSwitchPage('home');
            document.querySelector('.root-loading-screen').classList.add('hidden');
            alert('Failed to initialize app.');
          }
        });

        document.querySelector('.root-main').addEventListener('click', (event) => {
          const span = event.target.closest('.root-clickable');
          const button = event.target.closest('.root-button');
          const container = button?.closest('.root-page') || span?.closest('.root-page');
          if (span) {
            const pageId = span.dataset.page;
            if (pageId) {
              console.log(`[Background] Nav clicked: ${pageId}`);
              rootSwitchPage(pageId);
            }
            return;
          }
          if (!button || !container) return;
          const action = button.dataset.action;
          console.log(`[Background] Button clicked: ${action}`);
          if (container.id === 'notes') {
            if (action === 'save') rootApplication.branch1.save(container);
            else if (action === 'load') rootApplication.branch1.load(container);
            else if (action === 'import') rootApplication.branch1.importMedia(container);
            else if (action === 'toggle-view') rootApplication.branch1.toggleView(container);
            else if (action === 'undo') rootApplication.branch1.undo(container);
            else if (action === 'redo') rootApplication.branch1.redo(container);
            else if (action === 'back') rootSwitchPage('home');
          } else if (container.id === 'game') {
            if (action === 'back') rootSwitchPage('home');
          }
        });

        document.querySelector('.root-main').addEventListener('touchstart', (event) => {
          const button = event.target.closest('.root-button');
          const container = button?.closest('.root-page');
          if (!button || !container) return;
          event.preventDefault();
          const action = button.dataset.action;
          console.log(`[Background] Button touched: ${action}`);
          if (container.id === 'notes') {
            if (action === 'save') rootApplication.branch1.save(container);
            else if (action === 'load') rootApplication.branch1.load(container);
            else if (action === 'import') rootApplication.branch1.importMedia(container);
            else if (action === 'toggle-view') rootApplication.branch1.toggleView(container);
            else if (action === 'undo') rootApplication.branch1.undo(container);
            else if (action === 'redo') rootApplication.branch1.redo(container);
            else if (action === 'back') rootSwitchPage('home');
          } else if (container.id === 'game') {
            if (action === 'back') rootSwitchPage('home');
          }
        });

        document.querySelector('.root-main').addEventListener('mouseover', (event) => {
          const button = event.target.closest('.root-button');
          if (button && button.dataset.tooltip) {
            rootTooltipHandler.showTooltip(button.dataset.tooltip);
          }
        });

        document.querySelector('.root-main').addEventListener('mouseout', (event) => {
          const button = event.target.closest('.root-button');
          if (button) rootTooltipHandler.hideTooltip();
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            document.querySelector('.root-loading-overlay').classList.remove('active');
          }
        });
      };

      window.rootApplication = {
        branch1: {
          save(container) {
            console.log('[Background] Saving note');
            try {
              const note = rootState.branch1.text || '';
              const blob = new Blob([note], { type: 'text/plain' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'note.md';
              a.click();
              URL.revokeObjectURL(url);
              console.log('[Background] Note saved');
            } catch (error) {
              console.error(`[Error] Save failed: ${error}`);
              alert('Failed to save note.');
            }
          },
          load(container) {
            console.log('[Background] Loading note');
            try {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = '.md';
              input.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file && (file.name.endsWith('.md') || file.type === 'text/plain' || file.type === 'application/octet-stream')) {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                    rootState.branch1.text = e.target.result.trim();
                    rootState.branch1.history = [rootState.branch1.text];
                    rootState.branch1.historyIndex = 0;
                    rootState.branch1.cachedHtml = '';
                    this.render(container);
                    console.log('[Background] Note loaded');
                  };
                  reader.onerror = () => {
                    console.error('[Error] Failed to read .md file');
                    alert('Failed to load note.');
                  };
                  reader.readAsText(file);
                }
              });
              input.click();
            } catch (error) {
              console.error(`[Error] Load failed: ${error}`);
              alert('Failed to load note.');
            }
          },
          importMedia(container) {
            console.log('[Background] Importing media');
            try {
              const overlay = document.querySelector('.root-loading-overlay');
              overlay.classList.add('active');
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = 'image/*,audio/mpeg,video/mp4';
              input.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) {
                  overlay.classList.remove('active');
                  return;
                }
                if (file.size > 10 * 1024 * 1024) {
                  overlay.classList.remove('active');
                  alert('File too large. Maximum size is 10MB.');
                  return;
                }
                if (file.type.startsWith('image/') || file.type === 'audio/mpeg' || file.type === 'video/mp4') {
                  try {
                    const base64 = await rootMediaHandler.fileToBase64(file);
                    const type = rootMediaHandler.getFileType(file);
                    if (type) {
                      rootMediaHandler.insertMedia(container, base64, type, file.name);
                      console.log('[Background] Media imported');
                    }
                  } catch (error) {
                    console.error(`[Error] Media import failed: ${error}`);
                    alert('Failed to import media.');
                  }
                } else {
                  alert('Unsupported file type.');
                }
                overlay.classList.remove('active');
              });
              input.addEventListener('cancel', () => {
                overlay.classList.remove('active');
              });
              input.click();
            } catch (error) {
              console.error(`[Error] Import failed: ${error}`);
              alert('Failed to import media.');
              document.querySelector('.root-loading-overlay').classList.remove('active');
            }
          },
          toggleView(container) {
            console.log('[Background] Toggling view mode');
            try {
              rootState.branch1.isViewMode = !rootState.branch1.isViewMode;
              this.render(container);
            } catch (error) {
              console.error(`[Error] Toggle view failed: ${error}`);
              alert('Failed to toggle view mode.');
            }
          },
          undo(container) {
            console.log('[Background] Undo action');
            try {
              if (rootState.branch1.historyIndex > 0) {
                rootState.branch1.historyIndex--;
                rootState.branch1.text = rootState.branch1.history[rootState.branch1.historyIndex];
                rootState.branch1.cachedHtml = '';
                this.render(container);
              }
            } catch (error) {
              console.error(`[Error] Undo failed: ${error}`);
              alert('Failed to undo.');
            }
          },
          redo(container) {
            console.log('[Background] Redo action');
            try {
              if (rootState.branch1.historyIndex < rootState.branch1.history.length - 1) {
                rootState.branch1.historyIndex++;
                rootState.branch1.text = rootState.branch1.history[rootState.branch1.historyIndex];
                rootState.branch1.cachedHtml = '';
                this.render(container);
              }
            } catch (error) {
              console.error(`[Error] Redo failed: ${error}`);
              alert('Failed to redo.');
            }
          },
          render(container) {
            console.log('[Background] Rendering notes');
            try {
              const input = container.querySelector('.branch1-note-input');
              const view = container.querySelector('.branch1-note-view');
              input.style.display = rootState.branch1.isViewMode ? 'none' : 'block';
              view.classList.toggle('active', rootState.branch1.isViewMode);
              input.value = rootState.branch1.text || '';
              if (rootState.branch1.isViewMode) {
                if (!rootState.branch1.cachedHtml) {
                  rootState.branch1.cachedHtml = this.parseMarkdown(rootState.branch1.text || '');
                }
                view.innerHTML = rootState.branch1.cachedHtml;
              } else {
                view.innerHTML = '';
                rootState.branch1.cachedHtml = '';
              }
              document.querySelector('.root-loading-screen').classList.add('hidden');
              console.log('[Background] Loading screen hidden (notes)');
            } catch (error) {
              console.error(`[Error] Render failed: ${error}`);
              alert('Failed to render note.');
              document.querySelector('.root-loading-screen').classList.add('hidden');
            }
          },
          parseMarkdown(text) {
            const lines = text.split('\n');
            let html = '';
            let inList = false;
            let listType = null;
            let listDepth = 0;
            let inCodeBlock = false;
            let codeBlockContent = '';
            let inTable = false;
            let tableRows = [];
            let tableHeaders = [];

            for (let i = 0; i < lines.length; i++) {
              let line = lines[i].trim();
              if (!line) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                if (inCodeBlock) {
                  codeBlockContent += '\n';
                } else if (inTable) {
                  html += this.renderTable(tableHeaders, tableRows);
                  inTable = false;
                  tableHeaders = [];
                  tableRows = [];
                } else {
                  html += '<br>';
                }
                continue;
              }

              if (inCodeBlock) {
                if (line.match(/^```/)) {
                  html += `<pre><code>${codeBlockContent}</code></pre>`;
                  inCodeBlock = false;
                  codeBlockContent = '';
                } else {
                  codeBlockContent += line + '\n';
                }
                continue;
              }

              if (line.match(/^```/)) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                if (inTable) {
                  html += this.renderTable(tableHeaders, tableRows);
                  inTable = false;
                  tableHeaders = [];
                  tableRows = [];
                }
                inCodeBlock = true;
                continue;
              }

              if (line.match(/^(---|\*\*\*|___)$/)) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                if (inTable) {
                  html += this.renderTable(tableHeaders, tableRows);
                  inTable = false;
                  tableHeaders = [];
                  tableRows = [];
                }
                html += '<hr>';
                continue;
              }

              if (line.startsWith('>')) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                if (inTable) {
                  html += this.renderTable(tableHeaders, tableRows);
                  inTable = false;
                  tableHeaders = [];
                  tableRows = [];
                }
                html += `<blockquote>${this.parseInline(line.slice(1).trim())}</blockquote>`;
                continue;
              }

              if (line.match(/^\|.*\|$/)) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                try {
                  const cells = line.split('|').map(cell => cell.trim()).filter(cell => cell);
                  if (!inTable) {
                    if (cells.length === 0) continue;
                    inTable = true;
                    tableHeaders = cells;
                    if (lines[i + 1] && lines[i + 1].match(/^\|[-:\s]+\|$/)) {
                      i++;
                    }
                  } else {
                    tableRows.push(cells);
                  }
                } catch (error) {
                  console.warn(`[Warn] Malformed table row skipped: ${line}`);
                  inTable = false;
                  tableHeaders = [];
                  tableRows = [];
                }
                continue;
              } else if (inTable) {
                html += this.renderTable(tableHeaders, tableRows);
                inTable = false;
                tableHeaders = [];
                tableRows = [];
              }

              if (line.match(/^!\[([^\]]*)\]\((data:image\/[^)]+)\)/)) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                const match = line.match(/^!\[([^\]]*)\]\((data:image\/[^)]+)\)/);
                html += `<img src="${match[2]}" alt="${match[1]}">`;
                continue;
              }

              if (line.match(/^\[audio\]\((data:audio\/[^)]+)\)/)) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                const match = line.match(/^\[audio\]\((data:audio\/[^)]+)\)/);
                html += `<audio controls src="${match[1]}"></audio>`;
                continue;
              }

              if (line.match(/^\[video\]\((data:video\/[^)]+)\)/)) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                const match = line.match(/^\[video\]\((data:video\/[^)]+)\)/);
                html += `<video controls src="${match[1]}"></video>`;
                continue;
              }

              if (line.startsWith('###')) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                html += `<h3>${this.parseInline(line.slice(3).trim())}</h3>`;
                continue;
              } else if (line.startsWith('##')) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                html += `<h2>${this.parseInline(line.slice(2).trim())}</h2>`;
                continue;
              } else if (line.startsWith('#')) {
                if (inList) {
                  html += `</${listType}>`.repeat(listDepth);
                  inList = false;
                  listType = null;
                  listDepth = 0;
                }
                html += `<h1>${this.parseInline(line.slice(1).trim())}</h1>`;
                continue;
              }

              const indentLevel = line.match(/^\s*/)[0].length / 2;
              if (line.match(/^\s*[-*]\s/) || line.match(/^\s*\d+\.\s/)) {
                const isOrdered = line.match(/^\s*\d+\.\s/);
                const currentType = isOrdered ? 'ol' : 'ul';
                const trimmedLine = line.replace(/^\s*/, '');
                const content = isOrdered ? trimmedLine.replace(/^\d+\.\s/, '').trim() : trimmedLine.slice(2).trim();

                if (!inList) {
                  inList = true;
                  listType = currentType;
                  listDepth = indentLevel + 1;
                  html += `<${currentType}>`;
                } else if (indentLevel > listDepth - 1) {
                  html += `<${currentType}>`;
                  listDepth++;
                  listType = currentType;
                } else if (indentLevel < listDepth - 1) {
                  html += `</${listType}>`.repeat(listDepth - indentLevel - 1);
                  listDepth = indentLevel + 1;
                  listType = currentType;
                } else if (listType !== currentType) {
                  html += `</${listType}><${currentType}>`;
                  listType = currentType;
                }

                html += `<li>${this.parseInline(content)}</li>`;
                continue;
              } else if (inList) {
                html += `</${listType}>`.repeat(listDepth);
                inList = false;
                listType = null;
                listDepth = 0;
              }

              html += `<p>${this.parseInline(line)}</p>`;
            }

            if (inList) html += `</${listType}>`.repeat(listDepth);
            if (inCodeBlock) html += `<pre><code>${codeBlockContent}</code></pre>`;
            if (inTable) html += this.renderTable(tableHeaders, tableRows);
            return html;
          },
          renderTable(headers, rows) {
            try {
              if (headers.length === 0) return '';
              let html = '<table>';
              html += '<tr>' + headers.map(header => `<th>${this.parseInline(header)}</th>`).join('') + '</tr>';
              html += rows.map(row => `<tr>${row.map(cell => `<td>${this.parseInline(cell)}</td>`).join('')}</tr>`).join('');
              html += '</table>';
              return html;
            } catch (error) {
              console.warn(`[Error] Failed to render table: ${error}`);
              return '';
            }
          },
          parseInline(text) {
            text = text.replace(/\\([*_\-\[\]\(\)#>|`])/g, '$1');
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            text = text.replace(/~~(.*?)~~/g, '<del>$1</del>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
            return text;
          }
        },
        branch2: {
          render(container) {
            console.log('[Background] Rendering game');
            try {
              const canvas = container.querySelector('.branch2-game-canvas');
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = 'hsl(0, 0%, 50%)';
              ctx.fillRect(10, 10, 50, 50);
              document.querySelector('.root-loading-screen').classList.add('hidden');
              console.log('[Background] Loading screen hidden (game)');
            } catch (error) {
              console.error(`[Error] Game render failed: ${error}`);
              alert('Failed to render game.');
            }
          }
        }
      };

      rootInitialize();
    })();
  </script>
  <!-- End JS Zone: Root Logic -->
</body>
