<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Project: Speed</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    :root { --c-bg: #050505; --c-txt: #eee; --c-dim: #333; --c-high: #fff; --c-shadow: rgba(0,0,0,0.5); --f-main: 'VT323', monospace; --z-bg: 100; --z-cvs: 10; --z-ui: 20; --z-modal: 50; 
    }
    body { margin:0; overflow:hidden; background-color:var(--c-bg); color:var(--c-txt); font-family:var(--f-main); user-select:none; touch-action:none; }
    body::after { content:" "; display:block; position:absolute; inset:0; background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06)); z-index:var(--z-bg); background-size:100% 2px, 3px 100%; pointer-events:none; }
    canvas { position:absolute; inset:0; z-index:var(--z-cvs); cursor:crosshair; image-rendering:pixelated; filter:contrast(1.1) saturate(1.2); pointer-events:auto; }
    #ui-layer { position:absolute; inset:0; pointer-events:none; z-index:var(--z-ui); display:flex; flex-direction:column; justify-content:center; align-items:center; overflow:hidden; }
    #floor-menu { text-align:center; pointer-events:auto; transition: opacity 0.8s ease, filter 0.8s ease, color 0.8s ease; will-change: transform, opacity; }
    #floor-menu.menu-active { opacity: 1; color: var(--c-txt); filter: drop-shadow(0 0 5px var(--c-shadow)); }
    #floor-menu.menu-sunken { opacity: 0.25; color: white; pointer-events: none; filter: blur(2px); }
    h1 { font-size:100px; margin:0; line-height:0.8; font-weight:normal; letter-spacing:10px; color:inherit; }
    .score-readout { font-size:120px; margin:10px 0; line-height:0.8; color:var(--c-high); transition: all 0.8s; }
    #floor-menu.menu-sunken .score-readout { opacity: 1; color: white; }
    .menu-row { display:flex; justify-content:center; gap:20px; margin: 15px 0; font-size: 24px; letter-spacing: 2px; color:inherit; }
    .opt-btn { cursor: pointer; transition: all 0.2s; text-transform: uppercase; color: #666; }
    #floor-menu.menu-active .opt-btn:hover { color: #aaa; }
    #floor-menu.menu-active .opt-btn.active { color: var(--c-high); text-shadow: 0 0 8px var(--c-high); }
    .action-row { margin-top: 40px; display:flex; flex-direction:column; gap:15px; align-items:center; }
    .btn-main { font-size: 42px; color: inherit; cursor: pointer; letter-spacing: 5px; transition: all 0.2s; }
    #floor-menu.menu-active .btn-main { color: var(--c-high); }
    #floor-menu.menu-active .btn-main:hover { text-shadow: 0 0 15px white; letter-spacing: 8px; }
    .btn-sub { font-size: 20px; color: inherit; cursor: pointer; margin-top:10px; opacity: 0.5; }
    #floor-menu.menu-active .btn-sub:hover { opacity: 1; color: var(--c-high); }
    #guide-modal { position: absolute; top:50%; left:50%; transform:translate(-50%, -50%); width: 300px; padding: 20px; background: #050505; border: 1px solid var(--c-dim); color: #eee; z-index: var(--z-modal); display: none; pointer-events: auto; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
    #guide-modal.visible { display: block; }
    #guide-modal h3 { margin-top:0; border-bottom: 1px solid var(--c-dim); padding-bottom:10px; }
    .key-row { display:flex; justify-content:space-between; margin-bottom:5px; font-size:14px; color:#aaa; }
    .key-val { color: #fff; }
    .close-guide { margin-top:15px; width:100%; background:#111; border:none; color:#fff; padding:5px; cursor:pointer; font-family:var(--f-main); font-size:18px; }
    .close-guide:hover { background:var(--c-dim); }
    .touch-container { display:none; position:absolute; z-index:30; pointer-events:none; inset:0; }
    .touch-pad { position:absolute; border:1px solid rgba(255,255,255,0.1); border-radius:50%; pointer-events:auto; }
    .stick-base { width:120px; height:120px; background:rgba(255,255,255,0.05); }
    .stick-nub { position:absolute; top:50%; left:50%; width:40px; height:40px; background:var(--c-high); border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; box-shadow:0 0 10px var(--c-high); }
    .btn-action { width:80px; height:80px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:#444; font-size:24px; }
    .btn-action.active { background:var(--c-high); color:#000; box-shadow:0 0 15px var(--c-high); }
</style>
</head>
<body>
<div id="ui-layer">
    <div id="floor-menu" class="menu-active">
        <h1>PROJECT_SPEED</h1>
        <div id="score-val" class="score-readout">0</div>
        <div class="menu-row" style="font-size: 18px; gap:15px;">
            <span id="opt-in-mouse" class="opt-btn active" onclick="Game.systems.input.setScheme('MOUSE')">MOUSE</span><span id="opt-in-key" class="opt-btn" onclick="Game.systems.input.setScheme('KEYBOARD')">KEYS</span><span id="opt-in-touch" class="opt-btn" onclick="Game.systems.input.setScheme('TOUCH')">TOUCH</span><span id="opt-in-pad" class="opt-btn" onclick="Game.systems.input.setScheme('GAMEPAD')">PAD</span>
        </div>
        <div class="action-row"><div id="btn-start" class="btn-main" onclick="Game.ui.triggerStart()">INITIALIZE</div><div class="btn-sub" onclick="Game.ui.toggleGuide()">[ GUIDE ]</div></div>
    </div>
</div>
<div id="guide-modal">
    <h3>CONTROLS</h3>
    <div class="key-row"><span>MOVE</span> <span class="key-val">WASD / ARROWS</span></div>
    <div class="key-row"><span>AIM</span> <span class="key-val">MOUSE / RIGHT STICK</span></div>
    <div class="key-row"><span>DASH / SPRINT</span> <span class="key-val">L-CLICK / SPACE</span></div>
    <div class="key-row"><span>PARRY / BRACE</span> <span class="key-val">R-CLICK / SHIFT</span></div>
    <div class="key-row"><span>CHARGE</span> <span class="key-val">HOLD BOTH</span></div>
    <br><div class="key-row" style="color:#666">GOAL: KILL TO COOL DOWN.</div>
    <button class="close-guide" onclick="Game.ui.toggleGuide()">CLOSE</button>
</div>
<div id="touch-layer" class="touch-container"></div>
<canvas id="gameCanvas"></canvas>
<script>
    // 1. CONSTANTS & TUNING
    // REFACTOR: Global Theme Palette reduced to 5 Generic Variables
    const Palette = {
        C1: "#08ss0808", // Main Background
        C2: "#ffffff", // Main Light / Text / Flash
        C3: "#000000", // Main Shadow / Structure
        C4: "#444444", // Debris / Dust / Fizzle
        C5: "#141414"  // Secondary Detail / Floor Noise
    };

    const GameConfig = {
        PHYSICS: { FRICTION: 0.92, ACCEL_BASE: 1.5, DASH_IMPULSE: 30, HIGH_IMPULSE: 60, MAX_IMPULSE: 100, RECOIL_MOD: 1.2, OVERDRIVE_ACCEL_A: 2.5, OVERDRIVE_ACCEL_B: 0.2, WALL_BOUNCE: -0.8, BOUNDS_PADDING: 25 },
        MASS: { HEAVY: 0.1, LIGHT: 2.0, STANDARD: 1.0 },
        SPEED: { STOP: 0, BRACE: 0.4, BASE: 1.0, SPRINT: 2.2 },
        TIERS: { IDLE: 0, MOVE: 1, SPRINT: 2, DASH: 2, CHARGE_3: 3, CHARGE_4: 4 },
        DAMAGE: { LV1: 10, LV2: 25, LV3: 50, LV4: 999, WALL_SLAM: 25, AREA_BLAST: 50, OD_DASH: 35, OD_BLAST: 40 },
        TIMING: { TAP_LIMIT: 15, CHARGE_THRESH: 180, CHARGE_LV3: 90, CHARGE_LV4: 180, CHARGE_MIN: 15, CD_DASH: 180, CD_PARRY: 45, CD_CHARGE: 60, CD_OD: 15, PARRY_WINDOW: 20, INVULN: 30, AI_MIN_TICK: 10, AI_MAX_TICK: 30, OD_TRIGGER: 600, OD_DURATION: 600 },
        STATE: { IDLE: 0, MOVE: 1, SPRINT: 3, DASH: 4, PARRY: 5, DODGE: 6, CHARGING: 7, LV3_READY: 8, LV4_READY: 9, STUNNED: 10, BRACE: 11 },
        HEAT: { DECAY: 0.04, GAIN_KILL: 10, GAIN_PARRY: 15, GAIN_CLASH: 5, PENALTY_HIT: 20 },
        VISUALS: { PARTICLE_LIMIT: 400, SHAKE_BASE: 20, SHAKE_HIGH: 100, GRID_SIZE: 80, FLASH_DECAY: 0.05 },
        AIM: { ASSIST_ANGLE: 0.90, ASSIST_DIST: 500, ASSIST_STR: 0.35, DEADZONE: 0.1 },
        INPUT: { HOLD_THRESHOLD: 300 }
    };

    // 2. DATA DEFINITIONS
    const AudioMap = { UI_HOVER: { vol: 0.2 }, UI_CLICK: { vol: 0.5 }, DASH: { vol: 0.4 }, CHARGE: { vol: 0.3 }, PARRY: { vol: 0.8 }, HIT_LIGHT: { vol: 0.4 }, HIT_HEAVY: { vol: 0.6 }, DEATH: { vol: 0.7 }, CLASH: { vol: 0.8 }, LOOT: { vol: 0.5 }, HEAT: { vol: 0.3 } };

    // REFACTOR: Hardcoded colors for Entities
    const EntityDefs = {
        PLAYER_1: { tags: ['player', 'p1'], stats: { hp: 100, max: 100, radius: 15 }, color: "#0ff", inputId: 'p1' },
        ENEMY_RUSHER: { stats: { hp: 100, radius: 15 }, ai: "AGGRESSIVE", traits: ["SPRINTER"], color: "#f00" },
        ENEMY_DEFENDER: { stats: { hp: 100, radius: 15 }, ai: "DEFENSIVE", traits: ["BRACER"], color: "#567" },
        ENEMY_VULTURE: { stats: { hp: 100, radius: 15 }, ai: "OPPORTUNIST", traits: ["TRICKY"], color: "#50f" },
        ENEMY_BOSS: { stats: { hp: 3000, radius: 20 }, ai: "BOSS", traits: ["BOSS"], color: "#a0f" }
    };

    // REFACTOR: Hardcoded colors for Loot
    const LootDefs = {
        HEAL: { color: "#0f0", text: "HP UP", mod: { type: 'STAT', key: 'hp', val: 50 } },
        GOD: { color: "#f80", text: "GOD MODE", mod: { type: 'STATUS', key: 'invuln', val: 600 } },
        LIFE: { color: "#0ff", text: "LIFE-UP", mod: { type: 'SPECIAL', key: 'lives', val: 1 } }
    };

    // 3. UTILITIES & MATH
    class Vector2 { constructor(x, y) { this.x = x; this.y = y; } add(v) { this.x += v.x; this.y += v.y; return this; } sub(v) { this.x -= v.x; this.y -= v.y; return this; } mul(s) { this.x *= s; this.y *= s; return this; } mag() { return Math.sqrt(this.x ** 2 + this.y ** 2); } normalize() { const m = this.mag(); if (m !== 0) this.mul(1 / m); return this; } dot(v) { return this.x * v.x + this.y * v.y; } clone() { return new Vector2(this.x, this.y); } static dist(v1, v2) { return Math.sqrt((v1.x - v2.x) ** 2 + (v1.y - v2.y) ** 2); } static sub(v1, v2) { return new Vector2(v1.x - v2.x, v1.y - v2.y); } }
    class MemoryPool { constructor(fn, size = 100) { this.store = []; this.factory = fn; for (let i = 0; i < size; i++) this.store.push(this.factory()); } get() { return this.store.length > 0 ? this.store.pop() : this.factory(); } free(obj) { this.store.push(obj); } }
    class EventBus { constructor() { this.subscribers = {}; } subscribe(event, callback) { (this.subscribers[event] = this.subscribers[event] || []).push(callback); } publish(event, data) { if (this.subscribers[event]) this.subscribers[event].forEach(cb => cb(data)); } }
    const ColorHelper = { hexToHSL: (hex) => { let r = 0, g = 0, b = 0; if (hex.length == 4) { r = "0x" + hex[1] + hex[1]; g = "0x" + hex[2] + hex[2]; b = "0x" + hex[3] + hex[3]; } else { r = "0x" + hex[1] + hex[2]; g = "0x" + hex[3] + hex[4]; b = "0x" + hex[5] + hex[6]; } r /= 255; g /= 255; b /= 255; let cmin = Math.min(r, g, b), cmax = Math.max(r, g, b), delta = cmax - cmin, h = 0, s = 0, l = (cmax + cmin) / 2; if (delta == 0) h = 0; else h = cmax == r ? ((g - b) / delta) % 6 : (cmax == g ? (b - r) / delta + 2 : (r - g) / delta + 4); h = Math.round(h * 60); if (h < 0) h += 360; s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1)); return { h, s: s * 100, l: l * 100 }; }, dynamicColor: (base, combatState, type = 'SHELL') => { const hsl = ColorHelper.hexToHSL(base); let h = hsl.h, s = hsl.s, l = hsl.l; if (combatState.state === GameConfig.STATE.LV4_READY || combatState.level === 4) return type === 'CORE' ? '#fff' : '#888'; if (combatState.overdriveType === 'A') { s = Math.max(0, s - 20); l = 90; } else if (combatState.overdriveType === 'B') { l = 15; } switch (combatState.state) { case GameConfig.STATE.STUNNED: s = 0; l = 40; break; case GameConfig.STATE.CHARGING: l += Math.sin(Date.now() / 50) * 20; break; case GameConfig.STATE.LV3_READY: s = 100; l = 85; break; case GameConfig.STATE.BRACE: s = 100; l = type === 'CORE' ? 90 : 40; break; case GameConfig.STATE.PARRY: return Palette.C2; } if (type === 'CORE') l = Math.min(95, l + 40); return `hsl(${h},${s}%,${l}%)`; } };
    const ActionLogic = { vectorToTarget: (self, target) => Vector2.sub(target.components.position.vector, self.components.position.vector), smoothTurn: (self, targetDir) => { const current = self.components.input.lastDirection, dot = current.dot(targetDir); self.components.input.lastDirection = new Vector2(current.x + (targetDir.x - current.x) * (dot > 0.95 ? 0.5 : 1.5), current.y + (targetDir.y - current.y) * (dot > 0.95 ? 0.5 : 1.5)).normalize(); }, 'HOLD_SPRINT': (self, target) => { self.components.input.p1 = true; self.components.input.p2 = false; ActionLogic.smoothTurn(self, ActionLogic.vectorToTarget(self, target).normalize()); }, 'HOLD_BRACE': (self, target) => { self.components.input.p1 = false; self.components.input.p2 = true; ActionLogic.smoothTurn(self, ActionLogic.vectorToTarget(self, target).normalize()); }, 'HOLD_CHARGE': (self, target) => { self.components.input.p1 = true; self.components.input.p2 = true; ActionLogic.smoothTurn(self, ActionLogic.vectorToTarget(self, target).normalize()); }, 'RELEASE_ATTACK': (self) => { self.components.input.p1 = false; self.components.input.p2 = false; }, 'PARRY_BAIT': (self, target) => { ActionLogic.smoothTurn(self, ActionLogic.vectorToTarget(self, target).normalize().mul(-1)); if (Math.random() < 0.1) self.components.input.forceP2 = true; }, 'BOSS_LOGIC': (self, target) => { self.components.input.p1 = true; ActionLogic.smoothTurn(self, ActionLogic.vectorToTarget(self, target).normalize()); } };
    const AiBehaviors = { AGGRESSIVE: [{ type: 'HOLD_SPRINT', weight: 5.0, range: [0, 3000], duration: 60 }, { type: 'RELEASE_ATTACK', weight: 3.0, cooldown: 'dash', range: [0, 300], duration: 5 }], DEFENSIVE: [{ type: 'HOLD_BRACE', weight: 5.0, range: [0, 3000], duration: 120 }, { type: 'RELEASE_ATTACK', weight: 2.0, cooldown: 'dash', range: [0, 150], duration: 5 }, { type: 'HOLD_SPRINT', weight: 1.0, range: [300, 1000], duration: 40 }], OPPORTUNIST: [{ type: 'HOLD_SPRINT', weight: 4.0, range: [200, 3000], duration: 40 }, { type: 'PARRY_BAIT', weight: 2.0, cooldown: 'parry', range: [0, 150], duration: 20 }, { type: 'RELEASE_ATTACK', weight: 4.0, cooldown: 'dash', range: [0, 250], duration: 5 }], BOSS: [{ type: 'HOLD_CHARGE', weight: 2.0, range: [0, 3000], duration: 90 }, { type: 'RELEASE_ATTACK', weight: 4.0, cooldown: 'dash', range: [0, 3000], duration: 5 }, { type: 'BOSS_LOGIC', weight: 1.0, range: [0, 3000], duration: 100 }] };

    // 4. CORE ENTITY COMPONENT SYSTEM
    class GameObject { constructor(id) { this.id = id; this.components = {}; this.tags = new Set(); this.isActive = true; } addComponent(name, data) { this.components[name] = data; return this; } hasComponent(name) { return !!this.components[name]; } hasTag(tag) { return this.tags.has(tag); } }
    class ObjectManager { constructor() { this.list = []; this.nextId = 0; } create() { const obj = new GameObject(++this.nextId); this.list.push(obj); return obj; } destroy(obj) { obj.isActive = false; } clean() { this.list = this.list.filter(e => e.isActive); } getWithComponents(compNames) { return this.list.filter(e => e.isActive && compNames.every(n => e.hasComponent(n))); } getByTag(tag) { return this.list.filter(e => e.isActive && e.hasTag(tag)); } }
    const EntityFactory = {
        createBlueprint: (type, x, y) => { const obj = Game.objectManager.create(), blueprint = EntityDefs[type]; if (!blueprint && type.includes('RUSHER')) return EntityFactory.createEnemy(type, x, y); obj.components.position = { vector: new Vector2(x, y), rotation: 0 }; obj.components.velocity = new Vector2(0, 0); if (blueprint.tags) blueprint.tags.forEach(t => obj.tags.add(t)); if (blueprint.stats) obj.addComponent('stats', { ...blueprint.stats, lives: 0 }); obj.addComponent('render', { color: blueprint.color || blueprint.render.color, trail: [] }); if (blueprint.inputId) obj.addComponent('input', { deviceId: blueprint.inputId, p1: false, p2: false, holdTime1: 0, holdTime2: 0, lastDirection: new Vector2(1, 0) }); obj.addComponent('combat', { state: GameConfig.STATE.IDLE, stateTimer: 0, sprintAccel: 0, braceAccel: 0, chargeTimer: 0, cooldowns: { parry: 0, dash: 0, turn: 0, overdrive: 0, charge: 0 }, invulnTimer: 0, intensity: 0, level: 0, overdriveType: null, overdriveTimer: 0 }); return obj; },
        createEnemy: (key, x, y) => { const obj = Game.objectManager.create(), configKey = key.replace('NORMAL_', ''); const raw = EntityDefs[Object.keys(EntityDefs).find(k => key.includes(k))]; obj.tags.add('enemy'); obj.tags.add(key); obj.components.position = { vector: new Vector2(x, y), rotation: 0 }; obj.components.velocity = new Vector2(0, 0); obj.addComponent('stats', { ...raw.stats, max: raw.stats.hp, lives: 0 }); obj.addComponent('render', { color: raw.color, trail: [] }); obj.addComponent('input', { deviceId: 'ai', p1: false, p2: false, holdTime1: 0, holdTime2: 0, lastDirection: new Vector2(1, 0), forceP1: false, forceP2: false }); obj.addComponent('combat', { state: GameConfig.STATE.IDLE, stateTimer: 0, sprintAccel: 0, braceAccel: 0, chargeTimer: 0, cooldowns: { parry: 0, dash: 0, turn: 0, overdrive: 0, charge: 0 }, invulnTimer: 0, level: 0, overdriveType: null, overdriveTimer: 0 }); obj.addComponent('ai', { behavior: AiBehaviors[raw.ai], traits: raw.traits || [], memory: { damageTaken: 0 }, tick: 0, plan: null }); return obj; },
        createLoot: (x, y, key) => { const obj = Game.objectManager.create(); obj.tags.add('loot'); obj.components.position = { vector: new Vector2(x, y), rotation: 0 }; obj.components.velocity = new Vector2(0, 0); obj.addComponent('loot', { type: key, life: 1200, data: LootDefs[key] }); obj.addComponent('render', { color: LootDefs[key].color }); return obj; },
        spawnParticle: (x, y, color, speed, type = 'EXPLODE') => { const p = Game.pool.get(); p.isActive = true; p.type = type; p.position.x = x; p.position.y = y; p.color = color; p.life = 1; p.size = Math.random() * 4 + 2; p.rotation = Math.random() * 360; if (type === 'IMPLODE') { p.velocity.x = 0; p.velocity.y = 0; } else if (type === 'FIZZLE') { p.velocity.x = (Math.random() - 0.5); p.velocity.y = -2; p.color = Palette.C4; } else if (type === 'DATA') { p.velocity.x = 0; p.velocity.y = 0; p.life = 0.5; p.size = 3; } else { const a = Math.random() * 6.28; p.velocity.x = Math.cos(a) * speed; p.velocity.y = Math.sin(a) * speed; } Game.particles.push(p); },
        spawnWave: (x, y, color) => { Game.waves.push({ x, y, r: 5, color, alpha: 1 }); }
    };

    // 5. SYSTEMS

    class InputSystem { constructor() { this.mode = "MOUSE"; this.pads = { p1: { p1: 0, p2: 0, axis: new Vector2(0, 0) } }; this.keys = {}; this.touches = {}; this.mouse = { x: 0, y: 0 }; this.debounce = 0; this.bindEvents(); } bindEvents() { const L = window.addEventListener; L('keydown', e => { this.keys[e.code] = true; }); L('keyup', e => this.keys[e.code] = false); L('mousemove', e => { if (this.mode === 'MOUSE') { this.mouse.x = e.clientX; this.mouse.y = e.clientY; } }); L('mousedown', e => { if (this.mode === 'MOUSE' && !Game.state.isMenu) { if (e.button === 0) this.pads.p1.p1 = true; if (e.button === 2) this.pads.p1.p2 = true; } }); L('mouseup', e => { if (this.mode === 'MOUSE') { if (e.button === 0) this.pads.p1.p1 = false; if (e.button === 2) this.pads.p1.p2 = false; } }); L('contextmenu', e => e.preventDefault()); } aimAssist(source, vec) { if (vec.mag() < GameConfig.AIM.DEADZONE) return vec; let targets = source.hasTag('player') ? Game.objectManager.getByTag('enemy') : Game.objectManager.getByTag('player'); if (!targets.length) return vec; let best = null, maxScore = -1; targets.forEach(t => { const dist = Vector2.dist(source.components.position.vector, t.components.position.vector); if (dist > GameConfig.AIM.ASSIST_DIST) return; const dir = Vector2.sub(t.components.position.vector, source.components.position.vector).normalize(), dot = vec.dot(dir); if (dot > GameConfig.AIM.ASSIST_ANGLE) { const score = dot + (1 - dist / 1000); if (score > maxScore) { maxScore = score; best = dir; } } }); return best ? new Vector2(vec.x * (1 - GameConfig.AIM.ASSIST_STR) + best.x * GameConfig.AIM.ASSIST_STR, vec.y * (1 - GameConfig.AIM.ASSIST_STR) + best.y * GameConfig.AIM.ASSIST_STR).normalize() : vec; } process() { this.pollGamepads(); if (this.debounce > 0) this.debounce--; this.mapInputs(); Game.objectManager.getWithComponents(['input', 'combat', 'velocity']).forEach(obj => { if (Game.state.isMenu && obj.components.input.deviceId !== 'ai') return; const inp = obj.compo     class RenderSystem {
        constructor() {
            this.ctx = document.getElementById("gameCanvas").getContext("2d");
            this.noiseCanvas = document.createElement('canvas');
            this.noiseCanvas.width = 200;
            this.noiseCanvas.height = 200;
            const nCtx = this.noiseCanvas.getContext('2d');
            // Generate static floor noise texture once for performance
            nCtx.fillStyle = Palette.C1;
            nCtx.fillRect(0, 0, 200, 200);
            for (let i = 0; i < 1000; i++) {
                nCtx.fillStyle = Math.random() > 0.5 ? '#222' : '#111';
                nCtx.fillRect(Math.random() * 200, Math.random() * 200, 2, 2);
            }
        }

        draw() {
            const w = Game.width, h = Game.height;

            // 1. Heat Reactive Background Logic
            // Calculate Heat Level (0 to 1 scaling factor)
            const heatFactor = Game.state.heat / 100;
            const heatLevel = Math.ceil(heatFactor * 5); // 1-5

            this.ctx.save();

            // Shake logic
            const shakeMag = Math.min(Game.state.shake, 35) * 0.7;
            const sx = (Math.random() - 0.5) * shakeMag;
            const sy = (Math.random() - 0.5) * shakeMag;
            this.ctx.translate(sx, sy);
            if (Game.ui.el) Game.ui.el.style.transform = `translate(${sx}px,${sy}px)`;

            // Draw Tiled Floor
            const pat = this.ctx.createPattern(this.noiseCanvas, 'repeat');
            this.ctx.fillStyle = pat;
            this.ctx.fillRect(-sx, -sy, w, h);

            // Draw "Wanted Level" Vignette
            // As heat rises, the edges get darker and slightly reddish
            const grad = this.ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.8);
            const vigColor = `rgba(${Math.floor(heatFactor * 50)}, 0, 0, ${0.4 + (heatFactor * 0.5)})`;
            grad.addColorStop(0, "rgba(0,0,0,0)");
            grad.addColorStop(1, vigColor);
            this.ctx.fillStyle = grad;
            this.ctx.fillRect(-sx, -sy, w, h);

            // Grid (Subtle, darker)
            if (Game.config.FX.GRID) {
                this.ctx.lineWidth = 2;
                this.ctx.strokeStyle = "rgba(30,30,30,0.5)";
                this.ctx.beginPath();
                for (let x = 0; x < w; x += GameConfig.VISUALS.GRID_SIZE) {
                    this.ctx.moveTo(x, 0); this.ctx.lineTo(x, h);
                }
                for (let y = 0; y < h; y += GameConfig.VISUALS.GRID_SIZE) {
                    this.ctx.moveTo(0, y); this.ctx.lineTo(w, y);
                }
                this.ctx.stroke();
            }

            // Blood
            Game.visuals.blood.forEach(b => {
                this.ctx.save();
                this.ctx.translate(b.position.x, b.position.y);
                this.ctx.rotate(b.rotation);
                this.ctx.fillStyle = b.color;
                this.ctx.globalAlpha = Math.min(0.8, b.life / 400);
                this.ctx.fillRect(-b.size / 2, -b.size / 2, b.size, b.size);
                this.ctx.restore();
            });

            this.drawEntities();

            // Shockwaves
            this.ctx.lineWidth = 3;
            Game.waves.forEach(s => {
                this.ctx.globalAlpha = s.alpha * 0.8;
                this.ctx.strokeStyle = s.color; // Use actual color
                this.ctx.beginPath();
                this.ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                this.ctx.stroke();
            });
            this.ctx.globalAlpha = 1;

            // Flash
            if (Game.state.flash > 0 && Game.config.FX.FLASH) {
                this.ctx.fillStyle = 'rgba(255,255,255,' + (Game.state.flash * 0.2) + ')';
                this.ctx.fillRect(-sx, -sy, w, h);
            }

            // Floating Text (Pixel style)
            Game.visuals.text.forEach(t => {
                this.ctx.globalAlpha = Math.max(0, t.life);
                this.ctx.fillStyle = Palette.C2;
                this.ctx.font = "30px VT323";
                this.ctx.shadowColor = Palette.C3;
                this.ctx.shadowBlur = 0;
                // Manual text shadow for pixel art feel
                this.ctx.fillText(t.str, t.position.x + 2, t.position.y + 2);
                this.ctx.fillStyle = t.color;
                this.ctx.fillText(t.str, t.position.x, t.position.y);
            });

            // Aim Line
            if (Game.systems.input.mode === 'MOUSE' && !Game.state.isMenu) {
                const p1 = Game.objectManager.getByTag('player')[0];
                if (p1) {
                    this.ctx.strokeStyle = "rgba(255,255,255,0.1)";
                    this.ctx.setLineDash([2, 4]);
                    this.ctx.beginPath();
                    this.ctx.moveTo(p1.components.position.vector.x, p1.components.position.vector.y);
                    this.ctx.lineTo(Game.systems.input.mouse.x, Game.systems.input.mouse.y);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);

                    // Cursor
                    this.ctx.strokeStyle = Palette.C2;
                    this.ctx.strokeRect(Game.systems.input.mouse.x - 4, Game.systems.input.mouse.y - 4, 8, 8);
                }
            }
            this.ctx.restore();
        }

        drawEntities() {
            Game.objectManager.getByTag('loot').forEach(p => {
                this.ctx.save();
                this.ctx.translate(p.components.position.vector.x, p.components.position.vector.y);

                // Loot Glow
                const glow = this.ctx.createRadialGradient(0, 0, 5, 0, 0, 40);
                glow.addColorStop(0, p.components.render.color);
                glow.addColorStop(1, "transparent");
                this.ctx.fillStyle = glow;
                this.ctx.globalAlpha = 0.3;
                this.ctx.beginPath(); this.ctx.arc(0, 0, 40, 0, Math.PI * 2); this.ctx.fill();

                this.ctx.rotate(p.components.position.rotation);
                this.ctx.strokeStyle = p.components.render.color;
                this.ctx.shadowColor = p.components.render.color;
                this.ctx.shadowBlur = 0;
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(-8, -8, 16, 16);
                this.ctx.fillStyle = Palette.C2;
                this.ctx.fillRect(-3, -3, 6, 6);
                this.ctx.restore();
            });

            Game.particles.forEach(p => {
                this.ctx.save();
                this.ctx.translate(p.position.x, p.position.y);
                this.ctx.rotate(p.rotation);
                this.ctx.fillStyle = p.color;
                this.ctx.globalAlpha = p.life;
                this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                this.ctx.restore();
            });

            Game.objectManager.getByTag('enemy').forEach(e => this.drawEntity(e));
            Game.objectManager.getByTag('player').forEach(p => this.drawEntity(p));
        }

        drawEntity(obj) {
            const c = obj.components, s = c.stats, p = c.position.vector, l = Game.systems.combat.getLevel(obj), col = ColorHelper.dynamicColor(c.render.color, c.combat);
            this.ctx.save();
            this.ctx.translate(p.x, p.y);

            // 1. IMPROVED LIGHTING (The "Shine into ground")
            // Larger radius, very low opacity, creates "atmosphere"
            const light = this.ctx.createRadialGradient(0, 0, s.radius, 0, 0, s.radius * 8);
            light.addColorStop(0, c.render.color);
            light.addColorStop(1, "transparent");
            this.ctx.globalAlpha = 0.15;
            this.ctx.fillStyle = light;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, s.radius * 8, 0, Math.PI * 2);
            this.ctx.fill();

            // 2. AFTER-IMAGES (Replaces Trails)
            // We draw the entity shape at previous positions
            if (c.render.trail.length > 0) {
                c.render.trail.forEach((t, i) => {
                    this.ctx.save();
                    // We need to inverse translate to draw at world coordinates relative to current local
                    this.ctx.translate(t.x - p.x, t.y - p.y);
                    this.ctx.rotate(t.rot);
                    this.ctx.strokeStyle = col;
                    this.ctx.globalAlpha = (i / c.render.trail.length) * 0.3; // Low opacity ghost
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, s.radius, 0, Math.PI * 2);
                    this.ctx.stroke();
                    this.ctx.restore();
                });
            }

            // 3. MAIN ENTITY BODY
            this.ctx.rotate(Math.atan2(c.velocity.y, c.velocity.x));
            const str = 1 + Math.min(c.velocity.mag() / 80, 0.6);
            this.ctx.scale(str, 1 / str);

            // Jitter effect for high level / charge
            if (l >= 3 || c.combat.state === GameConfig.STATE.CHARGING) {
                this.ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 2);
            }

            // Setup Noir Style Shadow/Glow
            this.ctx.shadowColor = col;
            this.ctx.shadowBlur = l >= 3 ? 20 : 0; // Only glow heavily at high power
            this.ctx.strokeStyle = col;
            this.ctx.lineWidth = 3;
            this.ctx.globalAlpha = 1;

            // Draw Circle
            this.ctx.beginPath();
            this.ctx.arc(0, 0, s.radius, 0, Math.PI * 2);
            this.ctx.stroke();

            // Inner Fill (Darker)
            this.ctx.fillStyle = Palette.C3;
            this.ctx.globalAlpha = 0.8;
            this.ctx.fill();

            // Center Core (The eye)
            this.ctx.fillStyle = Palette.C2;
            this.ctx.globalAlpha = 0.8;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, s.radius * 0.4, 0, Math.PI * 2);
            this.ctx.fill();

            // Charge Indicator Ring
            if (c.combat.state >= GameConfig.STATE.CHARGING && c.combat.state <= GameConfig.STATE.LV4_READY) {
                const g = 30 - (c.combat.chargeTimer % 30);
                this.ctx.strokeStyle = Palette.C2;
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, s.radius + g, 0, Math.PI * 2);
                this.ctx.stroke();
            }
            this.ctx.restore();
        }
    }
    // 6. MAIN GAME DIRECTOR
    class Game { static objectManager = new ObjectManager(); static visuals = { blood: [], text: [] }; static particles = []; static waves = []; static pool = null; static state = { isMenu: true, score: 0, kills: 0, heat: 0, shake: 0, stop: 0, flash: 0, waveTimer: 0, lootTimer: 1800, aberration: 0, invert: false, partLimit: 0, combo: 0 }; static config = { FX: { BLOOD: true, SHAKE: true, FLASH: true, GLOW: true, GRID: true } }; static bus = new EventBus(); static width = window.innerWidth; static height = window.innerHeight; static systems = {}; static ui = { el: document.getElementById("floor-menu"), scoreEl: document.getElementById("score-val"), triggerStart: () => { if (Game.state.isMenu) { Game.state.isMenu = false; Game.ui.el.classList.remove("menu-active"); Game.ui.el.classList.add("menu-sunken"); Game.director.play(); } else { Game.state.isMenu = true; Game.ui.el.classList.add("menu-active"); Game.ui.el.classList.remove("menu-sunken"); } }, toggleGuide: () => { document.getElementById('guide-modal').classList.toggle('visible'); }, update: () => { Game.ui.scoreEl.innerText = Math.floor(Game.state.score); } }; static director = { attract: () => { Game.objectManager.list = []; Game.objectManager.nextId = 0; Game.particles = []; Game.visuals.text = []; Game.visuals.blood = []; const a1 = EntityFactory.createBlueprint('PLAYER_1', Game.width * 0.5, Game.height / 2); a1.components.input.deviceId = 'ai'; a1.addComponent('ai', { behavior: AiBehaviors.AGGRESSIVE, traits: ["SPRINTER"], memory: { damageTaken: 0 }, tick: 0, plan: null }); Game.state.isMenu = true; Game.ui.el.classList.add("menu-active"); Game.ui.el.classList.remove("menu-sunken"); }, play: () => { Game.loop.resize(); Game.systems.input.pads.p1.axis = new Vector2(0, 0); Game.objectManager.list = []; Game.objectManager.nextId = 0; Game.particles = []; Game.visuals.text = []; Game.visuals.blood = []; const p1 = EntityFactory.createBlueprint('PLAYER_1', Game.width / 2, Game.height / 2); Game.state.score = 0; Game.state.heat = 0; Game.ui.update(); Game.state.kills = 0; Game.state.shake = 0; Game.state.stop = 0; Game.state.waveTimer = 0; Game.state.lootTimer = 1800; Game.systems.input.setupTouch(); }, spawnWave: () => { const enemyCount = Game.objectManager.getByTag('enemy').length; const threshold = 1 + Math.floor(Game.state.heat / 20); if (enemyCount < threshold) { const r = Math.random(), type = r < 0.05 ? "ENEMY_BOSS" : (r < 0.40 ? "ENEMY_DEFENDER" : (r < 0.70 ? "ENEMY_VULTURE" : "ENEMY_RUSHER")); const s = Math.floor(Math.random() * 4), pos = [new Vector2(Math.random() * Game.width, -40), new Vector2(Game.width + 40, Math.random() * Game.height), new Vector2(Math.random() * Game.width, Game.height + 40), new Vector2(-40, Math.random() * Game.height)][s]; EntityFactory.createEnemy(type, pos.x, pos.y); } Game.state.lootTimer--; if (Game.state.lootTimer <= 0) { EntityFactory.createLoot(Math.random() * (Game.width - 100) + 50, Math.random() * (Game.height - 100) + 50, Math.random() > 0.8 ? "LIFE" : (Math.random() > 0.5 ? "GOD" : "HEAL")); Game.state.lootTimer = 1800 + Math.random() * 1800; } }, gameOver: () => { Game.state.isMenu = true; Game.ui.el.classList.add("menu-active"); Game.ui.el.classList.remove("menu-sunken"); } }; static init() { this.pool = new MemoryPool(() => ({ isActive: false, position: new Vector2(0, 0), velocity: new Vector2(0, 0), color: Palette.C2, life: 0, size: 1, type: 'EXPLODE' }), 300); this.systems.audio = new AudioSystem(); this.systems.input = new InputSystem(); this.systems.ai = new AiSystem(); this.systems.physics = new PhysicsSystem(); this.systems.combat = new CombatSystem(); this.systems.rules = new Rules(); this.systems.render = new RenderSystem(); this.loop = { id: null, lastTime: 0, accumulator: 0, step: 1000 / 60, resize: () => { Game.width = document.getElementById("gameCanvas").width = window.innerWidth; Game.height = document.getElementById("gameCanvas").height = window.innerHeight; }, run: (ts) => { if (!Game.loop.lastTime) Game.loop.lastTime = ts; let dt = ts - Game.loop.lastTime; Game.loop.lastTime = ts; if (dt > 200) dt = Game.loop.step; Game.loop.accumulator += dt; while (Game.loop.accumulator >= Game.loop.step) { if (Game.state.stop > 0) Game.state.stop--; else { Game.systems.input.process(); if (!Game.state.isMenu) { Game.state.heat = Math.max(0, Game.state.heat - GameConfig.HEAT.DECAY); Game.ui.update(); } else if (Game.state.isMenu && Game.objectManager.getByTag('player').length === 0 && Game.objectManager.nextId > 0) { const a1 = EntityFactory.createBlueprint('PLAYER_1', Game.width * 0.5, Game.height / 2); a1.components.input.deviceId = 'ai'; a1.addComponent('ai', { behavior: AiBehaviors.AGGRESSIVE, traits: ["SPRINTER"], memory: { damageTaken: 0 }, tick: 0, plan: null }); } Game.director.spawnWave(); Game.systems.ai.process(); Game.systems.physics.process(); Game.systems.combat.process(); Game.objectManager.clean(); Game.visuals.text.forEach((t, i) => { t.position.add(t.velocity); t.life -= 0.02; if (t.life <= 0) Game.visuals.text.splice(i, 1); }); Game.visuals.blood.forEach(b => { b.position.add(b.velocity); b.velocity.mul(0.85); }); for (let i = Game.particles.length - 1; i >= 0; i--) { let p = Game.particles[i]; p.position.add(p.velocity); p.velocity.mul(0.9); p.life -= 0.05; if (p.life <= 0) { Game.pool.free(p); Game.particles.splice(i, 1); } } Game.waves.forEach((s, i) => { s.r += 4; s.alpha -= GameConfig.VISUALS.FLASH_DECAY; if (s.alpha <= 0) Game.waves.splice(i, 1); }); if (Game.objectManager.getByTag('player').length === 0 && !Game.state.isMenu) Game.director.gameOver(); } Game.state.shake = Math.max(0, Game.state.shake * 0.9 - 0.1); Game.state.flash = Math.max(0, Game.state.flash - 0.05); Game.state.aberration = Math.max(0, Game.state.aberration - 0.5); Game.state.partLimit = 0; Game.loop.accumulator -= Game.loop.step; } Game.systems.render.draw(); Game.state.invert = false; Game.loop.id = requestAnimationFrame(Game.loop.run); } }; window.addEventListener("resize", this.loop.resize); this.bus.subscribe('SHAKE', v => { if (this.config.FX.SHAKE) this.state.shake += v; }); this.bus.subscribe('FLASH', v => { if (this.config.FX.FLASH) this.state.flash = v; }); this.bus.subscribe('PART_SPAWN', d => { if (Game.state.partLimit > GameConfig.VISUALS.PARTICLE_LIMIT) return; if (Game.particles.length > GameConfig.VISUALS.PARTICLE_LIMIT) { Game.pool.free(Game.particles.shift()); } Game.state.partLimit++; EntityFactory.spawnParticle(d.x, d.y, d.color, d.speed, d.type); }); this.bus.subscribe('PART_BURST', d => { if (!this.config.FX.BLOOD && !this.config.FX.FLASH) return; for (let i = 0; i < d.count; i++) this.bus.publish('PART_SPAWN', { x: d.x, y: d.y, color: d.color, speed: Math.random() * 10 + 5 }); }); this.bus.subscribe('FIZZLE', d => { for (let i = 0; i < 5; i++) Game.bus.publish('PART_SPAWN', { x: d.x, y: d.y, color: Palette.C4, speed: 0.5, type: 'FIZZLE' }); }); this.loop.resize(); this.director.attract(); Game.loop.id = requestAnimationFrame(this.loop.run); } }; Game.init();
