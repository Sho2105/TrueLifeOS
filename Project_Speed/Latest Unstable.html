<script>const PAL={BG:"#050505",W:"#ffffff",K:"#000000",G:"#444444",D:"#141414"};const CFG={PHY:{FRIC:0.9,BOUNCE:-0.8,PAD:25},DMG:{BASE:15,WALL:25},ST:{IDLE:"IDLE",MOVE:"MOVE",STUN:"STUN"},HEAT:{DECAY:0.04,KILL:10,PARRY:15,CLASH:5,HIT:20},VIS:{P_LIM:400,GRID:80,F_DEC:0.05},AIM:{ANG:0.9,DIST:500,STR:0.35,DZONE:0.1},IN:{TAP_WIN:8,HOLD_WIN:9}};const CompSchemas={st:['hp','max','rad','mods'],ren:['col'],cmb:['moveset','state'],in:['id'],ai:['behav']};const MoveReg={IDLE:{tier:0,type:"UTIL",style:"NRM"},MOVE:{tier:1,type:"UTIL",style:"NRM"},STUN:{tier:0,type:"UTIL",style:"STUN"},DASH:{tier:3,type:"UTIL",style:"GLOW",dur:15,enter:(o,d)=>{o.cp.vel=d.cln().mul(30);o.cp.cmb.invTimer=10;o.cp.cmb.cds.dash=60;FX.txt(o.cp.pos.v,">> DASH",Col.shift(o.cp.ren.col,0,0,30));G.bus.pub("SHAKE",2);},update:(o)=>o.cp.vel.mul(0.85)},PARRY:{tier:5,type:"DEF",style:"PURE",dur:20,enter:(o)=>{o.cp.vel.mul(0.1);o.cp.cmb.cds.parry=60;o.cp.cmb.invTimer=5;FX.txt(o.cp.pos.v,"< PARRY >",PAL.W);}},SPRINT:{tier:2,type:"UTIL",style:"GLOW",dur:999,update:(o,d)=>{o.cp.vel.add(d.mul(3.75));if(Math.random()<0.3)Factory.part(o.cp.pos.v.x,o.cp.pos.v.y,Col.shift(o.cp.ren.col,0,20,10),2);},exit:(o)=>o.cp.vel.mul(0.5)},BRACE:{tier:2,type:"DEF",style:"DIM",dur:999,enter:(o)=>FX.txt(o.cp.pos.v,"[ BRACE ]",Col.shift(o.cp.ren.col,0,-50,-20)),update:(o,d)=>o.cp.vel.add(d.mul(0.6))},CHARGE:{tier:1,type:"UTIL",style:"CHG",dur:999,enter:(o)=>FX.txt(o.cp.pos.v,"^ CHARGE ^","#FFD700"),update:(o)=>{const c=o.cp.cmb;o.cp.vel.mul(0.8);c.chgTimer++;if(c.chgTimer%5===0)Factory.part(o.cp.pos.v.x,o.cp.pos.v.y,"#FFD700",5,"IMP");if(c.chgTimer>100){G.bus.pub("FLASH",0.8);G.bus.pub("SHAKE",20);FX.txt(o.cp.pos.v,"MAX POWER!","#FFF");Factory.wave(o.cp.pos.v.x,o.cp.pos.v.y,"#FFD700");c.moveset="L2";c.powerTimer=400;c.chgTimer=0;c.state="IDLE";c.reqRel=true;}},exit:(o)=>(o.cp.cmb.chgTimer=0)},BLINK:{tier:3,type:"UTIL",style:"PURE",dur:10,enter:(o,d)=>{o.cp.pos.v.add(d.cln().mul(150));FX.txt(o.cp.pos.v,"* BLINK *","#0ff");FX.burst(o.c const Factory={validate:(o)=>{for(let cName in o.cp){if(CompSchemas[cName]){const req=CompSchemas[cName];const has=Object.keys(o.cp[cName]);const missing=req.filter(x=>!has.includes(x));if(missing.length>0){const msg=`STRICT ERROR:Entity ${o.id}comp'${cName}'missing:${missing.join(',')}`;alert(msg);throw new Error(msg);}}}},mk:(t,x,y)=>{const o=G.obs.mk(),bp=Defs[t];if(!bp&&t.includes("RUSH"))return Factory.foe(t,x,y);o.cp.pos={v:new Vec2(x,y),rot:0};o.cp.vel=new Vec2(0,0);if(bp.tags)bp.tags.forEach((tg)=>o.tags.add(tg));o.add("st",{...bp.st});o.add("ren",{col:bp.col,tr:[]}).add("in",{id:bp.in,p1:false,p2:false,ht1:0,ht2:0,last:new Vec2(1,0),});o.add("cmb",{moveset:"L1",baseMoveset:"L1",state:CFG.ST.IDLE,stTimer:0,chgTimer:0,powerTimer:0,cds:{parry:0,dash:0},invTimer:0,lvl:0,reqRel:false,});Factory.validate(o);return o;},foe:(k,x,y)=>{const o=G.obs.mk(),raw=Defs[Object.keys(Defs).find((dk)=>k.includes(dk))];o.tags.add("enemy");o.tags.add(k);o.cp.pos={v:new Vec2(x,y),rot:0};o.cp.vel=new Vec2(0,0);o.add("st",{...raw.st});o.add("ren",{col:raw.col,tr:[]});o.add("in",{id:"ai",p1:false,p2:false,ht1:0,ht2:0,last:new Vec2(1,0),fP1:false,fP2:false,});o.add("cmb",{moveset:"L1",baseMoveset:"L1",state:CFG.ST.IDLE,stTimer:0,chgTimer:0,powerTimer:0,cds:{parry:0,dash:0},invTimer:0,lvl:0,reqRel:false,});o.add("ai",{behav:Behave[raw.ai],traits:raw.traits||[],mem:{dmg:0},tick:0,plan:null,});Factory.validate(o);return o;},loot:(x,y,k)=>{const o=G.obs.mk();o.tags.add("loot");o.cp.pos={v:new Vec2(x,y),rot:0};o.cp.vel=new Vec2(0,0);o.add("loot",{type:k,life:1200,data:Loot[k]});o.add("ren",{col:Loot[k].col});return o;},part:(x,y,c,s,t="EXP")=>{const p=G.pool.get();p.act=true;p.type=t;p.pos.x=x;p.pos.y=y;p.col=c;p.life=1;p.sz=Math.random()*4+2;p.rot=Math.random()*360;if(t==="IMP"){p.vel.x=0;p.vel.y=0;}else if(t==="FIZ"){p.vel.x=Math.random()-0.5;p.vel.y=-2;p.col=PAL.G;}else if(t==="DAT"){p.vel.x=0;p.vel.y=0;p.life=0.5;p.sz=3;}

class Game{static obs=new ObjMan();static vis={blood:[],txt:[]};static parts=[];static waves=[];static pool=null;static st={menu:true,score:0,kills:0,heat:0,shake:0,stop:0,flash:0,wT:0,lT:1800,aberr:0,inv:false,pLim:0,combo:0,};static cfg={FX:{BLOOD:true,SHAKE:true,FLASH:true,GLOW:true,GRID:true},};static bus=new Bus();static w=window.innerWidth;static h=window.innerHeight;static sys={};static ui={el:document.getElementById("menu"),sc:document.getElementById("score-disp"),start:()=>{if(G.st.menu){G.st.menu=false;G.ui.el.classList.remove("active");G.ui.el.classList.add("sunken");G.dir.play();}else{G.st.menu=true;G.ui.el.classList.add("active");G.ui.el.classList.remove("sunken");}},guide:()=>{document.getElementById("guide").classList.toggle("show");},upd:()=>{G.ui.sc.innerText=Math.floor(G.st.score);},};static dir={attr:()=>{G.obs.all=[];G.obs.nid=0;G.parts=[];G.vis.txt=[];G.vis.blood=[];const a1=Factory.mk("P1",G.w*0.5,G.h/2);a1.cp.in.id="ai";a1.add("ai",{behav:Behave.AGRO,traits:["SPRINT"],mem:{dmg:0},tick:0,plan:null,});G.st.menu=true;G.ui.el.classList.add("active");G.ui.el.classList.remove("sunken");},play:()=>{G.loop.sz();G.sys.in.pad.p1.ax=new Vec2(0,0);G.obs.all=[];G.obs.nid=0;G.parts=[];G.vis.txt=[];G.vis.blood=[];Factory.mk("P1",G.w/2,G.h/2);G.st.score=0;G.st.heat=0;G.ui.upd();G.st.kills=0;G.st.shake=0;G.st.stop=0;G.st.wT=0;G.st.lT=1800;G.sys.in.touch();},wave:()=>{const c=G.obs.tag("enemy").length,th=1+Math.floor(G.st.heat/20);if(c<th){const r=Math.random(),t=r<0.05?"E_BOSS":r<0.4?"E_DEF":r<0.7?"E_VUL":"E_RUSH";const s=Math.floor(Math.random()*4),pos=[new Vec2(Math.random()*G.w,-40),new Vec2(G.w+40,Math.random()*G.h),new Vec2(Math.random()*G.w,G.h+40),new Vec2(-40,Math.random()*G.h),][s];Factory.foe(t,pos.x,pos.y);}

G.dir.wave();G.sys.ai.run();G.sys.phy.run();G.sys.cmb.run();G.obs.clean();G.vis.txt.forEach((t,i)=>{t.pos.add(t.vel);t.life-=0.02;if(t.life<=0)G.vis.txt.splice(i,1);});G.vis.blood.forEach((b)=>{b.pos.add(b.vel);b.vel.mul(0.85);});for(let i=G.parts.length-1;i>=0;i--){let p=G.parts[i];p.pos.add(p.vel);p.vel.mul(0.9);p.life-=0.05;if(p.life<=0){G.pool.free(p);G.parts.splice(i,1);}}
G.waves.forEach((s,i)=>{s.r+=4;s.a-=CFG.VIS.F_DEC;if(s.a<=0)G.waves.splice(i,1);});if(G.obs.tag("player").length==0&&!G.st.menu)
