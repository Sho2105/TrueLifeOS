<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Project: Speed [Fixed 60Hz]</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    :root { --c-cyan: #dcdcdc; --c-pink: #ff0000; --c-yell: #fff; --c-bg: #000000; --c-dim: #333; }
    body { margin: 0; overflow: hidden; background-color: var(--c-bg); color: #eee; font-family: 'VT323', monospace; user-select: none; touch-action: none; }
    body::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03)); z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.8; mix-blend-mode: overlay; }
    canvas { display: block; cursor: none; image-rendering: pixelated; filter: contrast(1.2) saturate(1.1) grayscale(0.1); }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    #pause-menu { display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 4px solid #fff; padding: 25px; text-align: center; pointer-events: auto; box-shadow: 10px 10px 0 #333; min-width: 350px; max-height: 90vh; overflow-y: auto; z-index: 60; }
    .menu-btn { background: #000; color: #888; border: 2px solid #333; font-family: 'VT323', monospace; font-size: 28px; padding: 10px 20px; cursor: pointer; margin-top: 15px; width: 100%; text-transform: uppercase; transition: 0.1s; }
    .menu-btn:hover, .menu-btn.focused { background: #fff; color: #000; border-color: #fff; }
    .menu-btn.active { background: #333; color: #fff; border: 2px solid #fff; }
    .control-row { display: flex; justify-content: space-between; font-size: 20px; color: #666; margin-bottom: 5px; border-bottom: 1px solid #222; }
    b { color: #ccc; }
    .fx-toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 22px; margin: 8px 0; color: #888; padding: 0 5px; }
    .fx-toggle-row.focused { background: #fff; color: #000; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: #fff; cursor: pointer; }
    #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; pointer-events: auto; z-index: 50; }
    #game-over h2 { font-size: 120px; margin: 0; color: #fff; text-shadow: 4px 4px 0 #ff0000; animation: glitch 0.2s infinite; line-height: 0.8; letter-spacing: -5px;}
    @keyframes glitch { 0% { transform: translate(-2px, 2px); } 50% { transform: translate(2px, -2px); } 100% { transform: translate(0, 0); } }
    .touch-container { display: none; position: absolute; z-index: 30; pointer-events: none; width: 100%; height: 100%; top: 0; left: 0; }
    .touch-pad { position: absolute; border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; backdrop-filter: grayscale(1); pointer-events: auto; }
    .stick-base { width: 120px; height: 120px; background: rgba(0, 0, 0, 0.5); }
    .stick-nub { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .btn-action { width: 90px; height: 90px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: bold; border-color: #fff;}
    .btn-action:active, .btn-action.active { background: #fff; color: #000; }
    .btn-sprint { width: 70px; height: 70px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 16px; border-color: #888;}
    .btn-sprint:active, .btn-sprint.active { background: #888; color: #000; }
</style>

<div id="ui-layer">
    <div id="game-over">
        <h2 id="go-title">WASTED</h2>
        <p style="font-size: 40px; color: #000; background: #fff; display:inline-block; padding: 0 15px; font-weight: bold;">SCORE: <span id="final-score">0</span></p>
        <button class="menu-btn" style="background: #000; color: #fff; border-color: #fff; margin-top: 20px;" onclick="Game.events.emit('reset_request')">RESTART</button>
    </div>
</div>
<div id="touch-layer" class="touch-container"></div>
<div id="pause-menu">
    <h2 style="color: #fff; margin: 0 0 15px 0; border-bottom: 4px solid #fff; letter-spacing: 2px;">SYSTEM READY</h2>
    <div style="margin-bottom: 15px;">
        <div class="control-row" style="border:none; justify-content: center; gap: 10px;">
            <button id="btn-mode-solo" class="menu-btn active" style="margin:0; width:45%" onclick="Game.director.setMode('SOLO')">SOLO</button>
            <button id="btn-mode-vs" class="menu-btn" style="margin:0; width:45%" onclick="Game.director.setMode('COOP')">CO-OP</button>
        </div>
        <div class="control-row" style="border:none; justify-content: center; gap: 5px; margin-top: 10px;">
            <button id="btn-input-mouse" class="menu-btn active" style="margin:0; width:22%; font-size: 20px;" onclick="Game.input.setScheme('MOUSE')">MSE</button>
            <button id="btn-input-key" class="menu-btn" style="margin:0; width:22%; font-size: 20px;" onclick="Game.input.setScheme('KEYBOARD')">KEY</button>
            <button id="btn-input-touch" class="menu-btn" style="margin:0; width:22%; font-size: 20px;" onclick="Game.input.setScheme('TOUCH')">TCH</button>
            <button id="btn-input-pad" class="menu-btn" style="margin:0; width:22%; font-size: 20px;" onclick="Game.input.setScheme('GAMEPAD')">PAD</button>
        </div>
    </div>
    <div id="controls-desc" style="text-align: left; margin-bottom: 20px;"></div>
    <div style="text-align: left; border-top: 2px solid #333; padding-top: 10px;">
        <h3 style="margin: 0 0 5px 0; color: #666;">PHYSICS</h3>
        <div class="fx-toggle-row"><label>FRICTION <small style="color:#fff" id="lbl-fric">0.92</small></label><input type="range" id="rng-friction" min="0.80" max="0.99" step="0.01" value="0.92" oninput="document.getElementById('lbl-fric').innerText=this.value" onchange="Game.config.update()"></div>
        <h3 style="margin: 10px 0 5px 0; color: #666;">VISUALS</h3>
        <div class="fx-toggle-row"><label>GORE</label><input type="checkbox" id="chk-blood" checked onchange="Game.config.update()"></div>
        <div class="fx-toggle-row"><label>SCREEN SHAKE</label><input type="checkbox" id="chk-shake" checked onchange="Game.config.update()"></div>
        <div class="fx-toggle-row"><label>IMPACT FRAMES</label><input type="checkbox" id="chk-flash" checked onchange="Game.config.update()"></div>
        <div class="fx-toggle-row"><label>NEON BLOOM</label><input type="checkbox" id="chk-glow" checked onchange="Game.config.update()"></div>
        <div class="fx-toggle-row"><label>RETRO GRID</label><input type="checkbox" id="chk-grid" checked onchange="Game.config.update()"></div>
    </div>
    <button class="menu-btn" onclick="Game.ui.toggleMenu()">DEPLOY</button>
</div>
<canvas id="gameCanvas"></canvas>

<script>
// --- CORE CONSTANTS & UTILS ---
const PALETTE = {
    CYAN: "#00f3ff", PINK: "#ff0055", YELLOW: "#ffe600", WHITE: "#ffffff",
    DARK: "#050505", GREY: "#444444", GREEN: "#00ff00", RED: "#ff4757",
    ORANGE: "#ffa502", LIME: "#2ed573", BLUE: "#1e90ff", INDIGO: "#3742fa",
    SLATE: "#747d8c", IRON: "#57606f", SHADOW: "#2f3542", STEEL: "#535c68",
    PLATINUM: "#a4b0be", PURPLE: "#8e44ad", CRIMSON: "#c0392b",
    RUST: "#d35400", JADE: "#16a085", MIDNIGHT: "#2c3e50"
};

const CONSTANTS = {
    SPEED: { NORMAL: 1, MOMENTUM: 2.5, BURST: 50, HYPER: 100 },
    DAMAGE: { NORMAL: 0, MOMENTUM: 15, BURST: 25, HYPER: 999 },
    COLORS: { P1: PALETTE.CYAN, P2: PALETTE.ORANGE, HYPER: PALETTE.WHITE, TEXT: PALETTE.WHITE },
    RANKS: ["F", "D", "C", "B", "A", "S", "SS", "SSS", "GOD", "???"],
    TIMING: { CHARGE_BURST: 45, CHARGE_HYPER: 120, PARRY_DUR: 20, PARRY_CD: 60, BURST_DUR: 20, BURST_CD: 60, GOD: 600, STUN: 120 },
    STATE: { IDLE: 0, MOVE: 1, SPRINT: 2, CHARGE: 3, READY_BURST: 4, READY_HYPER: 5, PARRY: 6, DASH_BURST: 7, DASH_HYPER: 8, STUN: 9, DEAD: 10 },
    MAX_PARTICLES: 200, MAX_PARTICLES_PER_FRAME: 10
};

// --- DATA REGISTRIES ---
const ACTION_REGISTRY = {
    'GET_LOOT': (e, target) => {
        e.c.combat.state = CONSTANTS.STATE.MOVE;
        e.c.velocity.add(Vector.subtract(target.c.transform.pos, e.c.transform.pos).normalize().multiply(CONSTANTS.SPEED.NORMAL * e.c.stats.speed * 1.2));
    },
    'APPROACH': (e, target) => {
        e.c.combat.state = CONSTANTS.STATE.MOVE;
        e.c.velocity.add(Vector.subtract(target.c.transform.pos, e.c.transform.pos).normalize().multiply(CONSTANTS.SPEED.NORMAL * e.c.stats.speed));
    },
    'RUN': (e, target) => {
        e.c.combat.state = CONSTANTS.STATE.MOVE;
        e.c.velocity.sub(Vector.subtract(target.c.transform.pos, e.c.transform.pos).normalize().multiply(CONSTANTS.SPEED.NORMAL * e.c.stats.speed));
    },
    'SPRINT_ATK': (e, target) => {
        e.c.combat.state = CONSTANTS.STATE.SPRINT;
        e.c.velocity.add(Vector.subtract(target.c.transform.pos, e.c.transform.pos).normalize().multiply(CONSTANTS.SPEED.MOMENTUM * e.c.stats.speed));
    },
    'BURST_ATK': (e, target) => {
        if(e.c.combat.cooldowns.burst > 0) return;
        e.c.combat.state = CONSTANTS.STATE.DASH_BURST; e.c.combat.stateTimer = CONSTANTS.TIMING.BURST_DUR; e.c.combat.cooldowns.burst = 200;
        const bAngle = Math.atan2(target.c.transform.pos.y - e.c.transform.pos.y, target.c.transform.pos.x - e.c.transform.pos.x);
        e.c.velocity = new Vector(Math.cos(bAngle)*CONSTANTS.SPEED.BURST*0.8, Math.sin(bAngle)*CONSTANTS.SPEED.BURST*0.8);
    },
    'HYPER_ATK': (e, target) => {
        if(e.c.combat.cooldowns.burst > 0) return;
        Game.events.emit('shake', 15);
        e.c.combat.state = CONSTANTS.STATE.DASH_HYPER; e.c.combat.stateTimer = CONSTANTS.TIMING.BURST_DUR; e.c.combat.cooldowns.burst = 400;
        const hAngle = Math.atan2(target.c.transform.pos.y - e.c.transform.pos.y, target.c.transform.pos.x - e.c.transform.pos.x);
        e.c.velocity = new Vector(Math.cos(hAngle)*CONSTANTS.SPEED.HYPER*0.8, Math.sin(hAngle)*CONSTANTS.SPEED.HYPER*0.8);
    },
    'PARRY': (e) => {
        if(e.c.combat.cooldowns.parry > 0) return;
        e.c.combat.state = CONSTANTS.STATE.PARRY; e.c.combat.stateTimer = CONSTANTS.TIMING.PARRY_DUR; e.c.combat.cooldowns.parry = 180;
    }
};

const BEHAVIOR_SETS = {
    AGGRESSIVE: [
        { type: 'GET_LOOT', weight: 3.0, range: [0, 400] }, 
        { type: 'PARRY', weight: 0.1, cd: 'parry', range: [0, 100] },
        { type: 'SPRINT_ATK', weight: 1.0, cd: 'burst', range: [50, 400] },
        { type: 'APPROACH', weight: 0.5, range: [200, 2000] }
    ],
    DEFENSIVE: [
        { type: 'GET_LOOT', weight: 2.0, range: [0, 300] },
        { type: 'PARRY', weight: 0.8, cd: 'parry', range: [0, 150] },
        { type: 'RUN', weight: 0.6, range: [0, 200] },
        { type: 'BURST_ATK', weight: 0.4, cd: 'burst', range: [150, 400] },
        { type: 'APPROACH', weight: 0.2, range: [400, 2000] }
    ],
    BOSS: [
        { type: 'GET_LOOT', weight: 5.0, range: [0, 600] },
        { type: 'HYPER_ATK', weight: 0.2, cd: 'burst', range: [0, 800] },
        { type: 'PARRY', weight: 0.6, cd: 'parry', range: [0, 120] },
        { type: 'BURST_ATK', weight: 0.8, cd: 'burst', range: [120, 500] },
        { type: 'APPROACH', weight: 0.3, range: [100, 2000] }
    ]
};

const BLUEPRINTS = {
    PLAYER_P1: { tags: ['player', 'p1'], stats: { hp: 100, maxHp: 100, speed: 1, radius: 16 }, render: { color: CONSTANTS.COLORS.P1 }, input: { id: 'p1' } },
    PLAYER_P2: { tags: ['player', 'p2'], stats: { hp: 100, maxHp: 100, speed: 1, radius: 16 }, render: { color: CONSTANTS.COLORS.P2 }, input: { id: 'p2' } },
    ENEMY_NORMAL: { stats: { hp: 100, speed: 1, radius: 16 }, behavior: "AGGRESSIVE", traits: ["BRAVE"], variants: [PALETTE.RED, PALETTE.ORANGE, PALETTE.LIME, PALETTE.BLUE] },
    ENEMY_ELITE: { stats: { hp: 800, speed: 0.8, radius: 20 }, behavior: "DEFENSIVE", traits: ["CAUTIOUS"], variants: [PALETTE.SLATE, PALETTE.IRON, PALETTE.SHADOW, PALETTE.STEEL] },
    ENEMY_BOSS: { stats: { hp: 5000, speed: 0.6, radius: 40 }, behavior: "BOSS", traits: ["BOSS"], variants: [PALETTE.PURPLE, PALETTE.CRIMSON] }
};

const LOOT_REGISTRY = {
    HEAL: { color: PALETTE.GREEN, text: "HP UP", mod: { type: 'STAT', key: 'hp', val: 50, op: 'add' } },
    GOD:  { color: PALETTE.YELLOW, text: "GOD MODE", mod: { type: 'STATUS', key: 'invincibleTimer', val: CONSTANTS.TIMING.GOD } },
    LIFE: { color: PALETTE.CYAN, text: "LIFE-UP", mod: { type: 'SPECIAL', key: 'life', val: 1 } }
};

// --- CORE UTILS ---
class Vector {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { this.x += v.x; this.y += v.y; return this; }
    sub(v) { this.x -= v.x; this.y -= v.y; return this; }
    multiply(s) { this.x *= s; this.y *= s; return this; }
    magnitude() { return Math.sqrt(this.x ** 2 + this.y ** 2); }
    normalize() { const m = this.magnitude(); if (m !== 0) this.multiply(1 / m); return this; }
    clone() { return new Vector(this.x, this.y); }
    static distance(v1, v2) { return Math.sqrt((v1.x - v2.x) ** 2 + (v1.y - v2.y) ** 2); }
    static subtract(v1, v2) { return new Vector(v1.x - v2.x, v1.y - v2.y); }
}

const ColorUtils = {
    hexToHSL: (H) => {
        let r=0,g=0,b=0; if(H.length==4){r="0x"+H[1]+H[1];g="0x"+H[2]+H[2];b="0x"+H[3]+H[3];}else if(H.length==7){r="0x"+H[1]+H[2];g="0x"+H[3]+H[4];b="0x"+H[5]+H[6];}
        r/=255;g/=255;b/=255; let cmin=Math.min(r,g,b), cmax=Math.max(r,g,b), delta=cmax-cmin, h=0, s=0, l=0;
        if(delta==0)h=0;else if(cmax==r)h=((g-b)/delta)%6;else if(cmax==g)h=(b-r)/delta+2;else h=(r-g)/delta+4;
        h=Math.round(h*60);if(h<0)h+=360;l=(cmax+cmin)/2;s=delta==0?0:delta/(1-Math.abs(2*l-1)); return {h:h,s:s*100,l:l*100};
    },
    HSLToHex: (h,s,l) => {
        s/=100;l/=100; let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
        if(0<=h&&h<60){r=c;g=x;b=0;}else if(60<=h&&h<120){r=x;g=c;b=0;}else if(120<=h&&h<180){r=0;g=c;b=x;}else if(180<=h&&h<240){r=0;g=x;b=c;}else if(240<=h&&h<300){r=x;g=0;b=c;}else if(300<=h&&h<360){r=c;g=0;b=x;}
        r=Math.round((r+m)*255).toString(16).padStart(2,'0');g=Math.round((g+m)*255).toString(16).padStart(2,'0');b=Math.round((b+m)*255).toString(16).padStart(2,'0'); return "#"+r+g+b;
    },
    getStateColor: (baseHex, state) => {
        const hsl = ColorUtils.hexToHSL(baseHex);
        switch (state) {
            case CONSTANTS.STATE.STUN: return PALETTE.GREY;
            case CONSTANTS.STATE.SPRINT: return ColorUtils.HSLToHex(hsl.h, 100, 60);
            case CONSTANTS.STATE.CHARGE: return ColorUtils.HSLToHex(hsl.h, 100, 20);
            case CONSTANTS.STATE.READY_BURST: return ColorUtils.HSLToHex(hsl.h, 90, 80);
            case CONSTANTS.STATE.READY_HYPER: const p = 80 + Math.sin(Date.now() / 40) * 20; return ColorUtils.HSLToHex(hsl.h, 30, p);
            case CONSTANTS.STATE.DASH_BURST: case CONSTANTS.STATE.DASH_HYPER: case CONSTANTS.STATE.PARRY: return PALETTE.WHITE;
            default: return baseHex;
        }
    }
};

class EventBus { constructor() { this.l = {}; } on(e, c) { (this.l[e] = this.l[e] || []).push(c); } emit(e, d) { if (this.l[e]) this.l[e].forEach(c => c(d)); } }

// --- ECS CORE ---
class Entity {
    constructor(id) { this.id = id; this.c = {}; this.tags = new Set(); this.active = true; }
    addComponent(name, data) { this.c[name] = data; return this; }
    has(name) { return !!this.c[name]; }
    hasTag(tag) { return this.tags.has(tag); }
}

class EntityManager {
    constructor() { this.entities = []; this.idCounter = 0; }
    create() { const e = new Entity(++this.idCounter); this.entities.push(e); return e; }
    destroy(e) { e.active = false; }
    cleanup() { this.entities = this.entities.filter(e => e.active); }
    query(compNames) { return this.entities.filter(e => e.active && compNames.every(name => e.has(name))); }
    queryTag(tag) { return this.entities.filter(e => e.active && e.hasTag(tag)); }
}

const EntityFactory = {
    createFromBlueprint: (type, x, y) => {
        const e = Game.world.create();
        const bp = BLUEPRINTS[type];
        if(!bp && type.includes('ENEMY')) return EntityFactory.createEnemy(type, x, y); 
        
        e.c.transform = { pos: new Vector(x, y), rot: 0 };
        e.c.velocity = new Vector(0,0);
        if (bp.tags) bp.tags.forEach(t => e.tags.add(t));
        if (bp.stats) e.addComponent('stats', { ...bp.stats, extraLife: 0 });
        if (bp.render) e.addComponent('render', { ...bp.render, baseColor: bp.render.color, trail: [] });
        if (bp.input) e.addComponent('input', { ...bp.input, chargeTime: 0 });
        e.addComponent('combat', { state: CONSTANTS.STATE.IDLE, stateTimer: 0, cooldowns: { parry: 0, burst: 0 }, invincibleTimer: 0 });
        return e;
    },
    
    createEnemy: (categoryKey, x, y) => {
        const e = Game.world.create();
        const config = BLUEPRINTS[categoryKey];
        const variantColor = config.variants[Math.floor(Math.random() * config.variants.length)];
        
        e.tags.add('enemy'); e.tags.add(categoryKey); 
        e.c.transform = { pos: new Vector(x, y), rot: 0 };
        e.c.velocity = new Vector(0,0);
        e.addComponent('stats', { ...config.stats, maxHp: config.stats.hp, extraLife: 0 });
        e.addComponent('render', { baseColor: variantColor, trail: [] });
        e.addComponent('combat', { state: CONSTANTS.STATE.IDLE, stateTimer: 0, cooldowns: { parry: 0, burst: 0 }, invincibleTimer: 0 });
        // Traits and Memory for logic decoupling
        e.addComponent('ai', { behavior: BEHAVIOR_SETS[config.behavior], traits: config.traits || [], memory: { hitsTaken: 0, playerAggro: 0 } });
        return e;
    },

    createPickup: (x, y, typeKey) => {
        const e = Game.world.create();
        e.tags.add('pickup');
        e.c.transform = { pos: new Vector(x, y), rot: 0 };
        e.c.velocity = new Vector(0,0);
        // Modifiers are now passed as data, not direct functions
        e.addComponent('pickup', { type: typeKey, life: 1200, data: LOOT_REGISTRY[typeKey] });
        e.addComponent('render', { baseColor: LOOT_REGISTRY[typeKey].color });
        return e;
    },

    createParticle: (x, y, color, speed) => {
        Game.particles.push({ active:true, pos: new Vector(x,y), vel: new Vector(Math.cos(Math.random()*6.28)*speed, Math.sin(Math.random()*6.28)*speed), color: color, life: 1, size: Math.random()*4+2 });
    }
};

// --- SYSTEMS ---

class InputSystem {
    constructor() {
        this.scheme = "MOUSE"; 
        this.rawInputs = { p1: { move: new Vector(0,0), action: false, momentum: false }, p2: { move: new Vector(0,0), action: false, momentum: false } };
        this.keys = {}; this.touchData = {}; this.mouse = { x: 0, y: 0 }; this.menuTimer = 0;
        this.setupListeners();
    }

    setupListeners() {
        window.addEventListener('keydown', e => {
            if (Game.state.mode === 'PAUSE' || Game.state.mode === 'OVER') {
                 const ui = Game.ui; e.preventDefault();
                 if(['ArrowUp','KeyW'].includes(e.code)) ui.navFocus(-1);
                 if(['ArrowDown','KeyS'].includes(e.code)) ui.navFocus(1);
                 if(['Enter','Space'].includes(e.code)) ui.triggerFocus();
            } else this.keys[e.code] = true;
        });
        window.addEventListener('keyup', e => this.keys[e.code] = false);
        window.addEventListener('mousemove', e => { if (this.scheme === 'MOUSE') { this.mouse.x = e.clientX; this.mouse.y = e.clientY; } });
        window.addEventListener('mousedown', e => { if (this.scheme === 'MOUSE' && Game.state.mode === "PLAY") { if (e.button === 0) this.rawInputs.p1.momentum = true; if (e.button === 2) this.rawInputs.p1.action = true; } });
        window.addEventListener('mouseup', e => { if (this.scheme === 'MOUSE') { if (e.button === 0) this.rawInputs.p1.momentum = false; if (e.button === 2) this.rawInputs.p1.action = false; } });
        window.addEventListener('contextmenu', e => e.preventDefault());
    }

    update() {
        if (Game.state.mode !== 'PLAY') return;
        this.pollGamepads();
        this.mapInputs();

        Game.world.query(['input', 'combat', 'velocity']).forEach(e => {
            if (e.c.combat.state === CONSTANTS.STATE.STUN || e.c.combat.state === CONSTANTS.STATE.PARRY || 
                (e.c.combat.state === CONSTANTS.STATE.DASH_BURST || e.c.combat.state === CONSTANTS.STATE.DASH_HYPER)) return;

            const inp = this.rawInputs[e.c.input.id];
            const p = e.c; 

            if (inp.action) {
                p.input.chargeTime++; p.velocity.multiply(0.85);
                if (p.input.chargeTime > CONSTANTS.TIMING.CHARGE_HYPER) { 
                    p.combat.state = CONSTANTS.STATE.READY_HYPER; 
                    if (p.input.chargeTime % 5 == 0) Game.events.emit('particle', {x:p.transform.pos.x, y:p.transform.pos.y, col:PALETTE.WHITE, spd:-8}); 
                } else if (p.input.chargeTime > CONSTANTS.TIMING.CHARGE_BURST) { 
                    p.combat.state = CONSTANTS.STATE.READY_BURST; 
                } else { 
                    p.combat.state = CONSTANTS.STATE.CHARGE; 
                }
            } else {
                if (p.combat.state >= CONSTANTS.STATE.CHARGE && p.combat.state <= CONSTANTS.STATE.READY_HYPER) {
                    if (p.combat.cooldowns.burst <= 0 && p.input.chargeTime > CONSTANTS.TIMING.CHARGE_BURST) {
                        const isHyper = p.input.chargeTime > CONSTANTS.TIMING.CHARGE_HYPER;
                        const angle = (this.scheme === 'MOUSE' && p.input.id === 'p1') ? Math.atan2(this.mouse.y - p.transform.pos.y, this.mouse.x - p.transform.pos.x) : (inp.move.magnitude()>0.1 ? Math.atan2(inp.move.y, inp.move.x) : Math.atan2(p.velocity.y, p.velocity.x));
                        p.combat.state = isHyper ? CONSTANTS.STATE.DASH_HYPER : CONSTANTS.STATE.DASH_BURST; 
                        p.combat.stateTimer = CONSTANTS.TIMING.BURST_DUR; 
                        p.combat.cooldowns.burst = CONSTANTS.TIMING.BURST_CD;
                        const spd = isHyper ? CONSTANTS.SPEED.HYPER : CONSTANTS.SPEED.BURST;
                        p.velocity = new Vector(Math.cos(angle)*spd, Math.sin(angle)*spd);
                        Game.events.emit('shake', isHyper?30:15); Game.events.emit('flash', isHyper?0.5:0.2); 
                        Game.events.emit('particle_burst', {x:p.transform.pos.x, y:p.transform.pos.y, col:ColorUtils.getStateColor(p.render.baseColor, p.combat.state), n:isHyper?50:25});
                    } else if (p.combat.cooldowns.parry <= 0 && p.input.chargeTime <= CONSTANTS.TIMING.CHARGE_BURST) {
                        p.combat.state = CONSTANTS.STATE.PARRY; 
                        p.combat.stateTimer = CONSTANTS.TIMING.PARRY_DUR; 
                        p.combat.cooldowns.parry = CONSTANTS.TIMING.PARRY_CD;
                        Game.events.emit('particle_burst', {x:p.transform.pos.x, y:p.transform.pos.y, col:PALETTE.WHITE, n:10}); Game.events.emit('shake', 5);
                    } else p.combat.state = CONSTANTS.STATE.IDLE;
                    p.input.chargeTime = 0;
                } else {
                    const speed = inp.momentum ? CONSTANTS.SPEED.MOMENTUM : CONSTANTS.SPEED.NORMAL;
                    p.combat.state = inp.momentum ? CONSTANTS.STATE.SPRINT : CONSTANTS.STATE.MOVE;
                    let moveVec = new Vector(0,0);
                    if (this.scheme === 'MOUSE' && p.input.id === 'p1') { 
                        if (Vector.distance(p.transform.pos, this.mouse) > 10) moveVec = Vector.subtract(this.mouse, p.transform.pos); 
                    } else { 
                        if (inp.move.magnitude() > 0.1) moveVec = inp.move; 
                    }
                    if (moveVec.magnitude() > 0) p.velocity.add(moveVec.normalize().multiply(speed)); else p.combat.state = CONSTANTS.STATE.IDLE;
                }
            }
        });
    }

    pollGamepads() {
        const gps = navigator.getGamepads ? navigator.getGamepads() : [];
        const mapPad = (pid, idx) => {
            const gp = gps[idx];
            if(gp) {
                this.rawInputs[pid].move.x = Math.abs(gp.axes[0]) > 0.1 ? gp.axes[0] : 0;
                this.rawInputs[pid].move.y = Math.abs(gp.axes[1]) > 0.1 ? gp.axes[1] : 0;
                this.rawInputs[pid].action = gp.buttons[0].pressed || gp.buttons[2].pressed; 
                this.rawInputs[pid].momentum = gp.buttons[1].pressed || gp.buttons[3].pressed;
            } else { this.rawInputs[pid].move = new Vector(0,0); this.rawInputs[pid].action=false; this.rawInputs[pid].momentum=false; }
        };
        if(this.scheme === 'GAMEPAD') {
            mapPad('p1', 0);
            if(Game.state.subMode === 'COOP') mapPad('p2', 1);
            else if (gps[1]) mapPad('p1', 1); 
        }
    }

    mapInputs() {
        if (this.scheme === 'KEYBOARD') {
            const map = (id,u,d,l,r,a,m) => { this.rawInputs[id].move.x=(this.keys[r]?1:0)-(this.keys[l]?1:0); this.rawInputs[id].move.y=(this.keys[d]?1:0)-(this.keys[u]?1:0); this.rawInputs[id].action=this.keys[a]; this.rawInputs[id].momentum=this.keys[m]; }
            map('p1','KeyW','KeyS','KeyA','KeyD','KeyZ','KeyX'); map('p2','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyK','KeyL');
        } else if (this.scheme === 'TOUCH') {
            ['p1','p2'].forEach(id=>{let s=this.touchData[`stick-${id}`];if(s){this.rawInputs[id].move.x=s.x;this.rawInputs[id].move.y=s.y;} this.rawInputs[id].action=this.touchData[`action-${id}`]; this.rawInputs[id].momentum=this.touchData[`momentum-${id}`];});
        }
    }
    
    setScheme(s) {
        this.scheme = s;
        document.getElementById("btn-input-mouse").classList.toggle('active', s === 'MOUSE');
        document.getElementById("btn-input-key").classList.toggle('active', s === 'KEYBOARD');
        document.getElementById("btn-input-touch").classList.toggle('active', s === 'TOUCH');
        document.getElementById("btn-input-pad").classList.toggle('active', s === 'GAMEPAD');
        Game.ui.updateControlsDesc(); this.setupTouchUI();
    }
    setupTouchUI() {
        const ui = document.getElementById("touch-layer"); ui.innerHTML = ''; ui.style.display = this.scheme === 'TOUCH' ? 'block' : 'none';
        if (this.scheme !== 'TOUCH') return;
        const add = (id, type, r, rot) => {
            const b = document.createElement('div'); b.className = `touch-pad ${type==='s'?'stick-base':(type==='a'?'btn-action':'btn-sprint')}`;
            if(type==='s') { b.style.left='30px'; const n=document.createElement('div'); n.className='stick-nub'; b.appendChild(n); 
                let o=null; b.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches){if(o&&t.identifier===o.id){let dx=t.clientX-o.x,dy=t.clientY-o.y,d=Math.min(50,Math.sqrt(dx*dx+dy*dy)),a=Math.atan2(dy,dx); n.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`; let ox=Math.cos(a)*(d/50),oy=Math.sin(a)*(d/50); if(rot){ox*=-1;oy*=-1;} this.touchData[`stick-${id}`]={x:ox,y:oy};}}});
                b.addEventListener('touchstart',e=>{e.preventDefault();let r=b.getBoundingClientRect();o={x:r.left+r.width/2,y:r.top+r.height/2,id:e.changedTouches[0].identifier};this.touchData[`stick-${id}`]={x:0,y:0};});
                b.addEventListener('touchend',e=>{o=null;n.style.transform=`translate(-50%,-50%)`;this.touchData[`stick-${id}`]={x:0,y:0};});
            } else { b.innerText=type==='a'?'ATK':'SPD'; b.style.right=r+'px'; b.addEventListener('touchstart',e=>{e.preventDefault();this.touchData[`${type==='a'?'action':'momentum'}-${id}`]=true;b.classList.add('active')}); b.addEventListener('touchend',e=>{e.preventDefault();this.touchData[`${type==='a'?'action':'momentum'}-${id}`]=false;b.classList.remove('active')}); }
            b.style[rot?'top':'bottom']='30px'; if(rot) b.style.transform="rotate(180deg)"; ui.appendChild(b);
        };
        add('p1','s',0,false); add('p1','a',30,false); add('p1','m',140,false);
        if(Game.state.subMode==='COOP') { add('p2','s',0,true); add('p2','a',30,true); add('p2','m',140,true); }
    }
}

class AISystem {
    update() {
        const players = Game.world.queryTag('player');
        const pickups = Game.world.queryTag('pickup');
        if (players.length === 0) return;

        Game.world.query(['ai', 'combat']).forEach(me => {
            if (me.c.combat.state === CONSTANTS.STATE.STUN || 
                (me.c.combat.state >= CONSTANTS.STATE.DASH_BURST && me.c.combat.state <= CONSTANTS.STATE.DASH_HYPER) || 
                me.c.combat.state === CONSTANTS.STATE.PARRY) return;
            
            const playerTarget = players.reduce((p, c) => Vector.distance(me.c.transform.pos, p.c.transform.pos) < Vector.distance(me.c.transform.pos, c.c.transform.pos) ? p : c);
            let lootTarget = null;
            if (pickups.length > 0) {
                lootTarget = pickups.reduce((p, c) => Vector.distance(me.c.transform.pos, p.c.transform.pos) < Vector.distance(me.c.transform.pos, c.c.transform.pos) ? p : c);
            }

            // DYNAMIC TRAIT LOGIC: Adjust weights based on memory
            const weightedBehaviors = me.c.ai.behavior.map(b => {
                let w = b.weight;
                if (me.c.ai.traits.includes("BRAVE") && me.c.ai.memory.hitsTaken > 0) {
                    if (b.type === 'SPRINT_ATK' || b.type === 'APPROACH') w *= 2.5; // Enrage on hit
                }
                if (me.c.ai.traits.includes("CAUTIOUS") && me.c.ai.memory.hitsTaken > 0) {
                    if (b.type === 'PARRY' || b.type === 'RUN') w *= 2.0; // Turtle on hit
                }
                return { ...b, weight: w };
            });

            const validMoves = weightedBehaviors.filter(b => {
                const target = (b.type === 'GET_LOOT') ? lootTarget : playerTarget;
                if (!target) return false;
                const dist = Vector.distance(me.c.transform.pos, target.c.transform.pos);
                if (b.range && (dist < b.range[0] || dist > b.range[1])) return false;
                if (b.cd && me.c.combat.cooldowns[b.cd] > 0) return false;
                return true;
            });

            const totalWeight = validMoves.reduce((sum, b) => sum + b.weight, 0);
            let r = Math.random() * totalWeight;
            let selected = null;
            for(const move of validMoves) {
                r -= move.weight;
                if (r <= 0) { selected = move; break; }
            }
            
            if (selected) {
                const finalTarget = (selected.type === 'GET_LOOT') ? lootTarget : playerTarget;
                ACTION_REGISTRY[selected.type](me, finalTarget);
            } else {
                ACTION_REGISTRY['APPROACH'](me, playerTarget);
            }
        });
    }
}

class MovementSystem {
    update(dt) {
        Game.world.query(['velocity', 'transform']).forEach(e => {
            const p = e.c;
            
            if (e.has('combat')) {
                p.combat.cooldowns.burst = Math.max(0, p.combat.cooldowns.burst - 1);
                p.combat.cooldowns.parry = Math.max(0, p.combat.cooldowns.parry - 1);
                p.combat.invincibleTimer = Math.max(0, p.combat.invincibleTimer - 1);
                p.combat.stateTimer = Math.max(0, p.combat.stateTimer - 1);

                const s = p.combat.state;
                if (s === CONSTANTS.STATE.STUN) { p.velocity.multiply(0.9); if (p.combat.stateTimer <= 0) p.combat.state = CONSTANTS.STATE.IDLE; }
                else if (s === CONSTANTS.STATE.DASH_BURST || s === CONSTANTS.STATE.DASH_HYPER) { 
                    p.velocity.multiply(0.98); p.combat.invincibleTimer = 2; 
                    if (p.combat.stateTimer <= 0) { p.combat.state = CONSTANTS.STATE.IDLE; p.velocity.multiply(0.5); } 
                } 
                else if (s === CONSTANTS.STATE.PARRY) { p.velocity.multiply(0.8); p.combat.invincibleTimer = 2; if (p.combat.stateTimer <= 0) p.combat.state = CONSTANTS.STATE.IDLE; }
                else { p.velocity.multiply(Game.config.FRICTION); }
            }

            p.transform.pos.add(p.velocity);

            const b = Game.config.BOUNDS;
            if (p.transform.pos.x < b) { p.transform.pos.x = b; p.velocity.x *= -0.8; }
            if (p.transform.pos.x > Game.width - b) { p.transform.pos.x = Game.width - b; p.velocity.x *= -0.8; }
            if (p.transform.pos.y < b) { p.transform.pos.y = b; p.velocity.y *= -0.8; }
            if (p.transform.pos.y > Game.height - b) { p.transform.pos.y = Game.height - b; p.velocity.y *= -0.8; }
        });
        
        Game.world.queryTag('pickup').forEach(p => { p.c.transform.rot += 0.05; p.c.pickup.life--; if(p.c.pickup.life<=0) Game.world.destroy(p); });

        if(Game.state.subMode === 'COOP') { 
            const ps = Game.world.queryTag('player');
            if(ps.length > 1) {
                if(Vector.distance(ps[0].c.transform.pos, ps[1].c.transform.pos) < 42) {
                    const push = Vector.subtract(ps[0].c.transform.pos, ps[1].c.transform.pos).normalize().multiply(3);
                    ps[0].c.velocity.add(push); ps[1].c.velocity.sub(push);
                }
            }
        }
    }
}

class CombatSystem {
    getTier(e) {
        if (!e.has('combat')) return 0;
        const s = e.c.combat.state;
        if (s === CONSTANTS.STATE.DASH_HYPER) return 3;
        if (s === CONSTANTS.STATE.DASH_BURST) return 2;
        if (s === CONSTANTS.STATE.SPRINT) return 1;
        return 0;
    }

    update() {
        const combatants = Game.world.query(['combat', 'stats']);
        const enemies = Game.world.queryTag('enemy');
        const pickups = Game.world.queryTag('pickup');

        combatants.forEach(e => {
            enemies.forEach(other => {
                if (e !== other && Vector.distance(e.c.transform.pos, other.c.transform.pos) < 42) {
                    this.resolveCollision(e, other);
                }
            });
            for(let i=pickups.length-1; i>=0; i--) {
                const p = pickups[i];
                if (Vector.distance(e.c.transform.pos, p.c.transform.pos) < 30) {
                    Game.events.emit('loot_pickup', { target: e, pickup: p });
                }
            }
        });
    }

    resolveCollision(e1, e2) {
        if (e1.c.combat.state === CONSTANTS.STATE.STUN) return Game.events.emit('entity_hit', { attacker: e2, victim: e1, tier: this.getTier(e2) });
        if (e2.c.combat.state === CONSTANTS.STATE.STUN) return Game.events.emit('entity_hit', { attacker: e1, victim: e2, tier: this.getTier(e1) });
        if (e1.c.combat.state === CONSTANTS.STATE.PARRY) return Game.events.emit('entity_parry', { blocker: e1, attacker: e2, tier: this.getTier(e1) });
        if (e2.c.combat.state === CONSTANTS.STATE.PARRY) return Game.events.emit('entity_parry', { blocker: e2, attacker: e1, tier: this.getTier(e2) });

        const t1 = this.getTier(e1);
        const t2 = this.getTier(e2);

        if (t1 > 0 && t2 > 0) {
            if (t1 === t2) {
                Game.events.emit('clash', { e1, e2 });
            } else if (t1 > t2) Game.events.emit('entity_hit', { attacker: e1, victim: e2, tier: t1 }); 
            else Game.events.emit('entity_hit', { attacker: e2, victim: e1, tier: t2 });
            return;
        }
        if (t1 > 0) Game.events.emit('entity_hit', { attacker: e1, victim: e2, tier: t1 });
        else if (t2 > 0) Game.events.emit('entity_hit', { attacker: e2, victim: e1, tier: t2 });
        else { 
            const push=Vector.subtract(e1.c.transform.pos, e2.c.transform.pos).normalize().multiply(4); 
            e1.c.velocity.add(push); e2.c.velocity.sub(push); 
        }
    }
}

// --- LOGIC SYSTEM (EVENT HANDLER) ---
class LogicSystem {
    constructor() {
        // 1. HIT LOGIC
        Game.events.on('entity_hit', ({ attacker, victim, tier }) => {
            if (victim.c.combat.state !== CONSTANTS.STATE.STUN && victim.c.combat.invincibleTimer > 0) return;
            
            const dmg = tier===3 ? CONSTANTS.DAMAGE.HYPER : (tier===2 ? CONSTANTS.DAMAGE.BURST : (tier===1 ? CONSTANTS.DAMAGE.MOMENTUM : CONSTANTS.DAMAGE.NORMAL));
            victim.c.stats.hp -= dmg;
            victim.c.combat.state = CONSTANTS.STATE.IDLE;
            if(victim.has('input')) victim.c.input.chargeTime = 0;

            // Update Memory/Traits
            if(victim.has('ai')) {
                victim.c.ai.memory.hitsTaken++;
                if (victim.hasTag('BOSS') && victim.c.stats.hp < victim.c.stats.maxHp * 0.5) {
                    Game.events.emit('boss_phase_change', { boss: victim, phase: 2 });
                }
            }

            // Physics Recoil
            const force = tier===3?80:(tier===2?40:(tier===1?20:10));
            const k = Vector.subtract(victim.c.transform.pos, attacker.c.transform.pos).normalize().multiply(force);
            victim.c.velocity = k; attacker.c.velocity.add(k.clone().multiply(0.2));

            // FX
            Game.state.hitStopTimer = (tier >= 2) ? 4 : 0; 
            Game.events.emit('shake', force/2); 
            if(tier >= 2) { Game.state.chromaticAberration = 10; if(Game.config.FX.FLASH) Game.state.invertedFrame = true; } 
            Game.events.emit('particle_burst',{x:victim.c.transform.pos.x, y:victim.c.transform.pos.y, col:victim.c.render.baseColor, n:10+force/2});

            if (victim.c.stats.hp <= 0) Game.events.emit('entity_kill', { victim, attacker });
            else if (victim.hasTag('player')) { Game.state.combo=0; }
        });

        // 2. KILL LOGIC
        Game.events.on('entity_kill', ({ victim, attacker }) => {
             if (victim.c.stats.extraLife > 0) {
                Game.events.emit('entity_revive', { entity: victim });
                return;
            }
            Game.world.destroy(victim);
            Game.state.hitStopTimer = 2; Game.state.streak++; Game.state.combo++; 
            
            let scoreVal = 100;
            if (victim.hasTag('ENEMY_BOSS')) scoreVal = 5000;
            else if (victim.hasTag('ENEMY_ELITE')) scoreVal = 1000;
            Game.state.score += scoreVal * (1 + Math.floor(Game.state.combo/5)*2);
            
            if(!victim.hasTag('ENEMY_NORMAL')) { 
                const cat = victim.hasTag('ENEMY_BOSS') ? "BOSS" : "ELITE";
                Game.state.hitStopTimer = 15; Game.events.emit('shake', 100); Game.events.emit('flash', 0.8); 
            }
            if(Game.config.FX.BLOOD) { for(let i=0;i<15;i++) Game.entities.blood.push({position:new Vector(victim.c.transform.pos.x, victim.c.transform.pos.y), velocity:new Vector(Math.cos(Math.random()*6.28)*Math.random()*10, Math.sin(Math.random()*6.28)*Math.random()*10), color:victim.c.render.baseColor, size:Math.random()*12+6, rotation:Math.random()*6, life:1000}); }
        });

        // 3. PARRY LOGIC
        Game.events.on('entity_parry', ({ blocker, attacker, tier }) => {
            const recoil = Vector.subtract(attacker.c.transform.pos, blocker.c.transform.pos).normalize().multiply(30);
            attacker.c.velocity = recoil; 
            attacker.c.combat.state = CONSTANTS.STATE.STUN; 
            attacker.c.combat.stateTimer = CONSTANTS.TIMING.STUN; 
            attacker.c.combat.invincibleTimer = 0;
            
            blocker.c.velocity = recoil.clone().multiply(-0.2); 
            blocker.c.combat.invincibleTimer = 20; Game.state.hitStopTimer = 5;
            
            Game.events.emit('particle_burst',{x:attacker.c.transform.pos.x, y:attacker.c.transform.pos.y, col:PALETTE.WHITE, n:30}); 
            
            if(tier >= 2) { 
                Game.events.emit('flash',0.5); Game.events.emit('shake',30); 
                attacker.c.combat.stateTimer *= 1.5; 
            }
        });

        // 4. CLASH LOGIC
        Game.events.on('clash', ({ e1, e2 }) => {
            Game.state.hitStopTimer=4; Game.events.emit('shake',30); Game.events.emit('flash',0.3);
            const d = Vector.subtract(e1.c.transform.pos, e2.c.transform.pos).normalize();
            e1.c.velocity=d.clone().multiply(40); e2.c.velocity=d.clone().multiply(-40);
            e1.c.combat.state=e2.c.combat.state=CONSTANTS.STATE.IDLE; 
            e1.c.combat.invincibleTimer=e2.c.combat.invincibleTimer=10;
            const mid = Vector.subtract(e2.c.transform.pos, e1.c.transform.pos).multiply(0.5).add(e1.c.transform.pos);
            Game.events.emit('particle_burst',{x:mid.x, y:mid.y, col:PALETTE.WHITE, n:40});
        });

        // 5. LOOT LOGIC (MODIFIERS)
        Game.events.on('loot_pickup', ({ target, pickup }) => {
            Game.events.emit('particle_burst', {x:pickup.c.transform.pos.x, y:pickup.c.transform.pos.y, col:pickup.c.render.baseColor, n:30});
            
            const mod = pickup.c.pickup.data.mod;
            if (mod.type === 'STAT') {
                target.c.stats[mod.key] = Math.min(target.c.stats[mod.key] + mod.val, target.c.stats.maxHp);
            } else if (mod.type === 'STATUS') {
                target.c.combat[mod.key] = mod.val;
            } else if (mod.type === 'SPECIAL') {
                if (target.hasTag('player')) {
                    if (target.c.stats.extraLife < 1) target.c.stats.extraLife++;
                    else target.c.stats.hp = target.c.stats.maxHp;
                }
            }
            Game.world.destroy(pickup);
        });

        // 6. REVIVE LOGIC
        Game.events.on('entity_revive', ({ entity }) => {
            entity.c.stats.extraLife--; entity.c.stats.hp = entity.c.stats.maxHp; entity.c.combat.invincibleTimer = 180;
            Game.state.hitStopTimer=30; Game.events.emit('shake',50); Game.events.emit('flash',1); 
            Game.events.emit('particle_burst',{x:entity.c.transform.pos.x, y:entity.c.transform.pos.y, col:LOOT_REGISTRY.LIFE.color, n:50}); 
        });
    }
}

class RenderSystem {
    constructor() { this.ctx = document.getElementById("gameCanvas").getContext("2d"); }
    draw() {
        if (Game.state.invertedFrame) { this.ctx.fillStyle = PALETTE.WHITE; this.ctx.fillRect(0,0,Game.width,Game.height); return; }
        this.ctx.fillStyle = "#000"; this.ctx.fillRect(0, 0, Game.width, Game.height);
        this.ctx.save();
        const shakeX = (Math.random() - 0.5) * Game.state.shakeIntensity, shakeY = (Math.random() - 0.5) * Game.state.shakeIntensity;
        this.ctx.translate(shakeX, shakeY);
        if(Game.config.FX.GRID) this.drawGrid();
        
        Game.entities.blood.forEach(b => { 
            this.ctx.save(); this.ctx.translate(b.position.x, b.position.y); this.ctx.rotate(b.rotation); 
            this.ctx.fillStyle = b.color; this.ctx.globalAlpha = 0.6; this.ctx.fillRect(-b.size/2, -b.size/2, b.size, b.size); this.ctx.restore(); 
        });

        if (Game.state.chromaticAberration > 1) {
            this.ctx.save(); this.ctx.globalCompositeOperation = "screen"; this.ctx.translate(Game.state.chromaticAberration, 0); 
            this.drawAllEntities(); this.ctx.translate(-Game.state.chromaticAberration*2, 0); this.drawAllEntities(); this.ctx.restore();
        }
        this.drawAllEntities();

        if (Game.state.flashOpacity > 0 && Game.config.FX.FLASH) { this.ctx.fillStyle = `rgba(255, 255, 255, ${Game.state.flashOpacity})`; this.ctx.fillRect(-shakeX, -shakeY, Game.width, Game.height); }
        
        Game.entities.texts.forEach(t => { 
            this.ctx.globalAlpha = Math.max(0, t.life); this.ctx.fillStyle = t.color; this.ctx.font = "30px VT323"; 
            this.ctx.shadowColor = t.color; this.ctx.shadowBlur = 10; this.ctx.fillText(t.str, t.position.x, t.position.y); this.ctx.shadowBlur=0; 
        });
        
        if (Game.state.subMode === 'SOLO' && Game.input.scheme === 'MOUSE') {
            const p1 = Game.world.queryTag('player')[0];
            if(p1) {
                this.ctx.strokeStyle = "rgba(255, 255, 255, 0.1)"; this.ctx.setLineDash([4, 4]); this.ctx.beginPath(); this.ctx.moveTo(p1.c.transform.pos.x, p1.c.transform.pos.y); this.ctx.lineTo(Game.input.mouse.x, Game.input.mouse.y); this.ctx.stroke(); this.ctx.setLineDash([]);
                this.ctx.fillStyle = PALETTE.CYAN; this.ctx.fillRect(Game.input.mouse.x - 4, Game.input.mouse.y - 4, 8, 8);
            }
        }
        this.ctx.restore();
        const grad = this.ctx.createRadialGradient(Game.width/2, Game.height/2, Game.height/2, Game.width/2, Game.height/2, Game.height);
        grad.addColorStop(0, "transparent"); grad.addColorStop(1, "rgba(0,0,0,0.8)"); this.ctx.fillStyle = grad; this.ctx.fillRect(0,0,Game.width,Game.height);
    }
    
    drawAllEntities() {
        Game.world.query(['pickup']).forEach(p => {
             this.ctx.save(); this.ctx.translate(p.c.transform.pos.x, p.c.transform.pos.y); this.ctx.rotate(p.c.transform.rot);
             this.ctx.fillStyle = p.c.render.baseColor; this.ctx.globalAlpha = Math.min(1, p.c.pickup.life / 60);
             this.ctx.beginPath(); this.ctx.moveTo(0, -10); this.ctx.lineTo(10, 0); this.ctx.lineTo(0, 10); this.ctx.lineTo(-10, 0); this.ctx.fill();
             if (Game.config.FX.GLOW) { this.ctx.shadowColor = p.c.render.baseColor; this.ctx.shadowBlur = 15; this.ctx.stroke(); }
             this.ctx.restore();
        });
        Game.particles.forEach(p => { this.ctx.globalAlpha = p.life; this.ctx.fillStyle = p.color; this.ctx.fillRect(p.pos.x, p.pos.y, p.size, p.size); });
        Game.world.queryTag('enemy').forEach(e => this.drawSingleEntity(e, 0));
        Game.world.queryTag('player').forEach(p => this.drawSingleEntity(p, Math.random() * (p.c.combat.state >= CONSTANTS.STATE.CHARGE && p.c.combat.state <= CONSTANTS.STATE.READY_HYPER ? 2 : 0), p.c.combat.state === CONSTANTS.STATE.PARRY));
    }

    drawSingleEntity(e, shakeOffset, showShield) {
        let color = ColorUtils.getStateColor(e.c.render.baseColor, e.c.combat.state);
        if (e.c.combat.invincibleTimer > 60 && e.c.combat.invincibleTimer % 10 < 5) color = LOOT_REGISTRY.GOD.color;
        
        this.ctx.save(); this.ctx.translate(e.c.transform.pos.x + shakeOffset, e.c.transform.pos.y + shakeOffset);
        
        if (Game.config.FX.GLOW && e.c.render.trail.length > 0) {
            e.c.render.trail.forEach((t, i) => { this.ctx.globalAlpha = i / 10; this.ctx.fillStyle = color; this.ctx.beginPath(); this.ctx.arc(t.x - e.c.transform.pos.x, t.y - e.c.transform.pos.y, e.c.stats.radius, 0, 2*Math.PI); this.ctx.fill(); });
            this.ctx.globalAlpha = 1;
        }
        const tier = Game.combat.getTier(e);
        if (tier >= 2 || (tier >= 1 && Game.config.FX.GLOW)) { 
            e.c.render.trail.push({x:e.c.transform.pos.x, y:e.c.transform.pos.y}); if(e.c.render.trail.length > 5) e.c.render.trail.shift(); 
        } else e.c.render.trail = [];

        if (showShield) { this.ctx.strokeStyle = PALETTE.WHITE; this.ctx.lineWidth = 3; this.ctx.beginPath(); this.ctx.arc(0, 0, e.c.stats.radius + 8, 0, 2 * Math.PI); this.ctx.stroke(); }
        if (e.c.stats.hp < 30 && Math.floor(Date.now() / 50) % 2 == 0) this.ctx.globalAlpha = 0.4;
        
        this.ctx.rotate(Math.atan2(e.c.velocity.y, e.c.velocity.x));
        const stretch = 1 + Math.min(e.c.velocity.magnitude() / 60, 0.8); this.ctx.scale(stretch, 1 / stretch);
        if (tier > 0 && Game.config.FX.GLOW && e.c.combat.state !== CONSTANTS.STATE.STUN) { this.ctx.shadowBlur = 20; this.ctx.shadowColor = color; }
        
        this.ctx.fillStyle = color; this.ctx.beginPath(); this.ctx.arc(0, 0, e.c.stats.radius, 0, 2 * Math.PI); this.ctx.fill();
        this.ctx.fillStyle = PALETTE.WHITE; this.ctx.globalAlpha = 0.4; this.ctx.beginPath(); this.ctx.arc(0, 0, e.c.stats.radius * 0.6, 0, 2 * Math.PI); this.ctx.fill();
        this.ctx.restore();
    }
    
    drawGrid() {
        this.ctx.strokeStyle = "#222"; this.ctx.lineWidth = 1; 
        const p1=Game.world.queryTag('player')[0];
        const ox=p1?-p1.c.transform.pos.x*0.1:0, oy=p1?-p1.c.transform.pos.y*0.1:0; 
        this.ctx.beginPath(); 
        for(let x=ox%100;x<Game.width;x+=100){this.ctx.moveTo(x,0);this.ctx.lineTo(x,Game.height);} 
        for(let y=oy%100;y<Game.height;y+=100){this.ctx.moveTo(0,y);this.ctx.lineTo(Game.width,y);} 
        this.ctx.stroke(); 
    }
}

// --- GAME ---
class Game {
    static world = new EntityManager();
    static entities = { blood: [], texts: [] };
    static particles = [];
    static state = { mode: "PAUSE", subMode: "SOLO", score: 0, streak: 0, combo: 0, shakeIntensity: 0, hitStopTimer: 0, flashOpacity: 0, waveTimer: 0, lootTimer: 1800, chromaticAberration: 0, invertedFrame: false, needsReset: true, particleSpawnCount: 0 };
    static config = { 
        FX: { BLOOD: true, SHAKE: true, FLASH: true, GLOW: true, GRID: true }, FRICTION: 0.92, BOUNDS: 25,
        update: () => { const c = Game.config.FX; c.BLOOD = document.getElementById("chk-blood").checked; c.SHAKE = document.getElementById("chk-shake").checked; c.FLASH = document.getElementById("chk-flash").checked; c.GLOW = document.getElementById("chk-glow").checked; c.GRID = document.getElementById("chk-grid").checked; Game.config.FRICTION = parseFloat(document.getElementById("rng-friction").value); }
    };
    static events = new EventBus();
    static width = window.innerWidth; static height = window.innerHeight;
    static ui = { 
        menu: document.getElementById("pause-menu"), gameOver: document.getElementById("game-over"), finalScore: document.getElementById("final-score"), controlsDesc: document.getElementById("controls-desc"),
        menuFocusIdx: 0, menuElements: [],
        toggleMenu: () => { 
            Game.state.mode = Game.state.mode === "PLAY" ? "PAUSE" : "PLAY"; 
            Game.ui.menu.style.display = Game.state.mode === "PAUSE" ? "block" : "none"; 
            if (Game.state.mode === "PLAY") { 
                Game.config.update(); 
                if(Game.state.needsReset) Game.director.reset(); 
                else { Game.input.setupTouchUI(); Game.loop.lastTime = 0; if (!Game.loop.id) requestAnimationFrame(Game.loop.run); } 
            } else {
                Game.ui.setupFocus();
            }
        },
        setupFocus: () => {
            const container = Game.state.mode === 'OVER' ? Game.ui.gameOver : Game.ui.menu;
            Game.ui.menuElements = Array.from(container.querySelectorAll('button:not([style*="display: none"]), input'));
            Game.ui.menuFocusIdx = 0; Game.ui.updateFocus();
        },
        updateFocus: () => {
            Game.ui.menuElements.forEach((e, i) => {
                const active = i === Game.ui.menuFocusIdx;
                e.classList.toggle('focused', active);
                if(e.parentElement.classList.contains('fx-toggle-row')) e.parentElement.classList.toggle('focused', active);
                if(active) e.scrollIntoView({block: 'nearest'});
            });
        },
        navFocus: (dir) => {
            if(!Game.ui.menuElements.length) Game.ui.setupFocus();
            Game.ui.menuFocusIdx = (Game.ui.menuFocusIdx + dir + Game.ui.menuElements.length) % Game.ui.menuElements.length;
            Game.ui.updateFocus();
        },
        triggerFocus: () => {
            if(!Game.ui.menuElements.length) return;
            const el = Game.ui.menuElements[Game.ui.menuFocusIdx];
            if(el.tagName === 'BUTTON') el.click();
            else if(el.type === 'checkbox') { el.checked = !el.checked; el.onchange(); }
        },
        updateControlsDesc: () => {
             let h = '', scheme = Game.input.scheme, mode = Game.state.subMode;
             if (scheme === 'MOUSE') h = `<div class="control-row"><span>MOVE</span><b>MOUSE (FOLLOW)</b></div><div class="control-row"><span>MOMENTUM</span><b>HOLD LMB</b></div><div class="control-row"><span>ACTION</span><b>RMB (TAP/HOLD)</b></div>`;
             else if (scheme === 'KEYBOARD') h = mode === 'SOLO' ? `<div class="control-row"><span>MOVE</span><b>W A S D</b></div><div class="control-row"><span>SPRINT</span><b>X / SHIFT</b></div><div class="control-row"><span>ACTION</span><b>Z / SPACE</b></div>` : `<div class="control-row"><span>P1 MOVE</span><b>W A S D</b></div><div class="control-row"><span>P1 ACT/RUN</span><b>Z / X</b></div><div class="control-row" style="margin-top:5px; border-top:1px solid #333"><span>P2 MOVE</span><b>ARROWS</b></div><div class="control-row"><span>P2 ACT/RUN</span><b>K / L</b></div>`;
             else if (scheme === 'TOUCH') h = mode === 'SOLO' ? `<div class="control-row"><span>MOVE</span><b>L-STICK</b></div><div class="control-row"><span>ACT/RUN</span><b>R-BUTTONS</b></div>` : `<div class="control-row"><span>P1</span><b>BOTTOM</b></div><div class="control-row"><span>P2</span><b>TOP (ROTATED)</b></div>`;
             else if (scheme === 'GAMEPAD') h = mode === 'SOLO' ? `<div class="control-row"><span>MOVE</span><b>L-STICK</b></div><div class="control-row"><span>SPRINT</span><b>B / Y / TRIGGERS</b></div><div class="control-row"><span>ACTION</span><b>A / X</b></div>` : `<div class="control-row"><span>P1</span><b>CONTROLLER 1</b></div><div class="control-row"><span>P2</span><b>CONTROLLER 2</b></div>`;
             Game.ui.controlsDesc.innerHTML = h;
        }
    };
    static director = {
        setMode: (m) => { if(Game.state.subMode !== m) Game.state.needsReset = true; Game.state.subMode = m; document.getElementById("btn-mode-solo").classList.toggle('active', m === 'SOLO'); document.getElementById("btn-mode-vs").classList.toggle('active', m === 'COOP'); Game.ui.updateControlsDesc(); },
        reset: () => {
            Game.loop.resize(); Game.input.rawInputs.p1.move = new Vector(0,0); Game.input.rawInputs.p2.move = new Vector(0,0);
            Game.world.entities = []; Game.world.idCounter=0; Game.particles = []; Game.entities.texts = []; Game.entities.blood = [];
            
            const p1 = EntityFactory.createFromBlueprint('PLAYER_P1', Game.width/2, Game.height/2);
            if (Game.state.subMode === 'COOP') { p1.c.transform.pos.x -= 100; EntityFactory.createFromBlueprint('PLAYER_P2', Game.width/2 + 100, Game.height/2); }
            
            Game.state.score = 0; Game.state.streak = 0; Game.state.combo = 0; Game.state.shakeIntensity = 0; Game.state.hitStopTimer = 0; Game.state.waveTimer = 0; Game.state.lootTimer = 1800; Game.state.needsReset = false;
            Game.ui.gameOver.style.display = "none"; Game.state.mode = "PLAY"; Game.input.setupTouchUI(); Game.loop.lastTime = 0; if (!Game.loop.id) requestAnimationFrame(Game.loop.run);
        },
        spawnWave: () => {
             Game.state.waveTimer--;
             const enemyCount = Game.world.queryTag('enemy').length;
             if (enemyCount === 0 && Game.state.waveTimer <= 0) {
                 let c = 1 + Math.ceil(Math.min(Game.state.streak, 10)); if(Game.state.subMode==='COOP') c=Math.ceil(c*1.5);
                 for (let i=0; i<c; i++) {
                     const rng = Math.random(), type = rng < 0.01 ? "ENEMY_BOSS" : (rng < 0.10 ? "ENEMY_ELITE" : "ENEMY_NORMAL")
                     const r = Math.floor(Math.random() * 4);
                     const pos = [new Vector(Math.random()*Game.width, -40), new Vector(Game.width+40, Math.random()*Game.height), new Vector(Math.random()*Game.width, Game.height+40), new Vector(-40, Math.random()*Game.height)][r];
                     EntityFactory.createEnemy(type, pos.x, pos.y);
                 }
                 Game.state.waveTimer = 250;
             }
             Game.state.lootTimer--;
             if (Game.state.lootTimer <= 0) {
                 const x = Math.random() * (Game.width - 100) + 50;
                 const y = Math.random() * (Game.height - 100) + 50;
                 const type = Math.random() > 0.8 ? "LIFE" : (Math.random() > 0.5 ? "GOD" : "HEAL");
                 EntityFactory.createPickup(x, y, type);
                 Game.state.lootTimer = 1800 + Math.random() * 1800;
             }
        },
        gameOver: () => { Game.state.mode = "OVER"; Game.ui.gameOver.style.display = "block"; Game.ui.finalScore.innerText = Game.state.score; Game.ui.setupFocus(); }
    };
    static init() {
        this.input = new InputSystem(); this.ai = new AISystem(); this.movement = new MovementSystem(); this.combat = new CombatSystem(); this.renderer = new RenderSystem(); this.logic = new LogicSystem();
        this.loop = {
            id: null, lastTime: 0, accumulator: 0, step: 1000/60,
            resize: () => { Game.width = document.getElementById("gameCanvas").width = window.innerWidth; Game.height = document.getElementById("gameCanvas").height = window.innerHeight; },
            run: (timestamp) => {
                if (!Game.loop.lastTime) Game.loop.lastTime = timestamp;
                let dt = timestamp - Game.loop.lastTime; Game.loop.lastTime = timestamp; if (dt > 1000) dt = Game.loop.step;
                
                if (Game.state.mode !== "PLAY") Game.input.update(); 
                else {
                    Game.loop.accumulator += dt; let steps = 0;
                    while (Game.loop.accumulator >= Game.loop.step) {
                        if (Game.state.hitStopTimer > 0) Game.state.hitStopTimer--;
                        else { 
                            Game.input.update();
                            Game.director.spawnWave(); 
                            Game.ai.update(); 
                            Game.movement.update(Game.loop.step); 
                            Game.combat.update(); 
                            Game.world.cleanup();
                            Game.entities.texts.forEach((t,i)=>{t.position.add(t.velocity); t.life-=0.02; if(t.life<=0)Game.entities.texts.splice(i,1)});
                            Game.entities.blood.forEach((b,i)=>{ b.position.add(b.velocity); b.velocity.multiply(0.85); if(b.velocity.magnitude() < 0.1) b.velocity.multiply(0); });
                            Game.particles.forEach((p,i)=>{p.pos.add(p.vel); p.vel.multiply(0.9); p.life-=0.05; if(p.life<=0)Game.particles.splice(i,1)});
                            
                            const players = Game.world.queryTag('player');
                            if(players.length === 0 && !Game.state.needsReset) Game.director.gameOver();
                        }
                        Game.state.shakeIntensity = Math.max(0, Game.state.shakeIntensity * 0.9 - 0.1); 
                        Game.state.flashOpacity = Math.max(0, Game.state.flashOpacity - 0.05); 
                        Game.state.chromaticAberration = Math.max(0, Game.state.chromaticAberration - 0.5);
                        Game.state.particleSpawnCount = 0;

                        Game.loop.accumulator -= Game.loop.step; steps++; 
                        if (steps > 240) { Game.loop.accumulator = 0; break; }
                    }
                    
                    Game.renderer.draw(); Game.state.invertedFrame = false;
                }
                Game.loop.id = requestAnimationFrame(Game.loop.run);
            }
        };
        window.addEventListener("resize", this.loop.resize);
        this.events.on('shake', amt => { if(this.config.FX.SHAKE) this.state.shakeIntensity += amt; });
        this.events.on('flash', o => { if(this.config.FX.FLASH) this.state.flashOpacity = o; });
        this.events.on('particle', d => {
            if (Game.state.particleSpawnCount > CONSTANTS.MAX_PARTICLES_PER_FRAME) return;
            if (Game.particles.length > CONSTANTS.MAX_PARTICLES) Game.particles.shift();
            Game.state.particleSpawnCount++;
            EntityFactory.createParticle(d.x, d.y, d.col, d.spd);
        });
        this.events.on('particle_burst', d => { if(!this.config.FX.BLOOD && !this.config.FX.FLASH) return; for(let i=0;i<d.n;i++) this.events.emit('particle', {x:d.x, y:d.y, col:d.col, spd:Math.random()*10+5}); });
        this.events.on('text', d => this.entities.texts.push({ position: new Vector(d.x, d.y), velocity: new Vector(Math.random()-0.5, -2), str: d.txt, color: d.col, life: 1 }));
        this.events.on('reset_request', this.director.reset);
        
        this.loop.resize(); this.ui.updateControlsDesc(); 
        EntityFactory.createFromBlueprint('PLAYER_P1', Game.width/2, Game.height/2);
        this.loop.id = requestAnimationFrame(this.loop.run);
    }
}
Game.init();
</script>
