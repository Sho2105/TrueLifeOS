<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Project: Speed [Diegetic]</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    :root { --c-bg:#050505; --c-txt:#eee; --c-dim:#444; }
    body { margin:0; overflow:hidden; background-color:var(--c-bg); color:var(--c-txt); font-family:'VT323',monospace; user-select:none; touch-action:none; }
    
    /* POST-PROCESSING */
    body::after { content:" "; display:block; position:absolute; top:0; left:0; bottom:0; right:0; background:linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index:100; background-size:100% 2px, 3px 100%; pointer-events:none; }

    canvas { position:absolute; top:0; left:0; z-index:10; display:block; cursor:crosshair; image-rendering:pixelated; filter:contrast(1.1) saturate(1.2); pointer-events:auto; }
    body.menu-mode canvas { pointer-events: none; }

    #ui-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; display:flex; justify-content:center; align-items:center; }
    
    /* DIEGETIC UI */
    #floor-interface { 
        text-align:center; pointer-events:auto; display:flex; flex-direction:column; gap:15px; 
        transition: opacity 0.5s ease; will-change: transform; 
    }
    #floor-interface.active { opacity: 1; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    #floor-interface.passive { opacity: 0.1; pointer-events:none; filter: blur(2px); }
    
    h1 { font-size:80px; margin:0; line-height:0.8; letter-spacing:15px; font-weight:normal; color: var(--c-txt); text-shadow: 0 0 20px rgba(255,255,255,0.1); }
    .score-readout { font-size:100px; margin:0; line-height:0.9; color: #fff; }
    .heat-readout { font-size:24px; color:var(--c-dim); letter-spacing: 4px; font-weight:bold; }
    
    .btn-group { display:flex; justify-content:center; gap:30px; margin:20px 0; }
    .bare-btn { 
        background:transparent; border:none; color:var(--c-dim); 
        font-family:'VT323',monospace; font-size:24px; cursor:pointer; 
        text-transform:uppercase; letter-spacing:3px; padding:5px 15px;
        transition: all 0.1s;
    }
    #floor-interface.active .bare-btn:hover, #floor-interface.active .bare-btn.active, #floor-interface.active .bare-btn:focus { 
        color:#fff; text-shadow:0 0 15px #fff; outline:none; transform: scale(1.1);
    }
    #btn-main-action { font-size:48px; margin-top:30px; color: #fff; }
    #floor-interface.active #btn-main-action:hover, #floor-interface.active #btn-main-action:focus { text-shadow:0 0 30px #fff; letter-spacing: 6px; }

    .touch-container { display:none; position:absolute; z-index:30; pointer-events:none; width:100%; height:100%; top:0; left:0; }
    .touch-pad { position:absolute; border:1px solid rgba(255, 255, 255, 0.1); border-radius:50%; pointer-events:auto; }
    .stick-base { width:120px; height:120px; background:rgba(255,255,255,0.05); }
    .stick-nub { position:absolute; top:50%; left:50%; width:40px; height:40px; background:#fff; border-radius:50%; transform:translate(-50%, -50%); pointer-events:none; box-shadow:0 0 10px #fff; }
    .btn-action { width:80px; height:80px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:#444; font-size:24px; }
    .btn-action.active { background:#fff; color:#000; box-shadow:0 0 15px #fff; }
</style>
</head>
<body>

<div id="ui-layer">
    <div id="floor-interface" class="active">
        <h1 id="menu-title">PROJECT_SPEED</h1>
        <div id="score-val" class="score-readout">0</div>
        <div id="heat-val" class="heat-readout">HEAT // 0%</div>
        <div class="btn-group">
            <button id="btn-mode-solo" class="bare-btn active" onclick="Core_Game.director.setMode('SOLO')">SOLO</button>
            <button id="btn-mode-vs" class="bare-btn" onclick="Core_Game.director.setMode('COOP')">CO-OP</button>
        </div>
        <div class="btn-group">
            <button id="btn-input-mouse" class="bare-btn active" onclick="Core_Game.sys.input.setScheme('MOUSE')">MOUSE</button>
            <button id="btn-input-key" class="bare-btn" onclick="Core_Game.sys.input.setScheme('KEYBOARD')">KEYS</button>
            <button id="btn-input-touch" class="bare-btn" onclick="Core_Game.sys.input.setScheme('TOUCH')">TOUCH</button>
            <button id="btn-input-pad" class="bare-btn" onclick="Core_Game.sys.input.setScheme('GAMEPAD')">PAD</button>
        </div>
        <button id="btn-main-action" class="bare-btn" onclick="Core_Game.ui.triggerStart()">INITIALIZE</button>
    </div>
</div>

<div id="touch-layer" class="touch-container"></div>
<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// 1. CONFIGURATION & DATA (cfg_ / db_)
// ==========================================
const cfg_Visuals = { 
    CYAN:"#00e5ff", LIME:"#76ff03", PINK:"#f50057", WHITE:"#ffffff", 
    DARK:"#050505", GREY:"#444", RED:"#d50000", ORANGE:"#ff3d00", 
    INDIGO:"#3d5afe", SLATE:"#607d8b", PURPLE:"#d500f9" 
};

const cfg_Game = {
    PHYSICS: { FRICTION: 0.90, ACCEL_BASE: 2.2, DASH_IMPULSE: 45, HYPER_IMPULSE: 75, GOD_IMPULSE: 110, RECOIL_FORCE: 3.0 },
    SPEED_MOD: { STOP: 0, WALK: 0.4, BASE: 1.0, SPRINT: 1.8 },
    TIER: { IDLE:0, WALK:0.5, BASE:1, HIGH:2, HYPER:3, GOD:4 },
    DAMAGE: { T1:10, T2:25, T3:50, T4:999 },
    COLORS: { P1:cfg_Visuals.CYAN, P2:cfg_Visuals.LIME, HYPER:cfg_Visuals.WHITE, TEXT:cfg_Visuals.WHITE },
    TIMING: { TAP_WINDOW:16, CHARGE_T3:90, CHARGE_T4:150, DASH_CD:300, PARRY_CD:30, TURN_CD:30, IFRAME_HIT:20, AI_THINK_MIN:15, AI_THINK_MAX:45 },
    STATE: { IDLE:0, MOVE:1, WALK:2, SPRINT:3, DASH:4, PARRY:5, DODGE:6, CHARGE:7, TIER3_READY:8, TIER4_READY:9, STUN:10 },
    HEAT: { DECAY:0.04, KILL:10, PARRY:15, CLASH:5, HIT_PENALTY:20 },
    FX: { MAX_PARTICLES:250, MAX_SHOCKWAVES:10 }
};

const cfg_Audio = {
    // --- PLACEHOLDERS: Add your Base64 Data URIs here ---
    // Format: "data:audio/wav;base64,..."
    SFX_UI_HOVER:   { src: null, vol: 0.2, loop: false },
    SFX_UI_CLICK:   { src: null, vol: 0.5, loop: false },
    SFX_DASH:       { src: null, vol: 0.4, loop: false },
    SFX_CHARGE:     { src: null, vol: 0.3, loop: true }, // Loop while charging
    SFX_PARRY:      { src: null, vol: 0.8, loop: false },
    SFX_HIT_WEAK:   { src: null, vol: 0.4, loop: false },
    SFX_HIT_HEAVY:  { src: null, vol: 0.6, loop: false },
    SFX_KILL:       { src: null, vol: 0.7, loop: false },
    SFX_CLASH:      { src: null, vol: 0.8, loop: false },
    SFX_PICKUP:     { src: null, vol: 0.5, loop: false },
    SFX_HEAT_UP:    { src: null, vol: 0.3, loop: false },
};

const db_Blueprints = {
    PLAYER_P1: { tags:['player','p1'], stats:{hp:100, maxHp:100, radius:16}, render:{color:cfg_Game.COLORS.P1}, input:{id:'p1'} },
    PLAYER_P2: { tags:['player','p2'], stats:{hp:100, maxHp:100, radius:16}, render:{color:cfg_Game.COLORS.P2}, input:{id:'p2'} },
    ENEMY_NORMAL: { stats:{hp:100, radius:16}, behavior:"AGGRESSIVE", traits:["BRAVE"], variants:[cfg_Visuals.RED] },
    ENEMY_ELITE: { stats:{hp:800, radius:20}, behavior:"DEFENSIVE", traits:["CAUTIOUS"], variants:[cfg_Visuals.SLATE] },
    ENEMY_BOSS: { stats:{hp:5000, radius:40}, behavior:"BOSS", traits:["BOSS"], variants:[cfg_Visuals.PURPLE] }
};

const db_Loot = {
    HEAL: { color:cfg_Visuals.GREEN, text:"HP UP", mod:{type:'STAT', key:'hp', val:50} },
    GOD:  { color:cfg_Visuals.YELLOW, text:"GOD MODE", mod:{type:'STATUS', key:'invincibleTimer', val:600} },
    LIFE: { color:cfg_Visuals.CYAN, text:"LIFE-UP", mod:{type:'SPECIAL', key:'life', val:1} }
};

const db_Actions = {
    'GET_LOOT': (e, t) => { e.c.input.btnA=false; e.c.input.btnB=false; const d=Vector.sub(t.c.transform.pos, e.c.transform.pos).normalize(); e.c.velocity.add(d.multiply(cfg_Game.PHYSICS.ACCEL_BASE * cfg_Game.SPEED_MOD.BASE)); },
    'APPROACH': (e, t) => { e.c.input.btnA=false; e.c.input.btnB=false; const d=Vector.sub(t.c.transform.pos, e.c.transform.pos).normalize(); e.c.velocity.add(d.multiply(cfg_Game.PHYSICS.ACCEL_BASE * cfg_Game.SPEED_MOD.BASE)); },
    'SPRINT_ATK': (e, t) => { e.c.input.btnA=true; e.c.input.btnB=false; e.c.input.aim=Vector.sub(t.c.transform.pos, e.c.transform.pos); },
    'DASH_ATK': (e, t) => { e.c.input.btnA=true; e.c.input.btnB=false; e.c.input.simTapA=true; e.c.input.aim=Vector.sub(t.c.transform.pos, e.c.transform.pos); },
    'PARRY': (e) => { e.c.input.btnB=true; e.c.input.btnA=false; e.c.input.simTapB=true; },
    'CHARGE_HYPER': (e, t) => { e.c.input.btnA=true; e.c.input.btnB=true; e.c.input.aim=Vector.sub(t.c.transform.pos, e.c.transform.pos); }
};

const db_AI_Behaviors = {
    AGGRESSIVE: [ { type:'GET_LOOT', weight:3.0, range:[0,400] }, { type:'PARRY', weight:0.5, cd:'parry', range:[0,80] }, { type:'DASH_ATK', weight:2.0, cd:'dash', range:[80,300] }, { type:'APPROACH', weight:1.0, range:[300,2000] } ],
    DEFENSIVE: [ { type:'GET_LOOT', weight:2.0, range:[0,300] }, { type:'PARRY', weight:1.5, cd:'parry', range:[0,120] }, { type:'APPROACH', weight:0.5, range:[150,400] } ],
    BOSS: [ { type:'GET_LOOT', weight:5.0, range:[0,600] }, { type:'CHARGE_HYPER', weight:0.5, range:[0,800] }, { type:'PARRY', weight:0.8, cd:'parry', range:[0,120] }, { type:'DASH_ATK', weight:1.0, cd:'dash', range:[120,500] }, { type:'APPROACH', weight:0.3, range:[100,2000] } ]
};

// ==========================================
// 2. CORE UTILITIES
// ==========================================
class Vector {
    constructor(x, y) { this.x=x; this.y=y; }
    add(v) { this.x+=v.x; this.y+=v.y; return this; }
    sub(v) { this.x-=v.x; this.y-=v.y; return this; }
    multiply(s) { this.x*=s; this.y*=s; return this; }
    magnitude() { return Math.sqrt(this.x**2 + this.y**2); }
    normalize() { const m=this.magnitude(); if(m!==0) this.multiply(1/m); return this; }
    clone() { return new Vector(this.x, this.y); }
    static distance(v1, v2) { return Math.sqrt((v1.x-v2.x)**2 + (v1.y-v2.y)**2); }
    static sub(v1, v2) { return new Vector(v1.x-v2.x, v1.y-v2.y); }
}

const ColorUtils = {
    hexToHSL: (H) => {
        let r=0,g=0,b=0; if(H.length==4){r="0x"+H[1]+H[1];g="0x"+H[2]+H[2];b="0x"+H[3]+H[3];}else if(H.length==7){r="0x"+H[1]+H[2];g="0x"+H[3]+H[4];b="0x"+H[5]+H[6];}
        r/=255;g/=255;b/=255; let cmin=Math.min(r,g,b), cmax=Math.max(r,g,b), delta=cmax-cmin, h=0, s=0, l=0;
        if(delta==0)h=0;else if(cmax==r)h=((g-b)/delta)%6;else if(cmax==g)h=(b-r)/delta+2;else h=(r-g)/delta+4;
        h=Math.round(h*60);if(h<0)h+=360;l=(cmax+cmin)/2;s=delta==0?0:delta/(1-Math.abs(2*l-1)); return {h:h,s:s*100,l:l*100};
    },
    getDynamicColor: (baseHex, state, timer) => {
        const hsl = ColorUtils.hexToHSL(baseHex);
        switch(state) {
            case cfg_Game.STATE.STUN: return `hsl(${hsl.h}, 10%, ${30 + (Math.random()*10)}%)`; // Glitch Gray
            case cfg_Game.STATE.CHARGE: return `hsl(${hsl.h}, 100%, 30%)`; // Deep Power
            case cfg_Game.STATE.TIER3_READY: return `hsl(${hsl.h}, 100%, 70%)`; // Bright
            case cfg_Game.STATE.TIER4_READY: return `hsl(${(Date.now()/5)%360}, 100%, 60%)`; // Rainbow
            case cfg_Game.STATE.PARRY: return `#ffffff`; // Flash White
            case cfg_Game.STATE.DASH: return `hsl(${hsl.h}, ${hsl.s}%, 80%)`; // Washout
            default: return baseHex;
        }
    }
};

class Core_Bus { constructor() { this.l={}; } on(e,c) { (this.l[e]=this.l[e]||[]).push(c); } emit(e,d) { if(this.l[e]) this.l[e].forEach(c=>c(d)); } }

// ==========================================
// 3. FACTORIES & ENTITY MANAGEMENT (Core_)
// ==========================================
class Entity { constructor(id) { this.id=id; this.c={}; this.tags=new Set(); this.active=true; } addComponent(n,d) { this.c[n]=d; return this; } has(n) { return !!this.c[n]; } hasTag(t) { return this.tags.has(t); } }
class Core_EntityManager {
    constructor() { this.entities=[]; this.idCounter=0; }
    create() { const e=new Entity(++this.idCounter); this.entities.push(e); return e; }
    destroy(e) { e.active=false; }
    cleanup() { this.entities=this.entities.filter(e=>e.active); }
    query(c) { return this.entities.filter(e=>e.active && c.every(n=>e.has(n))); }
    queryTag(t) { return this.entities.filter(e=>e.active && e.hasTag(t)); }
}

const Factory_Entity = {
    createFromBlueprint: (type, x, y) => {
        const e = Core_Game.world.create(), bp = db_Blueprints[type];
        if(!bp && type.includes('ENEMY')) return Factory_Entity.createEnemy(type, x, y); 
        e.c.transform={pos:new Vector(x,y), rot:0}; e.c.velocity=new Vector(0,0);
        if(bp.tags) bp.tags.forEach(t=>e.tags.add(t));
        if(bp.stats) e.addComponent('stats', {...bp.stats, extraLife:0});
        if(bp.render) e.addComponent('render', {...bp.render, baseColor:bp.render.color, trail:[]});
        if(bp.input) e.addComponent('input', {...bp.input, btnA:false, btnB:false, framesA:0, framesB:0, aim:new Vector(0,0)});
        e.addComponent('combat', {state:cfg_Game.STATE.IDLE, stateTimer:0, cooldowns:{parry:0, dash:0, turn:0}, invincibleTimer:0});
        return e;
    },
    createEnemy: (key, x, y) => {
        const e = Core_Game.world.create(), cfg = db_Blueprints[key];
        e.tags.add('enemy'); e.tags.add(key); e.c.transform={pos:new Vector(x,y), rot:0}; e.c.velocity=new Vector(0,0);
        e.addComponent('stats', {...cfg.stats, maxHp:cfg.stats.hp, extraLife:0});
        e.addComponent('render', {baseColor:cfg.variants[0], trail:[]});
        e.addComponent('input', {id:'ai', btnA:false, btnB:false, framesA:0, framesB:0, aim:new Vector(0,0), simTapA:false, simTapB:false});
        e.addComponent('combat', {state:cfg_Game.STATE.IDLE, stateTimer:0, cooldowns:{parry:0, dash:0, turn:0}, invincibleTimer:0});
        e.addComponent('ai', {behavior:db_AI_Behaviors[cfg.behavior], traits:cfg.traits||[], memory:{hitsTaken:0}, decisionTimer:0, currentAction:null});
        return e;
    },
    createPickup: (x, y, key) => {
        const e = Core_Game.world.create(); e.tags.add('pickup'); e.c.transform={pos:new Vector(x,y), rot:0}; e.c.velocity=new Vector(0,0);
        e.addComponent('pickup', {type:key, life:1200, data:db_Loot[key]});
        e.addComponent('render', {baseColor:db_Loot[key].color}); return e;
    },
    createParticle: (x, y, c, s, type='EXPLODE') => { 
        Core_Game.particles.push({
            active:true, type:type, pos:new Vector(x,y), 
            vel: type==='IMPLODE' ? new Vector(0,0) : new Vector(Math.cos(Math.random()*6.28)*s, Math.sin(Math.random()*6.28)*s), 
            color:c, life:1, size:Math.random()*4+2
        }); 
    },
    createShockwave: (x, y, color) => { Core_Game.shockwaves.push({x, y, r: 5, color, alpha: 1, maxR: 100}); }
};

// ==========================================
// 4. SYSTEMS (Sys_)
// ==========================================

class Sys_Audio {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.enabled = true;
        this.setupListeners();
    }
    setupListeners() {
        // Hook into event bus for automatic sound triggering
        Core_Game.bus.on('ev_hit', () => this.play('SFX_HIT_WEAK'));
        Core_Game.bus.on('ev_clash', () => this.play('SFX_CLASH'));
        Core_Game.bus.on('ev_parry', () => this.play('SFX_PARRY'));
        Core_Game.bus.on('ev_kill', () => this.play('SFX_KILL'));
        Core_Game.bus.on('ev_dash', () => this.play('SFX_DASH'));
        Core_Game.bus.on('ev_charge_start', () => this.play('SFX_CHARGE')); 
        Core_Game.bus.on('ev_ui_hover', () => this.play('SFX_UI_HOVER'));
        Core_Game.bus.on('ev_ui_click', () => this.play('SFX_UI_CLICK'));
    }
    play(key) {
        if(!this.enabled || !cfg_Audio[key] || !cfg_Audio[key].src) return;
        
        const soundDef = cfg_Audio[key];
        const audio = new Audio(soundDef.src);
        audio.volume = soundDef.vol;
        audio.loop = soundDef.loop;
        
        // Pitch variation for variety
        if(audio.mozPreservesPitch !== undefined) audio.mozPreservesPitch = false;
        audio.playbackRate = 0.9 + Math.random() * 0.2; 
        
        audio.play().catch(e => {}); // Handle auto-play policies
    }
}

class Sys_Input {
    constructor() {
        this.scheme="MOUSE"; 
        this.raw={p1:{btnA:false,btnB:false,move:new Vector(0,0)}, p2:{btnA:false,btnB:false,move:new Vector(0,0)}};
        this.keys={}; this.touchData={}; this.mouse={x:0,y:0}; this.menuCooldown=0;
        this.setupListeners();
    }
    setupListeners() {
        window.addEventListener('keydown', e=>{ 
            this.keys[e.code]=true;
            if(Core_Game.state.inMenu){
                if(['ArrowUp','KeyW'].includes(e.code)) { Core_Game.ui.navFocus(-1); Core_Game.bus.emit('ev_ui_hover'); }
                if(['ArrowDown','KeyS'].includes(e.code)) { Core_Game.ui.navFocus(1); Core_Game.bus.emit('ev_ui_hover'); }
                if(['Enter','Space'].includes(e.code)) { Core_Game.ui.triggerFocus(); Core_Game.bus.emit('ev_ui_click'); }
            }
        });
        window.addEventListener('keyup', e=>this.keys[e.code]=false);
        window.addEventListener('mousemove', e=>{if(this.scheme==='MOUSE'){this.mouse.x=e.clientX;this.mouse.y=e.clientY;}});
        window.addEventListener('mousedown', e=>{if(this.scheme==='MOUSE'&&!Core_Game.state.inMenu){if(e.button===0)this.raw.p1.btnA=true;if(e.button===2)this.raw.p1.btnB=true;}});
        window.addEventListener('mouseup', e=>{if(this.scheme==='MOUSE'){if(e.button===0)this.raw.p1.btnA=false;if(e.button===2)this.raw.p1.btnB=false;}});
        window.addEventListener('contextmenu', e=>e.preventDefault());
    }
    update() {
        this.pollGamepads();
        if(Core_Game.state.inMenu && this.menuCooldown<=0) {
            const pad = navigator.getGamepads()[0];
            if(pad) {
                if(pad.axes[1] < -0.5 || pad.buttons[12].pressed) { Core_Game.ui.navFocus(-1); this.menuCooldown=10; Core_Game.bus.emit('ev_ui_hover'); }
                else if(pad.axes[1] > 0.5 || pad.buttons[13].pressed) { Core_Game.ui.navFocus(1); this.menuCooldown=10; Core_Game.bus.emit('ev_ui_hover'); }
                else if(pad.buttons[0].pressed || pad.buttons[9].pressed) { Core_Game.ui.triggerFocus(); this.menuCooldown=20; Core_Game.bus.emit('ev_ui_click'); }
            }
        }
        if(this.menuCooldown>0) this.menuCooldown--;
        this.mapInputs();
        
        Core_Game.world.query(['input','combat','velocity']).forEach(e=>{
            if(Core_Game.state.inMenu && e.c.input.id !== 'ai') return;
            const i=e.c.input, c=e.c.combat;
            const prevFramesA = i.framesA, prevFramesB = i.framesB;
            let rawA = false, rawB = false, move = new Vector(0,0);
            
            if(i.id==='ai') {
                if(i.simTapA){ rawA=true; i.simTapA=false; } else rawA = i.btnA;
                if(i.simTapB){ rawB=true; i.simTapB=false; } else rawB = i.btnB;
                move=i.aim.clone().normalize();
            } else {
                rawA = this.raw[i.id].btnA; rawB = this.raw[i.id].btnB;
                if(this.scheme==='MOUSE'&&i.id==='p1'){ if(Vector.distance(e.c.transform.pos,this.mouse)>10) move=Vector.sub(this.mouse,e.c.transform.pos).normalize(); } 
                else if(this.raw[i.id].move.magnitude()>0.1) move=this.raw[i.id].move;
            }
            
            i.framesA = rawA ? i.framesA + 1 : 0; i.framesB = rawB ? i.framesB + 1 : 0;
            const pA = i.framesA > 0, pB = i.framesB > 0;
            
            if([cfg_Game.STATE.DASH, cfg_Game.STATE.PARRY, cfg_Game.STATE.STUN, cfg_Game.STATE.DODGE].includes(c.state)) return;
            
            // CHARGE
            if(pA && pB) {
                e.c.velocity.multiply(0);
                const chargeTime = Math.min(i.framesA, i.framesB);
                if(chargeTime===1) Core_Game.bus.emit('ev_charge_start');
                
                if(chargeTime > cfg_Game.TIMING.CHARGE_T4) c.state = cfg_Game.STATE.TIER4_READY;
                else if(chargeTime > cfg_Game.TIMING.CHARGE_T3) c.state = cfg_Game.STATE.TIER3_READY;
                else c.state = cfg_Game.STATE.CHARGE;
                
                if(chargeTime % 5 === 0) Core_Game.bus.emit('ev_particle_suction', {target:e, n:1});
                if(c.state >= cfg_Game.STATE.TIER3_READY && chargeTime % 10 === 0) Core_Game.bus.emit('ev_shake', 1);
                return;
            }
            
            // RELEASE CHARGE
            if ( (c.state === cfg_Game.STATE.CHARGE || c.state === cfg_Game.STATE.TIER3_READY || c.state === cfg_Game.STATE.TIER4_READY) ) {
                if (!pA || !pB) {
                    let tier = 0; if(c.state === cfg_Game.STATE.TIER4_READY) tier = 4; else if(c.state === cfg_Game.STATE.TIER3_READY) tier = 3;
                    if(tier >= 3) {
                        c.state = cfg_Game.STATE.DASH; c.stateTimer = tier===4 ? 30 : 20; c.invincibleTimer = c.stateTimer; c.tierOverride = tier;
                        const force = tier === 4 ? cfg_Game.PHYSICS.GOD_IMPULSE : cfg_Game.PHYSICS.HYPER_IMPULSE;
                        const dir = move.magnitude() > 0 ? move : (e.c.velocity.magnitude() > 0 ? e.c.velocity.normalize() : new Vector(1,0));
                        e.c.velocity = dir.multiply(force);
                        Core_Game.bus.emit('ev_dash');
                        Core_Game.bus.emit('ev_shake', tier===4?20:10); Core_Game.bus.emit('ev_flash', tier===4?0.5:0.2); 
                        Core_Game.bus.emit('ev_particle_burst', {x:e.c.transform.pos.x, y:e.c.transform.pos.y, col:e.c.render.baseColor, n:40});
                    } else c.state = cfg_Game.STATE.IDLE;
                }
                return;
            }
            
            // COMBOS
            if(i.framesB > cfg_Game.TIMING.TAP_WINDOW && i.framesA === 1 && c.cooldowns.parry <= 0) {
                c.state = cfg_Game.STATE.DODGE; c.stateTimer = 15; c.invincibleTimer = 15; c.cooldowns.parry = cfg_Game.TIMING.PARRY_CD;
                e.c.velocity.add(move.multiply(cfg_Game.PHYSICS.DASH_IMPULSE * 0.8)); return;
            }
            if(i.framesA > cfg_Game.TIMING.TAP_WINDOW && i.framesB === 1 && c.cooldowns.turn <= 0) {
                e.c.velocity.multiply(0.1); c.cooldowns.turn = cfg_Game.TIMING.TURN_CD;
                Core_Game.bus.emit('ev_particle', {x:e.c.transform.pos.x, y:e.c.transform.pos.y, col:cfg_Visuals.WHITE, spd:1}); return;
            }
            
            // HOLDS
            if(i.framesA > cfg_Game.TIMING.TAP_WINDOW) { c.state = cfg_Game.STATE.SPRINT; e.c.velocity.add(move.multiply(cfg_Game.PHYSICS.ACCEL_BASE * cfg_Game.SPEED_MOD.SPRINT)); return; }
            if(i.framesB > cfg_Game.TIMING.TAP_WINDOW) { c.state = cfg_Game.STATE.WALK; e.c.velocity.add(move.multiply(cfg_Game.PHYSICS.ACCEL_BASE * cfg_Game.SPEED_MOD.WALK)); return; }
            
            // TAPS
            if(!pA && prevFramesA > 0 && prevFramesA <= cfg_Game.TIMING.TAP_WINDOW && c.cooldowns.dash <= 0) {
                c.state = cfg_Game.STATE.DASH; c.stateTimer = 10; c.cooldowns.dash = cfg_Game.TIMING.DASH_CD; c.tierOverride = 2;
                const dir = move.magnitude() > 0 ? move : (e.c.velocity.magnitude() > 0 ? e.c.velocity.normalize() : new Vector(1,0));
                e.c.velocity = dir.multiply(cfg_Game.PHYSICS.DASH_IMPULSE); Core_Game.bus.emit('ev_dash'); return;
            }
            if(!pB && prevFramesB > 0 && prevFramesB <= cfg_Game.TIMING.TAP_WINDOW && c.cooldowns.parry <= 0) {
                c.state = cfg_Game.STATE.PARRY; c.stateTimer = 20; c.cooldowns.parry = cfg_Game.TIMING.PARRY_CD; e.c.velocity.multiply(0.1); return;
            }
            
            // BASE MOVE
            if(move.magnitude() > 0){ c.state = cfg_Game.STATE.MOVE; e.c.velocity.add(move.multiply(cfg_Game.PHYSICS.ACCEL_BASE * cfg_Game.SPEED_MOD.BASE)); } else { c.state = cfg_Game.STATE.IDLE; }
        });
    }
    pollGamepads() {
        const gps=navigator.getGamepads?navigator.getGamepads():[];
        const map=(pid,i)=>{const g=gps[i]; if(g){this.raw[pid].move.x=Math.abs(g.axes[0])>0.1?g.axes[0]:0;this.raw[pid].move.y=Math.abs(g.axes[1])>0.1?g.axes[1]:0;this.raw[pid].btnA=g.buttons[0].pressed||g.buttons[2].pressed;this.raw[pid].btnB=g.buttons[1].pressed||g.buttons[3].pressed;}else{this.raw[pid].move=new Vector(0,0);this.raw[pid].btnA=false;this.raw[pid].btnB=false;}};
        if(this.scheme==='GAMEPAD'){ map('p1',0); if(Core_Game.state.subMode==='COOP')map('p2',1); else if(gps[1])map('p1',1); }
    }
    mapInputs() {
        if(this.scheme==='KEYBOARD'){ const m=(id,u,d,l,r,a,b)=>{this.raw[id].move.x=(this.keys[r]?1:0)-(this.keys[l]?1:0);this.raw[id].move.y=(this.keys[d]?1:0)-(this.keys[u]?1:0);this.raw[id].btnA=this.keys[a];this.raw[id].btnB=this.keys[b];}; m('p1','KeyW','KeyS','KeyA','KeyD','KeyZ','KeyX'); m('p2','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyK','KeyL'); if(this.keys['Space'])this.raw.p1.btnA=true; if(this.keys['ShiftLeft'])this.raw.p1.btnB=true; }
        else if(this.scheme==='TOUCH'){ ['p1','p2'].forEach(id=>{let s=this.touchData[`stick-${id}`];if(s){this.raw[id].move.x=s.x;this.raw[id].move.y=s.y;}this.raw[id].btnA=this.touchData[`btnA-${id}`];this.raw[id].btnB=this.touchData[`btnB-${id}`];}); }
    }
    setScheme(s) { this.scheme=s; ['mouse','key','touch','pad'].forEach(k=>document.getElementById(`btn-input-${k}`).classList.toggle('active', s.toUpperCase()===k.toUpperCase()||(k==='pad'&&s==='GAMEPAD')||(k==='key'&&s==='KEYBOARD'))); this.setupTouchUI(); }
    setupTouchUI() { const ui=document.getElementById("touch-layer"); ui.innerHTML=''; ui.style.display=this.scheme==='TOUCH'?'block':'none'; if(this.scheme!=='TOUCH')return; const add=(id,t,r,rot)=>{const b=document.createElement('div'); b.className=`touch-pad ${t==='s'?'stick-base':(t==='a'?'btn-action':'btn-sprint')}`; if(t==='s'){b.style.left='30px';const n=document.createElement('div');n.className='stick-nub';b.appendChild(n);let o=null;b.addEventListener('touchmove',e=>{e.preventDefault();for(let v of e.changedTouches){if(o&&v.identifier===o.id){let dx=v.clientX-o.x,dy=v.clientY-o.y,d=Math.min(50,Math.sqrt(dx*dx+dy*dy)),a=Math.atan2(dy,dx);n.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;let ox=Math.cos(a)*(d/50),oy=Math.sin(a)*(d/50);if(rot){ox*=-1;oy*=-1;}this.touchData[`stick-${id}`]={x:ox,y:oy};}}});b.addEventListener('touchstart',e=>{e.preventDefault();let r=b.getBoundingClientRect();o={x:r.left+r.width/2,y:r.top+r.height/2,id:e.changedTouches[0].identifier};this.touchData[`stick-${id}`]={x:0,y:0};});b.addEventListener('touchend',e=>{o=null;n.style.transform=`translate(-50%,-50%)`;this.touchData[`stick-${id}`]={x:0,y:0};});}else{b.innerText=t==='a'?'A':'B';b.style.right=r+'px';b.addEventListener('touchstart',e=>{e.preventDefault();this.touchData[`${t==='a'?'btnA':'btnB'}-${id}`]=true;b.classList.add('active')});b.addEventListener('touchend',e=>{e.preventDefault();this.touchData[`${t==='a'?'btnA':'btnB'}-${id}`]=false;b.classList.remove('active')});} b.style[rot?'top':'bottom']='30px';if(rot)b.style.transform="rotate(180deg)";ui.appendChild(b);}; add('p1','s',0,false);add('p1','a',30,false);add('p1','m',140,false); if(Core_Game.state.subMode==='COOP'){add('p2','s',0,true);add('p2','a',30,true);add('p2','m',140,true);} }

class Sys_AI {
    update() {
        const ps=Core_Game.world.queryTag('player'), enemies=Core_Game.world.queryTag('enemy'), pickups=Core_Game.world.queryTag('pickup'); 
        const targets = Core_Game.state.inMenu ? enemies : ps;
        Core_Game.world.query(['ai','combat']).forEach(me=>{
            const c=me.c.combat, ai=me.c.ai;
            if([cfg_Game.STATE.STUN, cfg_Game.STATE.DASH, cfg_Game.STATE.PARRY].includes(c.state)) return;
            ai.decisionTimer--;
            if(ai.decisionTimer > 0 && ai.currentAction) {
                let target = null;
                if(ai.currentAction.targetType === 'LOOT') target = pickups.find(p=>p.id===ai.currentAction.targetId);
                else if(ai.currentAction.targetType === 'PLAYER') target = ps.find(p=>p.id===ai.currentAction.targetId);
                else target = enemies.find(e=>e.id===ai.currentAction.targetId);
                if(ai.currentAction.type === 'CHARGE_HYPER') {
                    if(ai.decisionTimer > 10) { me.c.input.btnA = true; me.c.input.btnB = true; me.c.input.aim = target ? Vector.sub(target.c.transform.pos, me.c.transform.pos) : new Vector(1,0); } 
                    else { me.c.input.btnA = false; me.c.input.btnB = false; ai.currentAction = null; }
                    return;
                }
                if(target && target.active) { if(db_Actions[ai.currentAction.type]) db_Actions[ai.currentAction.type](me, target); } else ai.decisionTimer = 0;
                return;
            }
            let possibleTargets = targets;
            if (Core_Game.state.inMenu && me.hasTag('player')) possibleTargets = enemies; else if (!me.hasTag('player')) possibleTargets = ps;
            if (possibleTargets.length === 0 && Core_Game.state.inMenu) possibleTargets = Core_Game.world.queryTag('enemy').filter(e=>e.id!==me.id);
            if(possibleTargets.length === 0) return; 
            const pTarget = possibleTargets.reduce((p,c)=>Vector.distance(me.c.transform.pos,p.c.transform.pos)<Vector.distance(me.c.transform.pos,c.c.transform.pos)?p:c);
            let lootTarget = pickups.length ? pickups.reduce((p,c)=>Vector.distance(me.c.transform.pos,p.c.transform.pos)<Vector.distance(me.c.transform.pos,c.c.transform.pos)?p:c) : null;
            const valid = ai.behavior.filter(b=>{
                const t = b.type==='GET_LOOT'?lootTarget:pTarget; if(!t)return false;
                const d=Vector.distance(me.c.transform.pos, t.c.transform.pos);
                if(b.range && (d<b.range[0]||d>b.range[1])) return false; if(b.cd && c.cooldowns[b.cd]>0) return false; return true;
            });
            const total = valid.reduce((s,b)=>s+b.weight,0); let r=Math.random()*total, selected=null; for(const m of valid){r-=m.weight; if(r<=0){selected=m; break;}}
            if(selected) {
                const finalT = selected.type==='GET_LOOT'?lootTarget:pTarget;
                ai.currentAction = { type: selected.type, targetId: finalT.id, targetType: selected.type==='GET_LOOT'?'LOOT':(finalT.hasTag('player')?'PLAYER':'ENEMY') };
                let duration = Math.floor(Math.random() * (cfg_Game.TIMING.AI_THINK_MAX - cfg_Game.TIMING.AI_THINK_MIN) + cfg_Game.TIMING.AI_THINK_MIN);
                if(selected.type === 'CHARGE_HYPER') duration = 120; ai.decisionTimer = duration;
            } else { ai.currentAction = { type: 'APPROACH', targetId: pTarget.id, targetType: 'PLAYER' }; ai.decisionTimer = 30; }
        });
    }
}

class Sys_Physics {
    update() {
        Core_Game.world.query(['velocity','transform']).forEach(e=>{
            const p=e.c;
            if(e.has('combat')){
                ['dash','parry','turn'].forEach(k=>p.combat.cooldowns[k]=Math.max(0,p.combat.cooldowns[k]-1));
                p.combat.invincibleTimer=Math.max(0,p.combat.invincibleTimer-1); p.combat.stateTimer=Math.max(0,p.combat.stateTimer-1);
                const s=p.combat.state;
                if(s===cfg_Game.STATE.STUN){ p.velocity.multiply(0.85); if(p.combat.stateTimer<=0)p.combat.state=cfg_Game.STATE.IDLE; }
                else if(s===cfg_Game.STATE.DASH){ p.combat.invincibleTimer=2; if(p.combat.stateTimer<=0){p.combat.state=cfg_Game.STATE.IDLE;p.velocity.multiply(0.5);p.combat.tierOverride=0;} }
                else if(s===cfg_Game.STATE.PARRY||s===cfg_Game.STATE.DODGE){ p.velocity.multiply(0.8); if(s===cfg_Game.STATE.DODGE)p.combat.invincibleTimer=2; if(p.combat.stateTimer<=0)p.combat.state=cfg_Game.STATE.IDLE; }
                else if(s===cfg_Game.STATE.CHARGE||s===cfg_Game.STATE.TIER3_READY||s===cfg_Game.STATE.TIER4_READY){ p.velocity.multiply(0.5); }
                else { p.velocity.multiply(cfg_Game.PHYSICS.FRICTION); }
            }
            p.transform.pos.add(p.velocity);
            const b=Core_Game.config.BOUNDS;
            if(p.transform.pos.x<b){p.transform.pos.x=b;p.velocity.x*=-0.8;} if(p.transform.pos.x>Core_Game.width-b){p.transform.pos.x=Core_Game.width-b;p.velocity.x*=-0.8;}
            if(p.transform.pos.y<b){p.transform.pos.y=b;p.velocity.y*=-0.8;} if(p.transform.pos.y>Core_Game.height-b){p.transform.pos.y=Core_Game.height-b;p.velocity.y*=-0.8;}
        });
        Core_Game.world.queryTag('pickup').forEach(p=>{p.c.transform.rot+=0.05; p.c.pickup.life--; if(p.c.pickup.life<=0)Core_Game.world.destroy(p);});
        if(Core_Game.state.subMode==='COOP'){const ps=Core_Game.world.queryTag('player'); if(ps.length>1 && Vector.distance(ps[0].c.transform.pos,ps[1].c.transform.pos)<42){const push=Vector.sub(ps[0].c.transform.pos,ps[1].c.transform.pos).normalize().multiply(3); ps[0].c.velocity.add(push); ps[1].c.velocity.sub(push);}}
    }
}

class Sys_Combat {
    getTier(e) { if(!e.has('combat'))return 0; if(e.c.combat.tierOverride)return e.c.combat.tierOverride; const s=e.c.combat.state; if(s===cfg_Game.STATE.DASH||s===cfg_Game.STATE.SPRINT)return 2; if(s===cfg_Game.STATE.WALK)return 0.5; if(s===cfg_Game.STATE.MOVE)return 1; return 0; }
    update() {
        const combatants=Core_Game.world.query(['combat','stats']), enemies=Core_Game.world.queryTag('enemy'), pickups=Core_Game.world.queryTag('pickup');
        combatants.forEach(e=>{
            combatants.forEach(o=>{ 
                 if(e!==o && e.hasTag('player') !== o.hasTag('player') && Vector.distance(e.c.transform.pos, o.c.transform.pos)<42) 
                    this.resolveCollision(e,o); 
            });
            for(let i=pickups.length-1;i>=0;i--) if(Vector.distance(e.c.transform.pos,pickups[i].c.transform.pos)<30) Core_Game.bus.emit('ev_loot_pickup',{target:e,pickup:pickups[i]});
        });
    }
    resolveCollision(e1, e2) {
        // STUN LOGIC: Stunned entity only takes damage from Tier 1+ attacks (prevents accidental touch-death)
        if(e1.c.combat.state===cfg_Game.STATE.STUN) { if(this.getTier(e2) < 1) return; return Core_Game.bus.emit('ev_hit',{attacker:e2,victim:e1,tier:this.getTier(e2)}); }
        if(e2.c.combat.state===cfg_Game.STATE.STUN) { if(this.getTier(e1) < 1) return; return Core_Game.bus.emit('ev_hit',{attacker:e1,victim:e2,tier:this.getTier(e1)}); }
        
        const t1=this.getTier(e1), t2=this.getTier(e2);
        
        if(e1.c.combat.state===cfg_Game.STATE.PARRY && t2!==4) return Core_Game.bus.emit('ev_parry',{blocker:e1,attacker:e2,tier:t2});
        if(e2.c.combat.state===cfg_Game.STATE.PARRY && t1!==4) return Core_Game.bus.emit('ev_parry',{blocker:e2,attacker:e1,tier:t1});
        
        if(t1>=2 && t2>=2){ if(t1===t2)Core_Game.bus.emit('ev_clash',{e1,e2}); else if(t1>t2)Core_Game.bus.emit('ev_hit',{attacker:e1,victim:e2,tier:t1}); else Core_Game.bus.emit('ev_hit',{attacker:e2,victim:e1,tier:t2}); return; }
        if(t1>=2 && t2<2) Core_Game.bus.emit('ev_hit',{attacker:e1,victim:e2,tier:t1}); else if(t2>=2 && t1<2) Core_Game.bus.emit('ev_hit',{attacker:e2,victim:e1,tier:t2});
        else { const p=Vector.sub(e1.c.transform.pos,e2.c.transform.pos).normalize().multiply(4); e1.c.velocity.add(p); e2.c.velocity.sub(p); }
    }
}

class Sys_Rules {
    constructor() {
        Core_Game.bus.on('ev_hit', ({attacker,victim,tier})=>{
            if(victim.c.combat.state!==cfg_Game.STATE.STUN && victim.c.combat.invincibleTimer>0) return;
            if(victim.c.combat.state===cfg_Game.STATE.DODGE) return;
            let dmg = tier===4?cfg_Game.DAMAGE.T4:(tier===3?cfg_Game.DAMAGE.T3:(tier===2?cfg_Game.DAMAGE.T2:cfg_Game.DAMAGE.T1));
            if(victim.c.combat.state===cfg_Game.STATE.WALK) dmg*=0.5;
            victim.c.stats.hp-=dmg; 
            if(victim.has('ai')){ 
                victim.c.ai.memory.hitsTaken++; 
                if(victim.hasTag('BOSS') && victim.c.stats.hp<victim.c.stats.maxHp*0.5) Core_Game.bus.emit('ev_boss_phase_change',{boss:victim,phase:2}); 
            }
            if(victim.hasTag('player')) Core_Game.state.heat = Math.max(0, Core_Game.state.heat - cfg_Game.HEAT.HIT_PENALTY);
            const isCharging = (victim.c.combat.state >= cfg_Game.STATE.CHARGE && victim.c.combat.state <= cfg_Game.STATE.TIER4_READY);
            const isStunned = victim.c.combat.state === cfg_Game.STATE.STUN;
            if (!isCharging) {
                if(!isStunned) victim.c.combat.state=cfg_Game.STATE.IDLE;
                const force=tier===4?100:(tier===3?60:(tier===2?30:10));
                const k=Vector.sub(victim.c.transform.pos,attacker.c.transform.pos).normalize().multiply(force*cfg_Game.PHYSICS.RECOIL_FORCE);
                victim.c.velocity=k; attacker.c.velocity.add(k.clone().multiply(0.2));
            }
            victim.c.combat.invincibleTimer = cfg_Game.TIMING.IFRAME_HIT; // IFRAME GRANT
            Core_Game.state.hitStopTimer=(tier>=3)?3:0; 
            const shake = tier===4?50:(tier>=2?15:5); Core_Game.bus.emit('ev_shake', shake);
            if(tier>=3){ Core_Game.state.chromaticAberration=20; if(tier===4 && Core_Game.config.FX.FLASH) Core_Game.state.invertedFrame=true; }
            if(tier>=2) Factory_Entity.createShockwave(victim.c.transform.pos.x, victim.c.transform.pos.y, victim.c.render.baseColor);
            Core_Game.bus.emit('ev_particle_burst',{x:victim.c.transform.pos.x,y:victim.c.transform.pos.y,col:victim.c.render.baseColor,n:10+shake});
            if(victim.c.stats.hp<=0) Core_Game.bus.emit('ev_kill',{victim,attacker}); else if(victim.hasTag('player') && !Core_Game.state.inMenu) Core_Game.state.combo=0;
        });
        Core_Game.bus.on('ev_parry', ({blocker,attacker,tier})=>{
            const r=Vector.sub(attacker.c.transform.pos,blocker.c.transform.pos).normalize().multiply(30);
            attacker.c.velocity=r; attacker.c.combat.state=cfg_Game.STATE.STUN; 
            attacker.c.combat.stateTimer = (tier >= 3) ? 120 : 60;
            attacker.c.combat.invincibleTimer=0;
            blocker.c.velocity=r.clone().multiply(-0.2); blocker.c.combat.invincibleTimer=20; Core_Game.state.hitStopTimer=3;
            if(blocker.hasTag('player')) Core_Game.state.heat = Math.min(100, Core_Game.state.heat + cfg_Game.HEAT.PARRY);
            Factory_Entity.createShockwave(blocker.c.transform.pos.x, blocker.c.transform.pos.y, cfg_Visuals.WHITE);
            Core_Game.bus.emit('ev_particle_burst',{x:attacker.c.transform.pos.x,y:attacker.c.transform.pos.y,col:cfg_Visuals.WHITE,n:30}); 
            Core_Game.bus.emit('ev_flash',0.3); Core_Game.bus.emit('ev_shake',30);
        });
        Core_Game.bus.on('ev_clash', ({e1,e2})=>{
            Core_Game.state.hitStopTimer=4; Core_Game.bus.emit('ev_shake',30); 
            const d=Vector.sub(e1.c.transform.pos,e2.c.transform.pos).normalize();
            e1.c.velocity=d.clone().multiply(40); e2.c.velocity=d.clone().multiply(-40); e1.c.combat.state=e2.c.combat.state=cfg_Game.STATE.IDLE; e1.c.combat.invincibleTimer=e2.c.combat.invincibleTimer=10;
            if(e1.hasTag('player')||e2.hasTag('player')) Core_Game.state.heat = Math.min(100, Core_Game.state.heat + cfg_Game.HEAT.CLASH);
            const m=Vector.sub(e2.c.transform.pos,e1.c.transform.pos).multiply(0.5).add(e1.c.transform.pos); 
            Factory_Entity.createShockwave(m.x, m.y, cfg_Visuals.WHITE); Core_Game.bus.emit('ev_particle_burst',{x:m.x,y:m.y,col:cfg_Visuals.WHITE,n:40});
        });
        Core_Game.bus.on('ev_loot_pickup', ({target,pickup})=>{
            Core_Game.bus.emit('ev_particle_burst',{x:pickup.c.transform.pos.x,y:pickup.c.transform.pos.y,col:pickup.c.render.baseColor,n:30});
            const m=pickup.c.pickup.data.mod;
            if(m.type==='STAT') target.c.stats[m.key]=Math.min(target.c.stats[m.key]+m.val,target.c.stats.maxHp);
            else if(m.type==='STATUS') target.c.combat[m.key]=m.val;
            else if(m.type==='SPECIAL' && target.hasTag('player')) { if(target.c.stats.extraLife<1)target.c.stats.extraLife++; else target.c.stats.hp=target.c.stats.maxHp; }
            Core_Game.world.destroy(pickup);
        });
        Core_Game.bus.on('ev_revive', ({entity})=>{
            entity.c.stats.extraLife--; entity.c.stats.hp=entity.c.stats.maxHp; entity.c.combat.invincibleTimer=180;
            Core_Game.state.hitStopTimer=30; Core_Game.bus.emit('ev_shake',50); Core_Game.bus.emit('ev_flash',1); Core_Game.bus.emit('ev_particle_burst',{x:entity.c.transform.pos.x,y:entity.c.transform.pos.y,col:db_Loot.LIFE.color,n:50});
        });
        Core_Game.bus.on('ev_kill', ({victim,attacker})=>{
            if(victim.c.stats.extraLife>0) return Core_Game.bus.emit('ev_revive',{entity:victim});
            Core_Game.world.destroy(victim); Core_Game.state.hitStopTimer=5; Core_Game.state.streak++; Core_Game.state.combo++;
            let s=100; if(victim.hasTag('ENEMY_BOSS'))s=5000; else if(victim.hasTag('ENEMY_ELITE'))s=1000;
            if(attacker.hasTag('player')) Core_Game.state.heat = Math.min(100, Core_Game.state.heat + cfg_Game.HEAT.KILL * (victim.hasTag('ENEMY_BOSS')?5:1));
            if(!Core_Game.state.inMenu) { Core_Game.state.score += s * (1 + Core_Game.state.heat * 0.1); Core_Game.ui.updateScore(); }
            if(!victim.hasTag('ENEMY_NORMAL')){ Core_Game.state.hitStopTimer=20; Core_Game.bus.emit('ev_shake',100); Core_Game.bus.emit('ev_flash',0.8); }
            if(Core_Game.config.FX.BLOOD) for(let i=0;i<15;i++)Core_Game.entities.blood.push({position:new Vector(victim.c.transform.pos.x,victim.c.transform.pos.y),velocity:new Vector(Math.cos(Math.random()*6.28)*Math.random()*10,Math.sin(Math.random()*6.28)*Math.random()*10),color:victim.c.render.baseColor,size:Math.random()*12+6,rotation:Math.random()*6,life:1000});
        });
    }
}

class Sys_Render {
    constructor() { this.ctx=document.getElementById("gameCanvas").getContext("2d"); }
    draw() {
        this.ctx.clearRect(0,0,Core_Game.width,Core_Game.height);
        if(Core_Game.state.invertedFrame){this.ctx.fillStyle=cfg_Visuals.WHITE;this.ctx.fillRect(0,0,Core_Game.width,Core_Game.height);return;}
        
        this.ctx.save();
        const sx=(Math.random()-0.5)*Core_Game.state.shakeIntensity, sy=(Math.random()-0.5)*Core_Game.state.shakeIntensity;
        this.ctx.translate(sx,sy); 
        if(Core_Game.ui.menu) Core_Game.ui.menu.style.transform = `translate(${sx}px, ${sy}px)`;

        if(Core_Game.config.FX.GRID) this.drawGrid();
        
        // Heat Haze
        if(Core_Game.state.heat > 50) {
            this.ctx.globalCompositeOperation = 'lighter';
            this.ctx.fillStyle = `rgba(255, 50, 0, ${(Core_Game.state.heat-50)/500})`;
            this.ctx.fillRect(0,0,Core_Game.width,Core_Game.height);
            this.ctx.globalCompositeOperation = 'source-over';
        }

        Core_Game.entities.blood.forEach(b=>{this.ctx.save();this.ctx.translate(b.position.x,b.position.y);this.ctx.rotate(b.rotation);this.ctx.fillStyle=b.color;this.ctx.globalAlpha=0.6;this.ctx.fillRect(-b.size/2,-b.size/2,b.size,b.size);this.ctx.restore();});
        if(Core_Game.state.chromaticAberration>1){
            this.ctx.save(); this.ctx.globalCompositeOperation="screen";
            this.ctx.translate(Core_Game.state.chromaticAberration,0);this.drawAllEntities();
            this.ctx.translate(-Core_Game.state.chromaticAberration*2,0);this.drawAllEntities();
            this.ctx.restore();
        }
        this.drawAllEntities();
        
        this.ctx.lineWidth=4;
        Core_Game.shockwaves.forEach(s => { this.ctx.globalAlpha = s.alpha; this.ctx.strokeStyle = s.color; this.ctx.beginPath(); this.ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); this.ctx.stroke(); });
        this.ctx.globalAlpha = 1;

        if(Core_Game.state.flashOpacity>0&&Core_Game.config.FX.FLASH){this.ctx.fillStyle=`rgba(255,255,255,${Core_Game.state.flashOpacity})`;this.ctx.fillRect(-sx,-sy,Core_Game.width,Core_Game.height);}
        Core_Game.entities.texts.forEach(t=>{this.ctx.globalAlpha=Math.max(0,t.life);this.ctx.fillStyle=t.color;this.ctx.font="30px VT323";this.ctx.shadowColor=t.color;this.ctx.shadowBlur=10;this.ctx.fillText(t.str,t.position.x,t.position.y);this.ctx.shadowBlur=0;});
        
        if(Core_Game.state.subMode==='SOLO'&&Core_Game.sys.input.scheme==='MOUSE'&&!Core_Game.state.inMenu){
            const p1=Core_Game.world.queryTag('player')[0];
            if(p1){ this.ctx.strokeStyle="rgba(255,255,255,0.1)";this.ctx.setLineDash([4,4]);this.ctx.beginPath();this.ctx.moveTo(p1.c.transform.pos.x,p1.c.transform.pos.y);this.ctx.lineTo(Core_Game.sys.input.mouse.x,Core_Game.sys.input.mouse.y);this.ctx.stroke();this.ctx.setLineDash([]);this.ctx.fillStyle=cfg_Visuals.CYAN;this.ctx.fillRect(Core_Game.sys.input.mouse.x-4,Core_Game.sys.input.mouse.y-4,8,8); }
        }
        this.ctx.restore(); 
        const heatPulse = (Core_Game.state.heat/100) * 0.2 * Math.sin(Date.now()/200);
        const g=this.ctx.createRadialGradient(Core_Game.width/2,Core_Game.height/2,Core_Game.height/2,Core_Game.width/2,Core_Game.height/2,Core_Game.height); 
        g.addColorStop(0,"transparent"); g.addColorStop(1,`rgba(${Math.min(255, Core_Game.state.heat*2.5)},0,0,${0.8 + heatPulse})`);
        this.ctx.fillStyle=g;this.ctx.fillRect(0,0,Core_Game.width,Core_Game.height);
    }
    drawAllEntities() {
        Core_Game.world.query(['pickup']).forEach(p=>{this.ctx.save();this.ctx.translate(p.c.transform.pos.x,p.c.transform.pos.y);this.ctx.rotate(p.c.transform.rot);this.ctx.fillStyle=p.c.render.baseColor;this.ctx.globalAlpha=Math.min(1,p.c.pickup.life/60);this.ctx.beginPath();this.ctx.moveTo(0,-10);this.ctx.lineTo(10,0);this.ctx.lineTo(0,10);this.ctx.lineTo(-10,0);this.ctx.fill();if(Core_Game.config.FX.GLOW){this.ctx.shadowColor=p.c.render.baseColor;this.ctx.shadowBlur=30;this.ctx.stroke();}this.ctx.restore();});
        Core_Game.particles.forEach(p=>{
            this.ctx.globalAlpha=p.life; this.ctx.fillStyle=p.color;
            if(p.type==='IMPLODE') { this.ctx.strokeStyle=p.color; this.ctx.lineWidth=1; this.ctx.beginPath(); this.ctx.moveTo(p.pos.x, p.pos.y); this.ctx.lineTo(p.pos.x+p.vel.x*10, p.pos.y+p.vel.y*10); this.ctx.stroke(); } 
            else { this.ctx.fillRect(p.pos.x,p.pos.y,p.size,p.size); }
        });
        Core_Game.world.queryTag('enemy').forEach(e=>this.drawEntity(e,0)); Core_Game.world.queryTag('player').forEach(p=>this.drawEntity(p,Math.random()*(p.c.combat.state>=cfg_Game.STATE.CHARGE?2:0),p.c.combat.state===cfg_Game.STATE.PARRY));
    }
    drawEntity(e, off, shield) {
        let col=ColorUtils.getDynamicColor(e.c.render.baseColor, e.c.combat.state, e.c.combat.stateTimer);
        if(e.c.combat.invincibleTimer>60&&e.c.combat.invincibleTimer%10<5)col=db_Loot.GOD.color;
        this.ctx.save(); this.ctx.translate(e.c.transform.pos.x+off,e.c.transform.pos.y+off);
        if(e.c.combat.invincibleTimer > 0 && e.c.combat.invincibleTimer % 4 < 2) this.ctx.globalAlpha = 0.4; // IFRAME BLINK
        if(Core_Game.config.FX.GLOW){this.ctx.shadowBlur=e.c.combat.state===cfg_Game.STATE.CHARGE?60:30;this.ctx.shadowColor=col;this.ctx.globalCompositeOperation='screen';}
        if(Core_Game.config.FX.GLOW&&e.c.render.trail.length>0){e.c.render.trail.forEach((t,i)=>{this.ctx.globalAlpha=i/10;this.ctx.fillStyle=col;this.ctx.beginPath();this.ctx.arc(t.x-e.c.transform.pos.x,t.y-e.c.transform.pos.y,e.c.stats.radius,0,2*Math.PI);this.ctx.fill();});this.ctx.globalAlpha=1;}
        const tier=Core_Game.sys.combat.getTier(e); if(tier>=2||(tier>=1&&Core_Game.config.FX.GLOW)){e.c.render.trail.push({x:e.c.transform.pos.x,y:e.c.transform.pos.y});if(e.c.render.trail.length>5)e.c.render.trail.shift();}else e.c.render.trail=[];
        if(shield){this.ctx.strokeStyle=cfg_Visuals.WHITE;this.ctx.lineWidth=4;this.ctx.beginPath();this.ctx.arc(0,0,e.c.stats.radius+8,0,2*Math.PI);this.ctx.stroke();}
        if(e.c.stats.hp<30&&Math.floor(Date.now()/50)%2==0)this.ctx.globalAlpha=0.4;
        this.ctx.rotate(Math.atan2(e.c.velocity.y,e.c.velocity.x));
        const str=1+Math.min(e.c.velocity.magnitude()/60,0.8); this.ctx.scale(str,1/str);
        this.ctx.fillStyle=col;this.ctx.beginPath();this.ctx.arc(0,0,e.c.stats.radius,0,2*Math.PI);this.ctx.fill();
        this.ctx.fillStyle=cfg_Visuals.WHITE;this.ctx.globalAlpha=0.4;this.ctx.beginPath();this.ctx.arc(0,0,e.c.stats.radius*0.6,0,2*Math.PI);this.ctx.fill();
        this.ctx.restore();
    }
    drawGrid() { 
        this.ctx.fillStyle=Core_Game.state.heat>50?"#221":"#111"; this.ctx.lineWidth=1;
        for(let x=0;x<Core_Game.width;x+=100) { for(let y=0;y<Core_Game.height;y+=100) {
            if((x+y)%200===0) { this.ctx.fillStyle=Core_Game.state.heat>70?"#511":"#222"; this.ctx.fillRect(x-1,y-10,2,20); this.ctx.fillRect(x-10,y-1,20,2); } 
            else { this.ctx.fillStyle="#1a1a1a"; this.ctx.fillRect(x-2,y-2,4,4); }
        }}
    }
}

// ==========================================
// 5. CORE LOOP (Core_)
// ==========================================
class Core_Game {
    static world=new Core_EntityManager(); static entities={blood:[],texts:[]}; static particles=[]; static shockwaves=[];
    static state={inMenu:true, subMode:"SOLO",score:0,streak:0,heat:0,shakeIntensity:0,hitStopTimer:0,flashOpacity:0,waveTimer:0,lootTimer:1800,chromaticAberration:0,invertedFrame:false,particleSpawnCount:0};
    static config={ FX:{BLOOD:true,SHAKE:true,FLASH:true,GLOW:true,GRID:true}, BOUNDS:25, update:()=>{} };
    static bus=new Core_Bus(); static width=window.innerWidth; static height=window.innerHeight;
    static sys={}; // Container for instantiated systems
    
    static ui={
        menu:document.getElementById("floor-interface"), title:document.getElementById("menu-title"), score:document.getElementById("score-val"), heat:document.getElementById("heat-val"), actionBtn:document.getElementById("btn-main-action"), menuFocusIdx:0, menuElements:[],
        triggerStart:()=>{ 
            if(Core_Game.state.inMenu){
                Core_Game.state.inMenu = false; document.body.classList.remove('menu-mode');
                Core_Game.ui.menu.classList.remove("active"); Core_Game.ui.menu.classList.add("passive");
                Core_Game.director.startGame();
            } else {
                Core_Game.state.inMenu = true; document.body.classList.add('menu-mode');
                Core_Game.ui.menu.classList.remove("passive"); Core_Game.ui.menu.classList.add("active");
            }
        },
        setupFocus:()=>{ Core_Game.ui.menuElements=Array.from(document.querySelectorAll('#floor-interface button')); Core_Game.ui.menuFocusIdx=Core_Game.ui.menuElements.length-1; Core_Game.ui.updateFocus(); },
        updateFocus:()=>{ Core_Game.ui.menuElements.forEach((e,i)=>{const a=i===Core_Game.ui.menuFocusIdx;e.classList.toggle('focused',a);if(a)e.scrollIntoView({block:'nearest'});}); },
        navFocus:(d)=>{ if(!Core_Game.ui.menuElements.length)Core_Game.ui.setupFocus(); Core_Game.ui.menuFocusIdx=(Core_Game.ui.menuFocusIdx+d+Core_Game.ui.menuElements.length)%Core_Game.ui.menuElements.length; Core_Game.ui.updateFocus(); },
        triggerFocus:()=>{ if(!Core_Game.ui.menuElements.length)return; Core_Game.ui.menuElements[Core_Game.ui.menuFocusIdx].click(); },
        updateScore:()=>{ Core_Game.ui.score.innerText=Math.floor(Core_Game.state.score); Core_Game.ui.heat.innerText=`HEAT // ${Math.floor(Core_Game.state.heat)}%`; }
    };
    
    static director={
        setMode:(m)=>{Core_Game.state.subMode=m; document.getElementById("btn-mode-solo").classList.toggle('active',m==='SOLO'); document.getElementById("btn-mode-vs").classList.toggle('active',m==='COOP');},
        startAttractMode:()=>{
            Core_Game.world.entities=[]; Core_Game.world.idCounter=0; Core_Game.particles=[]; Core_Game.entities.texts=[]; Core_Game.entities.blood=[];
            const ai1 = Factory_Entity.createFromBlueprint('PLAYER_P1', Core_Game.width*0.3, Core_Game.height/2); ai1.c.input.id = 'ai'; ai1.addComponent('ai', {behavior:db_AI_Behaviors.AGGRESSIVE, traits:["BRAVE"], memory:{hitsTaken:0}, decisionTimer:0, currentAction:null});
            const ai2 = Factory_Entity.createFromBlueprint('PLAYER_P2', Core_Game.width*0.7, Core_Game.height/2); ai2.c.input.id = 'ai'; ai2.addComponent('ai', {behavior:db_AI_Behaviors.AGGRESSIVE, traits:["BRAVE"], memory:{hitsTaken:0}, decisionTimer:0, currentAction:null});
            Core_Game.ui.title.innerText="SYSTEM_IDLE"; Core_Game.ui.actionBtn.innerText="INITIALIZE";
            Core_Game.state.inMenu = true; document.body.classList.add('menu-mode');
        },
        startGame:()=>{ 
            Core_Game.loop.resize(); Core_Game.sys.input.raw.p1.move=new Vector(0,0); Core_Game.sys.input.raw.p2.move=new Vector(0,0); Core_Game.world.entities=[]; Core_Game.world.idCounter=0; Core_Game.particles=[]; Core_Game.entities.texts=[]; Core_Game.entities.blood=[];
            const p1=Factory_Entity.createFromBlueprint('PLAYER_P1',Core_Game.width/2,Core_Game.height/2); if(Core_Game.state.subMode==='COOP'){p1.c.transform.pos.x-=100;Factory_Entity.createFromBlueprint('PLAYER_P2',Core_Game.width/2+100,Core_Game.height/2);}
            Core_Game.state.score=0; Core_Game.state.heat=0; Core_Game.ui.updateScore(); Core_Game.state.streak=0; Core_Game.state.shakeIntensity=0; Core_Game.state.hitStopTimer=0; Core_Game.state.waveTimer=0; Core_Game.state.lootTimer=1800; 
            Core_Game.ui.title.innerText="SYSTEM_ACTIVE"; Core_Game.ui.actionBtn.innerText="RESTART"; 
            Core_Game.sys.input.setupTouchUI(); 
        },
        spawnWave:()=>{ 
            const ec=Core_Game.world.queryTag('enemy').length; const target = 1 + Math.floor(Core_Game.state.heat / 20); 
            if(ec < target){
                const r=Math.random(),t=r<0.02?"ENEMY_BOSS":(r<0.15?"ENEMY_ELITE":"ENEMY_NORMAL"),side=Math.floor(Math.random()*4),pos=[new Vector(Math.random()*Core_Game.width,-40),new Vector(Core_Game.width+40,Math.random()*Core_Game.height),new Vector(Math.random()*Core_Game.width,Core_Game.height+40),new Vector(-40,Math.random()*Core_Game.height)][side]; 
                Factory_Entity.createEnemy(t,pos.x,pos.y);
            }
            Core_Game.state.lootTimer--; if(Core_Game.state.lootTimer<=0){Factory_Entity.createPickup(Math.random()*(Core_Game.width-100)+50,Math.random()*(Core_Game.height-100)+50,Math.random()>0.8?"LIFE":(Math.random()>0.5?"GOD":"HEAL")); Core_Game.state.lootTimer=1800+Math.random()*1800;} 
        },
        gameOver:()=>{ 
            Core_Game.state.inMenu = true; document.body.classList.add('menu-mode');
            Core_Game.ui.menu.classList.remove("passive"); Core_Game.ui.menu.classList.add("active");
            Core_Game.ui.title.innerText="SIGNAL_LOST"; Core_Game.ui.actionBtn.innerText="RESTART"; 
            Core_Game.ui.setupFocus(); 
        }
    };
    static init() {
        // Initialize Systems
        this.sys.audio = new Sys_Audio();
        this.sys.input = new Sys_Input();
        this.sys.ai = new Sys_AI();
        this.sys.physics = new Sys_Physics();
        this.sys.combat = new Sys_Combat();
        this.sys.rules = new Sys_Rules();
        this.sys.render = new Sys_Render();

        this.loop={ id:null, lastTime:0, accumulator:0, step:1000/60, resize:()=>{Core_Game.width=document.getElementById("gameCanvas").width=window.innerWidth;Core_Game.height=document.getElementById("gameCanvas").height=window.innerHeight;}, run:(ts)=>{
            if(!Core_Game.loop.lastTime)Core_Game.loop.lastTime=ts; let dt=ts-Core_Game.loop.lastTime; Core_Game.loop.lastTime=ts; if(dt>1000)dt=Core_Game.loop.step;
            Core_Game.loop.accumulator+=dt; let steps=0; 
            while(Core_Game.loop.accumulator>=Core_Game.loop.step){
                if(Core_Game.state.hitStopTimer>0)Core_Game.state.hitStopTimer--; 
                else { 
                    Core_Game.sys.input.update(); 
                    if(!Core_Game.state.inMenu) { Core_Game.state.heat = Math.max(0, Core_Game.state.heat - cfg_Game.HEAT.DECAY); Core_Game.ui.updateScore(); }
                    else if(Core_Game.state.inMenu && Core_Game.world.queryTag('player').length === 0 && Core_Game.world.idCounter > 0) {
                         const ai1 = Factory_Entity.createFromBlueprint('PLAYER_P1', Core_Game.width*0.3, Core_Game.height/2); ai1.c.input.id = 'ai'; ai1.addComponent('ai', {behavior:db_AI_Behaviors.AGGRESSIVE, traits:["BRAVE"], memory:{hitsTaken:0}, decisionTimer:0, currentAction:null});
                         const ai2 = Factory_Entity.createFromBlueprint('PLAYER_P2', Core_Game.width*0.7, Core_Game.height/2); ai2.c.input.id = 'ai'; ai2.addComponent('ai', {behavior:db_AI_Behaviors.AGGRESSIVE, traits:["BRAVE"], memory:{hitsTaken:0}, decisionTimer:0, currentAction:null});
                    }
                    Core_Game.director.spawnWave(); 
                    Core_Game.sys.ai.update(); Core_Game.sys.physics.update(); Core_Game.sys.combat.update(); Core_Game.world.cleanup(); 
                    Core_Game.entities.texts.forEach((t,i)=>{t.position.add(t.velocity);t.life-=0.02;if(t.life<=0)Core_Game.entities.texts.splice(i,1)}); 
                    Core_Game.entities.blood.forEach(b=>{b.position.add(b.velocity);b.velocity.multiply(0.85);}); 
                    Core_Game.particles.forEach((p,i)=>{p.pos.add(p.vel);p.vel.multiply(0.9);p.life-=0.05;if(p.life<=0)Core_Game.particles.splice(i,1)}); 
                    Core_Game.shockwaves.forEach((s,i)=>{s.r+=4; s.alpha-=0.05; if(s.alpha<=0)Core_Game.shockwaves.splice(i,1)});
                    if(Core_Game.world.queryTag('player').length===0 && !Core_Game.state.inMenu) Core_Game.director.gameOver(); 
                }
                Core_Game.state.shakeIntensity=Math.max(0,Core_Game.state.shakeIntensity*0.9-0.1); 
                Core_Game.state.flashOpacity=Math.max(0,Core_Game.state.flashOpacity-0.05); 
                Core_Game.state.chromaticAberration=Math.max(0,Core_Game.state.chromaticAberration-0.5); 
                Core_Game.state.particleSpawnCount=0; 
                Core_Game.loop.accumulator-=Core_Game.loop.step; 
                steps++; if(steps>240){Core_Game.loop.accumulator=0;break;}
            } 
            Core_Game.sys.render.draw(); 
            Core_Game.state.invertedFrame=false;
            Core_Game.loop.id=requestAnimationFrame(Core_Game.loop.run);
        }};
        window.addEventListener("resize",this.loop.resize); 
        this.bus.on('ev_shake',a=>{if(this.config.FX.SHAKE)this.state.shakeIntensity+=a;}); 
        this.bus.on('ev_flash',o=>{if(this.config.FX.FLASH)this.state.flashOpacity=o;}); 
        this.bus.on('ev_particle',d=>{if(Core_Game.state.particleSpawnCount>cfg_Game.FX.MAX_PARTICLES_PER_FRAME)return;if(Core_Game.particles.length>cfg_Game.FX.MAX_PARTICLES)Core_Game.particles.shift();Core_Game.state.particleSpawnCount++;Factory_Entity.createParticle(d.x,d.y,d.col,d.spd);}); 
        this.bus.on('ev_particle_suction',d=>{ for(let i=0;i<d.n;i++){ let ang=Math.random()*6.28, dist=30+Math.random()*20; Core_Game.particles.push({active:true, type:'IMPLODE', pos:new Vector(d.target.c.transform.pos.x+Math.cos(ang)*dist, d.target.c.transform.pos.y+Math.sin(ang)*dist), vel:new Vector(-Math.cos(ang)*2, -Math.sin(ang)*2), color:d.target.c.render.baseColor, life:1, size:2}); }});
        this.bus.on('ev_particle_burst',d=>{if(!this.config.FX.BLOOD&&!this.config.FX.FLASH)return;for(let i=0;i<d.n;i++)this.bus.emit('ev_particle',{x:d.x,y:d.y,col:d.col,spd:Math.random()*10+5});}); 
        this.bus.on('ev_text',d=>this.entities.texts.push({position:new Vector(d.x,d.y),velocity:new Vector(Math.random()-0.5,-2),str:d.txt,color:d.col,life:1}));
        this.loop.resize(); 
        this.director.startAttractMode();
        this.loop.id=requestAnimationFrame(this.loop.run);
    }
}
Core_Game.init();
</script>
