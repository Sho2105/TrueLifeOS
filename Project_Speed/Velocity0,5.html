<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Project: Speed [Refined]</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    :root { --c-cyan:#dcdcdc; --c-pink:#ff0000; --c-yell:#fff; --c-bg:#000; --c-dim:#333; }
    body { margin:0; overflow:hidden; background-color:var(--c-bg); color:#eee; font-family:'VT323',monospace; user-select:none; touch-action:none; }
    body::after { content:" "; display:block; position:absolute; top:0; left:0; bottom:0; right:0; background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03)); z-index:100; background-size:100% 2px, 3px 100%; pointer-events:none; opacity:0.8; mix-blend-mode:overlay; }
    canvas { display:block; cursor:none; image-rendering:pixelated; filter:contrast(1.2) saturate(1.1) grayscale(0.1); }
    #ui-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:20; }
    #pause-menu { display:block; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:#000; border:4px solid #fff; padding:25px; text-align:center; pointer-events:auto; box-shadow:10px 10px 0 #333; min-width:350px; max-height:90vh; overflow-y:auto; z-index:60; }
    .menu-btn { background:#000; color:#888; border:2px solid #333; font-family:'VT323',monospace; font-size:28px; padding:10px 20px; cursor:pointer; margin-top:15px; width:100%; text-transform:uppercase; transition:0.1s; }
    .menu-btn:hover, .menu-btn.focused { background:#fff; color:#000; border-color:#fff; }
    .menu-btn.active { background:#333; color:#fff; border:2px solid #fff; }
    .control-row { display:flex; justify-content:space-between; font-size:20px; color:#666; margin-bottom:5px; border-bottom:1px solid #222; }
    b { color:#ccc; }
    .fx-toggle-row { display:flex; justify-content:space-between; align-items:center; font-size:22px; margin:8px 0; color:#888; padding:0 5px; }
    .fx-toggle-row.focused { background:#fff; color:#000; }
    input[type="checkbox"] { width:20px; height:20px; accent-color:#fff; cursor:pointer; }
    #game-over { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center; display:none; pointer-events:auto; z-index:50; }
    #game-over h2 { font-size:120px; margin:0; color:#fff; text-shadow:4px 4px 0 #ff0000; animation:glitch 0.2s infinite; line-height:0.8; letter-spacing:-5px;}
    @keyframes glitch { 0% { transform:translate(-2px, 2px); } 50% { transform:translate(2px, -2px); } 100% { transform:translate(0, 0); } }
    .touch-container { display:none; position:absolute; z-index:30; pointer-events:none; width:100%; height:100%; top:0; left:0; }
    .touch-pad { position:absolute; border:2px solid rgba(255, 255, 255, 0.2); border-radius:50%; backdrop-filter:grayscale(1); pointer-events:auto; }
    .stick-base { width:120px; height:120px; background:rgba(0, 0, 0, 0.5); }
    .stick-nub { position:absolute; top:50%; left:50%; width:50px; height:50px; background:#fff; border-radius:50%; transform:translate(-50%, -50%); pointer-events:none; }
    .btn-action { width:90px; height:90px; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:bold; border-color:#fff;}
    .btn-action:active, .btn-action.active { background:#fff; color:#000; }
</style>

<div id="ui-layer">
    <div id="game-over">
        <h2 id="go-title">WASTED</h2>
        <p style="font-size:40px; color:#000; background:#fff; display:inline-block; padding:0 15px; font-weight:bold;">SCORE: <span id="final-score">0</span></p>
        <button class="menu-btn" style="background:#000; color:#fff; border-color:#fff; margin-top:20px;" onclick="Game.events.emit('reset_request')">RESTART</button>
    </div>
</div>
<div id="touch-layer" class="touch-container"></div>
<div id="pause-menu">
    <h2 style="color:#fff; margin:0 0 15px 0; border-bottom:4px solid #fff; letter-spacing:2px;">SYSTEM READY</h2>
    <div style="margin-bottom:15px;">
        <div class="control-row" style="border:none; justify-content:center; gap:10px;">
            <button id="btn-mode-solo" class="menu-btn active" style="margin:0; width:45%" onclick="Game.director.setMode('SOLO')">SOLO</button>
            <button id="btn-mode-vs" class="menu-btn" style="margin:0; width:45%" onclick="Game.director.setMode('COOP')">CO-OP</button>
        </div>
        <div class="control-row" style="border:none; justify-content:center; gap:5px; margin-top:10px;">
            <button id="btn-input-mouse" class="menu-btn active" style="margin:0; width:22%; font-size:20px;" onclick="Game.input.setScheme('MOUSE')">MSE</button>
            <button id="btn-input-key" class="menu-btn" style="margin:0; width:22%; font-size:20px;" onclick="Game.input.setScheme('KEYBOARD')">KEY</button>
            <button id="btn-input-touch" class="menu-btn" style="margin:0; width:22%; font-size:20px;" onclick="Game.input.setScheme('TOUCH')">TCH</button>
            <button id="btn-input-pad" class="menu-btn" style="margin:0; width:22%; font-size:20px;" onclick="Game.input.setScheme('GAMEPAD')">PAD</button>
        </div>
    </div>
    <div id="controls-desc" style="text-align:left; margin-bottom:20px;"></div>
    <button class="menu-btn" onclick="Game.ui.toggleMenu()">DEPLOY</button>
</div>
<canvas id="gameCanvas"></canvas>

<script>
// --- CONSTANTS & DATA ---
const PALETTE = { CYAN:"#00f3ff", PINK:"#ff0055", YELLOW:"#ffe600", WHITE:"#ffffff", DARK:"#050505", GREY:"#444", GREEN:"#00ff00", RED:"#ff4757", ORANGE:"#ffa502", LIME:"#2ed573", BLUE:"#1e90ff", INDIGO:"#3742fa", SLATE:"#747d8c", IRON:"#57606f", PURPLE:"#8e44ad", CRIMSON:"#c0392b" };

const CONSTANTS = {
    PHYSICS: { FRICTION: 0.92, ACCEL_BASE: 2.0, DASH_IMPULSE: 25, HYPER_IMPULSE: 70, GOD_IMPULSE: 100, RECOIL_FORCE: 2.0 },
    SPEED_MOD: { STOP: 0, WALK: 0.4, BASE: 1.0, SPRINT: 1.8 },
    TIER: { STOP:0, WALK:0.5, BASE:1, HIGH:2, HYPER:3, GOD:4 },
    DAMAGE: { T1:10, T2:25, T3:50, T4:999 },
    COLORS: { P1:PALETTE.CYAN, P2:PALETTE.ORANGE, HYPER:PALETTE.WHITE, TEXT:PALETTE.WHITE },
    TIMING: { TAP_WINDOW:12, CHARGE_T3:90, CHARGE_T4:150, DASH_CD:300, PARRY_CD:60, TURN_CD:30, AI_THINK_MIN:30, AI_THINK_MAX:60 },
    STATE: { IDLE:0, MOVE:1, WALK:2, SPRINT:3, DASH:4, PARRY:5, DODGE:6, CHARGE:7, TIER3_READY:8, TIER4_READY:9, STUN:10 },
    MAX_PARTICLES:200, MAX_PARTICLES_PER_FRAME:10
};

const ACTION_REGISTRY = {
    'GET_LOOT': (e, t) => { e.c.input.btnA=false; e.c.input.btnB=false; const d=Vector.sub(t.c.transform.pos, e.c.transform.pos).normalize(); e.c.velocity.add(d.multiply(CONSTANTS.PHYSICS.ACCEL_BASE * CONSTANTS.SPEED_MOD.BASE)); },
    'APPROACH': (e, t) => { e.c.input.btnA=false; e.c.input.btnB=false; const d=Vector.sub(t.c.transform.pos, e.c.transform.pos).normalize(); e.c.velocity.add(d.multiply(CONSTANTS.PHYSICS.ACCEL_BASE * CONSTANTS.SPEED_MOD.BASE)); },
    'SPRINT_ATK': (e, t) => { e.c.input.btnA=true; e.c.input.btnB=false; e.c.input.aim=Vector.sub(t.c.transform.pos, e.c.transform.pos); },
    'DASH_ATK': (e, t) => { e.c.input.btnA=true; e.c.input.btnB=false; e.c.input.simTapA=true; e.c.input.aim=Vector.sub(t.c.transform.pos, e.c.transform.pos); },
    'PARRY': (e) => { e.c.input.btnB=true; e.c.input.btnA=false; e.c.input.simTapB=true; },
    'CHARGE_HYPER': (e, t) => { e.c.input.btnA=true; e.c.input.btnB=true; e.c.input.aim=Vector.sub(t.c.transform.pos, e.c.transform.pos); }
};

const BEHAVIOR_SETS = {
    AGGRESSIVE: [ { type:'GET_LOOT', weight:3.0, range:[0,400] }, { type:'PARRY', weight:0.5, cd:'parry', range:[0,80] }, { type:'DASH_ATK', weight:2.0, cd:'dash', range:[80,300] }, { type:'APPROACH', weight:1.0, range:[300,2000] } ],
    DEFENSIVE: [ { type:'GET_LOOT', weight:2.0, range:[0,300] }, { type:'PARRY', weight:1.5, cd:'parry', range:[0,120] }, { type:'APPROACH', weight:0.5, range:[150,400] } ],
    BOSS: [ { type:'GET_LOOT', weight:5.0, range:[0,600] }, { type:'CHARGE_HYPER', weight:0.5, range:[0,800] }, { type:'PARRY', weight:0.8, cd:'parry', range:[0,120] }, { type:'DASH_ATK', weight:1.0, cd:'dash', range:[120,500] }, { type:'APPROACH', weight:0.3, range:[100,2000] } ]
};

const BLUEPRINTS = {
    PLAYER_P1: { tags:['player','p1'], stats:{hp:100, maxHp:100, radius:16}, render:{color:CONSTANTS.COLORS.P1}, input:{id:'p1'} },
    PLAYER_P2: { tags:['player','p2'], stats:{hp:100, maxHp:100, radius:16}, render:{color:CONSTANTS.COLORS.P2}, input:{id:'p2'} },
    ENEMY_NORMAL: { stats:{hp:100, radius:16}, behavior:"AGGRESSIVE", traits:["BRAVE"], variants:[PALETTE.RED] },
    ENEMY_ELITE: { stats:{hp:800, radius:20}, behavior:"DEFENSIVE", traits:["CAUTIOUS"], variants:[PALETTE.SLATE] },
    ENEMY_BOSS: { stats:{hp:5000, radius:40}, behavior:"BOSS", traits:["BOSS"], variants:[PALETTE.PURPLE] }
};

const LOOT_REGISTRY = {
    HEAL: { color:PALETTE.GREEN, text:"HP UP", mod:{type:'STAT', key:'hp', val:50} },
    GOD:  { color:PALETTE.YELLOW, text:"GOD MODE", mod:{type:'STATUS', key:'invincibleTimer', val:600} },
    LIFE: { color:PALETTE.CYAN, text:"LIFE-UP", mod:{type:'SPECIAL', key:'life', val:1} }
};

// --- CORE UTILS ---
class Vector {
    constructor(x, y) { this.x=x; this.y=y; }
    add(v) { this.x+=v.x; this.y+=v.y; return this; }
    sub(v) { this.x-=v.x; this.y-=v.y; return this; }
    multiply(s) { this.x*=s; this.y*=s; return this; }
    magnitude() { return Math.sqrt(this.x**2 + this.y**2); }
    normalize() { const m=this.magnitude(); if(m!==0) this.multiply(1/m); return this; }
    clone() { return new Vector(this.x, this.y); }
    static distance(v1, v2) { return Math.sqrt((v1.x-v2.x)**2 + (v1.y-v2.y)**2); }
    static sub(v1, v2) { return new Vector(v1.x-v2.x, v1.y-v2.y); }
}

const ColorUtils = {
    hexToHSL: (H) => {
        let r=0,g=0,b=0; if(H.length==4){r="0x"+H[1]+H[1];g="0x"+H[2]+H[2];b="0x"+H[3]+H[3];}else if(H.length==7){r="0x"+H[1]+H[2];g="0x"+H[3]+H[4];b="0x"+H[5]+H[6];}
        r/=255;g/=255;b/=255; let cmin=Math.min(r,g,b), cmax=Math.max(r,g,b), delta=cmax-cmin, h=0, s=0, l=0;
        if(delta==0)h=0;else if(cmax==r)h=((g-b)/delta)%6;else if(cmax==g)h=(b-r)/delta+2;else h=(r-g)/delta+4;
        h=Math.round(h*60);if(h<0)h+=360;l=(cmax+cmin)/2;s=delta==0?0:delta/(1-Math.abs(2*l-1)); return {h:h,s:s*100,l:l*100};
    },
    HSLToHex: (h,s,l) => {
        s/=100;l/=100; let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
        if(0<=h&&h<60){r=c;g=x;b=0;}else if(60<=h&&h<120){r=x;g=c;b=0;}else if(120<=h&&h<180){r=0;g=c;b=x;}else if(180<=h&&h<240){r=0;g=x;b=c;}else if(240<=h&&h<300){r=x;g=0;b=c;}else if(300<=h&&h<360){r=c;g=0;b=x;}
        r=Math.round((r+m)*255).toString(16).padStart(2,'0');g=Math.round((g+m)*255).toString(16).padStart(2,'0');b=Math.round((b+m)*255).toString(16).padStart(2,'0'); return "#"+r+g+b;
    },
    getStateColor: (base, s) => {
        const hsl = ColorUtils.hexToHSL(base);
        switch (s) {
            case CONSTANTS.STATE.STUN: return PALETTE.GREY;
            case CONSTANTS.STATE.SPRINT: return ColorUtils.HSLToHex(hsl.h, 100, 60);
            case CONSTANTS.STATE.CHARGE: return ColorUtils.HSLToHex(hsl.h, 100, 20);
            case CONSTANTS.STATE.TIER3_READY: return ColorUtils.HSLToHex(hsl.h, 90, 80);
            case CONSTANTS.STATE.TIER4_READY: return ColorUtils.HSLToHex(hsl.h, 30, 80 + Math.sin(Date.now()/40)*20);
            case CONSTANTS.STATE.DASH: case CONSTANTS.STATE.PARRY: return PALETTE.WHITE;
            case CONSTANTS.STATE.WALK: return ColorUtils.HSLToHex(hsl.h, 30, 30);
            default: return base;
        }
    }
};

class EventBus { constructor() { this.l={}; } on(e,c) { (this.l[e]=this.l[e]||[]).push(c); } emit(e,d) { if(this.l[e]) this.l[e].forEach(c=>c(d)); } }

// --- ECS ---
class Entity { constructor(id) { this.id=id; this.c={}; this.tags=new Set(); this.active=true; } addComponent(n,d) { this.c[n]=d; return this; } has(n) { return !!this.c[n]; } hasTag(t) { return this.tags.has(t); } }
class EntityManager {
    constructor() { this.entities=[]; this.idCounter=0; }
    create() { const e=new Entity(++this.idCounter); this.entities.push(e); return e; }
    destroy(e) { e.active=false; }
    cleanup() { this.entities=this.entities.filter(e=>e.active); }
    query(c) { return this.entities.filter(e=>e.active && c.every(n=>e.has(n))); }
    queryTag(t) { return this.entities.filter(e=>e.active && e.hasTag(t)); }
}

const EntityFactory = {
    createFromBlueprint: (type, x, y) => {
        const e = Game.world.create(), bp = BLUEPRINTS[type];
        if(!bp && type.includes('ENEMY')) return EntityFactory.createEnemy(type, x, y); 
        e.c.transform={pos:new Vector(x,y), rot:0}; e.c.velocity=new Vector(0,0);
        if(bp.tags) bp.tags.forEach(t=>e.tags.add(t));
        if(bp.stats) e.addComponent('stats', {...bp.stats, extraLife:0});
        if(bp.render) e.addComponent('render', {...bp.render, baseColor:bp.render.color, trail:[]});
        if(bp.input) e.addComponent('input', {...bp.input, btnA:false, btnB:false, framesA:0, framesB:0, aim:new Vector(0,0)});
        e.addComponent('combat', {state:CONSTANTS.STATE.IDLE, stateTimer:0, cooldowns:{parry:0, dash:0, turn:0}, invincibleTimer:0});
        return e;
    },
    createEnemy: (key, x, y) => {
        const e = Game.world.create(), cfg = BLUEPRINTS[key];
        e.tags.add('enemy'); e.tags.add(key); e.c.transform={pos:new Vector(x,y), rot:0}; e.c.velocity=new Vector(0,0);
        e.addComponent('stats', {...cfg.stats, maxHp:cfg.stats.hp, extraLife:0});
        e.addComponent('render', {baseColor:cfg.variants[0], trail:[]});
        e.addComponent('input', {id:'ai', btnA:false, btnB:false, framesA:0, framesB:0, aim:new Vector(0,0), simTapA:false, simTapB:false});
        e.addComponent('combat', {state:CONSTANTS.STATE.IDLE, stateTimer:0, cooldowns:{parry:0, dash:0, turn:0}, invincibleTimer:0});
        e.addComponent('ai', {behavior:BEHAVIOR_SETS[cfg.behavior], traits:cfg.traits||[], memory:{hitsTaken:0}, decisionTimer:0, currentAction:null});
        return e;
    },
    createPickup: (x, y, key) => {
        const e = Game.world.create(); e.tags.add('pickup'); e.c.transform={pos:new Vector(x,y), rot:0}; e.c.velocity=new Vector(0,0);
        e.addComponent('pickup', {type:key, life:1200, data:LOOT_REGISTRY[key]});
        e.addComponent('render', {baseColor:LOOT_REGISTRY[key].color}); return e;
    },
    createParticle: (x, y, c, s) => { Game.particles.push({active:true, pos:new Vector(x,y), vel:new Vector(Math.cos(Math.random()*6.28)*s, Math.sin(Math.random()*6.28)*s), color:c, life:1, size:Math.random()*4+2}); }
};

// --- SYSTEMS ---
class InputSystem {
    constructor() {
        this.scheme="MOUSE"; this.raw={p1:{btnA:false,btnB:false,move:new Vector(0,0)}, p2:{btnA:false,btnB:false,move:new Vector(0,0)}};
        this.keys={}; this.touchData={}; this.mouse={x:0,y:0}; this.setupListeners();
    }
    setupListeners() {
        window.addEventListener('keydown', e=>{ if(Game.state.mode!=='PLAY'){e.preventDefault(); const ui=Game.ui; if(['ArrowUp','KeyW'].includes(e.code))ui.navFocus(-1); if(['ArrowDown','KeyS'].includes(e.code))ui.navFocus(1); if(['Enter','Space'].includes(e.code))ui.triggerFocus();} else this.keys[e.code]=true; });
        window.addEventListener('keyup', e=>this.keys[e.code]=false);
        window.addEventListener('mousemove', e=>{if(this.scheme==='MOUSE'){this.mouse.x=e.clientX;this.mouse.y=e.clientY;}});
        window.addEventListener('mousedown', e=>{if(this.scheme==='MOUSE'&&Game.state.mode==='PLAY'){if(e.button===0)this.raw.p1.btnA=true;if(e.button===2)this.raw.p1.btnB=true;}});
        window.addEventListener('mouseup', e=>{if(this.scheme==='MOUSE'){if(e.button===0)this.raw.p1.btnA=false;if(e.button===2)this.raw.p1.btnB=false;}});
        window.addEventListener('contextmenu', e=>e.preventDefault());
    }
    update() {
        if(Game.state.mode!=='PLAY') return;
        this.pollGamepads(); this.mapInputs();
        Game.world.query(['input','combat','velocity']).forEach(e=>{
            const i=e.c.input, c=e.c.combat, prevA=i.framesA, prevB=i.framesB;
            if([CONSTANTS.STATE.STUN, CONSTANTS.STATE.DASH, CONSTANTS.STATE.PARRY, CONSTANTS.STATE.DODGE].includes(c.state)){ if(i.id!=='ai'){i.framesA=this.raw[i.id].btnA?i.framesA+1:0; i.framesB=this.raw[i.id].btnB?i.framesB+1:0;} return; }
            let pA=false, pB=false, move=new Vector(0,0);
            if(i.id==='ai') {
                pA=i.btnA; pB=i.btnB;
                if(i.simTapA){i.framesA=1;i.simTapA=false;pA=false;} else if(pA)i.framesA++; else i.framesA=0;
                if(i.simTapB){i.framesB=1;i.simTapB=false;pB=false;} else if(pB)i.framesB++; else i.framesB=0;
                move=i.aim.clone().normalize();
            } else {
                pA=this.raw[i.id].btnA; pB=this.raw[i.id].btnB; i.framesA=pA?i.framesA+1:0; i.framesB=pB?i.framesB+1:0;
                if(this.scheme==='MOUSE'&&i.id==='p1'){ if(Vector.distance(e.c.transform.pos,this.mouse)>10) move=Vector.sub(this.mouse,e.c.transform.pos).normalize(); }
                else { if(this.raw[i.id].move.magnitude()>0.1) move=this.raw[i.id].move; }
                if(i.framesA>CONSTANTS.TIMING.TAP_WINDOW && prevB>0 && i.framesB===0 && c.cooldowns.turn<=0) { e.c.velocity.multiply(0.1); c.cooldowns.turn=CONSTANTS.TIMING.TURN_CD; Game.events.emit('particle',{x:e.c.transform.pos.x,y:e.c.transform.pos.y,col:PALETTE.WHITE,spd:2}); return; }
                if(i.framesB>CONSTANTS.TIMING.TAP_WINDOW && prevA>0 && i.framesA===0 && c.cooldowns.parry<=0) { c.state=CONSTANTS.STATE.DODGE; c.stateTimer=15; c.invincibleTimer=15; c.cooldowns.parry=CONSTANTS.TIMING.PARRY_CD; e.c.velocity.add(move.multiply(CONSTANTS.PHYSICS.DASH_IMPULSE*0.5)); return; }
            }
            if(i.framesA>CONSTANTS.TIMING.TAP_WINDOW && i.framesB>CONSTANTS.TIMING.TAP_WINDOW) {
                const ct=Math.min(i.framesA, i.framesB); e.c.velocity.multiply(0.5);
                c.state = ct>CONSTANTS.TIMING.CHARGE_T4 ? CONSTANTS.STATE.TIER4_READY : (ct>CONSTANTS.TIMING.CHARGE_T3 ? CONSTANTS.STATE.TIER3_READY : CONSTANTS.STATE.CHARGE);
                if(c.state===CONSTANTS.STATE.TIER4_READY && ct%5===0) Game.events.emit('shake',2);
                return;
            }
            if(c.state>=CONSTANTS.STATE.CHARGE && c.state<=CONSTANTS.STATE.TIER4_READY) {
                if(!pA||!pB) {
                    if(c.state===CONSTANTS.STATE.TIER4_READY || c.state===CONSTANTS.STATE.TIER3_READY) {
                        const god=c.state===CONSTANTS.STATE.TIER4_READY, angle=(this.scheme==='MOUSE'&&i.id==='p1')?Math.atan2(this.mouse.y-e.c.transform.pos.y,this.mouse.x-e.c.transform.pos.x):Math.atan2(move.y,move.x), spd=god?CONSTANTS.PHYSICS.GOD_IMPULSE:CONSTANTS.PHYSICS.HYPER_IMPULSE;
                        c.state=CONSTANTS.STATE.DASH; c.stateTimer=15; e.c.velocity=new Vector(Math.cos(angle)*spd, Math.sin(angle)*spd); e.c.combat.tierOverride=god?4:3;
                        Game.events.emit('shake',god?20:10); Game.events.emit('flash',god?0.5:0.2); Game.events.emit('particle_burst',{x:e.c.transform.pos.x,y:e.c.transform.pos.y,col:PALETTE.WHITE,n:30});
                    } else c.state=CONSTANTS.STATE.IDLE;
                } return;
            }
            if(!pA && (i.id==='ai'?true:prevA>0 && prevA<CONSTANTS.TIMING.TAP_WINDOW) && c.cooldowns.dash<=0) {
                c.state=CONSTANTS.STATE.DASH; c.stateTimer=10; c.cooldowns.dash=CONSTANTS.TIMING.DASH_CD;

class AISystem {
    update() {
        const ps=Game.world.queryTag('player'), pickups=Game.world.queryTag('pickup'); if(!ps.length)return;
        Game.world.query(['ai','combat']).forEach(me=>{
            const c=me.c.combat, ai=me.c.ai;
            if([CONSTANTS.STATE.STUN, CONSTANTS.STATE.DASH, CONSTANTS.STATE.PARRY].includes(c.state)) return;
            ai.decisionTimer--;
            if(ai.decisionTimer > 0 && ai.currentAction) {
                const target = ai.currentAction.targetType === 'LOOT' ? pickups.find(p=>p.id===ai.currentAction.targetId) : ps.find(p=>p.id===ai.currentAction.targetId);
                if(target && target.active) ACTION_REGISTRY[ai.currentAction.type](me, target);
                else ai.decisionTimer = 0;
                return;
            }
            const pTarget = ps.reduce((p,c)=>Vector.distance(me.c.transform.pos,p.c.transform.pos)<Vector.distance(me.c.transform.pos,c.c.transform.pos)?p:c);
            let lootTarget = pickups.length ? pickups.reduce((p,c)=>Vector.distance(me.c.transform.pos,p.c.transform.pos)<Vector.distance(me.c.transform.pos,c.c.transform.pos)?p:c) : null;
            
            const wBehaviors = ai.behavior.map(b=>{
                let w=b.weight; 
                if(ai.traits.includes("BRAVE") && ai.memory.hitsTaken>0 && b.type==='DASH_ATK') w*=2.5;
                if(ai.traits.includes("CAUTIOUS") && ai.memory.hitsTaken>0 && b.type==='PARRY') w*=2.0;
                return {...b, weight:w};
            });
            const valid = wBehaviors.filter(b=>{
                const t = b.type==='GET_LOOT'?lootTarget:pTarget;
                if(!t)return false;
                const d=Vector.distance(me.c.transform.pos, t.c.transform.pos);
                if(b.range && (d<b.range[0]||d>b.range[1])) return false;
                if(b.cd && c.cooldowns[b.cd]>0) return false;
                return true;
            });
            const total = valid.reduce((s,b)=>s+b.weight,0);
            let r=Math.random()*total, selected=null;
            for(const m of valid){r-=m.weight; if(r<=0){selected=m; break;}}
            
            if(selected) {
                const finalT = selected.type==='GET_LOOT'?lootTarget:pTarget;
                ai.currentAction = { type: selected.type, targetId: finalT.id, targetType: selected.type==='GET_LOOT'?'LOOT':'PLAYER' };
                ai.decisionTimer = Math.floor(Math.random() * (CONSTANTS.TIMING.AI_THINK_MAX - CONSTANTS.TIMING.AI_THINK_MIN) + CONSTANTS.TIMING.AI_THINK_MIN);
                ACTION_REGISTRY[selected.type](me, finalT);
            } else {
                ai.currentAction = { type: 'APPROACH', targetId: pTarget.id, targetType: 'PLAYER' };
                ai.decisionTimer = 30;
                ACTION_REGISTRY['APPROACH'](me, pTarget);
            }
        });
    }
}

class MovementSystem {
    update() {
        Game.world.query(['velocity','transform']).forEach(e=>{
            const p=e.c;
            if(e.has('combat')){
                ['dash','parry','turn'].forEach(k=>p.combat.cooldowns[k]=Math.max(0,p.combat.cooldowns[k]-1));
                p.combat.invincibleTimer=Math.max(0,p.combat.invincibleTimer-1); p.combat.stateTimer=Math.max(0,p.combat.stateTimer-1);
                const s=p.combat.state;
                if(s===CONSTANTS.STATE.STUN){ p.velocity.multiply(0.9); if(p.combat.stateTimer<=0)p.combat.state=CONSTANTS.STATE.IDLE; }
                else if(s===CONSTANTS.STATE.DASH){ p.combat.invincibleTimer=2; if(p.combat.stateTimer<=0){p.combat.state=CONSTANTS.STATE.IDLE;p.velocity.multiply(0.5);p.combat.tierOverride=0;} }
                else if(s===CONSTANTS.STATE.PARRY||s===CONSTANTS.STATE.DODGE){ p.velocity.multiply(0.8); if(s===CONSTANTS.STATE.DODGE)p.combat.invincibleTimer=2; if(p.combat.stateTimer<=0)p.combat.state=CONSTANTS.STATE.IDLE; }
                else if(s===CONSTANTS.STATE.CHARGE||s===CONSTANTS.STATE.TIER3_READY||s===CONSTANTS.STATE.TIER4_READY){ p.velocity.multiply(0.5); }
                else { p.velocity.multiply(CONSTANTS.PHYSICS.FRICTION); }
            }
            p.transform.pos.add(p.velocity);
            const b=Game.config.BOUNDS;
            if(p.transform.pos.x<b){p.transform.pos.x=b;p.velocity.x*=-0.8;} if(p.transform.pos.x>Game.width-b){p.transform.pos.x=Game.width-b;p.velocity.x*=-0.8;}
            if(p.transform.pos.y<b){p.transform.pos.y=b;p.velocity.y*=-0.8;} if(p.transform.pos.y>Game.height-b){p.transform.pos.y=Game.height-b;p.velocity.y*=-0.8;}
        });
        Game.world.queryTag('pickup').forEach(p=>{p.c.transform.rot+=0.05; p.c.pickup.life--; if(p.c.pickup.life<=0)Game.world.destroy(p);});
        if(Game.state.subMode==='COOP'){const ps=Game.world.queryTag('player'); if(ps.length>1 && Vector.distance(ps[0].c.transform.pos,ps[1].c.transform.pos)<42){const push=Vector.sub(ps[0].c.transform.pos,ps[1].c.transform.pos).normalize().multiply(3); ps[0].c.velocity.add(push); ps[1].c.velocity.sub(push);}}
    }
}

class CombatSystem {
    getTier(e) { if(!e.has('combat'))return 0; if(e.c.combat.tierOverride)return e.c.combat.tierOverride; const s=e.c.combat.state; if(s===CONSTANTS.STATE.DASH||s===CONSTANTS.STATE.SPRINT)return 2; if(s===CONSTANTS.STATE.WALK)return 0.5; if(s===CONSTANTS.STATE.MOVE)return 1; return 0; }
    update() {
        const combatants=Game.world.query(['combat','stats']), enemies=Game.world.queryTag('enemy'), pickups=Game.world.queryTag('pickup');
        combatants.forEach(e=>{
            enemies.forEach(o=>{ if(e!==o && Vector.distance(e.c.transform.pos, o.c.transform.pos)<42) this.resolveCollision(e,o); });
            for(let i=pickups.length-1;i>=0;i--) if(Vector.distance(e.c.transform.pos,pickups[i].c.transform.pos)<30) Game.events.emit('loot_pickup',{target:e,pickup:pickups[i]});
        });
    }
    resolveCollision(e1, e2) {
        if(e1.c.combat.state===CONSTANTS.STATE.STUN) return Game.events.emit('entity_hit',{attacker:e2,victim:e1,tier:this.getTier(e2)});
        if(e2.c.combat.state===CONSTANTS.STATE.STUN) return Game.events.emit('entity_hit',{attacker:e1,victim:e2,tier:this.getTier(e1)});
        const t1=this.getTier(e1), t2=this.getTier(e2);
        if(e1.c.combat.state===CONSTANTS.STATE.PARRY && t2!==4) return Game.events.emit('entity_parry',{blocker:e1,attacker:e2,tier:t1});
        if(e2.c.combat.state===CONSTANTS.STATE.PARRY && t1!==4) return Game.events.emit('entity_parry',{blocker:e2,attacker:e1,tier:t2});
        if(t1>=2 && t2>=2){ if(t1===t2)Game.events.emit('clash',{e1,e2}); else if(t1>t2)Game.events.emit('entity_hit',{attacker:e1,victim:e2,tier:t1}); else Game.events.emit('entity_hit',{attacker:e2,victim:e1,tier:t2}); return; }
        if(t1>=2 && t2<2) Game.events.emit('entity_hit',{attacker:e1,victim:e2,tier:t1}); else if(t2>=2 && t1<2) Game.events.emit('entity_hit',{attacker:e2,victim:e1,tier:t2});
        else { const p=Vector.sub(e1.c.transform.pos,e2.c.transform.pos).normalize().multiply(4); e1.c.velocity.add(p); e2.c.velocity.sub(p); }
    }
}

class LogicSystem {
    constructor() {
        Game.events.on('entity_hit', ({attacker,victim,tier})=>{
            if(victim.c.combat.state!==CONSTANTS.STATE.STUN && victim.c.combat.invincibleTimer>0) return;
            if(victim.c.combat.state===CONSTANTS.STATE.DODGE) return;
            let dmg = tier===4?CONSTANTS.DAMAGE.T4:(tier===3?CONSTANTS.DAMAGE.T3:(tier===2?CONSTANTS.DAMAGE.T2:CONSTANTS.DAMAGE.T1));
            if(victim.c.combat.state===CONSTANTS.STATE.WALK) dmg*=0.5;
            victim.c.stats.hp-=dmg; victim.c.combat.state=CONSTANTS.STATE.IDLE;
            if(victim.has('ai')){ victim.c.ai.memory.hitsTaken++; if(victim.hasTag('BOSS') && victim.c.stats.hp<victim.c.stats.maxHp*0.5) Game.events.emit('boss_phase_change',{boss:victim,phase:2}); }
            const force=tier===4?100:(tier===3?60:(tier===2?30:10)), k=Vector.sub(victim.c.transform.pos,attacker.c.transform.pos).normalize().multiply(force*CONSTANTS.PHYSICS.RECOIL_FORCE);
            victim.c.velocity=k; attacker.c.velocity.add(k.clone().multiply(0.2));
            Game.state.hitStopTimer=(tier>=2)?4:0; Game.events.emit('shake',force/2);
            if(tier>=2){ Game.state.chromaticAberration=10; if(Game.config.FX.FLASH)Game.state.invertedFrame=true; }
            Game.events.emit('particle_burst',{x:victim.c.transform.pos.x,y:victim.c.transform.pos.y,col:victim.c.render.baseColor,n:10+force/2});
            if(victim.c.stats.hp<=0) Game.events.emit('entity_kill',{victim,attacker}); else if(victim.hasTag('player')) Game.state.combo=0;
        });
        Game.events.on('entity_kill', ({victim,attacker})=>{
            if(victim.c.stats.extraLife>0) return Game.events.emit('entity_revive',{entity:victim});
            Game.world.destroy(victim); Game.state.hitStopTimer=2; Game.state.streak++; Game.state.combo++;
            let s=100; if(victim.hasTag('ENEMY_BOSS'))s=5000; else if(victim.hasTag('ENEMY_ELITE'))s=1000;
            Game.state.score+=s*(1+Math.floor(Game.state.combo/5)*2);
            if(!victim.hasTag('ENEMY_NORMAL')){ Game.state.hitStopTimer=15; Game.events.emit('shake',100); Game.events.emit('flash',0.8); }
            if(Game.config.FX.BLOOD) for(let i=0;i<15;i++)Game.entities.blood.push({position:new Vector(victim.c.transform.pos.x,victim.c.transform.pos.y),velocity:new Vector(Math.cos(Math.random()*6.28)*Math.random()*10,Math.sin(Math.random()*6.28)*Math.random()*10),color:victim.c.render.baseColor,size:Math.random()*12+6,rotation:Math.random()*6,life:1000});
        });
        Game.events.on('entity_parry', ({blocker,attacker,tier})=>{
            const r=Vector.sub(attacker.c.transform.pos,blocker.c.transform.pos).normalize().multiply(30);
            attacker.c.velocity=r; attacker.c.combat.state=CONSTANTS.STATE.STUN; attacker.c.combat.stateTimer=(tier>=3)?120:60; attacker.c.combat.invincibleTimer=0;
            blocker.c.velocity=r.clone().multiply(-0.2); blocker.c.combat.invincibleTimer=20; Game.state.hitStopTimer=5;
            Game.events.emit('particle_burst',{x:attacker.c.transform.pos.x,y:attacker.c.transform.pos.y,col:PALETTE.WHITE,n:30}); if(tier>=2){Game.events.emit('flash',0.5);Game.events.emit('shake',30);}
        });
        Game.events.on('clash', ({e1,e2})=>{
            Game.state.hitStopTimer=4; Game.events.emit('shake',30); Game.events.emit('flash',0.3);
            const d=Vector.sub(e1.c.transform.pos,e2.c.transform.pos).normalize();
            e1.c.velocity=d.clone().multiply(40); e2.c.velocity=d.clone().multiply(-40); e1.c.combat.state=e2.c.combat.state=CONSTANTS.STATE.IDLE; e1.c.combat.invincibleTimer=e2.c.combat.invincibleTimer=10;
            const m=Vector.sub(e2.c.transform.pos,e1.c.transform.pos).multiply(0.5).add(e1.c.transform.pos); Game.events.emit('particle_burst',{x:m.x,y:m.y,col:PALETTE.WHITE,n:40});
        });
        Game.events.on('loot_pickup', ({target,pickup})=>{
            Game.events.emit('particle_burst',{x:pickup.c.transform.pos.x,y:pickup.c.transform.pos.y,col:pickup.c.render.baseColor,n:30});
            const m=pickup.c.pickup.data.mod;
            if(m.type==='STAT') target.c.stats[m.key]=Math.min(target.c.stats[m.key]+m.val,target.c.stats.maxHp);
            else if(m.type==='STATUS') target.c.combat[m.key]=m.val;
            else if(m.type==='SPECIAL' && target.hasTag('player')) { if(target.c.stats.extraLife<1)target.c.stats.extraLife++; else target.c.stats.hp=target.c.stats.maxHp; }
            Game.world.destroy(pickup);
        });
        Game.events.on('entity_revive', ({entity})=>{
            entity.c.stats.extraLife--; entity.c.stats.hp=entity.c.stats.maxHp; entity.c.combat.invincibleTimer=180;
            Game.state.hitStopTimer=30; Game.events.emit('shake',50); Game.events.emit('flash',1); Game.events.emit('particle_burst',{x:entity.c.transform.pos.x,y:entity.c.transform.pos.y,col:LOOT_REGISTRY.LIFE.color,n:50});
        });
    }
}

        let col=ColorUtils.getStateColor(e.c.render.baseColor,e.c.combat.state); if(e.c.combat.invincibleTimer>60&&e.c.combat.invincibleTimer%10<5)col=LOOT_REGISTRY.GOD.color;
        this.ctx.save(); this.ctx.translate(e.c.transform.pos.x+off,e.c.transform.pos.y+off);
        if(Game.config.FX.GLOW&&e.c.render.trail.length>0){e.c.render.trail.forEach((t,i)=>{this.ctx.globalAlpha=i/10;this.ctx.fillStyle=col;this.ctx.beginPath();this.ctx.arc(t.x-e.c.transform.pos.x,t.y-e.c.transform.pos.y,e.c.stats.radius,0,2*Math.PI);this.ctx.fill();});this.ctx.globalAlpha=1;}
        const tier=Game.combat.getTier(e); if(tier>=2||(tier>=1&&Game.config.FX.GLOW)){e.c.render.trail.push({x:e.c.transform.pos.x,y:e.c.transform.pos.y});if(e.c.render.trail.length>5)e.c.render.trail.shift();}else e.c.render.trail=[];
        if(shield){this.ctx.strokeStyle=PALETTE.WHITE;this.ctx.lineWidth=3;this.ctx.beginPath();this.ctx.arc(0,0,e.c.stats.radius+8,0,2*Math.PI);this.ctx.stroke();}
        if(e.c.stats.hp<30&&Math.floor(Date.now()/50)%2==0)this.ctx.globalAlpha=0.4;
        this.ctx.rotate(Math.atan2(e.c.velocity.y,e.c.velocity.x));
        const str=1+Math.min(e.c.velocity.magnitude()/60,0.8); this.ctx.scale(str,1/str);
        if(tier>0&&Game.config.FX.GLOW&&e.c.combat.state!==CONSTANTS.STATE.STUN){this.ctx.shadowBlur=20;this.ctx.shadowColor=col;}
        this.ctx.fillStyle=col;this.ctx.beginPath();this.ctx.arc(0,0,e.c.stats.radius,0,2*Math.PI);this.ctx.fill();
        this.ctx.fillStyle=PALETTE.WHITE;this.ctx.globalAlpha=0.4;this.ctx.beginPath();this.ctx.arc(0,0,e.c.stats.radius*0.6,0,2*Math.PI);this.ctx.fill();
        this.ctx.restore();
    }
    drawGrid() { this.ctx.strokeStyle="#222";this.ctx.lineWidth=1;const p1=Game.world.queryTag('player')[0],ox=p1?-p1.c.transform.pos.x*0.1:0,oy=p1?-p1.c.transform.pos.y*0.1:0;this.ctx.beginPath();for(let x=ox%100;x<Game.width;x+=100){this.ctx.moveTo(x,0);this.ctx.lineTo(x,Game.height);}for(let y=oy%100;y<Game.height;y+=100){this.ctx.moveTo(0,y);this.ctx.lineTo(Game.width,y);}this.ctx.stroke(); }
}

// --- GAME ---
class Game {
    static world=new EntityManager(); static entities={blood:[],texts:[]}; static particles=[];
    static state={mode:"PAUSE",subMode:"SOLO",score:0,streak:0,combo:0,shakeIntensity:0,hitStopTimer:0,flashOpacity:0,waveTimer:0,lootTimer:1800,chromaticAberration:0,invertedFrame:false,needsReset:true,particleSpawnCount:0};
    static config={ FX:{BLOOD:true,SHAKE:true,FLASH:true,GLOW:true,GRID:true}, BOUNDS:25, update:()=>{} };
    static events=new EventBus(); static width=window.innerWidth; static height=window.innerHeight;
    static ui={
        menu:document.getElementById("pause-menu"), gameOver:document.getElementById("game-over"), finalScore:document.getElementById("final-score"), controlsDesc:document.getElementById("controls-desc"), menuFocusIdx:0, menuElements:[],
        toggleMenu:()=>{ Game.state.mode=Game.state.mode==="PLAY"?"PAUSE":"PLAY"; Game.ui.menu.style.display=Game.state.mode==="PAUSE"?"block":"none"; if(Game.state.mode==="PLAY"){if(Game.state.needsReset)Game.director.reset();else{Game.input.setupTouchUI();Game.loop.lastTime=0;if(!Game.loop.id)requestAnimationFrame(Game.loop.run);}}else Game.ui.setupFocus(); },
        setupFocus:()=>{ const c=Game.state.mode==='OVER'?Game.ui.gameOver:Game.ui.menu; Game.ui.menuElements=Array.from(c.querySelectorAll('button:not([style*="display: none"]), input')); Game.ui.menuFocusIdx=0; Game.ui.updateFocus(); },
        updateFocus:()=>{ Game.ui.menuElements.forEach((e,i)=>{const a=i===Game.ui.menuFocusIdx;e.classList.toggle('focused',a);if(e.parentElement.classList.contains('fx-toggle-row'))e.parentElement.classList.toggle('focused',a);if(a)e.scrollIntoView({block:'nearest'});}); },
        navFocus:(d)=>{ if(!Game.ui.menuElements.length)Game.ui.setupFocus(); Game.ui.menuFocusIdx=(Game.ui.menuFocusIdx+d+Game.ui.menuElements.length)%Game.ui.menuElements.length; Game.ui.updateFocus(); },
        triggerFocus:()=>{ if(!Game.ui.menuElements.length)return; const e=Game.ui.menuElements[Game.ui.menuFocusIdx]; if(e.tagName==='BUTTON')e.click(); else if(e.type==='checkbox'){e.checked=!e.checked;e.onchange();} },
        updateControlsDesc:()=>{ let h='',s=Game.input.scheme,m=Game.state.subMode; if(s==='MOUSE')h=`<div class="control-row"><span>MOVE</span><b>MOUSE</b></div><div class="control-row"><span>ATK</span><b>LMB</b></div><div class="control-row"><span>RUN</span><b>RMB</b></div>`; else if(s==='KEYBOARD')h=m==='SOLO'?`<div class="control-row"><span>MOVE</span><b>WASD</b></div><div class="control-row"><span>ATK</span><b>Z/SPACE</b></div><div class="control-row"><span>RUN</span><b>X/SHIFT</b></div>`:`<div class="control-row"><span>P1</span><b>WASD+ZX</b></div><div class="control-row"><span>P2</span><b>ARROWS+KL</b></div>`; else if(s==='TOUCH')h=m==='SOLO'?`<div class="control-row"><span>MOVE</span><b>STICK</b></div><div class="control-row"><span>ACT</span><b>BTNS</b></div>`:`<div class="control-row"><span>P1</span><b>BOT</b></div><div class="control-row"><span>P2</span><b>TOP</b></div>`; else if(s==='GAMEPAD')h=m==='SOLO'?`<div class="control-row"><span>MOVE</span><b>STICK</b></div><div class="control-row"><span>A</span><b>A/X</b></div><div class="control-row"><span>B</span><b>B/Y</b></div>`:`<div class="control-row"><span>P1</span><b>PAD1</b></div><div class="control-row"><span>P2</span><b>PAD2</b></div>`; Game.ui.controlsDesc.innerHTML=h; }
    };
    static director={
        setMode:(m)=>{if(Game.state.subMode!==m)Game.state.needsReset=true; Game.state.subMode=m; document.getElementById("btn-mode-solo").classList.toggle('active',m==='SOLO'); document.getElementById("btn-mode-vs").classList.toggle('active',m==='COOP'); Game.ui.updateControlsDesc();},
        reset:()=>{ Game.loop.resize(); Game.input.raw.p1.move=new Vector(0,0); Game.input.raw.p2.move=new Vector(0,0); Game.world.entities=[]; Game.world.idCounter=0; Game.particles=[]; Game.entities.texts=[]; Game.entities.blood=[];
            const p1=EntityFactory.createFromBlueprint('PLAYER_P1',Game.width/2,Game.height/2); if(Game.state.subMode==='COOP'){p1.c.transform.pos.x-=100;EntityFactory.createFromBlueprint('PLAYER_P2',Game.width/2+100,Game.height/2);}
            Game.state.score=0; Game.state.streak=0; Game.state.combo=0; Game.state.shakeIntensity=0; Game.state.hitStopTimer=0; Game.state.waveTimer=0; Game.state.lootTimer=1800; Game.state.needsReset=false; Game.ui.gameOver.style.display="none"; Game.state.mode="PLAY"; Game.input.setupTouchUI(); Game.loop.lastTime=0; if(!Game.loop.id)requestAnimationFrame(Game.loop.run); },
        spawnWave:()=>{ Game.state.waveTimer--; const ec=Game.world.queryTag('enemy').length; if(ec===0&&Game.state.waveTimer<=0){let c=1+Math.ceil(Math.min(Game.state.streak,10));if(Game.state.subMode==='COOP')c=Math.ceil(c*1.5); for(let i=0;i<c;i++){const r=Math.random(),t=r<0.01?"ENEMY_BOSS":(r<0.10?"ENEMY_ELITE":"ENEMY_NORMAL"),side=Math.floor(Math.random()*4),pos=[new Vector(Math.random()*Game.width,-40),new Vector(Game.width+40,Math.random()*Game.height),new Vector(Math.random()*Game.width,Game.height+40),new Vector(-40,Math.random()*Game.height)][side]; EntityFactory.createEnemy(t,pos.x,pos.y);} Game.state.waveTimer=250;} Game.state.lootTimer--; if(Game.state.lootTimer<=0){EntityFactory.createPickup(Math.random()*(Game.width-100)+50,Math.random()*(Game.height-100)+50,Math.random()>0.8?"LIFE":(Math.random()>0.5?"GOD":"HEAL")); Game.state.lootTimer=1800+Math.random()*1800;} },
        gameOver:()=>{ Game.state.mode="OVER"; Game.ui.gameOver.style.display="block"; Game.ui.finalScore.innerText=Game.state.score; Game.ui.setupFocus(); }
    };
    static init() {
        this.input=new InputSystem(); this.ai=new AISystem(); this.movement=new MovementSystem(); this.combat=new CombatSystem(); this.renderer=new RenderSystem(); this.logic=new LogicSystem();
        this.loop={ id:null, lastTime:0, accumulator:0, step:1000/60, resize:()=>{Game.width=document.getElementById("gameCanvas").width=window.innerWidth;Game.height=document.getElementById("gameCanvas").height=window.innerHeight;}, run:(ts)=>{
            if(!Game.loop.lastTime)Game.loop.lastTime=ts; let dt=ts-Game.loop.lastTime; Game.loop.lastTime=ts; if(dt>1000)dt=Game.loop.step;
            if(Game.state.mode!=="PLAY")Game.input.update(); else {
                Game.loop.accumulator+=dt; let steps=0; while(Game.loop.accumulator>=Game.loop.step){
                    if(Game.state.hitStopTimer>0)Game.state.hitStopTimer--; else { Game.input.update(); Game.director.spawnWave(); Game.ai.update(); Game.movement.update(); Game.combat.update(); Game.world.cleanup(); Game.entities.texts.forEach((t,i)=>{t.position.add(t.velocity);t.life-=0.02;if(t.life<=0)Game.entities.texts.splice(i,1)}); Game.entities.blood.forEach(b=>{b.position.add(b.velocity);b.velocity.multiply(0.85);}); Game.particles.forEach((p,i)=>{p.pos.add(p.vel);p.vel.multiply(0.9);p.life-=0.05;if(p.life<=0)Game.particles.splice(i,1)}); if(Game.world.queryTag('player').length===0&&!Game.state.needsReset)Game.director.gameOver(); }
                    Game.state.shakeIntensity=Math.max(0,Game.state.shakeIntensity*0.9-0.1); Game.state.flashOpacity=Math.max(0,Game.state.flashOpacity-0.05); Game.state.chromaticAberration=Math.max(0,Game.state.chromaticAberration-0.5); Game.state.particleSpawnCount=0; Game.loop.accumulator-=Game.loop.step; steps++; if(steps>240){Game.loop.accumulator=0;break;}
                } Game.renderer.draw(); Game.state.invertedFrame=false;
            } Game.loop.id=requestAnimationFrame(Game.loop.run);
        }};
        window.addEventListener("resize",this.loop.resize); this.events.on('shake',a=>{if(this.config.FX.SHAKE)this.state.shakeIntensity+=a;}); this.events.on('flash',o=>{if(this.config.FX.FLASH)this.state.flashOpacity=o;}); this.events.on('particle',d=>{if(Game.state.particleSpawnCount>CONSTANTS.MAX_PARTICLES_PER_FRAME)return;if(Game.particles.length>CONSTANTS.MAX_PARTICLES)Game.particles.shift();Game.state.particleSpawnCount++;EntityFactory.createParticle(d.x,d.y,d.col,d.spd);}); this.events.on('particle_burst',d=>{if(!this.config.FX.BLOOD&&!this.config.FX.FLASH)return;for(let i=0;i<d.n;i++)this.events.emit('particle',{x:d.x,y:d.y,col:d.col,spd:Math.random()*10+5});}); this.events.on('text',d=>this.entities.texts.push({position:new Vector(d.x,d.y),velocity:new Vector(Math.random()-0.5,-2),str:d.txt,color:d.col,life:1})); this.events.on('reset_request',this.director.reset);
        this.loop.resize(); this.ui.updateControlsDesc(); EntityFactory.createFromBlueprint('PLAYER_P1',Game.width/2,Game.height/2); this.loop.id=requestAnimationFrame(this.loop.run);
    }
}
Game.init();
</script>
