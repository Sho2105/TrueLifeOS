<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Project: Speed</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    :root { --c-bg:#050505; --c-txt:#eee; --c-dim:#444; }
    body { margin:0; overflow:hidden; background-color:var(--c-bg); color:var(--c-txt); font-family:'VT323',monospace; user-select:none; touch-action:none; }
    body::after { content:" "; display:block; position:absolute; top:0; left:0; bottom:0; right:0; background:linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index:100; background-size:100% 2px, 3px 100%; pointer-events:none; }
    canvas { position:absolute; top:0; left:0; z-index:10; display:block; cursor:crosshair; image-rendering:pixelated; filter:contrast(1.1) saturate(1.2); pointer-events:auto; }
    body.menu-mode canvas { pointer-events: none; }
    #ui-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; display:flex; justify-content:center; align-items:center; }
    #floor-interface { text-align:center; pointer-events:auto; display:flex; flex-direction:column; gap:15px; transition: opacity 0.5s ease; will-change: transform; }
    #floor-interface.active { opacity: 1; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    #floor-interface.passive { opacity: 0.1; pointer-events:none; filter: blur(2px); }
    h1 { font-size:80px; margin:0; line-height:0.8; letter-spacing:15px; font-weight:normal; color: var(--c-txt); text-shadow: 0 0 20px rgba(255,255,255,0.1); }
    .score-readout { font-size:100px; margin:0; line-height:0.9; color: #fff; }
    .heat-readout { font-size:24px; color:var(--c-dim); letter-spacing: 4px; font-weight:bold; }
    .btn-group { display:flex; justify-content:center; gap:30px; margin:20px 0; }
    .bare-btn { background:transparent; border:none; color:var(--c-dim); font-family:'VT323',monospace; font-size:24px; cursor:pointer; text-transform:uppercase; letter-spacing:3px; padding:5px 15px; transition: all 0.1s; }
    #floor-interface.active .bare-btn:hover, #floor-interface.active .bare-btn.active, #floor-interface.active .bare-btn:focus { color:#fff; text-shadow:0 0 15px #fff; outline:none; transform: scale(1.1); }
    #btn-main-action { font-size:48px; margin-top:30px; color: #fff; }
    #floor-interface.active #btn-main-action:hover, #floor-interface.active #btn-main-action:focus { text-shadow:0 0 30px #fff; letter-spacing: 6px; }
    .touch-container { display:none; position:absolute; z-index:30; pointer-events:none; width:100%; height:100%; top:0; left:0; }
    .touch-pad { position:absolute; border:1px solid rgba(255, 255, 255, 0.1); border-radius:50%; pointer-events:auto; }
    .stick-base { width:120px; height:120px; background:rgba(255,255,255,0.05); }
    .stick-nub { position:absolute; top:50%; left:50%; width:40px; height:40px; background:#fff; border-radius:50%; transform:translate(-50%, -50%); pointer-events:none; box-shadow:0 0 10px #fff; }
    .btn-action { width:80px; height:80px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:#444; font-size:24px; }
    .btn-action.active { background:#fff; color:#000; box-shadow:0 0 15px #fff; }
</style>
</head>
<body>
<div id="ui-layer">
    <div id="floor-interface" class="active">
        <h1 id="menu-title">PROJECT_SPEED</h1>
        <div id="score-val" class="score-readout">0</div>
        <div id="heat-val" class="heat-readout">HEAT // 0%</div>
        <div class="btn-group">
            <button id="btn-mode-solo" class="bare-btn active" onclick="GameEngine.director.setGameMode('SOLO')">SOLO</button>
            <button id="btn-mode-vs" class="bare-btn" onclick="GameEngine.director.setGameMode('COOP')">CO-OP</button>
        </div>
        <div class="btn-group">
            <button id="btn-input-mouse" class="bare-btn active" onclick="GameEngine.systems.input.setInputScheme('MOUSE')">MOUSE</button>
            <button id="btn-input-key" class="bare-btn" onclick="GameEngine.systems.input.setInputScheme('KEYBOARD')">KEYS</button>
            <button id="btn-input-touch" class="bare-btn" onclick="GameEngine.systems.input.setInputScheme('TOUCH')">TOUCH</button>
            <button id="btn-input-pad" class="bare-btn" onclick="GameEngine.systems.input.setInputScheme('GAMEPAD')">PAD</button>
        </div>
        <button id="btn-main-action" class="bare-btn" onclick="GameEngine.userInterface.triggerGameStart()">INITIALIZE</button>
    </div>
</div>
<div id="touch-layer" class="touch-container"></div>
<canvas id="gameCanvas"></canvas>
<script>
/**
 * DEVELOPER_GUIDE
 * * STRUCTURE: ECS-Lite (Entity-Component-System).
 * - Entities: ID containers holding Components.
 * - Components: Pure data (e.g., Transform, Velocity, CombatState).
 * - Systems: Logic processors (e.g., PhysicsSystem, CombatSystem) that iterate over Entities.
 * - GameEngine: Manages the Loop, EventBus, and System instantiation.
 * * ARCHITECTURE:
 * - Data-Driven: Entity definitions are in `EntityDatabase`. Loot in `LootDatabase`.
 * - Event-Based: Decoupled logic using `GameEngine.eventBus`. Systems emit events; RulesSystem/RenderSystem listen.
 * - Fixed Timestep: Physics/Logic runs at 60Hz via `accumulator` to ensure consistency across refresh rates.
 * * GAME FLOW:
 * 1. `GameEngine.init()` sets up systems.
 * 2. `GameEngine.director` manages states (Attract Mode vs Gameplay).
 * 3. Loop: Input -> AI -> Physics -> Combat -> Rules -> Render.
 * * HOW TO ADD CONTENT:
 * - New Enemy: Add entry to `EntityDatabase` (define stats, color, AI behavior).
 * - New Behavior: Add logic array to `AiBehaviorDatabase` and action function to `ActionDatabase`.
 * - New Loot: Add entry to `LootDatabase` (modifier type: STAT, STATUS, or SPECIAL).
 */

// ================= 1. CONFIGURATION =================
const VisualPalette = { CYAN:"#00e5ff", LIME:"#76ff03", PINK:"#f50057", WHITE:"#ffffff", DARK:"#050505", GREY:"#444", RED:"#d50000", ORANGE:"#ff3d00", INDIGO:"#3d5afe", SLATE:"#607d8b", PURPLE:"#d500f9" };
const GameConfiguration = {
    PHYSICS: { FRICTION: 0.94, BASE_ACCELERATION: 1.2, FORCE_DASH: 60, FORCE_HIGH: 90, FORCE_MAXIMUM: 130, RECOIL_MULTIPLIER: 1.0 },
    SPEED_SCALARS: { STOP: 0, BRACE: 0.5, WALK: 0.4, BASE: 1.0, SPRINT: 2.2 },
    IMPACT_LEVELS: { NONE:0, LOW:0.5, MEDIUM:1, HIGH:2, EXTREME:3, MAXIMUM:4 },
    DAMAGE_VALUES: { LEVEL_1:10, LEVEL_2:25, LEVEL_3:50, LEVEL_4:999, WALL_COLLISION: 25, AREA_BLAST: 50 },
    ENTITY_COLORS: { P1:VisualPalette.CYAN, P2:VisualPalette.LIME, MAX_CHARGE:VisualPalette.WHITE, TEXT:VisualPalette.WHITE },
    TIMINGS: { TAP_WINDOW:12, CHARGE_THRESHOLD: 180, CHARGE_LEVEL_3:60, CHARGE_LEVEL_4:120, CD_DASH:180, CD_PARRY:30, INVULNERABILITY_HIT:20, AI_MIN_THINK:15, AI_MAX_THINK:45 },
    ACTION_STATE: { IDLE:0, MOVE:1, WALK:2, SPRINT:3, DASH:4, PARRY:5, DODGE:6, CHARGING:7, LEVEL_3_READY:8, LEVEL_4_READY:9, STUNNED:10, BRACING: 11 },
    HEAT_SYSTEM: { DECAY_RATE:0.04, SCORE_KILL:10, SCORE_PARRY:15, SCORE_CLASH:5, PENALTY_HIT:20 },
    RENDERING: { MAX_PARTICLES:250, MAX_SHOCKWAVES:10 }
};

const AudioDatabase = {
    UI_HOVER: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.2, loop: false, variance: false },
    UI_CLICK: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.5, loop: false, variance: false },
    COMBAT_DASH: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.4, loop: false, variance: true },
    COMBAT_CHARGE: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.3, loop: true, variance: false },
    COMBAT_PARRY: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.8, loop: false, variance: false },
    HIT_LIGHT: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.4, loop: false, variance: true },
    HIT_HEAVY: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.6, loop: false, variance: true },
    ENTITY_DEATH: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.7, loop: false, variance: true },
    CLASH: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.8, loop: false, variance: true },
    PICKUP_COLLECT: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.5, loop: false, variance: false },
    HEAT_INCREASE: { data: "data:audio/wav;base64,PLACEHOLDER", volume: 0.3, loop: false, variance: false }
};

const EntityDatabase = {
    PLAYER_ONE: { tags:['player','p1'], stats:{hp:100, maxHp:100, radius:16}, render:{color:GameConfiguration.ENTITY_COLORS.P1}, input:{deviceId:'p1'} },
    PLAYER_TWO: { tags:['player','p2'], stats:{hp:100, maxHp:100, radius:16}, render:{color:GameConfiguration.ENTITY_COLORS.P2}, input:{deviceId:'p2'} },
    ENEMY_STANDARD: { stats:{hp:100, radius:16}, behavior:"AGGRESSIVE", traits:["BRAVE"], variants:[VisualPalette.RED] },
    ENEMY_ELITE: { stats:{hp:800, radius:20}, behavior:"DEFENSIVE", traits:["CAUTIOUS"], variants:[VisualPalette.SLATE] },
    ENEMY_BOSS: { stats:{hp:5000, radius:40}, behavior:"BOSS", traits:["BOSS"], variants:[VisualPalette.PURPLE] }
};

const LootDatabase = {
    HEAL: { color:VisualPalette.LIME, text:"HP UP", modifier:{type:'STAT', key:'hp', value:50} },
    INVINCIBILITY: { color:VisualPalette.ORANGE, text:"GOD MODE", modifier:{type:'STATUS', key:'invulnerabilityTimer', value:600} },
    EXTRA_LIFE: { color:VisualPalette.CYAN, text:"LIFE-UP", modifier:{type:'SPECIAL', key:'lives', value:1} }
};

const ActionDatabase = {
    'ACQUIRE_LOOT': (entity, target) => {
        entity.components.input.primaryPressed=false; entity.components.input.secondaryPressed=false;
        const dir = Vector2D.subtract(target.components.transform.position, entity.components.transform.position).normalize();
        entity.components.velocity.add(dir.multiply(GameConfiguration.PHYSICS.BASE_ACCELERATION * GameConfiguration.SPEED_SCALARS.BASE));
        entity.components.input.lastDirection = dir.clone();
    },
    'APPROACH_TARGET': (entity, target) => {
        entity.components.input.primaryPressed=false; entity.components.input.secondaryPressed=false;
        const dir = Vector2D.subtract(target.components.transform.position, entity.components.transform.position).normalize();
        entity.components.velocity.add(dir.multiply(GameConfiguration.PHYSICS.BASE_ACCELERATION * GameConfiguration.SPEED_SCALARS.BASE));
        entity.components.input.lastDirection = dir.clone();
    },
    'ATTACK_DASH': (entity, target) => {
        entity.components.input.primaryPressed=true; entity.components.input.secondaryPressed=false; entity.components.input.forceTapPrimary=true;
        entity.components.input.lastDirection=Vector2D.subtract(target.components.transform.position, entity.components.transform.position).normalize();
    },
    'PERFORM_PARRY': (entity) => { entity.components.input.secondaryPressed=true; entity.components.input.primaryPressed=false; entity.components.input.forceTapSecondary=true; },
    'CHARGE_ATTACK': (entity, target) => {
        entity.components.input.primaryPressed=true; entity.components.input.secondaryPressed=true;
        entity.components.input.lastDirection=Vector2D.subtract(target.components.transform.position, entity.components.transform.position).normalize();
    }
};

const AiBehaviorDatabase = {
    AGGRESSIVE: [ { type:'ACQUIRE_LOOT', weight:3.0, range:[0,400] }, { type:'PERFORM_PARRY', weight:0.5, cooldown:'parry', range:[0,80] }, { type:'ATTACK_DASH', weight:2.0, cooldown:'dash', range:[80,300] }, { type:'APPROACH_TARGET', weight:1.0, range:[300,2000] } ],
    DEFENSIVE: [ { type:'ACQUIRE_LOOT', weight:2.0, range:[0,300] }, { type:'PERFORM_PARRY', weight:1.5, cooldown:'parry', range:[0,120] }, { type:'APPROACH_TARGET', weight:0.5, range:[150,400] } ],
    BOSS: [ { type:'ACQUIRE_LOOT', weight:5.0, range:[0,600] }, { type:'CHARGE_ATTACK', weight:0.5, range:[0,800] }, { type:'PERFORM_PARRY', weight:0.8, cooldown:'parry', range:[0,120] }, { type:'ATTACK_DASH', weight:1.0, cooldown:'dash', range:[120,500] }, { type:'APPROACH_TARGET', weight:0.3, range:[100,2000] } ]
};

// ================= 2. CORE UTILITIES =================
class MemoryPool {
    constructor(factoryFn, size=100) { this.store=[]; this.factory=factoryFn; for(let i=0;i<size;i++)this.store.push(this.factory()); }
    acquire() { return this.store.length > 0 ? this.store.pop() : this.factory(); }
    release(obj) { this.store.push(obj); }
}

class Vector2D {
    constructor(x, y) { this.x=x; this.y=y; }
    add(v) { this.x+=v.x; this.y+=v.y; return this; }
    subtract(v) { this.x-=v.x; this.y-=v.y; return this; }
    multiply(scalar) { this.x*=scalar; this.y*=scalar; return this; }
    magnitude() { return Math.sqrt(this.x**2 + this.y**2); }
    normalize() { const m=this.magnitude(); if(m!==0) this.multiply(1/m); return this; }
    clone() { return new Vector2D(this.x, this.y); }
    static distance(v1, v2) { return Math.sqrt((v1.x-v2.x)**2 + (v1.y-v2.y)**2); }
    static subtract(v1, v2) { return new Vector2D(v1.x-v2.x, v1.y-v2.y); }
}

const ColorUtils = {
    hexToHSL: (hex) => {
        let r=0,g=0,b=0;
        if(hex.length==4){r="0x"+hex[1]+hex[1];g="0x"+hex[2]+hex[2];b="0x"+hex[3]+hex[3];} else if(hex.length==7){r="0x"+hex[1]+hex[2];g="0x"+hex[3]+hex[4];b="0x"+hex[5]+hex[6];}
        r/=255;g/=255;b/=255; let cmin=Math.min(r,g,b), cmax=Math.max(r,g,b), delta=cmax-cmin, h=0, s=0, l=0;
        if(delta==0)h=0;else if(cmax==r)h=((g-b)/delta)%6;else if(cmax==g)h=(b-r)/delta+2;else h=(r-g)/delta+4;
        h=Math.round(h*60);if(h<0)h+=360;l=(cmax+cmin)/2;s=delta==0?0:delta/(1-Math.abs(2*l-1)); return {h:h,s:s*100,l:l*100};
    },
    resolveDynamicColor: (baseHex, state) => {
        const hsl = ColorUtils.hexToHSL(baseHex);
        switch(state) {
            case GameConfiguration.ACTION_STATE.STUNNED: return `hsl(${hsl.h}, 10%, ${30 + (Math.random()*10)}%)`;
            case GameConfiguration.ACTION_STATE.CHARGING: return `hsl(${hsl.h}, ${hsl.s}%, 40%)`;
            case GameConfiguration.ACTION_STATE.BRACING: return `hsl(${hsl.h}, 20%, 30%)`;
            case GameConfiguration.ACTION_STATE.LEVEL_3_READY: return `hsl(${hsl.h}, 100%, 65%)`;
            case GameConfiguration.ACTION_STATE.LEVEL_4_READY: return `hsl(${(Date.now()/5)%360}, 100%, 60%)`;
            case GameConfiguration.ACTION_STATE.PARRY: return `#ffffff`;
            case GameConfiguration.ACTION_STATE.DASH: return `hsl(${hsl.h}, ${hsl.s}%, 80%)`;
            case GameConfiguration.ACTION_STATE.WALK: return `hsl(${hsl.h}, ${hsl.s*0.8}%, 25%)`;
            default: return baseHex;
        }
    }
};

class GameEventBus {
    constructor() { this.subscribers={}; }
    subscribe(event, callback) { (this.subscribers[event]=this.subscribers[event]||[]).push(callback); }
    publish(event, payload) { if(this.subscribers[event]) this.subscribers[event].forEach(cb=>cb(payload)); }
}

// ================= 3. FACTORIES & ENTITIES =================
class GameObject {
    constructor(id) { this.id=id; this.components={}; this.tags=new Set(); this.active=true; }
    addComponent(name, data) { this.components[name]=data; return this; }
    hasComponent(name) { return !!this.components[name]; }
    hasTag(tag) { return this.tags.has(tag); }
}

class GameObjectManager {
    constructor() { this.objects=[]; this.idCounter=0; }
    createObject() { const obj=new GameObject(++this.idCounter); this.objects.push(obj); return obj; }
    destroyObject(obj) { obj.active=false; }
    cleanUp() { this.objects=this.objects.filter(e=>e.active); }
    queryComponents(componentList) { return this.objects.filter(e=>e.active && componentList.every(n=>e.hasComponent(n))); }
    queryTag(tag) { return this.objects.filter(e=>e.active && e.hasTag(tag)); }
}

const GameObjectFactory = {
    instantiateFromBlueprint: (type, x, y) => {
        const obj = GameEngine.objectManager.createObject(), bp = EntityDatabase[type];
        if(!bp && type.includes('ENEMY')) return GameObjectFactory.instantiateEnemy(type, x, y);
        obj.components.transform={position:new Vector2D(x,y), rotation:0}; obj.components.velocity=new Vector2D(0,0);
        if(bp.tags) bp.tags.forEach(t=>obj.tags.add(t));
        if(bp.stats) obj.addComponent('stats', {...bp.stats, extraLives:0});
        if(bp.render) obj.addComponent('render', {...bp.render, baseColor:bp.render.color, trail:[]});
        if(bp.input) obj.addComponent('input', {...bp.input, primaryPressed:false, secondaryPressed:false, framesHeldPrimary:0, framesHeldSecondary:0, lastDirection:new Vector2D(1,0)});
        obj.addComponent('combat', {state:GameConfiguration.ACTION_STATE.IDLE, stateTimer:0, sprintChargeAccumulator:0, braceChargeAccumulator:0, cooldowns:{parry:0, dash:0, turn:0}, invulnerabilityTimer:0, combatIntensity:0});
        return obj;
    },
    instantiateEnemy: (key, x, y) => {
        const obj = GameEngine.objectManager.createObject(), cfg = EntityDatabase[key];
        obj.tags.add('enemy'); obj.tags.add(key); obj.components.transform={position:new Vector2D(x,y), rotation:0}; obj.components.velocity=new Vector2D(0,0);
        obj.addComponent('stats', {...cfg.stats, maxHp:cfg.stats.hp, extraLives:0});
        obj.addComponent('render', {baseColor:cfg.variants[0], trail:[]});
        obj.addComponent('input', {deviceId:'ai', primaryPressed:false, secondaryPressed:false, framesHeldPrimary:0, framesHeldSecondary:0, lastDirection:new Vector2D(1,0), forceTapPrimary:false, forceTapSecondary:false});
        obj.addComponent('combat', {state:GameConfiguration.ACTION_STATE.IDLE, stateTimer:0, sprintChargeAccumulator:0, braceChargeAccumulator:0, cooldowns:{parry:0, dash:0, turn:0}, invulnerabilityTimer:0, combatIntensity:0});
        obj.addComponent('ai', {behavior:AiBehaviorDatabase[cfg.behavior], traits:cfg.traits||[], memory:{damageTaken:0}, thinkTimer:0, activePlan:null});
        return obj;
    },
    instantiateLoot: (x, y, key) => {
        const obj = GameEngine.objectManager.createObject(); obj.tags.add('loot'); obj.components.transform={position:new Vector2D(x,y), rotation:0}; obj.components.velocity=new Vector2D(0,0);
        obj.addComponent('loot', {type:key, life:1200, data:LootDatabase[key]});
        obj.addComponent('render', {baseColor:LootDatabase[key].color}); return obj;
    },
    instantiateParticle: (x, y, color, speed, type='EXPLODE') => {
        const p = GameEngine.particlePool.acquire();
        p.active=true; p.type=type; p.position.x=x; p.position.y=y; p.color=color; p.life=1; p.size=Math.random()*4+2;
        if(type==='IMPLODE') { p.velocity.x=0; p.velocity.y=0; }
        else { const a=Math.random()*6.28; p.velocity.x=Math.cos(a)*speed; p.velocity.y=Math.sin(a)*speed; }
        GameEngine.activeParticles.push(p);
    },
    instantiateShockwave: (x, y, color) => { GameEngine.activeShockwaves.push({x, y, r: 5, color, alpha: 1, maxR: 100}); }
};

// ================= 4. SYSTEMS =================
class AudioSystem {
    constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.active = true; this.bindEvents(); }
    bindEvents() {
        GameEngine.eventBus.subscribe('EVENT_HIT', () => this.playSound('HIT_LIGHT'));
        GameEngine.eventBus.subscribe('EVENT_CLASH', () => this.playSound('CLASH'));
        GameEngine.eventBus.subscribe('EVENT_PARRY', () => this.playSound('COMBAT_PARRY'));
        GameEngine.eventBus.subscribe('EVENT_DEATH', () => this.playSound('ENTITY_DEATH'));
        GameEngine.eventBus.subscribe('EVENT_DASH', () => this.playSound('COMBAT_DASH'));
        GameEngine.eventBus.subscribe('EVENT_CHARGE_INIT', () => this.playSound('COMBAT_CHARGE'));
        GameEngine.eventBus.subscribe('EVENT_UI_HOVER', () => this.playSound('UI_HOVER'));
        GameEngine.eventBus.subscribe('EVENT_UI_CLICK', () => this.playSound('UI_CLICK'));
        GameEngine.eventBus.subscribe('EVENT_LOOT', () => this.playSound('PICKUP_COLLECT'));
        GameEngine.eventBus.subscribe('EVENT_INTENSITY_UP', () => this.playSound('HIT_HEAVY'));
    }
    playSound(key) {
        if(!this.active || !AudioDatabase[key]) return;
        const cfg = AudioDatabase[key]; if (!cfg.data || cfg.data.length < 50) return;
        const aud = new Audio(cfg.data); aud.volume = cfg.volume; aud.loop = cfg.loop;
        if(cfg.variance) { if(aud.mozPreservesPitch !== undefined) aud.mozPreservesPitch = false; aud.playbackRate = 0.9 + Math.random() * 0.2; }
        aud.play().catch(e => { });
    }
}

class InputSystem {
    constructor() {
        this.scheme="MOUSE"; this.controllerState={p1:{primary:false,secondary:false,axis:new Vector2D(0,0)}, p2:{primary:false,secondary:false,axis:new Vector2D(0,0)}};
        this.keys={}; this.touches={}; this.mouseCoords={x:0,y:0}; this.menuDebounce=0; this.bindEvents();
    }
    bindEvents() {
        window.addEventListener('keydown', e=>{
            this.keys[e.code]=true;
            if(GameEngine.flags.inMenu){
                if(['ArrowUp','KeyW'].includes(e.code)) { GameEngine.userInterface.navigateMenu(-1); GameEngine.eventBus.publish('EVENT_UI_HOVER'); }
                if(['ArrowDown','KeyS'].includes(e.code)) { GameEngine.userInterface.navigateMenu(1); GameEngine.eventBus.publish('EVENT_UI_HOVER'); }
                if(['Enter','Space'].includes(e.code)) { GameEngine.userInterface.triggerMenuSelect(); GameEngine.eventBus.publish('EVENT_UI_CLICK'); }
            }
        });
        window.addEventListener('keyup', e=>this.keys[e.code]=false);
        window.addEventListener('mousemove', e=>{if(this.scheme==='MOUSE'){this.mouseCoords.x=e.clientX;this.mouseCoords.y=e.clientY;}});
        window.addEventListener('mousedown', e=>{if(this.scheme==='MOUSE'&&!GameEngine.flags.inMenu){if(e.button===0)this.controllerState.p1.primary=true;if(e.button===2)this.controllerState.p1.secondary=true;}});
        window.addEventListener('mouseup', e=>{if(this.scheme==='MOUSE'){if(e.button===0)this.controllerState.p1.primary=false;if(e.button===2)this.controllerState.p1.secondary=false;}});
        window.addEventListener('contextmenu', e=>e.preventDefault());
    }
    process() {
        this.pollGamepads();
        if(GameEngine.flags.inMenu && this.menuDebounce<=0) {
            const pad = navigator.getGamepads()[0];
            if(pad) {
                if(pad.axes[1] < -0.5 || pad.buttons[12].pressed) { GameEngine.userInterface.navigateMenu(-1); this.menuDebounce=10; GameEngine.eventBus.publish('EVENT_UI_HOVER'); }
                else if(pad.axes[1] > 0.5 || pad.buttons[13].pressed) { GameEngine.userInterface.navigateMenu(1); this.menuDebounce=10; GameEngine.eventBus.publish('EVENT_UI_HOVER'); }
                else if(pad.buttons[0].pressed || pad.buttons[9].pressed) { GameEngine.userInterface.triggerMenuSelect(); this.menuDebounce=20; GameEngine.eventBus.publish('EVENT_UI_CLICK'); }

        if(this.menuDebounce>0) this.menuDebounce--;
        this.mapInputsToState();

        GameEngine.objectManager.queryComponents(['input','combat','velocity']).forEach(obj=>{
            if(GameEngine.flags.inMenu && obj.components.input.deviceId !== 'ai') return;
            const input=obj.components.input, combat=obj.components.combat;
            const lastFramesP = input.framesHeldPrimary, lastFramesS = input.framesHeldSecondary;
            let rawP = false, rawS = false, rawAxis = new Vector2D(0,0);

            if(input.deviceId==='ai') {
                if(input.forceTapPrimary){ rawP=true; input.forceTapPrimary=false; } else rawP = input.primaryPressed;
                if(input.forceTapSecondary){ rawS=true; input.forceTapSecondary=false; } else rawS = input.secondaryPressed;
                rawAxis = input.lastDirection.clone();
            } else {
                rawP = this.controllerState[input.deviceId].primary; rawS = this.controllerState[input.deviceId].secondary;
                if(this.scheme==='MOUSE' && input.deviceId==='p1'){
                    if(Vector2D.distance(obj.components.transform.position, this.mouseCoords) > 10) rawAxis = Vector2D.subtract(this.mouseCoords, obj.components.transform.position).normalize();
                } else { if(this.controllerState[input.deviceId].axis.magnitude() > 0.1) rawAxis = this.controllerState[input.deviceId].axis.clone(); }

            const isHeldP = input.framesHeldPrimary > 0, isHeldS = input.framesHeldSecondary > 0;

            if([GameConfiguration.ACTION_STATE.DASH, GameConfiguration.ACTION_STATE.STUNNED, GameConfiguration.ACTION_STATE.DODGE].includes(combat.state)) return;
            const getAim = () => rawAxis.magnitude() > 0.1 ? rawAxis.normalize() : input.lastDirection;

            // --- CHARGE ACTION (HOLD P + S) ---
            if (isHeldP && isHeldS) {
                const chargeDuration = Math.min(input.framesHeldPrimary, input.framesHeldSecondary);
                if(chargeDuration===1) GameEngine.eventBus.publish('EVENT_CHARGE_INIT');

                if(chargeDuration > GameConfiguration.TIMINGS.CHARGE_LEVEL_4) combat.state = GameConfiguration.ACTION_STATE.LEVEL_4_READY;
                else if(chargeDuration > GameConfiguration.TIMINGS.CHARGE_LEVEL_3) combat.state = GameConfiguration.ACTION_STATE.LEVEL_3_READY;
                else combat.state = GameConfiguration.ACTION_STATE.CHARGING;

                obj.components.velocity.multiply(0.8);
                if(chargeDuration % 5 === 0) GameEngine.eventBus.publish('EVENT_PARTICLE_IMPLODE', {target:obj, count:2});
                return;
            }

            // --- RELEASE CHARGE ---
            if ((combat.state === GameConfiguration.ACTION_STATE.CHARGING || combat.state === GameConfiguration.ACTION_STATE.LEVEL_3_READY || combat.state === GameConfiguration.ACTION_STATE.LEVEL_4_READY) && (!isHeldP || !isHeldS)) {
                let level = 0; if(combat.state === GameConfiguration.ACTION_STATE.LEVEL_4_READY) level = 4; else if(combat.state === GameConfiguration.ACTION_STATE.LEVEL_3_READY) level = 3;
                if(level >= 3) {

                     const force = level === 4 ? GameConfiguration.PHYSICS.FORCE_MAXIMUM : GameConfiguration.PHYSICS.FORCE_HIGH;
                     obj.components.velocity = getAim().multiply(force);
                     GameEngine.eventBus.publish('EVENT_DASH'); GameEngine.eventBus.publish('EVENT_SHAKE', 15);
                } else combat.state = GameConfiguration.ACTION_STATE.IDLE;
                return;
            }

            // --- HOLD P: SPRINT ---
            if (isHeldP && !isHeldS) {
                if (input.framesHeldPrimary > GameConfiguration.TIMINGS.TAP_WINDOW) {
                    combat.state = GameConfiguration.ACTION_STATE.SPRINT; combat.sprintChargeAccumulator++;
                    obj.components.velocity.add(rawAxis.multiply(GameConfiguration.PHYSICS.BASE_ACCELERATION * GameConfiguration.SPEED_SCALARS.SPRINT));
                    if (combat.sprintChargeAccumulator >= GameConfiguration.TIMINGS.CHARGE_THRESHOLD && combat.sprintChargeAccumulator % 10 === 0) GameEngine.eventBus.publish('EVENT_PARTICLE_SPAWN', {x:obj.components.transform.position.x, y:obj.components.transform.position.y, col:VisualPalette.CYAN, speed:2, type:'EXPLODE'});
                    return;
                }
            } else if (!isHeldP && lastFramesP > GameConfiguration.TIMINGS.TAP_WINDOW) {
                // RELEASE SPRINT
                if (combat.sprintChargeAccumulator >= GameConfiguration.TIMINGS.CHARGE_THRESHOLD) {
                    combat.state = GameConfiguration.ACTION_STATE.DASH; combat.stateTimer = 20; combat.invulnerabilityTimer = 15; combat.levelOverride = 3;
                    obj.components.velocity = getAim().multiply(GameConfiguration.PHYSICS.FORCE_HIGH);
                    GameEngine.eventBus.publish('EVENT_DASH'); GameEngine.eventBus.publish('EVENT_SHAKE', 10);
                } else combat.state = GameConfiguration.ACTION_STATE.IDLE;
                combat.sprintChargeAccumulator = 0; return;
            }

            // --- HOLD S: BRACE ---
            if (isHeldS && !isHeldP) {
                if (input.framesHeldSecondary > GameConfiguration.TIMINGS.TAP_WINDOW) {
                    combat.state = GameConfiguration.ACTION_STATE.BRACING; combat.braceChargeAccumulator++;
                    obj.components.velocity.add(rawAxis.multiply(GameConfiguration.PHYSICS.BASE_ACCELERATION * GameConfiguration.SPEED_SCALARS.BRACE));
                    if (combat.braceChargeAccumulator >= GameConfiguration.TIMINGS.CHARGE_THRESHOLD && combat.braceChargeAccumulator % 10 === 0) GameEngine.eventBus.publish('EVENT_PARTICLE_SPAWN', {x:obj.components.transform.position.x, y:obj.components.transform.position.y, col:VisualPalette.ORANGE, speed:1, type:'IMPLODE'});
                    return;
                }
            } else if (!isHeldS && lastFramesS > GameConfiguration.TIMINGS.TAP_WINDOW) {
                // RELEASE BRACE
                if (combat.braceChargeAccumulator >= GameConfiguration.TIMINGS.CHARGE_THRESHOLD) {
                    GameEngine.eventBus.publish('EVENT_AREA_BLAST', {source: obj}); GameEngine.eventBus.publish('EVENT_SHAKE', 20);
                }
                combat.state = GameConfiguration.ACTION_STATE.IDLE; combat.braceChargeAccumulator = 0; return;
            }

            // --- TAP P: SHORT DASH ---
            if(isTapP && combat.cooldowns.dash <= 0 && !isHeldS) {
                combat.state = GameConfiguration.ACTION_STATE.DASH; combat.stateTimer = 10; combat.cooldowns.dash = GameConfiguration.TIMINGS.CD_DASH; combat.levelOverride = 2;
                obj.components.velocity = getAim().multiply(GameConfiguration.PHYSICS.FORCE_DASH); GameEngine.eventBus.publish('EVENT_DASH'); return;
            }

            // --- TAP S: PARRY ---
            if(isTapS && combat.cooldowns.parry <= 0 && !isHeldP) {
                combat.state = GameConfiguration.ACTION_STATE.PARRY; combat.stateTimer = 20; combat.cooldowns.parry = GameConfiguration.TIMINGS.CD_PARRY;
                obj.components.velocity.multiply(0.1); return;
            }

            // --- STANDARD MOVEMENT ---
            if(rawAxis.magnitude() > 0 && !isHeldP && !isHeldS){
                combat.state = GameConfiguration.ACTION_STATE.MOVE;
                obj.components.velocity.add(rawAxis.multiply(GameConfiguration.PHYSICS.BASE_ACCELERATION * GameConfiguration.SPEED_SCALARS.BASE));
            } else if (!isHeldP && !isHeldS && combat.state !== GameConfiguration.ACTION_STATE.PARRY) { combat.state = GameConfiguration.ACTION_STATE.IDLE; }
        });
    }
    pollGamepads() {
        const pads=navigator.getGamepads?navigator.getGamepads():[];
        const map=(pid,i)=>{const g=pads[i]; if(g){this.controllerState[pid].axis.x=Math.abs(g.axes[0])>0.1?g.axes[0]:0;this.controllerState[pid].axis.y=Math.abs(g.axes[1])>0.1?g.axes[1]:0;this.controllerState[pid].primary=g.buttons[0].pressed||g.buttons[2].pressed;this.controllerState[pid].secondary=g.buttons[1].pressed||g.buttons[3].pressed;}else{this.controllerState[pid].axis=new Vector2D(0,0);this.controllerState[pid].primary=false;this.controllerState[pid].secondary=false;}};
        if(this.scheme==='GAMEPAD'){ map('p1',0); if(GameEngine.flags.subMode==='COOP')map('p2',1); else if(pads[1])map('p1',1); }
    }
    mapInputsToState() {

        else if(this.scheme==='TOUCH'){ ['p1','p2'].forEach(id=>{let s=this.touches[`stick-${id}`];if(s){this.controllerState[id].axis.x=s.x;this.controllerState[id].axis.y=s.y;}this.controllerState[id].primary=this.touches[`btnA-${id}`];this.controllerState[id].secondary=this.touches[`btnB-${id}`];}); }
    }
    setInputScheme(schemeName) { this.scheme=schemeName; ['mouse','key','touch','pad'].forEach(k=>document.getElementById(`btn-input-${k}`).classList.toggle('active', schemeName.toUpperCase()===k.toUpperCase()||(k==='pad'&&schemeName==='GAMEPAD')||(k==='key'&&schemeName==='KEYBOARD'))); this.setupTouchInterface(); }
    setupTouchInterface() {
    const ui=document.getElementById("touch-layer"); ui.innerHTML=''; ui.style.display=this.scheme==='TOUCH'?'block':'none'; if(this.scheme!=='TOUCH')return;
    const add=(id,t,r,rot)=>{

            b.addEventListener('touchmove',e=>{e.preventDefault();for(let v of e.changedTouches){if(o&&v.identifier===o.id){let dx=v.clientX-o.x,dy=v.clientY-o.y,d=Math.min(50,Math.sqrt(dx*dx+dy*dy)),a=Math.atan2(dy,dx);n.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;let ox=Math.cos(a)*(d/50),oy=Math.sin(a)*(d/50);if(rot){ox*=-1;oy*=-1;}this.touches[`stick-${id}`]={x:ox,y:oy};}}});
            b.addEventListener('touchstart',e=>{e.preventDefault();let rect=b.getBoundingClientRect();o={x:rect.left+rect.width/2,y:rect.top+rect.height/2,id:e.changedTouches[0].identifier};this.touches[`stick-${id}`]={x:0,y:0};});
            b.addEventListener('touchend',e=>{o=null;n.style.transform=`translate(-50%,-50%)`;this.touches[`stick-${id}`]={x:0,y:0};});
        } else {

        }
        b.style[rot?'top':'bottom']='30px'; if(rot)b.style.transform="rotate(180deg)"; ui.appendChild(b);
    };
    add('p1','s',0,false); add('p1','a',40,false); add('p1','b',140,false);
    if(GameEngine.flags.subMode==='COOP'){ add('p2','s',0,true); add('p2','a',40,true); add('p2','b',140,true); }

class AiSystem {
    process() {
        const players=GameEngine.objectManager.queryTag('player'), enemies=GameEngine.objectManager.queryTag('enemy'), loot=GameEngine.objectManager.queryTag('loot');
        const targets = GameEngine.flags.inMenu ? enemies : players;
        GameEngine.objectManager.queryComponents(['ai','combat']).forEach(me=>{
            const combat=me.components.combat, ai=me.components.ai;
            if([GameConfiguration.ACTION_STATE.STUNNED, GameConfiguration.ACTION_STATE.DASH, GameConfiguration.ACTION_STATE.PARRY].includes(combat.state)) return;
            ai.thinkTimer--;
            if(ai.thinkTimer > 0 && ai.activePlan) {
                let target = null;
                if(ai.activePlan.targetType === 'LOOT') target = loot.find(p=>p.id===ai.activePlan.targetId);
                else if(ai.activePlan.targetType === 'PLAYER') target = players.find(p=>p.id===ai.activePlan.targetId);
                else target = enemies.find(e=>e.id===ai.activePlan.targetId);
                if(ai.activePlan.type === 'CHARGE_ATTACK') {
                    if(ai.thinkTimer > 10) { me.components.input.primaryPressed = true; me.components.input.secondaryPressed = true; }
                    else { me.components.input.primaryPressed = false; me.components.input.secondaryPressed = false; ai.activePlan = null; }
                    return;
                }
                if(target && target.active) { if(ActionDatabase[ai.activePlan.type]) ActionDatabase[ai.activePlan.type](me, target); } else ai.thinkTimer = 0;
                return;
            }
            let potentialTargets = targets;
            if (GameEngine.flags.inMenu && me.hasTag('player')) potentialTargets = enemies; else if (!me.hasTag('player')) potentialTargets = players;
            if (potentialTargets.length === 0 && GameEngine.flags.inMenu) potentialTargets = GameEngine.objectManager.queryTag('enemy').filter(e=>e.id!==me.id);
            if(potentialTargets.length === 0) return;
            const primaryTarget = potentialTargets.reduce((p,c)=>Vector2D.distance(me.components.transform.position,p.components.transform.position)<Vector2D.distance(me.components.transform.position,c.components.transform.position)?p:c);
            let lootTarget = loot.length ? loot.reduce((p,c)=>Vector2D.distance(me.components.transform.position,p.components.transform.position)<Vector2D.distance(me.components.transform.position,c.components.transform.position)?p:c) : null;
            const valid = ai.behavior.filter(b=>{
                const t = b.type==='ACQUIRE_LOOT'?lootTarget:primaryTarget; if(!t)return false;
                const d=Vector2D.distance(me.components.transform.position, t.components.transform.position);
                if(b.range && (d<b.range[0]||d>b.range[1])) return false; if(b.cooldown && combat.cooldowns[b.cooldown]>0) return false; return true;
            });
            const total = valid.reduce((s,b)=>s+b.weight,0); let r=Math.random()*total, selected=null; for(const m of valid){r-=m.weight; if(r<=0){selected=m; break;}}
            if(selected) {
                const finalT = selected.type==='ACQUIRE_LOOT'?lootTarget:primaryTarget;
                ai.activePlan = { type: selected.type, targetId: finalT.id, targetType: selected.type==='ACQUIRE_LOOT'?'LOOT':(finalT.hasTag('player')?'PLAYER':'ENEMY') };
                let duration = Math.floor(Math.random() * (GameConfiguration.TIMINGS.AI_MAX_THINK - GameConfiguration.TIMINGS.AI_MIN_THINK) + GameConfiguration.TIMINGS.AI_MIN_THINK);
                if(selected.type === 'CHARGE_ATTACK') duration = 120; ai.thinkTimer = duration;
            } else { ai.activePlan = { type: 'APPROACH_TARGET', targetId: primaryTarget.id, targetType: 'PLAYER' }; ai.thinkTimer = 30; }
        });
    }
}

class PhysicsSystem {
    process() {
        GameEngine.objectManager.queryComponents(['velocity','transform']).forEach(obj=>{
            const comp=obj.components;
            if(obj.hasComponent('combat')){
                ['dash','parry','turn'].forEach(k=>comp.combat.cooldowns[k]=Math.max(0,comp.combat.cooldowns[k]-1));
                comp.combat.invulnerabilityTimer=Math.max(0,comp.combat.invulnerabilityTimer-1); comp.combat.stateTimer=Math.max(0,comp.combat.stateTimer-1);
                const s=comp.combat.state;
                if(s===GameConfiguration.ACTION_STATE.STUNNED){ comp.velocity.multiply(0.85); if(comp.combat.stateTimer<=0)comp.combat.state=GameConfiguration.ACTION_STATE.IDLE; }
                else if(s===GameConfiguration.ACTION_STATE.DASH){ comp.combat.invulnerabilityTimer=2; if(comp.combat.stateTimer<=0){comp.combat.state=GameConfiguration.ACTION_STATE.IDLE;comp.velocity.multiply(0.5);comp.combat.levelOverride=0;} }
                else if(s===GameConfiguration.ACTION_STATE.PARRY){
                    comp.velocity.multiply(1.0); if(comp.combat.stateTimer<=0)comp.combat.state=GameConfiguration.ACTION_STATE.IDLE;
                    if(comp.velocity.magnitude() > 1.0) GameObjectFactory.instantiateParticle(comp.transform.position.x, comp.transform.position.y, VisualPalette.WHITE, 2, 'SPARK');
                }
                else if(s===GameConfiguration.ACTION_STATE.DODGE){ comp.velocity.multiply(0.9); comp.combat.invulnerabilityTimer=2; if(comp.combat.stateTimer<=0)comp.combat.state=GameConfiguration.ACTION_STATE.IDLE; }
                else if(s===GameConfiguration.ACTION_STATE.CHARGING||s===GameConfiguration.ACTION_STATE.LEVEL_3_READY||s===GameConfiguration.ACTION_STATE.LEVEL_4_READY){ comp.velocity.multiply(0.5); }
                else if(s===GameConfiguration.ACTION_STATE.WALK && comp.combat.combatIntensity > 0) {
                    if(Math.random() > 0.7) GameObjectFactory.instantiateParticle(comp.transform.position.x, comp.transform.position.y - 10, VisualPalette.GREY, 1, 'IMPLODE');
                    comp.velocity.multiply(GameConfiguration.PHYSICS.FRICTION);
                }
                else { comp.velocity.multiply(GameConfiguration.PHYSICS.FRICTION); }
            }
            comp.transform.position.add(comp.velocity);
            const bounds=GameEngine.config.BOUNDS; let wallHit = false;
            if(comp.transform.position.x<bounds){comp.transform.position.x=bounds;comp.velocity.x*=-0.8; wallHit=true;}
            if(comp.transform.position.x>GameEngine.screenWidth-bounds){comp.transform.position.x=GameEngine.screenWidth-bounds;comp.velocity.x*=-0.8; wallHit=true;}
            if(comp.transform.position.y<bounds){comp.transform.position.y=bounds;comp.velocity.y*=-0.8; wallHit=true;}
            if(comp.transform.position.y>GameEngine.screenHeight-bounds){comp.transform.position.y=GameEngine.screenHeight-bounds;comp.velocity.y*=-0.8; wallHit=true;}
            if(wallHit && obj.components.combat.state === GameConfiguration.ACTION_STATE.STUNNED) {
                GameEngine.eventBus.publish('EVENT_HIT', {attacker:obj, victim:obj, level:0, wallCollision:true}); GameEngine.eventBus.publish('EVENT_SHAKE', 20);
            }
        });
        GameEngine.objectManager.queryTag('loot').forEach(p=>{p.components.transform.rotation+=0.05; p.components.loot.life--; if(p.components.loot.life<=0)GameEngine.objectManager.destroyObject(p);});
        if(GameEngine.flags.subMode==='COOP'){const ps=GameEngine.objectManager.queryTag('player'); if(ps.length>1 && Vector2D.distance(ps[0].components.transform.position,ps[1].components.transform.position)<42){const push=Vector2D.subtract(ps[0].components.transform.position,ps[1].components.transform.position).normalize().multiply(3); ps[0].components.velocity.add(push); ps[1].components.velocity.subtract(push);}}
    }
}

class CombatSystem {
    calculateVelocityLevel(obj) { if(!obj.hasComponent('combat'))return 0; if(obj.components.combat.levelOverride)return obj.components.combat.levelOverride; const s=obj.components.combat.state; if(s===GameConfiguration.ACTION_STATE.DASH||s===GameConfiguration.ACTION_STATE.SPRINT)return 2; if(s===GameConfiguration.ACTION_STATE.WALK || s===GameConfiguration.ACTION_STATE.BRACING)return 0.5; if(s===GameConfiguration.ACTION_STATE.MOVE)return 1; return 0; }
    process() {
        const combatants=GameEngine.objectManager.queryComponents(['combat','stats']), loot=GameEngine.objectManager.queryTag('loot');
        combatants.forEach(entity=>{
            combatants.forEach(other=>{ if(entity!==other && Vector2D.distance(entity.components.transform.position, other.components.transform.position) < (entity.components.stats.radius + other.components.stats.radius)) this.resolveCollision(entity,other); });
            for(let i=loot.length-1;i>=0;i--) if(Vector2D.distance(entity.components.transform.position,loot[i].components.transform.position)<30) GameEngine.eventBus.publish('EVENT_LOOT',{target:entity,item:loot[i]});
        });
    }
    resolveCollision(e1, e2) {
        const pushDir = Vector2D.subtract(e1.components.transform.position, e2.components.transform.position).normalize();
        const pushForce = 1.2; e1.components.velocity.add(pushDir.clone().multiply(pushForce)); e2.components.velocity.subtract(pushDir.clone().multiply(pushForce));
        if(e1.components.combat.state===GameConfiguration.ACTION_STATE.STUNNED) { if(this.calculateVelocityLevel(e2) < 1) { e1.components.stats.hp -= 5; return; } return GameEngine.eventBus.publish('EVENT_HIT',{attacker:e2,victim:e1,level:this.calculateVelocityLevel(e2)}); }
        if(e2.components.combat.state===GameConfiguration.ACTION_STATE.STUNNED) { if(this.calculateVelocityLevel(e1) < 1) { e2.components.stats.hp -= 5; return; } return GameEngine.eventBus.publish('EVENT_HIT',{attacker:e1,victim:e2,level:this.calculateVelocityLevel(e1)}); }
        const l1=this.calculateVelocityLevel(e1), l2=this.calculateVelocityLevel(e2);
        if(e1.components.combat.state===GameConfiguration.ACTION_STATE.PARRY) { if (l2 > 3) GameEngine.eventBus.publish('EVENT_HIT',{attacker:e2,victim:e1,level:l2}); else return GameEngine.eventBus.publish('EVENT_PARRY',{blocker:e1,attacker:e2,level:l2}); }
        if(e2.components.combat.state===GameConfiguration.ACTION_STATE.PARRY) { if (l1 > 3) GameEngine.eventBus.publish('EVENT_HIT',{attacker:e1,victim:e2,level:l1}); else return GameEngine.eventBus.publish('EVENT_PARRY',{blocker:e2,attacker:e1,level:l1}); }
        if(l1>=2 && l2>=2){ if(l1===l2)GameEngine.eventBus.publish('EVENT_CLASH',{e1,e2}); else if(l1>l2)GameEngine.eventBus.publish('EVENT_HIT',{attacker:e1,victim:e2,level:l1}); else GameEngine.eventBus.publish('EVENT_HIT',{attacker:e2,victim:e1,level:l2}); return; }
        if(l1>=2 && l2<2) GameEngine.eventBus.publish('EVENT_HIT',{attacker:e1,victim:e2,level:l1}); else if(l2>=2 && l1<2) GameEngine.eventBus.publish('EVENT_HIT',{attacker:e2,victim:e1,level:l2});
    }
}

class RuleSystem {
    constructor() {
        GameEngine.eventBus.subscribe('EVENT_AREA_BLAST', ({source}) => {
             GameEngine.objectManager.queryComponents(['combat','stats']).forEach(target => {
                 if (target === source) return;
                 const d = Vector2D.distance(source.components.transform.position, target.components.transform.position);
                 if (d < 150) {
                     const dir = Vector2D.subtract(target.components.transform.position, source.components.transform.position).normalize();
                     target.components.velocity = dir.multiply(50); target.components.stats.hp -= GameConfiguration.DAMAGE_VALUES.AREA_BLAST;
                     target.components.combat.state = GameConfiguration.ACTION_STATE.STUNNED; target.components.combat.stateTimer = 60;
                     GameObjectFactory.instantiateShockwave(target.components.transform.position.x, target.components.transform.position.y, VisualPalette.ORANGE); GameEngine.eventBus.publish('EVENT_SHAKE', 30);
                 }
             });
             GameObjectFactory.instantiateShockwave(source.components.transform.position.x, source.components.transform.position.y, VisualPalette.ORANGE);
        });
        GameEngine.eventBus.subscribe('EVENT_HIT', ({attacker,victim,level,wallCollision})=>{
            if(wallCollision) { victim.components.stats.hp -= GameConfiguration.DAMAGE_VALUES.WALL_COLLISION; return; }
            if(victim.components.combat.state!==GameConfiguration.ACTION_STATE.STUNNED && victim.components.combat.invulnerabilityTimer>0) return;
            if(victim.components.combat.state===GameConfiguration.ACTION_STATE.DODGE) return;
            let dmg = level===4?GameConfiguration.DAMAGE_VALUES.LEVEL_4:(level===3?GameConfiguration.DAMAGE_VALUES.LEVEL_3:(level===2?GameConfiguration.DAMAGE_VALUES.LEVEL_2:GameConfiguration.DAMAGE_VALUES.LEVEL_1));
            const isBracing = victim.components.combat.state === GameConfiguration.ACTION_STATE.BRACING;
            if (isBracing) { dmg *= 0.5; GameEngine.eventBus.publish('EVENT_FLASH', 0.2); }
            victim.components.stats.hp-=dmg;
            if(victim.hasComponent('ai')){
                victim.components.ai.memory.damageTaken++;
                if(victim.hasTag('BOSS') && victim.components.stats.hp<victim.components.stats.maxHp*0.5) GameEngine.eventBus.publish('EVENT_BOSS_PHASE',{boss:victim,phase:2});
            }
            if(victim.hasTag('player')) GameEngine.flags.heat = Math.max(0, GameEngine.flags.heat - GameConfiguration.HEAT_SYSTEM.PENALTY_HIT);
            const isCharging = (victim.components.combat.state >= GameConfiguration.ACTION_STATE.CHARGING && victim.components.combat.state <= GameConfiguration.ACTION_STATE.LEVEL_4_READY);
            const isStunned = victim.components.combat.state === GameConfiguration.ACTION_STATE.STUNNED;
            if (!isCharging) { if(!isStunned) victim.components.combat.state=GameConfiguration.ACTION_STATE.IDLE; }
            let force = level===4?100:(level===3?60:(level===2?30:10)); if (isBracing) force *= 0.5;
            if (force > 0) { const k=Vector2D.subtract(victim.components.transform.position,attacker.components.transform.position).normalize().multiply(force*GameConfiguration.PHYSICS.RECOIL_MULTIPLIER); victim.components.velocity=k; attacker.components.velocity.add(k.clone().multiply(0.2)); }
            victim.components.combat.invulnerabilityTimer = GameConfiguration.TIMINGS.INVULNERABILITY_HIT; GameEngine.flags.hitStopTimer=(level>=3)?3:0;
            const shake = level===4?50:(level>=2?15:5); GameEngine.eventBus.publish('EVENT_SHAKE', shake);
            if(level>=3){ GameEngine.flags.chromaticAberration=20; if(level===4 && GameEngine.config.FX.FLASH) GameEngine.flags.invertedFrame=true; }
            if(level>=2) GameObjectFactory.instantiateShockwave(victim.components.transform.position.x, victim.components.transform.position.y, victim.components.render.baseColor);
            GameEngine.eventBus.publish('EVENT_PARTICLE_BURST',{x:victim.components.transform.position.x,y:victim.components.transform.position.y,col:victim.components.render.baseColor,count:10+shake});
            if(victim.components.stats.hp<=0) GameEngine.eventBus.publish('EVENT_DEATH',{victim,attacker}); else if(victim.hasTag('player') && !GameEngine.flags.inMenu) GameEngine.flags.comboCounter=0;
        });
        GameEngine.eventBus.subscribe('EVENT_PARRY', ({blocker,attacker,level})=>{
            const blockerSpeed = blocker.components.velocity.magnitude();
            const recoil = 30 + (blockerSpeed > 1.0 ? blockerSpeed * 2.0 : 0);
            const r=Vector2D.subtract(attacker.components.transform.position,blocker.components.transform.position).normalize().multiply(recoil);
            attacker.components.velocity=r; attacker.components.combat.state=GameConfiguration.ACTION_STATE.STUNNED; attacker.components.combat.stateTimer = (level >= 3) ? 120 : 60; attacker.components.combat.invulnerabilityTimer=0;
            blocker.components.velocity=r.clone().multiply(-0.2); blocker.components.combat.invulnerabilityTimer=20; GameEngine.flags.hitStopTimer=3;
            if(blocker.hasTag('player')) GameEngine.flags.heat = Math.min(100, GameEngine.flags.heat + GameConfiguration.HEAT_SYSTEM.SCORE_PARRY);
            GameObjectFactory.instantiateShockwave(blocker.components.transform.position.x, blocker.components.transform.position.y, VisualPalette.WHITE);
            GameEngine.eventBus.publish('EVENT_PARTICLE_BURST',{x:attacker.components.transform.position.x,y:attacker.components.transform.position.y,col:VisualPalette.WHITE,count:30}); GameEngine.eventBus.publish('EVENT_FLASH',0.3); GameEngine.eventBus.publish('EVENT_SHAKE',30);
        });
        GameEngine.eventBus.subscribe('EVENT_CLASH', ({e1,e2})=>{
            GameEngine.flags.hitStopTimer=4; GameEngine.eventBus.publish('EVENT_SHAKE',30); const d=Vector2D.subtract(e1.components.transform.position,e2.components.transform.position).normalize();
            e1.components.velocity=d.clone().multiply(40); e2.components.velocity=d.clone().multiply(-40); e1.components.combat.state=e2.components.combat.state=GameConfiguration.ACTION_STATE.IDLE; e1.components.combat.invulnerabilityTimer=e2.components.combat.invulnerabilityTimer=10;
            if(e1.hasTag('player')||e2.hasTag('player')) GameEngine.flags.heat = Math.min(100, GameEngine.flags.heat + GameConfiguration.HEAT_SYSTEM.SCORE_CLASH);
            const m=Vector2D.subtract(e2.components.transform.position,e1.components.transform.position).multiply(0.5).add(e1.components.transform.position);
            GameObjectFactory.instantiateShockwave(m.x, m.y, VisualPalette.WHITE); GameEngine.eventBus.publish('EVENT_PARTICLE_BURST',{x:m.x,y:m.y,col:VisualPalette.WHITE,count:40});
        });
        GameEngine.eventBus.subscribe('EVENT_LOOT', ({target,item})=>{
            GameEngine.eventBus.publish('EVENT_PARTICLE_BURST',{x:item.components.transform.position.x,y:item.components.transform.position.y,col:item.components.render.baseColor,count:30});
            const mod=item.components.loot.data.modifier;
            if(mod.type==='STAT') target.components.stats[mod.key]=Math.min(target.components.stats[mod.key]+mod.value,target.components.stats.maxHp);
            else if(mod.type==='STATUS') target.components.combat[mod.key]=mod.value;
            else if(mod.type==='SPECIAL' && target.hasTag('player')) { if(target.components.stats.extraLives<1)target.components.stats.extraLives++; else target.components.stats.hp=target.components.stats.maxHp; }
            GameEngine.objectManager.destroyObject(item);
        });
        GameEngine.eventBus.subscribe('EVENT_REVIVE', ({entity})=>{
            entity.components.stats.extraLives--; entity.components.stats.hp=entity.components.stats.maxHp; entity.components.combat.invulnerabilityTimer=180;
            GameEngine.flags.hitStopTimer=30; GameEngine.eventBus.publish('EVENT_SHAKE',50); GameEngine.eventBus.publish('EVENT_FLASH',1); GameEngine.eventBus.publish('EVENT_PARTICLE_BURST',{x:entity.components.transform.position.x,y:entity.components.transform.position.y,col:LootDatabase.EXTRA_LIFE.color,count:50});
        });
        GameEngine.eventBus.subscribe('EVENT_DEATH', ({victim,attacker})=>{
            if(victim.components.stats.extraLives>0) return GameEngine.eventBus.publish('EVENT_REVIVE',{entity:victim});
            GameEngine.objectManager.destroyObject(victim); GameEngine.flags.hitStopTimer=5; GameEngine.flags.killStreak++; GameEngine.flags.comboCounter++;
            let s=100; if(victim.hasTag('ENEMY_BOSS'))s=5000; else if(victim.hasTag('ENEMY_ELITE'))s=1000;
            if(attacker.hasTag('player')) GameEngine.flags.heat = Math.min(100, GameEngine.flags.heat + GameConfiguration.HEAT_SYSTEM.SCORE_KILL * (victim.hasTag('ENEMY_BOSS')?5:1));
            if(!GameEngine.flags.inMenu) { GameEngine.flags.score += s * (1 + GameEngine.flags.heat * 0.1); GameEngine.userInterface.updateScore(); }
            if(!victim.hasTag('ENEMY_STANDARD')){ GameEngine.flags.hitStopTimer=20; GameEngine.eventBus.publish('EVENT_SHAKE',100); GameEngine.eventBus.publish('EVENT_FLASH',0.8); }
            if(GameEngine.config.FX.BLOOD) {
                for(let i=0;i<15;i++) GameEngine.visualEntities.blood.push({
                    position:new Vector2D(victim.components.transform.position.x,victim.components.transform.position.y),
                    velocity:new Vector2D(Math.cos(Math.random()*6.28)*Math.random()*10,Math.sin(Math.random()*6.28)*Math.random()*10),
                    color:victim.components.render.baseColor, size:Math.random()*12+6, rotation:Math.random()*6, life:1000
                });
                if(GameEngine.visualEntities.blood.length > 500) GameEngine.visualEntities.blood.splice(0, GameEngine.visualEntities.blood.length - 100);
            }
        });
    }
}

class RenderSystem {
    constructor() { this.renderContext=document.getElementById("gameCanvas").getContext("2d"); }
    render() {
    this.renderContext.clearRect(0,0,GameEngine.screenWidth,GameEngine.screenHeight);
    if(GameEngine.flags.invertedFrame){this.renderContext.fillStyle=VisualPalette.WHITE;this.renderContext.fillRect(0,0,GameEngine.screenWidth,GameEngine.screenHeight);return;}
    this.renderContext.save();
    const sI=GameEngine.flags.shakeIntensity, sX=(Math.random()-0.5)*sI, sY=(Math.random()-0.5)*sI;
    this.renderContext.translate(sX,sY);
    if(GameEngine.userInterface.menu) GameEngine.userInterface.menu.style.transform = `translate(${sX}px, ${sY}px)`;
    if(GameEngine.config.FX.GRID) this.renderGrid();
    GameEngine.visualEntities.blood.forEach(b=>{this.renderContext.save();this.renderContext.translate(b.position.x,b.position.y);this.renderContext.rotate(b.rotation);this.renderContext.fillStyle=b.color;this.renderContext.globalAlpha=0.6;this.renderContext.fillRect(-b.size/2,-b.size/2,b.size,b.size);this.renderContext.restore();});
    const heat=GameEngine.flags.heat;
    if(GameEngine.flags.chromaticAberration>1 || heat>50){
        const dist = GameEngine.flags.chromaticAberration + (heat>75?(heat-75)/4:0);
        this.renderContext.save(); this.renderContext.globalCompositeOperation="screen";
        this.renderContext.translate(dist,0);this.renderAllEntities();
        this.renderContext.translate(-dist*2,0);this.renderAllEntities();
        this.renderContext.restore();
    }
    this.renderAllEntities();

    this.renderContext.lineWidth=4; GameEngine.activeShockwaves.forEach(s=>{this.renderContext.globalAlpha=s.alpha;this.renderContext.strokeStyle=s.color;this.renderContext.beginPath();this.renderContext.arc(s.x,s.y,s.r,0,Math.PI*2);this.renderContext.stroke();});this.renderContext.globalAlpha=1;
    if(GameEngine.flags.flashOpacity>0&&GameEngine.config.FX.FLASH){this.renderContext.fillStyle=`rgba(255,255,255,${GameEngine.flags.flashOpacity})`;this.renderContext.fillRect(-sX,-sY,GameEngine.screenWidth,GameEngine.screenHeight);}
    GameEngine.visualEntities.texts.forEach(t=>{this.renderContext.globalAlpha=Math.max(0,t.life);this.renderContext.fillStyle=t.color;this.renderContext.font="30px VT323";this.renderContext.shadowColor=t.color;this.renderContext.shadowBlur=10;this.renderContext.fillText(t.str,t.position.x,t.position.y);this.renderContext.shadowBlur=0;});
    if(GameEngine.flags.subMode==='SOLO'&&GameEngine.systems.input.scheme==='MOUSE'&&!GameEngine.flags.inMenu){
        const p1=GameEngine.objectManager.queryTag('player')[0];
        if(p1){ this.renderContext.strokeStyle="rgba(255,255,255,0.1)";this.renderContext.setLineDash([4,4]);this.renderContext.beginPath();this.renderContext.moveTo(p1.components.transform.position.x,p1.components.transform.position.y);this.renderContext.lineTo(GameEngine.systems.input.mouseCoords.x,GameEngine.systems.input.mouseCoords.y);this.renderContext.stroke();this.renderContext.setLineDash([]);this.renderContext.fillStyle=VisualPalette.CYAN;this.renderContext.fillRect(GameEngine.systems.input.mouseCoords.x-4,GameEngine.systems.input.mouseCoords.y-4,8,8); }
    }
    this.renderContext.restore();
    if(heat>20){
        const g=this.renderContext.createRadialGradient(GameEngine.screenWidth/2,GameEngine.screenHeight/2,GameEngine.screenHeight*0.6,GameEngine.screenWidth/2,GameEngine.screenHeight/2,GameEngine.screenHeight);
        g.addColorStop(0,"transparent"); g.addColorStop(1,`rgba(20,0,0,${(heat/150)})`);
        this.renderContext.fillStyle=g;this.renderContext.fillRect(0,0,GameEngine.screenWidth,GameEngine.screenHeight);
    }
}
    renderAllEntities() {
        GameEngine.objectManager.queryTag('loot').forEach(p=>{this.renderContext.save();this.renderContext.translate(p.components.transform.position.x,p.components.transform.position.y);this.renderContext.rotate(p.components.transform.rotation);this.renderContext.fillStyle=p.components.render.baseColor;this.renderContext.globalAlpha=Math.min(1,p.components.loot.life/60);this.renderContext.beginPath();this.renderContext.moveTo(0,-10);this.renderContext.lineTo(10,0);this.renderContext.lineTo(0,10);this.renderContext.lineTo(-10,0);this.renderContext.fill();if(GameEngine.config.FX.GLOW){this.renderContext.shadowColor=p.components.render.baseColor;this.renderContext.shadowBlur=30;this.renderContext.stroke();}this.renderContext.restore();});
        GameEngine.activeParticles.forEach(p=>{
            this.renderContext.globalAlpha=p.life; this.renderContext.fillStyle=p.color;
            if(p.type==='IMPLODE') { this.renderContext.fillRect(p.position.x, p.position.y, 4, 4); } else if (p.type === 'SPARK') { this.renderContext.fillRect(p.position.x, p.position.y, 2, 2); } else { this.renderContext.fillRect(p.position.x,p.position.y,p.size,p.size); }
        });
        GameEngine.objectManager.queryTag('enemy').forEach(e=>this.renderEntity(e,0)); GameEngine.objectManager.queryTag('player').forEach(p=>this.renderEntity(p,Math.random()*(p.components.combat.state>=GameConfiguration.ACTION_STATE.CHARGING?2:0),p.components.combat.state===GameConfiguration.ACTION_STATE.PARRY));
    }
    renderEntity(obj, offset, shield) {
        let col=ColorUtils.resolveDynamicColor(obj.components.render.baseColor, obj.components.combat.state);
        const level = GameEngine.systems.combat.calculateVelocityLevel(obj);
        let scale = 1.0, showTrail = false, auraBlur = 0;
        if (level >= 1) showTrail = true; if (level >= 2) scale = 1.1; if (level >= 3) { auraBlur = 20; scale = 1.2; } if (level >= 4) { col = GameConfiguration.ENTITY_COLORS.MAX_CHARGE; auraBlur = 40; scale = 1.3; }
        this.renderContext.save(); this.renderContext.translate(obj.components.transform.position.x+offset,obj.components.transform.position.y+offset);
        if(obj.components.combat.invulnerabilityTimer > 0 && obj.components.combat.invulnerabilityTimer % 4 < 2) this.renderContext.globalAlpha = 0.4;
        if(GameEngine.config.FX.GLOW){ this.renderContext.shadowBlur = obj.components.combat.state===GameConfiguration.ACTION_STATE.CHARGING ? 60 : (30 + auraBlur); this.renderContext.shadowColor = col; this.renderContext.globalCompositeOperation = 'screen'; }
        if(GameEngine.config.FX.GLOW && showTrail){
            obj.components.render.trail.push({x:obj.components.transform.position.x,y:obj.components.transform.position.y}); if(obj.components.render.trail.length > (level>=3?10:5)) obj.components.render.trail.shift();
            obj.components.render.trail.forEach((t,i)=>{this.renderContext.globalAlpha=i/15;this.renderContext.fillStyle=col;this.renderContext.beginPath();this.renderContext.arc(t.x-obj.components.transform.position.x,t.y-obj.components.transform.position.y,obj.components.stats.radius,0,2*Math.PI);this.renderContext.fill();}); this.renderContext.globalAlpha=1;
        } else { if(obj.components.render.trail.length > 0) obj.components.render.trail.shift(); }
        if(shield){this.renderContext.strokeStyle=VisualPalette.WHITE;this.renderContext.lineWidth=4;this.renderContext.beginPath();this.renderContext.arc(0,0,obj.components.stats.radius+8,0,2*Math.PI);this.renderContext.stroke();}
        if(obj.components.stats.hp<30&&Math.floor(Date.now()/50)%2==0)this.renderContext.globalAlpha=0.4;
        this.renderContext.rotate(Math.atan2(obj.components.velocity.y,obj.components.velocity.x));
        const speedMag = obj.components.velocity.magnitude(); const stretch = 1 + Math.min(speedMag/60, 0.8); this.renderContext.scale(stretch * scale, (1/stretch) * scale);
        this.renderContext.fillStyle=col;this.renderContext.beginPath();this.renderContext.arc(0,0,obj.components.stats.radius,0,2*Math.PI);this.renderContext.fill();
        this.renderContext.fillStyle=VisualPalette.WHITE;this.renderContext.globalAlpha=0.4;this.renderContext.beginPath();this.renderContext.arc(0,0,obj.components.stats.radius*0.6,0,2*Math.PI);this.renderContext.fill();
        this.renderContext.restore();
    }
    renderGrid() {
        this.renderContext.fillStyle=GameEngine.flags.heat>50?"#221":"#111"; this.renderContext.lineWidth=1;
        for(let x=0;x<GameEngine.screenWidth;x+=100) { for(let y=0;y<GameEngine.screenHeight;y+=100) {
            if((x+y)%200===0) { this.renderContext.fillStyle=GameEngine.flags.heat>70?"#511":"#222"; this.renderContext.fillRect(x-1,y-10,2,20); this.renderContext.fillRect(x-10,y-1,20,2); } else { this.renderContext.fillStyle="#1a1a1a"; this.renderContext.fillRect(x-2,y-2,4,4); }
        }}
    }
}

            if(!GameEngine.gameLoop.lastTime)GameEngine.gameLoop.lastTime=timestamp; let dt=timestamp-GameEngine.gameLoop.lastTime; GameEngine.gameLoop.lastTime=timestamp; if(dt>200) dt=GameEngine.gameLoop.step;

                    if(!GameEngine.flags.inMenu) { GameEngine.flags.heat = Math.max(0, GameEngine.flags.heat - GameConfiguration.HEAT_SYSTEM.DECAY_RATE); GameEngine.userInterface.updateScore(); }
                    else if(GameEngine.flags.inMenu && GameEngine.objectManager.queryTag('player').length === 0 && GameEngine.objectManager.idCounter > 0) {
                          const ai1 = GameObjectFactory.instantiateFromBlueprint('PLAYER_ONE', GameEngine.screenWidth*0.3, GameEngine.screenHeight/2); ai1.components.input.deviceId = 'ai'; ai1.addComponent('ai', {behavior:AiBehaviorDatabase.AGGRESSIVE, traits:["BRAVE"], memory:{damageTaken:0}, thinkTimer:0, activePlan:null});
                          const ai2 = GameObjectFactory.instantiateFromBlueprint('PLAYER_TWO', GameEngine.screenWidth*0.7, GameEngine.screenHeight/2); ai2.components.input.deviceId = 'ai'; ai2.addComponent('ai', {behavior:AiBehaviorDatabase.AGGRESSIVE, traits:["BRAVE"], memory:{damageTaken:0}, thinkTimer:0, activePlan:null});
                    }
                    GameEngine.director.spawnWave();
                    GameEngine.systems.ai.process(); GameEngine.systems.physics.process(); GameEngine.systems.combat.process(); GameEngine.objectManager.cleanUp();
                    GameEngine.visualEntities.texts.forEach((t,i)=>{t.position.add(t.velocity);t.life-=0.02;if(t.life<=0)GameEngine.visualEntities.texts.splice(i,1)});
                    GameEngine.visualEntities.blood.forEach(b=>{b.position.add(b.velocity);b.velocity.multiply(0.85);});
                    for(let i=GameEngine.activeParticles.length-1; i>=0; i--) {
                        let p = GameEngine.activeParticles[i]; p.position.add(p.velocity); p.velocity.multiply(0.9); p.life-=0.05;
                        if(p.life<=0) { GameEngine.particlePool.release(p); GameEngine.activeParticles.splice(i,1); }
                    }
                    GameEngine.activeShockwaves.forEach((s,i)=>{s.r+=4; s.alpha-=0.05; if(s.alpha<=0)GameEngine.activeShockwaves.splice(i,1)});
                    if(GameEngine.objectManager.queryTag('player').length===0 && !GameEngine.flags.inMenu) GameEngine.director.triggerGameOver();
                }
                GameEngine.flags.shakeIntensity=Math.max(0,GameEngine.flags.shakeIntensity*0.9-0.1); GameEngine.flags.flashOpacity=Math.max(0,GameEngine.flags.flashOpacity-0.05); GameEngine.flags.chromaticAberration=Math.max(0,GameEngine.flags.chromaticAberration-0.5); GameEngine.flags.particleLimit=0; GameEngine.gameLoop.accumulator-=GameEngine.gameLoop.step;
            }
            GameEngine.systems.render.render(); GameEngine.flags.invertedFrame=false; GameEngine.gameLoop.id=requestAnimationFrame(GameEngine.gameLoop.run);
        }};
        window.addEventListener("resize",this.gameLoop.resize);
        this.eventBus.subscribe('EVENT_SHAKE',amount=>{if(this.config.FX.SHAKE)this.flags.shakeIntensity+=amount;});
        this.eventBus.subscribe('EVENT_FLASH',opacity=>{if(this.config.FX.FLASH)this.flags.flashOpacity=opacity;});
        this.eventBus.subscribe('EVENT_PARTICLE_SPAWN',d=>{if(GameEngine.flags.particleLimit>GameConfiguration.RENDERING.MAX_PARTICLES)return;if(GameEngine.activeParticles.length>GameConfiguration.RENDERING.MAX_PARTICLES){GameEngine.particlePool.release(GameEngine.activeParticles.shift());}GameEngine.flags.particleLimit++;GameObjectFactory.instantiateParticle(d.x,d.y,d.col,d.speed, d.type);});
        this.eventBus.subscribe('EVENT_PARTICLE_IMPLODE',d=>{ for(let i=0;i<d.count;i++){ let ang=Math.random()*6.28, dist=30+Math.random()*20;
            let hsl = ColorUtils.hexToHSL(d.target.components.render.baseColor); let col = `hsl(${hsl.h}, ${hsl.s}%, 70%)`; if (d.count >= 4) col = `hsl(${Math.random()*360}, 100%, 70%)`;
            const p = GameEngine.particlePool.acquire(); p.active=true; p.type='IMPLODE'; p.position.x = d.target.components.transform.position.x+Math.cos(ang)*dist; p.position.y = d.target.components.transform.position.y+Math.sin(ang)*dist; p.velocity.x = -Math.cos(ang)*2; p.velocity.y = -Math.sin(ang)*2; p.color=col; p.life=1; p.size=3; GameEngine.activeParticles.push(p);
        }});
        this.eventBus.subscribe('EVENT_PARTICLE_BURST',d=>{if(!this.config.FX.BLOOD&&!this.config.FX.FLASH)return;for(let i=0;i<d.count;i++)this.eventBus.publish('EVENT_PARTICLE_SPAWN',{x:d.x,y:d.y,col:d.col,speed:Math.random()*10+5});});
        this.eventBus.subscribe('EVENT_TEXT',d=>this.visualEntities.texts.push({position:new Vector2D(d.x,d.y),velocity:new Vector2D(Math.random()-0.5,-2),str:d.txt,color:d.col,life:1}));
        this.gameLoop.resize(); this.director.startAttractMode(); this.gameLoop.id=requestAnimationFrame(this.gameLoop.run);
    }
}
GameEngine.initialize();
</script>
