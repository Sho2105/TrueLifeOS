render.showShield=combat.parryTimer>0;});};const PhysicsSystem=(entities)=>{entities.forEach(e=>{const t=e.components.Transform,v=e.components.Velocity,input=e.components.Input,combat=e.components.CombatState,r=e.components.Render,s=e.components.Stamina;if(!t||!v)return;if(e.components.Stats?.dead)return;const vel=v.vec;if(combat&&input&&combat.burstTimer<=0&&combat.parryTimer<=0&&!input.action&&combat.stunTimer<=0){let baseSpeed=(r.tier===1)?CONFIG.SPEED.MOMENTUM:CONFIG.SPEED.NORMAL;if(s&&s.current<=0)baseSpeed*=0.5;if(input.move.magnitude()>0.01)vel.add(input.move.clone().multiply(baseSpeed));}

if(t.y<p){t.y=p;vel.y*=-0.8}if(t.y>Game.screenHeight-p){t.y=Game.screenHeight-p;vel.y*=-0.8}}});};const CollisionSystem=(entities)=>{const actors=entities.filter(e=>e.components.CombatState&&!e.components.Stats.dead),pickups=entities.filter(e=>e.components.Loot);actors.forEach(a=>{pickups.forEach(p=>{if(Vector.distance(a.components.Transform,p.components.Transform)<a.components.Transform.radius+15)EventBus.emit('loot_pickup',{actor:a,pickup:p})})});for(let i=0;i<actors.length;i++){for(let j=i+1;j<actors.length;j++){let e1=actors[i],e2=actors[j],dist=Vector.distance(e1.components.Transform,e2.components.Transform),min=e1.components.Transform.radius+e2.components.Transform.radius;if(dist<min){let push=Vector.subtract(e1.components.Transform,e2.components.Transform).normalize().multiply(0.5);e1.components.Velocity.vec.add(push);e2.components.Velocity.vec.sub(push);if(((e1.components.PlayerTag&&e2.components.EnemyAI)||(e2.components.PlayerTag&&e1.components.EnemyAI))&&dist<42)EventBus.emit('combat_clash',{e1,e2});}}}};EventBus.on('dash',({entity,type})=>{let angle=0,input=entity.components.Input,vel=entity.components.Velocity.vec;if(input.move.magnitude()>0.1)angle=Math.atan2(input.move.y,input.move.x);else angle=Math.atan2(vel.y,vel.x);let speed=type==="HYPER"?CONFIG.SPEED.HYPER:CONFIG.SPEED.BURST,color=type==="HYPER"?CONFIG.COLORS.HYPER:CONFIG.COLORS.BURST;entity.components.Velocity.vec=new Vector(Math.cos(angle)*speed,Math.sin(angle)*speed);entity.components.CombatState.burstTimer=CONFIG.TIMING.BURST_DURATION;entity.components.CombatState.burstCooldown=CONFIG.TIMING.BURST_COOLDOWN;EventBus.emit('shake',type==="HYPER"?30:15);EventBus.emit('fx_burst',{x:entity.components.Transform.x,y:entity.components.Transform.y,color:color,count:type==="HYPER"?50:25});EventBus.emit('flash',type==="HYPER"?0.5:0.2);});EventBus.on('combat_clash',({e1,e2})=>{const resolve=(atk,def,tier)=>{if(def.components.CombatState.stunTimer<=0&&def.components.CombatState.invincibleTimer>0)return;let // --- RENDER SYSTEM (REWRITTEN: PURE GAMEPLAY) ---
const canvas=document.getElementById("gameCanvas"),context=canvas.getContext("2d");

const RenderSystem = (entities) => {
    // 1. Clear Screen (Solid Black)
    context.fillStyle = "#000000";
    context.fillRect(0, 0, Game.screenWidth, Game.screenHeight);

    // 2. Shake Effect (Keep Feel)
    context.save();
    if (Game.state.shakeIntensity > 0 && CONFIG.FX.SHAKE) {
        context.translate((Math.random() - 0.5) * Game.state.shakeIntensity, (Math.random() - 0.5) * Game.state.shakeIntensity);
    }

    // 3. Draw Entities (Simplified)
    entities.forEach(e => {
        const t = e.components.Transform;
        const r = e.components.Render;
        const v = e.components.Velocity;
        
        // Skip purely visual entities to reduce noise
        if (e.components.Particle || e.components.Text || (e.components.Lifetime && !e.components.Loot)) return;
        if (!t || !r) return;

        context.save();
        context.translate(t.x, t.y);

        if (e.components.Loot) {
            // Draw Loot as simple Squares
            context.fillStyle = r.color;
            context.fillRect(-10, -10, 20, 20);
            context.strokeStyle = "#fff";
            context.strokeRect(-10, -10, 20, 20);
        } else {
            // Draw Actors as simple Circles
            context.beginPath();
            context.arc(0, 0, t.radius, 0, 2 * Math.PI);
            context.fillStyle = r.color;
            
            // Visual feedback for states (Stunned = Gray, Invincible = White Outline)
            if (e.components.CombatState?.stunTimer > 0) context.fillStyle = "#555";
            context.fill();

            if (e.components.CombatState?.invincibleTimer > 0 && Math.floor(Date.now() / 50) % 2 == 0) {
                context.strokeStyle = "#fff";
                context.lineWidth = 2;
                context.stroke();
            }

            // Direction Line (To see where they are looking/moving)
            if (v && v.vec) {
                let angle = Math.atan2(v.vec.y, v.vec.x);
                if(v.vec.magnitude() < 0.1 && e.components.Input && e.components.Input.move.magnitude() > 0.1) {
                    // Fallback to input direction if stationary
                    angle = Math.atan2(e.components.Input.move.y, e.components.Input.move.x);
                }
                
                context.strokeStyle = "#000"; // Contrast against filled color
                context.lineWidth = 2;
                context.beginPath();
                context.moveTo(0, 0);
                context.lineTo(Math.cos(angle) * t.radius, Math.sin(angle) * t.radius);
                context.stroke();
            }
            
            // Shield Indicator (Simple Ring)
            if (r.showShield) {
                context.strokeStyle = "#fff";
                context.lineWidth = 4;
                context.stroke();
            }
        }
        context.restore();
    });

    // 4. Mouse Indicator
    if (Game.state.inputScheme === 'MOUSE') {
        context.strokeStyle = "#fff";
        context.lineWidth = 1;
        context.strokeRect(Game.mouse.x - 5, Game.mouse.y - 5, 10, 10);
        
        // Simple Charge Bar (No fancy gradients)
        let p1 = entities.find(e => e.components.PlayerTag);
        if (p1 && p1.components.CombatState.chargeTimer > 0) {
            let ct = p1.components.CombatState.chargeTimer;
            let max = CONFIG.TIMING.CHARGE_HYPER_THRESHOLD;
            let w = Math.min(ct, max) / max * 50;
            context.fillStyle = "#fff";
            context.fillRect(Game.mouse.x - 25, Game.mouse.y + 15, w, 4);
        }
    }

    // 5. Flash Effect (Keep Feel)
    context.restore(); // Restore from shake
    if (Game.state.flashOpacity > 0 && CONFIG.FX.FLASH) {
        context.fillStyle = `rgba(255,255,255,${Game.state.flashOpacity})`;
        context.fillRect(0, 0, Game.screenWidth, Game.screenHeight);
    }
};
