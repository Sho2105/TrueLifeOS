<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Project: Speed (Modular Shield)</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=VT323&display=swap");

      :root {
        --bg: #111;
        --txt: #888;
        --hi: #fff;
        --font: "VT323", monospace;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--txt);
        font-family: var(--font);
        user-select: none;
        touch-action: none;
      }

      canvas {
        position: absolute;
        inset: 0;
        z-index: 10;
        cursor: crosshair;
        pointer-events: auto;
      }

      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        pointer-events: none;
        max-width: 400px;
      }

      .section {
        margin-bottom: 20px;
        pointer-events: auto;
        transition: opacity 0.2s;
        width: 100%;
      }

      .section.sunken {
        opacity: 0.2;
        pointer-events: none;
      }

      .hidden {
        display: none;
      }

      h1 {
        font-size: 40px;
        margin: 0;
        line-height: 1;
        font-weight: normal;
        color: var(--hi);
        letter-spacing: 2px;
      }

      .score {
        font-size: 24px;
        margin-bottom: 10px;
        color: var(--hi);
      }

      .row {
        display: flex;
        gap: 15px;
        margin: 5px 0;
        font-size: 18px;
        color: #555;
      }

      .opt {
        cursor: pointer;
        transition: color 0.2s;
      }

      .opt.active {
        color: var(--hi);
      }

      .btn-m {
        font-size: 24px;
        color: var(--hi);
        cursor: pointer;
        background: transparent;
        padding: 0;
        display: block;
      }

      .btn-m:hover {
        text-decoration: underline;
      }

      .btn-s {
        font-size: 16px;
        color: #666;
        cursor: pointer;
        margin-top: 5px;
        display: block;
      }

      .btn-s:hover {
        color: #aaa;
      }

      #guide {
        margin-top: 20px;
        border-top: 1px solid #333;
        padding-top: 10px;
        font-size: 14px;
      }

      .g-grid {
        display: grid;
        grid-template-columns: 70px 80px 30px 1fr;
        gap: 5px;
        margin-bottom: 5px;
        align-items: center;
      }

      .g-head {
        color: #666;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
        margin-bottom: 10px;
        font-weight: bold;
      }

      .g-in {
        color: var(--hi);
      }

      .g-name {
        color: #aaa;
      }

      .g-tier {
        color: #aaa;
        text-align: center;
      }

      .g-desc {
        color: #666;
        font-size: 13px;
        line-height: 1;
      }

      #debug-panel {
        font-size: 14px;
        color: #444;
        margin-top: 20px;
        border-top: 1px solid #333;
        padding-top: 5px;
        font-family: monospace;
      }

      .touch-box {
        display: none;
        position: absolute;
        z-index: 30;
        pointer-events: none;
        inset: 0;
      }

      .pad {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        pointer-events: auto;
      }

      .stk-base {
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.02);
      }

      .stk-nub {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        background: var(--hi);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .btn-act {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.02);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #444;
        font-size: 24px;
      }

      .btn-act.active {
        background: var(--hi);
        color: #000;
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <div id="menu" class="section">
        <h1>DEV_CORE_1.3</h1>
        <div id="score-disp" class="score">SCORE: 0</div>
        <div class="row">
          <span
            id="opt-MOUSE"
            class="opt active"
            onclick="G.sys.in.scheme('MOUSE')"
            >MOUSE</span
          >
          <span id="opt-TOUCH" class="opt" onclick="G.sys.in.scheme('TOUCH')"
            >TOUCH</span
          >
        </div>
        <div id="btn-start" class="btn-m" onclick="G.ui.start()">
          > START SIMULATION
        </div>
        <div class="btn-s" onclick="G.ui.toggleGuide()">
          > TOGGLE SYSTEM GUIDE
        </div>
      </div>
      <div id="guide" class="section hidden">
        <div class="g-grid g-head">
          <div>INPUT</div>
          <div>MOVE</div>
          <div>T</div>
          <div>INFO</div>
        </div>
        <div id="guide-list"></div>
      </div>
      <div id="debug-panel">
        FPS: <span id="d-fps">0</span> | ENT: <span id="d-ent">0</span> |
        <span id="d-mode">MOUSE</span>
      </div>
    </div>
    <div id="touch-layer" class="touch-box"></div>
    <canvas id="cvs"></canvas>
    <script>
      const PAL = { BG: "#111", W: "#fff" };
      const CFG = {
        PHY: { FRIC: 0.92, BOUNCE: -0.8, PAD: 25 },
        DMG: { BASE: 15, WALL: 25 },
        ST: { IDLE: "IDLE", MOVE: "MOVE", STUN: "STUN" },
        AIM: { ANG: 0.9, DIST: 500, STR: 0.35, DZONE: 0.1 },
        IN: { TAP_WIN: 8, HOLD_WIN: 9 },
      };
      const MoveReg = {
        IDLE: { tier: 0, style: "NRM", name: "IDLE", desc: "Standing still." },
        MOVE: {
          tier: 1,
          style: "NRM",
          name: "MOVE",
          desc: "Standard movement.",
        },
        STUN: { tier: 0, style: "STUN", name: "STUN", desc: "Incapacitated." },
        DASH: {
          tier: 3,
          style: "GLOW",
          dur: 15,
          name: "DASH",
          desc: "High speed dash. Breaks locks.",
          enter: (o, d) => {
            o.cp.vel = d.cln().mul(30);
            o.cp.cmb.invTimer = 10;
            o.cp.cmb.cds.dash = 60;
          },
          update: (o) => o.cp.vel.mul(0.85),
        },
        PARRY: {
          tier: 5,
          style: "PURE",
          dur: 20,
          name: "PARRY",
          desc: "Deflects attacks. High Priority.",
          enter: (o) => {
            o.cp.vel.mul(0.1);
            o.cp.cmb.cds.parry = 60;
            o.cp.cmb.invTimer = 5;
          },
        },
        SPRINT: {
    tier: 2,
    style: "GLOW",
    dur: 999,
    name: "SPRINT",
    desc: "Fast movement. Constant velocity.",
    update: (o, d) => {
        // FIX 1: Use d.cln() so we don't corrupt the input vector
        // FIX 2: Manually apply friction (mul 0.85) because PhySys skips it
        o.cp.vel.add(d.cln().mul(2.5));  
    },
    exit: (o) => o.cp.vel.mul(0.5)
},
        BRACE: {
    tier: 2,
    style: "DIM",
    dur: 999,
    name: "SHIELD",
    desc: "Directional Shield. Breaks if HP 0.",
    enter: (o) => {},
    update: (o, d) => {
        // FIX 1: Use d.cln()
        // FIX 2: Manually apply strong friction (mul 0.8) for the "heavy" feel
        o.cp.vel.add(d.cln().mul(1.5));
        o.cp.vel.mul(0.8);

        const c = o.cp.cmb;
        c.shieldHp = Math.min(c.shieldMax, c.shieldHp + 0.2);
    },
    onHit: (vi, at, dmg) => {
        let facing = vi.cp.vel.cln();
        if (facing.mag() < 0.1) facing = vi.cp.in.last.cln();
        const inc = Vec2.sub(at.cp.pos.v, vi.cp.pos.v).nrm();
        if (inc.dot(facing.nrm()) > 0) {
            vi.cp.cmb.shieldHp -= dmg;
            if (vi.cp.cmb.shieldHp <= 0) {
                vi.cp.cmb.state = "STUN";
                vi.cp.cmb.stTimer = 60;
                vi.cp.vel.mul(-1.5);
                FX.txt(vi.cp.pos.v, "!! BREAK !!", "#fff");
            } else {
                FX.txt(vi.cp.pos.v, "BLOCK", "#888");
            }
            return true;
        }
        return false;
    },
    draw: (ctx, o) => {
        const c = o.cp,
            s = c.st;
        const hpPct = c.cmb.shieldHp / c.cmb.shieldMax;
        if (hpPct <= 0) return;
        ctx.save();
        let ang = Math.atan2(c.vel.y, c.vel.x);
        if (c.vel.mag() < 0.1) ang = Math.atan2(c.in.last.y, c.in.last.x);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.arc(0, 0, s.rad + 8, -Math.PI / 3, Math.PI / 3);
        ctx.strokeStyle = c.ren.col;
        ctx.lineWidth = 4 * hpPct;
        ctx.stroke();
        ctx.restore();
    }
},
CHARGE: {
          tier: 1,
          style: "CHG",
          dur: 999,
          name: "CHARGE",
          desc: "Charges power for ultimate.",
          enter: (o) => {},
          update: (o) => {
            const c = o.cp.cmb;
            o.cp.vel.mul(0.8);
            c.chgTimer++;
            if (c.chgTimer > 100) {
              c.moveset = "L2";
              c.powerTimer = 400;
              c.chgTimer = 0;
              c.state = "IDLE";
              c.reqRel = true;
            }
          },
          exit: (o) => (o.cp.cmb.chgTimer = 0),
        },
        BLINK: {
          tier: 3,
          style: "PURE",
          dur: 10,
          name: "BLINK",
          desc: "Instant teleportation.",
          enter: (o, d) => {
            o.cp.pos.v.add(d.cln().mul(150));
            o.cp.cmb.cds.dash = 90;
          },
        },
      };
      const Loadouts = {
        L1: {
          tapA: "DASH",
          tapB: "PARRY",
          holdA: "SPRINT",
          holdB: "BRACE",
          chg: "CHARGE",
        },
        L2: {
          tapA: "BLINK",
          tapB: "PARRY",
          holdA: "SPRINT",
          holdB: "BRACE",
          chg: "CHARGE",
        },
      };
      const InpMap = {
        tapA: "REL A",
        tapB: "REL B",
        holdA: "HOLD A",
        holdB: "HOLD B",
        chg: "HOLD AB",
      };
      const Defs = {
        P1: {
          tags: ["player", "p1"],
          st: { hp: 100, max: 100, rad: 15, mods: { dmg: 1 } },
          col: "#0ff",
          in: "p1",
        },
        E_RUSH: {
          st: { hp: 100, max: 100, rad: 15, mods: { dmg: 1 } },
          ai: "AGRO",
          traits: ["SPRINT"],
          col: "#f00",
        },
        E_DEF: {
          st: { hp: 100, max: 100, rad: 15, mods: { dmg: 1 } },
          ai: "DEF",
          traits: ["BRACE"],
          col: "#678",
        },
        E_VUL: {
          st: { hp: 100, max: 100, rad: 15, mods: { dmg: 1 } },
          ai: "OPP",
          traits: ["TRICKY"],
          col: "#50f",
        },
        E_BOSS: {
          st: { hp: 3000, max: 3000, rad: 20, mods: { dmg: 1 } },
          ai: "BOSS",
          traits: ["BOSS"],
          col: "#a0f",
        },
      };
      const Loot = {
        HEAL: { col: "#0f0", txt: "HP", mod: { t: "STAT", k: "hp", v: 50 } },
        GOD: {
          col: "#fa0",
          txt: "GOD",
          mod: { t: "STATUS", k: "invTimer", v: 600 },
        },
        LIFE: {
          col: "#0ff",
          txt: "LIFE",
          mod: { t: "SPEC", k: "lives", v: 1 },
        },
      };
      class Vec2 {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }
        add(v) {
          this.x += v.x;
          this.y += v.y;
          return this;
        }
        sub(v) {
          this.x -= v.x;
          this.y -= v.y;
          return this;
        }
        mul(s) {
          this.x *= s;
          this.y *= s;
          return this;
        }
        mag() {
          return Math.sqrt(this.x ** 2 + this.y ** 2);
        }
        nrm() {
          const m = this.mag();
          if (m !== 0) this.mul(1 / m);
          return this;
        }
        dot(v) {
          return this.x * v.x + this.y * v.y;
        }
        cln() {
          return new Vec2(this.x, this.y);
        }
        static dist(a, b) {
          return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }
        static sub(a, b) {
          return new Vec2(a.x - b.x, a.y - b.y);
        }
      }
      class Bus {
        constructor() {
          this.s = {};
        }
        sub(e, cb) {
          (this.s[e] = this.s[e] || []).push(cb);
        }
        pub(e, d) {
          if (this.s[e]) this.s[e].forEach((cb) => cb(d));
        }
      }
      const CompSchemas = {
        st: ["hp", "max", "rad", "mods"],
        ren: ["col"],
        cmb: ["moveset", "state"],
        in: ["id"],
        ai: ["behav"],
      };
      const Col = {
        hsl: (h) => {
          let r = 0,
            g = 0,
            b = 0;
          if (h.length == 4) {
            r = "0x" + h[1] + h[1];
            g = "0x" + h[2] + h[2];
            b = "0x" + h[3] + h[3];
          } else {
            r = "0x" + h[1] + h[2];
            g = "0x" + h[3] + h[4];
            b = "0x" + h[5] + h[6];
          }
          r /= 255;
          g /= 255;
          b /= 255;
          let min = Math.min(r, g, b),
            max = Math.max(r, g, b),
            d = max - min,
            hv = 0,
            s = 0,
            l = (max + min) / 2;
          if (d == 0) hv = 0;
          else
            hv =
              max == r
                ? ((g - b) / d) % 6
                : max == g
                  ? (b - r) / d + 2
                  : (r - g) / d + 4;
          hv = Math.round(hv * 60);
          if (hv < 0) hv += 360;
          s = d == 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
          return { h: hv, s: s * 100, l: l * 100 };
        },
        dyn: (base, moveKey) => {
          const mv = MoveReg[moveKey],
            st = mv ? mv.style : "NRM",
            c = Col.hsl(base);
          let h = c.h,
            s = c.s,
            l = c.l;
          switch (st) {
            case "STUN":
              s = 0;
              l = 30;
              break;
            case "GLOW":
              l = 80;
              s = 100;
              break;
            case "DIM":
              l = 20;
              break;
            case "PURE":
              return PAL.W;
            case "CHG":
              l = 80 + Math.sin(Date.now() / 50) * 20;
              s = 100;
              break;
          }
          return `hsl(${h},${s}%,${l}%)`;
        },
      };
      const FX = {
        txt: (pos, str, col) =>
          G.vis.txt.push({
            pos: pos.cln(),
            vel: new Vec2(0, -1),
            str: str,
            col: col,
            life: 1.0,
          }),
      };
      const Acts = {
        vec: (s, t) => Vec2.sub(t.cp.pos.v, s.cp.pos.v),
        turn: (s, td) => {
          const c = s.cp.in.last,
            d = c.dot(td);
          s.cp.in.last = new Vec2(
            c.x + (td.x - c.x) * (d > 0.95 ? 0.5 : 1.5),
            c.y + (td.y - c.y) * (d > 0.95 ? 0.5 : 1.5),
          ).nrm();
        },
        H_SP: (s, t) => {
          s.cp.in.p1 = true;
          s.cp.in.p2 = false;
          Acts.turn(s, Acts.vec(s, t).nrm());
        },
        H_BR: (s, t) => {
          s.cp.in.p1 = false;
          s.cp.in.p2 = true;
          Acts.turn(s, Acts.vec(s, t).nrm());
        },
        H_CH: (s, t) => {
          s.cp.in.p1 = true;
          s.cp.in.p2 = true;
          Acts.turn(s, Acts.vec(s, t).nrm());
        },
        R_ATK: (s) => {
          s.cp.in.p1 = false;
          s.cp.in.p2 = false;
        },
        BAIT: (s, t) => {
          Acts.turn(s, Acts.vec(s, t).nrm().mul(-1));
          if (Math.random() < 0.1) s.cp.in.fP2 = true;
        },
        BOSS: (s, t) => {
          s.cp.in.p1 = true;
          Acts.turn(s, Acts.vec(s, t).nrm());
        },
      };
      const Behave = {
        AGRO: [
          { t: "H_SP", w: 5, r: [0, 3000], d: 60 },
          { t: "R_ATK", w: 3, cd: "dash", r: [0, 300], d: 5 },
        ],
        DEF: [
          { t: "H_BR", w: 5, r: [0, 3000], d: 120 },
          { t: "R_ATK", w: 2, cd: "dash", r: [0, 150], d: 5 },
          { t: "H_SP", w: 1, r: [300, 1000], d: 40 },
        ],
        OPP: [
          { t: "H_SP", cond: "T_STUN", w: 50, r: [0, 500], d: 30 },
          { t: "BAIT", cond: "T_ATK", w: 20, r: [0, 200], d: 20 },
          { t: "H_SP", w: 4, r: [200, 3000], d: 40 },
          { t: "R_ATK", w: 4, cd: "dash", r: [0, 250], d: 5 },
        ],
        BOSS: [
          { t: "H_CH", w: 2, r: [0, 3000], d: 90 },
          { t: "R_ATK", w: 4, cd: "dash", r: [0, 3000], d: 5 },
          { t: "BOSS", w: 1, r: [0, 3000], d: 100 },
        ],
      };
      class Obj {
        constructor(id) {
          this.id = id;
          this.cp = {};
          this.tags = new Set();
          this.act = true;
        }
        add(n, d) {
          this.cp[n] = d;
          return this;
        }
        has(n) {
          return !!this.cp[n];
        }
        tag(t) {
          return this.tags.has(t);
        }
      }
      class ObjMan {
        constructor() {
          this.all = [];
          this.nid = 0;
        }
        mk() {
          const o = new Obj(++this.nid);
          this.all.push(o);
          return o;
        }
        kill(o) {
          o.act = false;
        }
        clean() {
          this.all = this.all.filter((e) => e.act);
        }
        get(c) {
          return this.all.filter((e) => e.act && c.every((n) => e.has(n)));
        }
        tag(t) {
          return this.all.filter((e) => e.act && e.tag(t));
        }
      }
      const Factory = {
        validate: (o) => {
          for (let cName in o.cp) {
            if (CompSchemas[cName]) {
              const req = CompSchemas[cName];
              const has = Object.keys(o.cp[cName]);
              const missing = req.filter((x) => !has.includes(x));
              if (missing.length > 0)
                console.error(`Validation Error ${cName}`);
            }
          }
        },
        mk: (t, x, y) => {
          const o = G.obs.mk(),
            bp = Defs[t];
          if (!bp && t.includes("RUSH")) return Factory.foe(t, x, y);
          o.cp.pos = { v: new Vec2(x, y), rot: 0 };
          o.cp.vel = new Vec2(0, 0);
          if (bp.tags) bp.tags.forEach((tg) => o.tags.add(tg));
          o.add("st", { ...bp.st });
          o.add("ren", { col: bp.col }).add("in", {
            id: bp.in,
            p1: false,
            p2: false,
            ht1: 0,
            ht2: 0,
            last: new Vec2(1, 0),
          });
          o.add("cmb", {
            moveset: "L1",
            baseMoveset: "L1",
            state: CFG.ST.IDLE,
            stTimer: 0,
            chgTimer: 0,
            powerTimer: 0,
            cds: { parry: 0, dash: 0 },
            invTimer: 0,
            lvl: 0,
            reqRel: false,
            shieldHp: 100,
            shieldMax: 100,
          });
          Factory.validate(o);
          return o;
        },
        foe: (k, x, y) => {
          const o = G.obs.mk(),
            raw = Defs[Object.keys(Defs).find((dk) => k.includes(dk))];
          o.tags.add("enemy");
          o.tags.add(k);
          o.cp.pos = { v: new Vec2(x, y), rot: 0 };
          o.cp.vel = new Vec2(0, 0);
          o.add("st", { ...raw.st });
          o.add("ren", { col: raw.col });
          o.add("in", {
            id: "ai",
            p1: false,
            p2: false,
            ht1: 0,
            ht2: 0,
            last: new Vec2(1, 0),
            fP1: false,
            fP2: false,
          });
          o.add("cmb", {
            moveset: "L1",
            baseMoveset: "L1",
            state: CFG.ST.IDLE,
            stTimer: 0,
            chgTimer: 0,
            powerTimer: 0,
            cds: { parry: 0, dash: 0 },
            invTimer: 0,
            lvl: 0,
            reqRel: false,
            shieldHp: 100,
            shieldMax: 100,
          });
          o.add("ai", {
            behav: Behave[raw.ai],
            traits: raw.traits || [],
            mem: { dmg: 0 },
            tick: 0,
            plan: null,
          });
          Factory.validate(o);
          return o;
        },
        loot: (x, y, k) => {
          const o = G.obs.mk();
          o.tags.add("loot");
          o.cp.pos = { v: new Vec2(x, y), rot: 0 };
          o.cp.vel = new Vec2(0, 0);
          o.add("loot", { type: k, life: 1200, data: Loot[k] });
          o.add("ren", { col: Loot[k].col });
          return o;
        },

          if (o.has("ai") && o.cp.ai.plan) {
            this.x.fillStyle = "#888";
            this.x.fillText(`REQ:${o.cp.ai.plan.t}(${o.cp.ai.tick})`, 0, 35);
          }
          const mv = MoveReg[c.cmb.state];
          if (mv && mv.draw) mv.draw(this.x, o);
          this.x.rotate(Math.atan2(c.vel.y, c.vel.x));
          this.x.lineWidth = 3;
          this.x.strokeStyle = col;
          this.x.globalAlpha = 1;
          this.x.beginPath();
          this.x.arc(0, 0, s.rad, 0, Math.PI * 2);
          this.x.stroke();
          this.x.beginPath();
          this.x.moveTo(s.rad, 0);
          this.x.lineTo(s.rad + 10, 0);
          this.x.stroke();
          this.x.restore();
        }
      }
      class Game {
        static obs = new ObjMan();
        static vis = { txt: [] };
        static st = {
          menu: true,
          score: 0,
          kills: 0,
          stop: 0,
          wT: 0,
          lT: 1800,
          inv: false,
          combo: 0,
        };
        static bus = new Bus();
        static w = window.innerWidth;
        static h = window.innerHeight;
        static sys = {};
        static ui = {
          el: document.getElementById("menu"),
          sc: document.getElementById("score-disp"),
          d: {
            fps: document.getElementById("d-fps"),
            ent: document.getElementById("d-ent"),
            mode: document.getElementById("d-mode"),
          },
          start: () => {
            if (G.st.menu) {
              G.st.menu = false;
              G.ui.el.classList.remove("active");
              G.ui.el.classList.add("sunken");
              G.dir.play();
            } else {
              G.st.menu = true;
              G.ui.el.classList.add("active");
              G.ui.el.classList.remove("sunken");
            }
          },
          toggleGuide: () => {
            document.getElementById("guide").classList.toggle("hidden");
          },
          genGuide: () => {
            const c = document.getElementById("guide-list");
            c.innerHTML = "";
            for (const [k, v] of Object.entries(Loadouts.L1)) {
              const m = MoveReg[v];
              if (m) {
                const row = document.createElement("div");
                row.className = "g-grid";
                row.innerHTML = `<div class="g-in">${InpMap[k]}</div><div class="g-name">${m.name}</div><div class="g-tier">${m.tier}</div><div class="g-desc">${m.desc}</div>`;
                c.appendChild(row);
              }
            }
          },
          upd: () => {
            G.ui.sc.innerText = "SCORE: " + Math.floor(G.st.score);
          },
          debug: (dt) => {
            G.ui.d.fps.innerText = Math.round(1000 / dt);
            G.ui.d.ent.innerText = G.obs.all.length;
            G.ui.d.mode.innerText = G.sys.in.md;
          },
        };
        static dir = {
          attr: () => {
            G.obs.all = [];
            G.obs.nid = 0;
            G.vis.txt = [];
            const a1 = Factory.mk("P1", G.w * 0.5, G.h / 2);
            a1.cp.in.id = "ai";
            a1.add("ai", {
              behav: Behave.AGRO,
              traits: ["SPRINT"],
              mem: { dmg: 0 },
              tick: 0,
              plan: null,
            });
            G.st.menu = true;
            G.ui.el.classList.add("active");
            G.ui.el.classList.remove("sunken");
            G.dir.spawnFoe();
          },
          play: () => {
            G.loop.sz();
            G.obs.all = [];
            G.obs.nid = 0;
            G.vis.txt = [];
            Factory.mk("P1", G.w / 2, G.h / 2);
            G.st.score = 0;
            G.ui.upd();
            G.st.kills = 0;
            G.st.stop = 0;
            G.st.lT = 1800;
            G.sys.in.touch();
            G.dir.spawnFoe();
          },
          spawnFoe: () => {
            const r = Math.random(),
              t =
                r < 0.05
                  ? "E_BOSS"
                  : r < 0.4
                    ? "E_DEF"
                    : r < 0.7
                      ? "E_VUL"
                      : "E_RUSH";
            const s = Math.floor(Math.random() * 4),
              pos = [
                new Vec2(Math.random() * G.w, -40),
                new Vec2(G.w + 40, Math.random() * G.h),
                new Vec2(Math.random() * G.w, G.h + 40),
                new Vec2(-40, Math.random() * G.h),
              ][s];
            Factory.foe(t, pos.x, pos.y);
          },
          tick: () => {
            if (G.obs.tag("enemy").length === 0) G.dir.spawnFoe();
            if (G.st.menu && G.obs.tag("player").length === 0) {
              const a1 = Factory.mk("P1", G.w * 0.5, G.h / 2);
              a1.cp.in.id = "ai";
              a1.add("ai", {
                behav: Behave.AGRO,
                traits: ["SPRINT"],
                mem: { dmg: 0 },
                tick: 0,
                plan: null,
              });
            }
            G.st.lT--;
            if (G.st.lT <= 0) {
              Factory.loot(
                Math.random() * (G.w - 100) + 50,
                Math.random() * (G.h - 100) + 50,
                Math.random() > 0.8
                  ? "LIFE"
                  : Math.random() > 0.5
                    ? "GOD"
                    : "HEAL",
              );
              G.st.lT = 1800 + Math.random() * 1800;
            }
            if (G.obs.tag("player").length == 0 && !G.st.menu) G.dir.over();
          },
          over: () => {
            G.st.menu = true;
            G.ui.el.classList.add("active");
            G.ui.el.classList.remove("sunken");
          },
        };
        static init() {
          this.sys = {
            in: new InpSys(),
            ai: new AiSys(),
            phy: new PhySys(),
            cmb: new CmbSys(),
            rls: new Rules(),
            ren: new RenSys(),
          };
          this.loop = {
            id: null,
            last: 0,
            acc: 0,
            step: 1000 / 60,
            sz: () => {
              G.w = document.getElementById("cvs").width = window.innerWidth;
              G.h = document.getElementById("cvs").height = window.innerHeight;
            },
            run: (ts) => {
              if (!G.loop.last) G.loop.last = ts;
              let dt = ts - G.loop.last;
              G.loop.last = ts;
              if (dt > 200) dt = G.loop.step;
              G.loop.acc += dt;
              while (G.loop.acc >= G.loop.step) {
                if (G.st.stop > 0) G.st.stop--;
                else {
                  G.sys.in.run();
                  G.dir.tick();
                  G.sys.ai.run();
                  G.sys.phy.run();
                  G.sys.cmb.run();
                  G.obs.clean();
                  G.vis.txt.forEach((t, i) => {
                    t.pos.add(t.vel);
                    t.life -= 0.02;
                    if (t.life <= 0) G.vis.txt.splice(i, 1);
                  });
                }
                G.loop.acc -= G.loop.step;
              }
              G.ui.debug(dt);
              G.sys.ren.draw();
              G.st.inv = false;
              G.loop.id = requestAnimationFrame(G.loop.run);
            },
          };
          window.addEventListener("resize", this.loop.sz);
          this.loop.sz();
          this.dir.attr();
          G.ui.genGuide();
          G.loop.id = requestAnimationFrame(this.loop.run);
        }
      }
      const G = Game;
      G.init();
    </script>
  </body>
</html>
